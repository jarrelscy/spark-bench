<!DOCTYPE html>
<html>
<head>
    <title>Spiral Galaxy Animation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size to full window
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        const stars = [];
        const numStars = 500;
        
        // Create stars with random properties
        for (let i = 0; i < numStars; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 100 + 50;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            stars.push({
                x: x,
                y: y,
                z: Math.random() * 50 + 10,
                baseSize: Math.random() * 2 + 0.5,
                twinklePhase: Math.random() * Math.PI * 2,
                color: `hsl(${Math.random() * 360}, 80%, 60%)`
            });
        }
        
        // Animation loop
        function animate(time) {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Draw core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'white');
            gradient.addColorStop(1, 'yellow');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw stars
            stars.forEach((star, index) => {
                // Rotate around center
                const rotation = time * 0.0005 + index * 0.01;
                const rotatedX = star.x * Math.cos(rotation) - star.y * Math.sin(rotation);
                const rotatedY = star.x * Math.sin(rotation) + star.y * Math.cos(rotation);
                
                const screenX = centerX + rotatedX;
                const screenY = centerY + rotatedY;
                
                // Twinkle effect
                const twinkle = Math.sin(time * 0.002 + star.twinklePhase) * 0.3 + 0.7;
                const size = star.baseSize * twinkle;
                
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate(0);
    </script>
</body>
</html>
