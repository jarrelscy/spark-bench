<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Fallback dark color */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration for planets
    // Distances and sizes are scaled for visual aesthetics, not scientific accuracy
    const planets = [
        { name: "Mercury", radius: 60, size: 4, color: "#A5A5A5", speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   radius: 90, size: 7, color: "#E3BB76", speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   radius: 130, size: 7.5, color: "#22A6F2", speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    radius: 170, size: 5, color: "#DD4C22", speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", radius: 240, size: 18, color: "#D9A066", speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  radius: 320, size: 15, color: "#EBD998", speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  radius: 390, size: 10, color: "#8CE3E3", speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", radius: 450, size: 10, color: "#3E54E8", speed: 0.0015, angle: Math.random() * Math.PI * 2 }
    ];

    // Starfield data
    const stars = [];
    const starCount = 400;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    function generateStars() {
        stars.length = 0;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Sun Glow
        ctx.shadowBlur = 50;
        ctx.shadowColor = "#FDB813";
        
        // Sun Body
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fillStyle = "#FDB813";
        ctx.fill();
        
        // Reset shadow for other elements
        ctx.shadowBlur = 0;
    }

    function drawOrbit(radius) {
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();
    }

    function animate() {
        // Clear canvas
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, width, height);

        // Draw Background Stars
        drawStars();

        // Draw Sun
        drawSun();

        // Draw Planets
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.radius;
            const y = centerY + Math.sin(planet.angle) * planet.radius;

            // Draw Orbit Path
            drawOrbit(planet.radius);

            // Draw Planet
            ctx.beginPath();
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            
            // Add a slight glow to planets
            ctx.shadowBlur = 10;
            ctx.shadowColor = planet.color;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset

            // Special case for Saturn's Ring
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                // Draw an ellipse-ish ring
                ctx.ellipse(x, y, planet.size * 2.2, planet.size * 0.8, planet.angle, 0, Math.PI * 2);
                ctx.stroke();
            }
        });

        requestAnimationFrame(animate);
    }

    // Initialization
    window.addEventListener('resize', resize);
    resize();
    animate();

</script>
</body>
</html>
