<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating DNA Double Helix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508; /* Deep dark background */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        const config = {
            particleCount: 60,      // Number of rungs/segments
            amplitude: 150,         // Width of the helix
            speed: 0.03,            // Rotation speed
            spacing: 12,            // Vertical distance between nodes
            nodeSize: 4,            // Radius of the endpoint dots
            rungOpacity: 0.3,       // Opacity of connecting lines
            strandColor1: { h: 200, s: 100, l: 60 }, // Cyan/Blue
            strandColor2: { h: 340, s: 100, l: 60 }, // Magenta/Pink
            perspective: 800        // For pseudo-3D scaling
        };

        let width, height, centerY;
        let rotationAngle = 0;

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            // Clear screen with a slight fade for trail effect (optional, using solid clear here)
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // Calculate total height of the helix to center it
            const totalHeight = config.particleCount * config.spacing;
            const startY = centerY - (totalHeight / 2);

            // Arrays to store calculated points for this frame
            const points1 = [];
            const points2 = [];

            // 1. Calculate Coordinates
            for (let i = 0; i < config.particleCount; i++) {
                const y = startY + i * config.spacing;
                
                // Calculate x position using Sine wave
                // Strand 1: sin(angle + index)
                // Strand 2: sin(angle + index + PI) (Opposite phase)
                const angle1 = rotationAngle + (i * 0.2); // 0.2 determines the twist tightness
                const angle2 = angle1 + Math.PI;

                const x1 = width / 2 + Math.sin(angle1) * config.amplitude;
                const x2 = width / 2 + Math.sin(angle2) * config.amplitude;

                // Calculate Z depth (Cosine) for pseudo-3D scaling
                // Z ranges from -1 to 1. We map this to scale 0.6 to 1.4
                const z1 = Math.cos(angle1);
                const z2 = Math.cos(angle2);

                points1.push({ x: x1, y: y, z: z1 });
                points2.push({ x: x2, y: y, z: z2 });
            }

            // 2. Draw Rungs (Connecting Lines)
            // We draw these first so they appear behind the nodes
            ctx.lineWidth = 2;
            for (let i = 0; i < config.particleCount; i++) {
                const p1 = points1[i];
                const p2 = points2[i];

                // Calculate average depth to determine opacity and scale
                const avgZ = (p1.z + p2.z) / 2;
                
                // Depth factor: 1.0 is center, 1.5 is front, 0.5 is back
                const scale = 0.6 + (avgZ + 1) * 0.2; 
                
                // Opacity based on depth (further back = more transparent)
                const alpha = config.rungOpacity + (avgZ * 0.2);
                
                ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0.05, alpha)})`;
                
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            }

            // 3. Draw Strands (Nodes)
            // We draw the nodes on top of the lines
            for (let i = 0; i < config.particleCount; i++) {
                // Draw Strand 1
                drawNode(points1[i], config.strandColor1);
                // Draw Strand 2
                drawNode(points2[i], config.strandColor2);
            }

            // Update rotation
            rotationAngle += config.speed;

            requestAnimationFrame(draw);
        }

        function drawNode(point, colorBase) {
            // Calculate scale based on Z depth
            // Z is between -1 (back) and 1 (front)
            // Map Z to a scale factor: 0.7 (back) to 1.3 (front)
            const scale = 0.7 + (point.z + 1) * 0.3;
            
            // Calculate opacity based on depth
            // Back nodes are dimmer
            const alpha = 0.4 + (point.z + 1) * 0.3;

            // Adjust Lightness based on depth for 3D lighting effect
            // Front is brighter, back is darker
            const lightness = colorBase.l + (point.z * 20); 

            ctx.fillStyle = `hsla(${colorBase.h}, ${colorBase.s}%, ${lightness}%, ${alpha})`;
            
            // Add a glow effect
            ctx.shadowBlur = 10 * scale;
            ctx.shadowColor = `hsla(${colorBase.h}, ${colorBase.s}%, ${colorBase.l}%, 0.5)`;

            ctx.beginPath();
            ctx.arc(point.x, point.y, config.nodeSize * scale, 0, Math.PI * 2);
            ctx.fill();

            // Reset shadow for performance
            ctx.shadowBlur = 0;
        }

        // Start Animation
        draw();

    </script>
</body>
</html>
