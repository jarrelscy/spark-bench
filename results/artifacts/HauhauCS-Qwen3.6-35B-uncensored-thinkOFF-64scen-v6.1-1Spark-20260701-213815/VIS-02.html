<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1200;
        const ARM_COUNT = 3;
        const SPREAD = 0.8; // How much randomness in the spiral arms
        const CORE_SIZE = 15; // Radius of the core glow

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Star Color Palettes
        const colors = [
            '#FFFFFF', // White
            '#FFE4C4', // Bisque
            '#FFD700', // Gold
            '#FF4500', // OrangeRed
            '#FF1493', // DeepPink
            '#4169E1', // RoyalBlue
            '#00BFFF'  // DeepSkyBlue
        ];

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Determine which arm this star belongs to
                this.armIndex = Math.floor(Math.random() * ARM_COUNT);
                this.armAngle = (Math.PI * 2 / ARM_COUNT) * this.armIndex;
                
                // Distance from center (random distribution favoring center slightly)
                // Using Math.random() ** 2 to cluster more towards center, but we want spread
                const maxRadius = Math.min(width, height) * 0.45;
                const r = Math.random() * maxRadius;
                
                // Spiral formula: angle increases with distance
                // We add randomness to simulate the "fluff" of a real galaxy
                const spiralAngle = r * 0.005; // Tightness of spiral
                const randomOffset = (Math.random() - 0.5) * SPREAD; 
                
                this.angle = this.armAngle + spiralAngle + randomOffset;
                this.distance = r;
                
                // Orbital speed: closer stars move faster (Kepler-ish approximation for visual flair)
                // We use a base speed divided by distance to make inner stars whiz around
                // Avoid division by zero by clamping distance
                const safeDist = Math.max(this.distance, 1);
                this.speed = (0.0005 + (Math.random() * 0.0005)) / (safeDist * 0.01);

                // Visual properties
                this.size = Math.random() * 1.5 + 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = Math.random() * 0.5 + 0.5;
                
                // Store initial position to avoid recalculating trig every frame if possible,
                // but we need to update angle.
                this.x = 0;
                this.y = 0;
                this.updatePosition();
            }

            updatePosition() {
                this.x = centerX + Math.cos(this.angle) * this.distance;
                this.y = centerY + Math.sin(this.angle) * this.distance;
            }

            update(time) {
                // Update angle based on speed
                this.angle += this.speed;
                this.updatePosition();

                // Calculate twinkle
                // Use sine wave to oscillate alpha
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                this.currentAlpha = this.baseAlpha + (twinkle * 0.3);
                
                // Clamp alpha
                if (this.currentAlpha < 0.1) this.currentAlpha = 0.1;
                if (this.currentAlpha > 1) this.currentAlpha = 1;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                
                // Create a glow effect for brighter stars
                if (this.size > 1.2) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.globalAlpha = this.currentAlpha;
                ctx.fill();
                ctx.globalAlpha = 1.0; // Reset for other elements
                ctx.shadowBlur = 0; // Reset
            }
        }

        // Initialize stars
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        // Draw the central core glow
        function drawCore(time) {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_SIZE * 3);
            gradient.addColorStop(0, 'rgba(255, 255, 240, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 220, 180, 0.8)');
            gradient.addColorStop(0.5, 'rgba(200, 150, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for glow
            ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over'; // Reset
        }

        // Animation loop
        let lastTime = 0;
        function animate(time) {
            // Clear canvas with a slight fade for trail effect (optional, but let's stick to clean clear for crispness)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Draw Core
            drawCore(time);

            // Update and draw stars
            // Use additive blending for the galaxy body to make overlapping stars brighter
            ctx.globalCompositeOperation = 'lighter';
            
            for (let star of stars) {
                star.update(time);
                star.draw(ctx);
            }

            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        // Start animation
        requestAnimationFrame(animate);

    </script>
</body>
</html>
