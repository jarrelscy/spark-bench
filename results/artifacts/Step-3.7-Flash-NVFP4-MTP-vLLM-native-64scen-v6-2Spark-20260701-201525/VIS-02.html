<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spiral Galaxy Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY, maxDistance;

        // Handle window resizing to keep galaxy centered and scaled
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            maxDistance = Math.min(width, height) * 0.4; // Galaxy fits in 40% of smallest screen dimension
        }
        resize();
        window.addEventListener('resize', resize);

        // Create static distant background stars for depth
        const staticStars = [];
        const numStaticStars = 200;
        for (let i = 0; i < numStaticStars; i++) {
            staticStars.push({
                xFraction: Math.random(),
                yFraction: Math.random(),
                size: 0.5 + Math.random() * 0.5,
                alpha: 0.2 + Math.random() * 0.3
            });
        }

        // Create galaxy stars
        const stars = [];
        const numStars = 800; // Hundreds of stars as requested
        const numArms = 4; // Number of spiral arms

        for (let i = 0; i < numStars; i++) {
            let distanceFraction, initialAngle;
            const inSpiralArm = Math.random() < 0.9; // 90% of stars form the spiral arms

            if (inSpiralArm) {
                const arm = i % numArms;
                distanceFraction = Math.random() * 0.9 + 0.02; // 2% to 92% of max distance from core
                const armBaseAngle = (arm / numArms) * Math.PI * 2;
                const spiralTightness = 0.1; // Controls how tight the spiral arms are
                const angleSpread = (Math.random() - 0.5) * 0.7; // Random spread around the arm for natural look
                initialAngle = armBaseAngle + spiralTightness * (distanceFraction * maxDistance) + angleSpread;
            } else {
                // 10% are random halo stars outside the main arms for realism
                distanceFraction = Math.random() * 1.0;
                initialAngle = Math.random() * Math.PI * 2;
            }

            // Star visual properties with variation
            const isWhite = Math.random() < 0.1; // 10% chance of white star
            const isBright = Math.random() < 0.05; // 5% chance of extra bright star

            let size, color;
            if (isWhite) {
                const lightness = 70 + Math.random() * 30;
                color = `hsl(0, 0%, ${lightness}%)`;
                size = isBright ? 3 + Math.random() * 0.5 : 1.5 + Math.random();
            } else {
                // Color gradient from warm core (gold) to cool outer arms (blue)
                const hue = 40 + (distanceFraction * 160); // 40 (gold) to 200 (blue)
                const saturation = 80 + Math.random() * 20; // 80-100% saturation
                let lightness = 60 + (distanceFraction * 20); // 60% (core) to 80% (outer)
                if (isBright) {
                    lightness = Math.min(lightness + 20, 95);
                    size = 2 + Math.random() * 1.5;
                } else {
                    size = 1 + (1 - distanceFraction) * 2 + Math.random() * 0.5;
                }
                color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            }

            // Animation properties
            const twinkleSpeed = 1 + Math.random() * 2; // 1-3 rad/s for natural twinkle rate
            const twinklePhase = Math.random() * Math.PI * 2; // Random start phase so stars don't twinkle in sync
            const rotationSpeed = 0.05 + Math.random() * 0.05; // 0.05-0.1 rad/s for slow, smooth galaxy rotation

            stars.push({
                distanceFraction,
                initialAngle,
                rotationSpeed,
                size,
                color,
                twinkleSpeed,
                twinklePhase
            });
        }

        // Main animation loop
        function animate() {
            const time = performance.now() / 1000; // Time in seconds for consistent animation speed

            // Clear canvas with solid black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Draw static background stars
            staticStars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(star.xFraction * width, star.yFraction * height, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw glowing galactic core with subtle pulse effect
            const corePulse = 1 + 0.1 * Math.sin(time * 0.5); // Subtle pulse every ~12 seconds
            const coreRadius = 40 * corePulse;
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            coreGradient.addColorStop(0.1, 'rgba(255, 255, 220, 0.9)');
            coreGradient.addColorStop(0.4, 'rgba(255, 200, 100, 0.4)');
            coreGradient.addColorStop(1, 'rgba(255, 150, 50, 0)');
            ctx.globalAlpha = 1;
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fill();

            // Draw and update galaxy stars
            stars.forEach(star => {
                // Calculate current rotation angle
                const currentAngle = star.initialAngle + star.rotationSpeed * time;
                // Calculate actual distance from core (scales with window size)
                const distance = star.distanceFraction * maxDistance;
                // Calculate star position
                const x = centerX + distance * Math.cos(currentAngle);
                const y = centerY + distance * Math.sin(currentAngle);

                // Calculate twinkle effect (varies both brightness and size)
                const twinkle = Math.sin(star.twinkleSpeed * time + star.twinklePhase);
                const alpha = 0.6 + 0.4 * twinkle; // Brightness varies between 20% and 100%
                const currentSize = star.size * (0.8 + 0.4 * twinkle); // Size varies by ±20%

                // Draw the star
                ctx.globalAlpha = alpha;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(x, y, currentSize, 0, Math.PI * 2);
                ctx.fill();
            });

            // Reset global alpha for next frame
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();
    </script>
</body>
</html>
