<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY, maxOrbitRadius;
        let stars = [];
        let lastTime = 0;

        // Planet configuration: orbitFraction = % of max orbit radius, speed = radians per second
        const planets = [
            { name: 'Mercury', orbitFraction: 0.2, radius: 4, color: '#a6a6a6', speed: 0.025 },
            { name: 'Venus', orbitFraction: 0.35, radius: 7, color: '#fffacd', speed: 0.015 },
            { name: 'Earth', orbitFraction: 0.5, radius: 8, color: '#4169e1', speed: 0.01 },
            { name: 'Mars', orbitFraction: 0.65, radius: 5, color: '#cd5c5c', speed: 0.008 },
            { name: 'Jupiter', orbitFraction: 0.8, radius: 18, color: '#d2b48c', speed: 0.005 },
            { name: 'Saturn', orbitFraction: 0.95, radius: 15, color: '#f0e68c', speed: 0.003, hasRings: true }
        ];

        // Initialize random starting angles for planets
        planets.forEach(planet => {
            planet.angle = Math.random() * Math.PI * 2;
        });

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            maxOrbitRadius = Math.min(width, height) * 0.4;
            generateStars();
            updatePlanetOrbits();
        }

        function generateStars() {
            stars = [];
            const numStars = 200;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.7 + 0.3
                });
            }
        }

        function updatePlanetOrbits() {
            planets.forEach(planet => {
                planet.orbitRadius = planet.orbitFraction * maxOrbitRadius;
            });
        }

        function drawStars() {
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSun() {
            const sunRadius = Math.min(width, height) * 0.03;
            // Glow effect
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ffaa00';
            // Radial gradient for realistic sun look
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sunRadius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.2, '#ffff00');
            gradient.addColorStop(1, '#ff8800');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for other elements
        }

        function drawOrbits() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function updateAndDrawPlanets(deltaTime) {
            planets.forEach(planet => {
                // Update orbital position
                planet.angle += planet.speed * deltaTime;
                const x = centerX + planet.orbitRadius * Math.cos(planet.angle);
                const y = centerY + planet.orbitRadius * Math.sin(planet.angle);

                // Draw planet with subtle glow
                ctx.shadowBlur = 5;
                ctx.shadowColor = planet.color;
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw Saturn's rings
                if (planet.hasRings) {
                    ctx.strokeStyle = 'rgba(200, 180, 150, 0.4)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 2.5, planet.radius * 2.5 * 0.7, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        function animate(currentTime) {
            if (!lastTime) lastTime = currentTime;
            const deltaTime = (currentTime - lastTime) / 1000; // Convert to seconds
            lastTime = currentTime;

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Draw all elements
            drawStars();
            drawSun();
            drawOrbits();
            updateAndDrawPlanets(deltaTime);

            requestAnimationFrame(animate);
        }

        // Initialize and start animation
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
