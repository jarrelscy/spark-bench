<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const stars = [];
        const numStars = 1200;
        
        // Configuration
        const coreColor = 'rgba(255, 255, 200, 0.8)';
        const galaxyRotationSpeed = 0.002;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Spiral math:
                // r = angle * scale
                // angle = theta
                // x = r * cos(theta)
                // y = r * sin(theta)
                
                // Randomize position in a spiral distribution
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.pow(Math.random(), 0.7) * (Math.min(width, height) * 0.4);
                
                // Add some "thickness" to the spiral arms
                const spread = (Math.random() - 0.5) * (distance * 0.3);
                
                // Spiral arm factor: 3 arms
                const armOffset = (Math.floor(Math.random() * 3) * (Math.PI * 2 / 3));
                const spiralAngle = angle + armOffset;
                
                // Spiral curvature
                const curvature = 2.5;
                const finalAngle = spiralAngle + (distance * curvature * 0.01);
                
                this.x = Math.cos(finalAngle) * distance;
                this.y = Math.sin(finalAngle) * distance;
                
                // Original relative position for rotation
                this.baseAngle = finalAngle;
                this.distance = distance;
                
                // Visual properties
                this.size = Math.random() * 1.5 + 0.5;
                this.baseOpacity = Math.random() * 0.8 + 0.2;
                this.opacity = this.baseOpacity;
                
                // Color: range from white to pale blue/yellow
                const hue = Math.random() > 0.8 ? 200 : (Math.random() > 0.5 ? 40 : 0);
                this.color = `hsla(${hue}, 80%, 80%,`;
                
                // Movement properties
                this.speed = (1 - (this.distance / (Math.min(width, height) * 0.4))) * 0.5 + 0.1;
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                // Rotate around center
                this.baseAngle += this.speed;
                
                // Calculate new position
                const currentAngle = this.baseAngle;
                this.x = Math.cos(currentAngle) * this.distance;
                this.y = Math.sin(currentAngle) * this.distance;

                // Twinkle effect
                this.twinklePhase += this.twinkleSpeed;
                this.opacity = this.baseOpacity + Math.sin(this.twinklePhase) * 0.3;
                
                // Fade out stars that drift too far (optional, but we keep them in orbit)
            }

            draw() {
                ctx.beginPath();
                ctx.arc(width / 2 + this.x, height / 2 + this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `${this.color} ${this.opacity})`;
                ctx.fill();
            }
        }

        // Initialize stars
        for (let i = 0; i < numStars; i++) {
            stars.push(new Star());
        }

        function animate() {
            // Create a slight motion blur effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Draw the core glow
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, 50
            );
            gradient.addColorStop(0, 'rgba(255, 255, 200, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
