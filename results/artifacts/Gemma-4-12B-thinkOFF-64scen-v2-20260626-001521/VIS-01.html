<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const planets = [];
        const stars = [];

        // Configuration
        const colors = ['#A5A5A5', '#E3BB76', '#2E7D32', '#FF7043', '#2196F3', '#9C27B0', '#F44336'];
        
        function init() {
            resize();
            createStars();
            createPlanets();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createStars() {
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function createPlanets() {
            planets.length = 0;
            // planet data: [distance from sun, radius, speed, color, name]
            const data = [
                [60, 4, 0.04, colors[1], "Mercury"],
                [90, 9, 0.015, colors[2], "Venus"],
                [130, 10, 0.01, colors[3], "Earth"],
                [170, 7, 0.008, colors[4], "Mars"],
                [230, 15, 0.006, colors[5], "Jupiter"],
                [300, 12, 0.004, colors[6], "Saturn"]
            ];

            data.forEach((p, index) => {
                planets.push({
                    distance: p[0],
                    radius: p[1],
                    speed: p[2],
                    color: p[3],
                    angle: Math.random() * Math.PI * 2,
                    name: p[4]
                });
            });
        }

        function drawSun() {
            const centerX = width / 2;
            const centerY = height / 2;

            // Sun Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 40);
            gradient.addColorStop(0, '#FFF59D');
            gradient.addColorStop(0.2, '#FFD600');
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core
            ctx.fillStyle = '#FFEA00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            const centerX = width / 2;
            const centerY = height / 2;

            drawSun();

            planets.forEach(planet => {
                // Update position
                planet.angle += planet.speed;
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit Path
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Simple highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(x - planet.radius*0.3, y - planet.radius*0.3, planet.radius/3, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            createStars();
        });

        init();
    </script>
</body>
</html>
