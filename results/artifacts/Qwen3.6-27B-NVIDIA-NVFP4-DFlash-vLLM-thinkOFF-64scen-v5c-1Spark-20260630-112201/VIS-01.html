<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Fallback color */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="solarCanvas"></canvas>

<script>
/**
 * Solar System Animation
 * No external libraries.
 */

const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;
let stars = [];

// Configuration for planets
// Distance is in arbitrary units relative to screen size
const planetConfig = [
    { name: "Mercury", color: "#A5A5A5", size: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
    { name: "Venus",   color: "#E3BB76", size: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
    { name: "Earth",   color: "#22A6F2", size: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
    { name: "Mars",    color: "#DD4C22", size: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
    { name: "Jupiter", color: "#D6A566", size: 18, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
    { name: "Saturn",  color: "#EAD6B8", size: 15, distance: 310, speed: 0.002, angle: Math.random() * Math.PI * 2, hasRing: true },
    { name: "Uranus",  color: "#D1F3F8", size: 10, distance: 380, speed: 0.0015, angle: Math.random() * Math.PI * 2 },
    { name: "Neptune", color: "#5B5DDF", size: 10, distance: 440, speed: 0.001, angle: Math.random() * Math.PI * 2 }
];

// Handle resizing
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    centerX = width / 2;
    centerY = height / 2;
    generateStars();
}

// Generate random starfield
function generateStars() {
    stars = [];
    const starCount = Math.floor((width * height) / 1500); // Density based on screen size
    for (let i = 0; i < starCount; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 1.5,
            opacity: Math.random()
        });
    }
}

// Draw the background stars
function drawStars() {
    ctx.fillStyle = "white";
    stars.forEach(star => {
        ctx.globalAlpha = star.opacity;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;
}

// Draw the Sun
function drawSun() {
    // Outer glow
    const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
    gradient.addColorStop(0, "rgba(255, 223, 0, 1)"); // Core
    gradient.addColorStop(0.2, "rgba(255, 165, 0, 0.8)"); // Inner glow
    gradient.addColorStop(0.5, "rgba(255, 69, 0, 0.2)"); // Outer glow
    gradient.addColorStop(1, "rgba(255, 69, 0, 0)"); // Fade out

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
    ctx.fill();

    // Solid sun body
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
    ctx.fill();
}

// Draw Orbit Paths (faint lines)
function drawOrbits() {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.lineWidth = 1;
    
    planetConfig.forEach(planet => {
        ctx.beginPath();
        ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
        ctx.stroke();
    });
}

// Draw Planets
function drawPlanets() {
    planetConfig.forEach(planet => {
        // Calculate position
        const x = centerX + Math.cos(planet.angle) * planet.distance;
        const y = centerY + Math.sin(planet.angle) * planet.distance;

        // Update angle for next frame
        planet.angle += planet.speed;

        // Draw Planet Body
        ctx.fillStyle = planet.color;
        ctx.beginPath();
        ctx.arc(x, y, planet.size, 0, Math.PI * 2);
        ctx.fill();

        // Optional: Add a slight shadow for 3D effect
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath();
        ctx.arc(x, y, planet.size, planet.angle + Math.PI/2, planet.angle - Math.PI/2);
        ctx.fill();

        // Draw Saturn's Rings (special case)
        if (planet.hasRing) {
            ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            // Draw an ellipse to simulate the ring
            ctx.ellipse(x, y, planet.size * 2.2, planet.size * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
            ctx.stroke();
        }
    });
}

// Main Animation Loop
function animate() {
    // Clear screen
    ctx.fillStyle = "#050505"; // Dark space background
    ctx.fillRect(0, 0, width, height);

    drawStars();
    drawOrbits();
    drawSun();
    drawPlanets();

    requestAnimationFrame(animate);
}

// Initialize
window.addEventListener('resize', resize);
resize();
animate();

</script>
</body>
</html>
