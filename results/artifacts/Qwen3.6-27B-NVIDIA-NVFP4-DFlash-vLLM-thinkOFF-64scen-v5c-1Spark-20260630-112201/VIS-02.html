<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const STAR_COUNT = 1200;
        const ARM_COUNT = 3;
        const ARM_SPREAD = 0.5; // How wide the arms are
        const GALAXY_RADIUS = 0.4; // Relative to screen size
        
        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        // Star Class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center (0 to 1)
                // We bias towards the outside slightly for a more interesting look, 
                // but keep a dense core.
                const distBias = Math.pow(Math.random(), 1.5); 
                this.dist = distBias * GALAXY_RADIUS * Math.min(width, height);

                // Angle is determined by the spiral arm logic
                // Base angle + spiral offset based on distance
                const armIndex = Math.floor(Math.random() * ARM_COUNT);
                const armAngle = (Math.PI * 2 / ARM_COUNT) * armIndex;
                
                // The spiral twist: further stars rotate more angle
                // We add random spread to make it look like a "cloud" of stars
                const spread = (Math.random() - 0.5) * ARM_SPREAD;
                
                // Calculate the twist factor based on distance
                // 0 at center, 2 full rotations at edge
                const twist = (this.dist / (GALAXY_RADIUS * Math.min(width, height))) * Math.PI * 4;

                this.angle = armAngle + twist + spread;

                // Initial orbital offset (so they don't all start at the same rotation point)
                this.orbitOffset = Math.random() * Math.PI * 2;

                // Rotation speed (Kepler-ish: inner stars move faster)
                // 1/dist would fly off at 0, so we add a buffer
                this.speed = (0.005 + (0.05 / (this.dist * 0.01 + 1)));

                // Appearance
                this.size = Math.random() * 1.5 + 0.5; // Size
                
                // Color Generation
                // Core stars are warm (white/yellow), outer stars are cool (blue/purple)
                const colorFactor = this.dist / (GALAXY_RADIUS * Math.min(width, height));
                
                if (colorFactor < 0.2) {
                    // Core: White/Yellow
                    this.color = `rgba(255, 255, ${200 + Math.random() * 55},`; 
                } else if (colorFactor < 0.6) {
                    // Mid: White/Blueish
                    this.color = `rgba(${200 + Math.random() * 55}, ${200 + Math.random() * 55}, 255,`;
                } else {
                    // Outer: Blue/Purple
                    this.color = `rgba(${100 + Math.random() * 100}, ${150 + Math.random() * 100}, 255,`;
                }

                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = Math.random() * 0.5 + 0.5;
            }

            update(time) {
                // Update angle for rotation
                this.angle += this.speed;

                // Update twinkle
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                // Map sin (-1 to 1) to alpha (0.2 to 1.0)
                this.alpha = this.baseAlpha * 0.5 + (twinkle * 0.5 * this.baseAlpha);
                if (this.alpha < 0.1) this.alpha = 0.1; // Don't disappear completely
            }

            draw() {
                const x = centerX + Math.cos(this.angle + this.orbitOffset) * this.dist;
                const y = centerY + Math.sin(this.angle + this.orbitOffset) * this.dist;

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.alpha + ')';
                ctx.fill();
            }
        }

        // Initialize
        function init() {
            resize();
            stars.length = 0;
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        // Animation Loop
        let time = 0;
        function animate() {
            // Clear canvas with a very slight fade for subtle trails (optional, currently solid black)
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.min(width, height) * 0.15);
            gradient.addColorStop(0, 'rgba(255, 255, 230, 0.8)'); // Bright center
            gradient.addColorStop(0.2, 'rgba(255, 200, 150, 0.3)'); // Warm mid
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Fade out

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.min(width, height) * 0.15, 0, Math.PI * 2);
            ctx.fill();

            // Update and Draw Stars
            // We use additive blending for a glowing effect
            ctx.globalCompositeOperation = 'lighter';
            
            for (let star of stars) {
                star.update(time);
                star.draw();
            }

            // Reset blending for next frame background clear
            ctx.globalCompositeOperation = 'source-over';

            time++;
            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', () => {
            resize();
            // Re-calculate star distances on resize to keep galaxy centered and scaled
            // but keep their relative angles/speeds
            const oldMin = Math.min(width, height);
            resize();
            const newMin = Math.min(width, height);
            const ratio = newMin / oldMin;
            
            // Simple reset is cleaner for this demo
            init(); 
        });

        // Start
        init();
        animate();

    </script>
</body>
</html>
