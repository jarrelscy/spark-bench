<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="space"></canvas>
<script>
const canvas = document.getElementById('space');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Generate a starfield
const stars = [];
function initStars() {
  stars.length = 0;
  const count = Math.floor((W * H) / 2000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.005
    });
  }
}
initStars();
window.addEventListener('resize', initStars);

// Planet definitions
const planets = [
  { name: 'Mercury', radius: 4,  dist: 70,  speed: 1.60, color: '#b1b1b1', angle: Math.random()*6.28 },
  { name: 'Venus',   radius: 7,  dist: 100, speed: 1.18, color: '#e8c07a', angle: Math.random()*6.28 },
  { name: 'Earth',   radius: 8,  dist: 140, speed: 1.00, color: '#4a90d9', angle: Math.random()*6.28 },
  { name: 'Mars',    radius: 6,  dist: 180, speed: 0.80, color: '#d1553f', angle: Math.random()*6.28 },
  { name: 'Jupiter', radius: 18, dist: 250, speed: 0.43, color: '#c9a06b', angle: Math.random()*6.28 },
  { name: 'Saturn',  radius: 15, dist: 320, speed: 0.32, color: '#e0c98f', angle: Math.random()*6.28, ring: true },
  { name: 'Uranus',  radius: 11, dist: 380, speed: 0.23, color: '#8fdce0', angle: Math.random()*6.28 },
  { name: 'Neptune', radius: 11, dist: 440, speed: 0.18, color: '#4a6fd9', angle: Math.random()*6.28 }
];

let lastTime = performance.now();
let sunPulse = 0;

function drawStars(t) {
  for (const s of stars) {
    const alpha = 0.5 + 0.5 * Math.sin(s.twinkle + t * s.speed);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
    ctx.fill();
  }
}

function drawSun() {
  const baseR = 30;
  const glowR = baseR + 40 + Math.sin(sunPulse) * 6;

  // Outer glow
  const grad = ctx.createRadialGradient(cx, cy, baseR * 0.3, cx, cy, glowR);
  grad.addColorStop(0, 'rgba(255,230,120,0.9)');
  grad.addColorStop(0.3, 'rgba(255,180,40,0.6)');
  grad.addColorStop(1, 'rgba(255,140,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Core
  const core = ctx.createRadialGradient(cx, cy, 2, cx, cy, baseR);
  core.addColorStop(0, '#fffbe0');
  core.addColorStop(0.6, '#ffd24a');
  core.addColorStop(1, '#ff8c00');
  ctx.beginPath();
  ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
  ctx.fillStyle = core;
  ctx.fill();
}

function drawOrbits() {
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (const p of planets) {
    ctx.beginPath();
    ctx.arc(cx, cy, p.dist, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function drawPlanet(p) {
  const x = cx + Math.cos(p.angle) * p.dist;
  const y = cy + Math.sin(p.angle) * p.dist;

  // Saturn's ring
  if (p.ring) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.5);
    ctx.scale(1, 0.4);
    ctx.beginPath();
    ctx.arc(0, 0, p.radius + 10, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(220,200,150,0.6)';
    ctx.stroke();
    ctx.restore();
  }

  // Planet body with subtle shading
  const grad = ctx.createRadialGradient(x - p.radius*0.3, y - p.radius*0.3, p.radius*0.1, x, y, p.radius);
  grad.addColorStop(0, p.color);
  grad.addColorStop(1, shade(p.color, -60));
  ctx.beginPath();
  ctx.arc(x, y, p.radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

function shade(hex, amt) {
  let c = hex.replace('#','');
  if (c.length === 3) c = c.split('').map(ch=>ch+ch).join('');
  let r = parseInt(c.substr(0,2),16) + amt;
  let g = parseInt(c.substr(2,2),16) + amt;
  let b = parseInt(c.substr(4,2),16) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  ctx.fillStyle = '#05060d';
  ctx.fillRect(0, 0, W, H);

  drawStars(now / 1000);
  drawOrbits();

  sunPulse += dt * 2;
  drawSun();

  for (const p of planets) {
    p.angle += p.speed * dt * 0.5;
    drawPlanet(p);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
