<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
(function () {
  const canvas = document.getElementById('galaxy');
  const ctx = canvas.getContext('2d');

  let W, H, cx, cy;
  const stars = [];
  const NUM_STARS = 900;
  const NUM_ARMS = 4;
  const ARM_TWIST = 4.5;    // how tightly arms wrap
  const ARM_SPREAD = 0.45;  // angular scatter within an arm

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // Star color palette (blues, whites, warm)
  function starColor(radiusFrac) {
    // inner stars warmer/yellow, outer bluer
    const r = Math.random();
    if (radiusFrac < 0.25) {
      // core region - warm
      const c = 255;
      return [c, 220 + Math.random()*35, 150 + Math.random()*60];
    } else if (r < 0.5) {
      return [180 + Math.random()*40, 200 + Math.random()*40, 255]; // blue-white
    } else if (r < 0.8) {
      return [255, 255, 240 + Math.random()*15]; // white
    } else {
      return [255, 210 + Math.random()*40, 170 + Math.random()*40]; // warm
    }
  }

  function createStars() {
    const maxRadius = Math.min(W, H) * 0.46;
    for (let i = 0; i < NUM_STARS; i++) {
      // Bias radius toward center a bit
      const rFrac = Math.pow(Math.random(), 0.7);
      const radius = rFrac * maxRadius;

      // Assign to a spiral arm
      const arm = Math.floor(Math.random() * NUM_ARMS);
      const armBaseAngle = (arm / NUM_ARMS) * Math.PI * 2;
      // spiral offset grows with radius
      const spiralAngle = armBaseAngle + (radius / maxRadius) * ARM_TWIST;
      // scatter, more scatter near center
      const scatter = (Math.random() - 0.5) * ARM_SPREAD * (1.2 - rFrac*0.6);
      const angle = spiralAngle + scatter;

      // Angular velocity — inner faster (differential rotation)
      const speed = 0.00025 + 0.06 / (radius + 40);

      stars.push({
        radius,
        angle,
        speed,
        size: 0.5 + Math.random() * 1.8 + (1 - rFrac) * 1.2,
        color: starColor(rFrac),
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.5 + Math.random() * 2.5,
        baseAlpha: 0.5 + Math.random() * 0.5
      });
    }
  }
  createStars();

  // Background faint dust stars
  const dust = [];
  for (let i = 0; i < 250; i++) {
    dust.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.2,
      alpha: Math.random() * 0.5,
      tw: Math.random() * Math.PI * 2,
      ts: 0.5 + Math.random() * 2
    });
  }

  let time = 0;

  function drawCore() {
    const coreRadius = Math.min(W, H) * 0.16;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius);
    g.addColorStop(0, 'rgba(255,255,245,0.95)');
    g.addColorStop(0.15, 'rgba(255,240,200,0.75)');
    g.addColorStop(0.4, 'rgba(255,200,140,0.35)');
    g.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();

    // bright center point
    const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius * 0.35);
    g2.addColorStop(0, 'rgba(255,255,255,1)');
    g2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  function animate() {
    time += 0.016;

    // Trail / fade
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);

    // Dust background
    for (const d of dust) {
      const tw = 0.5 + 0.5 * Math.sin(time * d.ts + d.tw);
      ctx.fillStyle = `rgba(200,210,255,${d.alpha * tw})`;
      ctx.fillRect(d.x, d.y, d.size, d.size);
    }

    // Faint galactic glow disk
    const diskR = Math.min(W, H) * 0.46;
    const gd = ctx.createRadialGradient(cx, cy, 0, cx, cy, diskR);
    gd.addColorStop(0, 'rgba(80,90,160,0.10)');
    gd.addColorStop(0.5, 'rgba(60,60,120,0.05)');
    gd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gd;
    ctx.beginPath();
    ctx.arc(cx, cy, diskR, 0, Math.PI * 2);
    ctx.fill();

    drawCore();

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      s.angle += s.speed;
      const x = cx + Math.cos(s.angle) * s.radius;
      const y = cy + Math.sin(s.angle) * s.radius * 0.55; // flatten for perspective

      const twinkle = 0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
      const alpha = s.baseAlpha * twinkle;
      const [r, g, b] = s.color;

      // glow
      const size = s.size;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
      grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
