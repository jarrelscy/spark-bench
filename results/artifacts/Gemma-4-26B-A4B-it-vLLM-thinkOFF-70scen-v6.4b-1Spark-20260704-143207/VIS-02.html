<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 800;
        const spiralArms = 3;
        const rotationSpeed = 0.002;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Distance from center
                this.distance = Math.random() * (Math.min(width, height) / 2.5);
                
                // Angle in the spiral
                // The spiral formula: angle = distance * constant + armOffset
                const armOffset = (Math.PI * 2 / spiralArms) * Math.floor(Math.random() * spiralArms);
                this.angle = (this.distance * 0.01) + armOffset;
                
                // Add some spread to the arms
                this.spread = (Math.random() - 0.5) * 0.5;
                
                // Color variation (blues, purples, whites)
                const hue = 200 + Math.random() * 60; // Blue to Purple
                const saturation = 50 + Math.random() * 50;
                const lightness = 70 + Math.random() * 30;
                this.color = `hsla(${hue}, ${saturation}%, ${lightness}%, `;
                
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                // Rotate the star
                this.angle += rotationSpeed;
                this.twinklePhase += this.twinkleSpeed;
            }

            draw() {
                // Calculate position based on spiral
                const currentAngle = this.angle + this.spread;
                const x = centerX + Math.cos(currentAngle) * this.distance;
                const y = centerY + Math.sin(currentAngle) * this.distance;

                // Twinkle effect (opacity)
                const opacity = 0.5 + Math.sin(this.twinklePhase) * 0.5;

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + opacity + ')';
                ctx.fill();
            }
        }

        // Initialize stars
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        function drawCore() {
            // Central glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 250, 200, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Clear canvas with a slight trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            drawCore();

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
