<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration
    const stars = [];
    const numStars = 300;
    
    // Planet Data: { name, color, size, distance (radius), speed, angle }
    // Distances and speeds are relative for visual fit, not scientific accuracy
    const planets = [
        { name: "Mercury", color: "#A5A5A5", size: 4, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", size: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6F2", size: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#DF4838", size: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D6A566", size: 18, distance: 240, speed: 0.005, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#F4D03F", size: 15, distance: 320, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#82E0AA", size: 10, distance: 390, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#5DADE2", size: 10, distance: 450, speed: 0.001, angle: Math.random() * Math.PI * 2 }
    ];

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }

    // Initialize Stars
    function initStars() {
        stars.length = 0;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    // Draw Background Stars
    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // Draw The Sun
    function drawSun() {
        // Glow effect
        ctx.shadowBlur = 50;
        ctx.shadowColor = "#FFD700";
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fillStyle = "#FFD700";
        ctx.fill();
        
        // Reset shadow for other elements
        ctx.shadowBlur = 0;
    }

    // Draw Orbits and Planets
    function drawPlanets() {
        planets.forEach(planet => {
            // Update Angle
            planet.angle += planet.speed;

            // Calculate Position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path (faint circle)
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Planet
            ctx.beginPath();
            ctx.fillStyle = planet.color;
            
            // Add a slight glow to the planet
            ctx.shadowBlur = 5;
            ctx.shadowColor = planet.color;
            
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow
            ctx.shadowBlur = 0;

            // Special case: Saturn's Ring
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.strokeStyle = "rgba(200, 180, 100, 0.6)";
                ctx.lineWidth = 4;
                // Ellipse for ring
                ctx.ellipse(x, y, planet.size * 2, planet.size * 0.8, planet.angle + Math.PI/2, 0, Math.PI * 2);
                ctx.stroke();
            }
        });
    }

    // Main Animation Loop
    function animate() {
        // Clear Canvas
        ctx.clearRect(0, 0, width, height);

        // Draw Background
        drawStars();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Initialization
    window.addEventListener('resize', () => {
        resize();
        initStars();
    });
    
    // Start
    resize();
    initStars();
    animate();

</script>

</body>
</html>
