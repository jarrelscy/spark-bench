<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let W, H, cx, cy;
  let stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    makeStars();
  }

  function makeStars() {
    stars = [];
    const count = Math.floor((W * H) / 2500);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.2,
        base: Math.random() * 0.6 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 1.5 + 0.3
      });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  // Planets: radius = orbit radius (scaled), size, speed (rad/sec), color
  const planets = [
    { name: 'Mercury', orbit: 60,  size: 4,  speed: 1.60, color: '#b5a7a7', moons: [] },
    { name: 'Venus',   orbit: 90,  size: 7,  speed: 1.17, color: '#e6c07b', moons: [] },
    { name: 'Earth',   orbit: 125, size: 8,  speed: 1.00, color: '#4f94e8',
      moons: [{ orbit: 15, size: 2.2, speed: 4.0, color: '#cccccc' }] },
    { name: 'Mars',    orbit: 160, size: 6,  speed: 0.80, color: '#d1603d', moons: [] },
    { name: 'Jupiter', orbit: 215, size: 16, speed: 0.43, color: '#d8a875', moons: [] },
    { name: 'Saturn',  orbit: 275, size: 13, speed: 0.32, color: '#e8d3a0', ring: true, moons: [] },
    { name: 'Uranus',  orbit: 325, size: 10, speed: 0.23, color: '#9fd7dd', moons: [] },
    { name: 'Neptune', orbit: 370, size: 10, speed: 0.18, color: '#5f7de8', moons: [] }
  ];

  // Random starting angles
  planets.forEach(p => {
    p.angle = Math.random() * Math.PI * 2;
    p.moons.forEach(m => m.angle = Math.random() * Math.PI * 2);
  });

  function orbitScale() {
    // Fit outermost orbit within the smaller half-dimension
    const maxOrbit = planets[planets.length - 1].orbit;
    return (Math.min(W, H) / 2 - 30) / maxOrbit;
  }

  function drawStars(t) {
    for (const s of stars) {
      const twinkle = s.base + 0.35 * Math.sin(t * s.speed + s.phase);
      ctx.globalAlpha = Math.max(0.05, Math.min(1, twinkle));
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSun(t) {
    const pulse = 1 + 0.04 * Math.sin(t * 2);
    const sunR = 26 * pulse;

    // Outer glow
    let glow = ctx.createRadialGradient(cx, cy, sunR * 0.4, cx, cy, sunR * 4);
    glow.addColorStop(0, 'rgba(255, 200, 60, 0.55)');
    glow.addColorStop(0.4, 'rgba(255, 140, 20, 0.18)');
    glow.addColorStop(1, 'rgba(255, 100, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, sunR * 4, 0, Math.PI * 2);
    ctx.fill();

    // Sun body
    let body = ctx.createRadialGradient(cx - sunR * 0.25, cy - sunR * 0.25, sunR * 0.1, cx, cy, sunR);
    body.addColorStop(0, '#fffbe0');
    body.addColorStop(0.5, '#ffd94a');
    body.addColorStop(1, '#ff9c1a');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlanet(p, scale) {
    const r = p.orbit * scale;
    const x = cx + Math.cos(p.angle) * r;
    const y = cy + Math.sin(p.angle) * r;

    // Orbit path
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();

    // Saturn's ring (behind-ish, drawn as ellipse)
    if (p.ring) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.4);
      ctx.strokeStyle = 'rgba(220, 200, 150, 0.7)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 1.9, p.size * 0.7, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Planet body with subtle shading (lit from sun side)
    const lightAngle = Math.atan2(cy - y, cx - x);
    const lx = x + Math.cos(lightAngle) * p.size * 0.4;
    const ly = y + Math.sin(lightAngle) * p.size * 0.4;
    const grad = ctx.createRadialGradient(lx, ly, p.size * 0.15, x, y, p.size * 1.15);
    grad.addColorStop(0, p.color);
    grad.addColorStop(1, '#05050a');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();

    // Moons
    for (const m of p.moons) {
      const mx = x + Math.cos(m.angle) * m.orbit;
      const my = y + Math.sin(m.angle) * m.orbit;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.arc(mx, my, m.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, x, y - p.size - 8);
  }

  let last = performance.now();

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;

    // Background
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);

    drawStars(t);

    const scale = orbitScale();

    drawSun(t);

    for (const p of planets) {
      p.angle += p.speed * dt * 0.5;
      for (const m of p.moons) m.angle += m.speed * dt;
      drawPlanet(p, scale);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
