<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
const stars = [];
const planets = [
  { name: 'Mercury', r: 4, orbit: 60, speed: 0.04, color: '#b5b5b5', angle: 0 },
  { name: 'Venus', r: 7, orbit: 90, speed: 0.025, color: '#e6c35c', angle: 1 },
  { name: 'Earth', r: 8, orbit: 130, speed: 0.018, color: '#4a90d9', angle: 2 },
  { name: 'Mars', r: 6, orbit: 170, speed: 0.014, color: '#c1440e', angle: 3 },
  { name: 'Jupiter', r: 16, orbit: 230, speed: 0.008, color: '#d4a373', angle: 4 },
  { name: 'Saturn', r: 14, orbit: 290, speed: 0.006, color: '#f0d78c', angle: 5, rings: true },
  { name: 'Uranus', r: 10, orbit: 340, speed: 0.004, color: '#7ec8e3', angle: 0.5 },
  { name: 'Neptune', r: 10, orbit: 390, speed: 0.003, color: '#4169e1', angle: 1.5 }
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  if (stars.length === 0) {
    for (let i = 0; i < 300; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 1.5 + 0.3,
        a: Math.random() * 0.8 + 0.2
      });
    }
  }
}
window.addEventListener('resize', resize);
resize();

function drawStars() {
  for (const s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a})`;
    ctx.fill();
  }
}

function drawSun() {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
  g.addColorStop(0, '#fffce8');
  g.addColorStop(0.3, '#ffdd44');
  g.addColorStop(0.6, '#ff8800');
  g.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 50, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  // core
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8c0';
  ctx.shadowColor = '#ffaa00';
  ctx.shadowBlur = 40;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawPlanet(p) {
  const x = cx + Math.cos(p.angle) * p.orbit;
  const y = cy + Math.sin(p.angle) * p.orbit;
  // orbit path (faint)
  ctx.beginPath();
  ctx.arc(cx, cy, p.orbit, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // rings for Saturn
  if (p.rings) {
    ctx.beginPath();
    ctx.ellipse(x, y, p.r * 2.2, p.r * 0.6, p.angle * 0.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(240,215,140,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  // planet glow
  ctx.beginPath();
  ctx.arc(x, y, p.r + 3, 0, Math.PI * 2);
  ctx.fillStyle = p.color + '33';
  ctx.fill();
  // planet body
  ctx.beginPath();
  ctx.arc(x, y, p.r, 0, Math.PI * 2);
  const pg = ctx.createRadialGradient(x - p.r * 0.3, y - p.r * 0.3, 0, x, y, p.r);
  pg.addColorStop(0, '#fff');
  pg.addColorStop(0.3, p.color);
  pg.addColorStop(1, shade(p.color, -40));
  ctx.fillStyle = pg;
  ctx.fill();
}

function shade(hex, amt) {
  let r = parseInt(hex.slice(1, 3), 16) + amt;
  let g = parseInt(hex.slice(3, 5), 16) + amt;
  let b = parseInt(hex.slice(5, 7), 16) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}

function animate() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  drawStars();
  drawSun();
  for (const p of planets) {
    p.angle += p.speed;
    drawPlanet(p);
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
