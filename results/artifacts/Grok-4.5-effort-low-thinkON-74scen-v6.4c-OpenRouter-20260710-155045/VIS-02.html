<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,cx,cy;
function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
cx=W/2;cy=H/2;
}
window.addEventListener('resize',resize);
resize();
const N=900;
const stars=[];
const arms=4;
const maxR=Math.min(W,H)*0.42;
const colors=['#ffffff','#fffaf0','#f0f8ff','#fff5e6','#e6f0ff','#ffe4c4','#f5f5dc','#e0ffff','#fffacd','#f0fff0'];
for(let i=0;i<N;i++){
const arm=i%arms;
const t=Math.random();
const r=Math.pow(t,0.65)*maxR+4;
const base=arm*(Math.PI*2/arms);
const spiral=Math.log(r+1)*1.8;
const noise=(Math.random()-0.5)*0.55;
const theta=base+spiral+noise;
const speed=0.0018*(0.35+0.65*(1-r/maxR));
const size=0.4+Math.random()*1.8*(0.4+0.6*(1-r/maxR));
const col=colors[(Math.random()*colors.length)|0];
const tw=Math.random()*Math.PI*2;
const tws=0.02+Math.random()*0.06;
stars.push({r,theta,speed,size,col,tw,tws,baseAlpha:0.55+Math.random()*0.45});
}
function drawCore(){
const g=ctx.createRadialGradient(cx,cy,0,cx,cy,70);
g.addColorStop(0,'rgba(255,255,220,1)');
g.addColorStop(0.12,'rgba(255,230,160,0.95)');
g.addColorStop(0.35,'rgba(255,160,80,0.45)');
g.addColorStop(0.65,'rgba(180,80,40,0.12)');
g.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(cx,cy,70,0,Math.PI*2);
ctx.fill();
const g2=ctx.createRadialGradient(cx,cy,0,cx,cy,18);
g2.addColorStop(0,'rgba(255,255,255,1)');
g2.addColorStop(0.5,'rgba(255,255,200,0.7)');
g2.addColorStop(1,'rgba(255,200,100,0)');
ctx.fillStyle=g2;
ctx.beginPath();
ctx.arc(cx,cy,18,0,Math.PI*2);
ctx.fill();
}
function frame(){
ctx.fillStyle='#000';
ctx.fillRect(0,0,W,H);
drawCore();
for(const s of stars){
s.theta+=s.speed;
s.tw+=s.tws;
const x=cx+Math.cos(s.theta)*s.r;
const y=cy+Math.sin(s.theta)*s.r;
const a=s.baseAlpha*(0.55+0.45*Math.sin(s.tw));
ctx.globalAlpha=a;
ctx.fillStyle=s.col;
ctx.beginPath();
ctx.arc(x,y,s.size,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=a*0.35;
ctx.beginPath();
ctx.arc(x,y,s.size*2.2,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
