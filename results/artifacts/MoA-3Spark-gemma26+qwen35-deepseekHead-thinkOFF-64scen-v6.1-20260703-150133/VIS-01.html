<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            background: #000;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let W, H, cx, cy;

            // --- resize ---
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
                generateStars();
            }
            window.addEventListener('resize', resize);

            // --- starfield ---
            let stars = [];

            function generateStars() {
                stars = [];
                const count = Math.floor((W * H) / 1800);
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.6 + 0.4,
                        baseA: Math.random() * 0.5 + 0.3,
                        twinkleSpeed: 0.008 + Math.random() * 0.04,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawStars(time) {
                for (const s of stars) {
                    const a = s.baseA + 0.35 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
                    const alpha = Math.max(0.05, Math.min(1, a));
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // --- planet data ---
            const planetDefs = [
                { name: 'Mercury', orbit: 55, size: 3.8, speed: 0.032, color: '#b5b5b5' },
                { name: 'Venus', orbit: 85, size: 5.5, speed: 0.022, color: '#e8c87a' },
                { name: 'Earth', orbit: 120, size: 6.0, speed: 0.018, color: '#4a9be8' },
                { name: 'Mars', orbit: 158, size: 4.5, speed: 0.014, color: '#d4735e' },
                { name: 'Jupiter', orbit: 220, size: 14.0, speed: 0.008, color: '#d8a27a' },
                { name: 'Saturn', orbit: 300, size: 11.5, speed: 0.0055, color: '#e8d5a3', rings: true },
                { name: 'Uranus', orbit: 380, size: 8.5, speed: 0.0038, color: '#7ec8d6' },
                { name: 'Neptune', orbit: 450, size: 8.0, speed: 0.0028, color: '#3f6ba8' }
            ];

            const planets = planetDefs.map(p => ({
                ...p,
                angle: Math.random() * Math.PI * 2
            }));

            // --- drawing helpers ---
            function drawSun() {
                // outer glow
                const glowR = 110;
                const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, glowR);
                grad.addColorStop(0, 'rgba(255,255,240,1)');
                grad.addColorStop(0.08, 'rgba(255,235,150,1)');
                grad.addColorStop(0.25, 'rgba(255,200,80,0.85)');
                grad.addColorStop(0.5, 'rgba(255,140,40,0.4)');
                grad.addColorStop(0.75, 'rgba(255,80,20,0.15)');
                grad.addColorStop(1, 'rgba(255,40,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
                ctx.fill();

                // core glow with shadow
                ctx.save();
                ctx.shadowColor = '#ffcc44';
                ctx.shadowBlur = 60;
                const coreGrad = ctx.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 28);
                coreGrad.addColorStop(0, '#fffef0');
                coreGrad.addColorStop(0.3, '#ffe866');
                coreGrad.addColorStop(0.7, '#ffaa22');
                coreGrad.addColorStop(1, '#ff7700');
                ctx.fillStyle = coreGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, 26, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // bright inner core
                ctx.fillStyle = 'rgba(255,255,245,0.6)';
                ctx.beginPath();
                ctx.arc(cx - 5, cy - 5, 12, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawOrbit(r) {
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.stroke();
            }

            function drawPlanet(p, time) {
                // update angle
                p.angle += p.speed;

                const x = cx + Math.cos(p.angle) * p.orbit;
                const y = cy + Math.sin(p.angle) * p.orbit;

                // orbit path
                drawOrbit(p.orbit);

                // Saturn rings
                if (p.rings) {
                    ctx.save();
                    ctx.translate(x, y);
                    const tilt = 0.35;
                    const rx = p.size * 2.8;
                    const ry = p.size * 0.9;
                    // outer ring
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210,190,140,0.5)';
                    ctx.lineWidth = 3.5;
                    ctx.stroke();
                    // inner ring
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx * 0.78, ry * 0.78, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210,190,140,0.25)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.restore();
                }

                // planet body with shading
                const r = p.size;
                // shadow side
                const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
                grad.addColorStop(0, lightenColor(p.color, 40));
                grad.addColorStop(0.5, p.color);
                grad.addColorStop(1, darkenColor(p.color, 50));
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();

                // specular highlight
                ctx.fillStyle = 'rgba(255,255,255,0.18)';
                ctx.beginPath();
                ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            // --- color utilities ---
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 200, g: 200, b: 200 };
            }

            function rgbToHex(r, g, b) {
                return '#' + [r, g, b].map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2, '0')).join('');
            }

            function lightenColor(hex, amt) {
                const { r, g, b } = hexToRgb(hex);
                return rgbToHex(Math.min(255, r + amt), Math.min(255, g + amt), Math.min(255, b + amt));
            }

            function darkenColor(hex, amt) {
                const { r, g, b } = hexToRgb(hex);
                return rgbToHex(Math.max(0, r - amt), Math.max(0, g - amt), Math.max(0, b - amt));
            }

            // --- main loop ---
            let startTime = performance.now();

            function animate(now) {
                const elapsed = (now - startTime) / 1000;

                // clear
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                // stars
                drawStars(elapsed);

                // sun
                drawSun();

                // planets
                for (const p of planets) {
                    drawPlanet(p, elapsed);
                }

                requestAnimationFrame(animate);
            }

            // --- init ---
            resize();
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
