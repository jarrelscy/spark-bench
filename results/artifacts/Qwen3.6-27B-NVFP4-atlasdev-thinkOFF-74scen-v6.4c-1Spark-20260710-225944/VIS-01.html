<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration
        const starCount = 400;
        let stars = [];

        // Planet Data (Relative sizes and speeds for visual effect, not scientific scale)
        const planets = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.025, angle: Math.random() * Math.PI * 2 },
            { name: "Earth",   color: "#22A6F2", radius: 7.5, distance: 130, speed: 0.02, angle: Math.random() * Math.PI * 2 },
            { name: "Mars",    color: "#FF5733", radius: 5, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D9A066", radius: 18, distance: 240, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn",  color: "#E0C896", radius: 15, distance: 310, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus",  color: "#82E0E0", radius: 10, distance: 380, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#4169E1", radius: 9, distance: 440, speed: 0.003, angle: Math.random() * Math.PI * 2 }
        ];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        // Generate random background stars
        function generateStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        // Draw the background
        function drawBackground() {
            // Clear screen with black
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Draw stars
            ctx.fillStyle = '#FFFFFF';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        // Draw the Sun
        function drawSun() {
            const sunRadius = 35;
            
            // Create a glow effect
            const gradient = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.2, centerX, centerY, sunRadius * 2.5);
            gradient.addColorStop(0, '#FFF');       // Center white
            gradient.addColorStop(0.1, '#FDB813');  // Sun yellow
            gradient.addColorStop(0.4, 'rgba(255, 140, 0, 0.6)'); // Orange glow
            gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');     // Fade out

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Draw the solid core of the sun
            ctx.fillStyle = '#FDB813';
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Orbit Paths (faint lines)
        function drawOrbits() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            planets.forEach(planet => {
                ctx.beginPath(.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        // Draw Planets
        function drawPlanets() {
            planets.forEach(planet => {
                // Update angle
                planet.angle += planet.speed;

                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Saturn's Ring (behind planet if needed, but simple 2D is fine)
                if (planet.hasRing) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(planet.angle + Math.PI / 4); // Tilt ring
                    ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    // Draw an ellipse for the ring
                    ctx.ellipse(0, 0, planet.radius * 2.2, planet.radius * 0.8, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Draw Planet Shadow/Highlight (simple 3D effect)
                const gradient = ctx.createRadialGradient(
                    x - planet.radius * 0.3, 
                    y - planet.radius * 0.3, 
                    planet.radius * 0.1, 
                    x, 
                    y, 
                    planet.radius
                );
                gradient.addColorStop(0, planet.color);
                gradient.addColorStop(1, '#000000'); // Shadow side

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Optional: Draw Planet Name
                // ctx.fillStyle = "rgba(255,255,255,0.5)";
                // ctx.font = "10px Arial";
                // ctx.textAlign = "center";
                // ctx.fillText(planet.name, x, y + planet.radius + 12);
            });
        }

        // Main Animation Loop
        function animate() {
            drawBackground();
            drawOrbits();
            drawSun();
            drawPlanets();
            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize(); // Initial sizing
        animate(); // Start loop

    </script>
</body>
</html>
