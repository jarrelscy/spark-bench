<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spiral Galaxy Animation</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="galaxy"></canvas>
  <script>
    const canvas = document.getElementById('galaxy');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const stars = [];
    const starCount = 300;
    const coreRadius = 40;
    const spiralArms = 2;
    const rotationSpeed = 0.0003;
    const twinkleSpeed = 0.02;

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        // Random radius from core, biased toward outer arms
        const r = Math.pow(Math.random(), 1.5) * (width / 2 - coreRadius) + coreRadius;
        // Angle with spiral arm modulation
        const baseAngle = Math.random() * Math.PI * 2;
        const armOffset = Math.sin(baseAngle * spiralArms) * 0.5;
        this.angle = baseAngle + armOffset;
        this.radius = r;
        this.size = 0.5 + Math.random() * 1.5;
        this.brightness = 0.6 + Math.random() * 0.4;
        this.colorOffset = Math.random() * 0.5; // for subtle hue variation
        this.twinklePhase = Math.random() * Math.PI * 2;
        this.twinkleSpeed = 0.01 + Math.random() * 0.03;
      }

      update(time) {
        // Rotate around core
        this.angle += rotationSpeed * (1 + this.radius / width * 0.5);
        // Twinkle
        this.twinklePhase += this.twinkleSpeed;
        const twinkle = 0.5 + 0.5 * Math.sin(this.twinklePhase);
        this.brightness = 0.6 + 0.4 * twinkle;
        // Wrap angle
        if (this.angle > Math.PI * 2) this.angle -= Math.PI * 2;
        if (this.angle < 0) this.angle += Math.PI * 2;
      }

      draw() {
        const x = width / 2 + Math.cos(this.angle) * this.radius;
        const y = height / 2 + Math.sin(this.angle) * this.radius;

        // Subtle color variation: shift hue based on position and time
        const hue = 200 + this.colorOffset * 30 + Math.sin(this.angle * 0.5) * 10; // blue-purple range
        const saturation = 70 + Math.random() * 10;
        const lightness = this.brightness * 50 + 20; // 20-70% lightness

        ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Initialize stars
    for (let i = 0; i < starCount; i++) {
      stars.push(new Star());
    }

    let lastTime = 0;
    function animate(time) {
      const deltaTime = time - lastTime;
      lastTime = time;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      // Draw faint core glow
      const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, coreRadius);
      gradient.addColorStop(0, 'rgba(255, 255, 200, 0.15)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      stars.forEach(star => {
        star.update(time);
        star.draw();
      });

      requestAnimationFrame(animate);
    }

    // Handle resize
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    animate(0);
  </script>
</body>
</html>
