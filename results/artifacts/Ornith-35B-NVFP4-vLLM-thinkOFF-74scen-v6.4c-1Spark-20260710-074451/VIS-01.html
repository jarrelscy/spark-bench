<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Starfield
        const stars = [];
        const numStars = 500;

        function generateStars() {
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    brightness: Math.random(),
                    twinkleSpeed: 0.01 + Math.random() * 0.04
                });
            }
        }

        generateStars();

        // Sun
        const sun = {
            radius: 40,
            color: '#FDB813',
            glowColor: '#FF4500'
        };

        // Planets
        const planets = [
            {
                name: 'Mercury',
                radius: 6,
                orbitRadius: 70,
                speed: 0.04,
                color: '#A9A9A9',
                angle: Math.random() * Math.PI * 2
            },
            {
                name: 'Venus',
                radius: 10,
                orbitRadius: 110,
                speed: 0.03,
                color: '#FFC649',
                angle: Math.random() * Math.PI * 2
            },
            {
                name: 'Earth',
                radius: 11,
                orbitRadius: 160,
                speed: 0.025,
                color: '#4F97E8',
                angle: Math.random() * Math.PI * 2
            },
            {
                name: 'Mars',
                radius: 8,
                orbitRadius: 210,
                speed: 0.02,
                color: '#E25A23',
                angle: Math.random() * Math.PI * 2
            },
            {
                name: 'Jupiter',
                radius: 22,
                orbitRadius: 290,
                speed: 0.01,
                color: '#C88B3A',
                angle: Math.random() * Math.PI * 2
            },
            {
                name: 'Saturn',
                radius: 18,
                orbitRadius: 370,
                speed: 0.008,
                color: '#EAD6B8',
                angle: Math.random() * Math.PI * 2,
                hasRings: true
            }
        ];

        let time = 0;

        function drawStars() {
            stars.forEach(star => {
                const twinkle = Math.sin(time * star.twinkleSpeed) * 0.5 + 0.5;
                const alpha = star.brightness * (0.5 + twinkle * 0.5);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sun.radius * 3);
            gradient.addColorStop(0, 'rgba(253, 184, 19, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 69, 0, 0.6)');
            gradient.addColorStop(0.7, 'rgba(255, 69, 0, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius * 3, 0, Math.PI * 2);
            ctx.fill();

            // Inner sun
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sun.radius);
            sunGradient.addColorStop(0, '#FFF');
            sunGradient.addColorStop(0.5, '#FDB813');
            sunGradient.addColorStop(1, '#FF4500');

            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOrbit(orbitRadius) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Draw orbit path
            drawOrbit(planet.orbitRadius);

            // Planet glow
            const glowGradient = ctx.createRadialGradient(x, y, 0, x, y, planet.radius * 2);
            glowGradient.addColorStop(0, planet.color);
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 2, 0, Math.PI * 2);
            ctx.fill();

            // Planet body
            const planetGradient = ctx.createRadialGradient(x - planet.radius * 0.3, y - planet.radius * 0.3, 0, x, y, planet.radius);
            planetGradient.addColorStop(0, lightenColor(planet.color, 30));
            planetGradient.addColorStop(1, darkenColor(planet.color, 30));

            ctx.fillStyle = planetGradient;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Saturn's rings
            if (planet.hasRings) {
                ctx.strokeStyle = 'rgba(210, 180, 140, 0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 1.8, planet.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(210, 180, 140, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 1.4, planet.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Label
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 15);
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace("#", ""), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                G = (num >> 8 & 0x00FF) + amt,
                B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function darkenColor(color, percent) {
            const num = parseInt(color.replace("#", ""), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) - amt,
                G = (num >> 8 & 0x00FF) - amt,
                B = (num & 0x0000FF) - amt;
            return "#" + (0x1000000 + (R > 255 ? 255 : R > 0 ? R : 0) * 0x10000 +
                (G > 255 ? 255 : G > 0 ? G : 0) * 0x100 +
                (B > 255 ? 255 : B > 0 ? B : 0)).toString(16).slice(1);
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();

            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            time++;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
