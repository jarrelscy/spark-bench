<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Fallback */
            overflow: hidden; /* Prevent scrollbars */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    /**
     * Solar System Animation
     * Pure HTML5 Canvas implementation
     */

    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration
    const PLANET_COUNT = 8;
    
    // Planet Data: relative size, relative distance, speed, color
    // Note: Scales are artistic, not astronomical, to fit on screen nicely.
    const planetData = [
        { name: "Mercury", size: 4,  dist: 60,  speed: 0.04, color: "#A5A5A5" },
        { name: "Venus",   size: 7,  dist: 90,  speed: 0.03, color: "#E3BB76" },
        { name: "Earth",   size: 7.5,dist: 130, speed: 0.02, color: "#22A6F2" },
        { name: "Mars",    size: 5,  dist: 170, speed: 0.016, color: "#FF5733" },
        { name: "Jupiter", size: 18, dist: 240, speed: 0.008, color: "#D9A066" },
        { name: "Saturn",  size: 15, dist: 310, speed: 0.006, color: "#F4D03F", ring: true },
        { name: "Uranus",  size: 10, dist: 370, speed: 0.004, color: "#AEEEEE" },
        { name: "Neptune", size: 10, dist: 420, speed: 0.003, color: "#5B7CFF" }
    ];

    let planets = [];
    let stars = [];

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars(); // Regenerate stars on resize
    }

    // Generate static starfield
    function generateStars() {
        stars = [];
        const starCount = 400;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    // Initialize Planets
    function initPlanets() {
        planets = planetData.map(data => {
            return {
                ...data,
                angle: Math.random() * Math.PI * 2 // Random start position
            };
        });
    }

    // Draw the Starfield
    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0; // Reset alpha
    }

    // Draw the Sun
    function drawSun() {
        // Outer Glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
        gradient.addColorStop(0, "rgba(255, 255, 200, 1)"); // Core
        gradient.addColorStop(0.2, "rgba(255, 200, 0, 0.8)"); // Inner Glow
        gradient.addColorStop(0.5, "rgba(255, 100, 0, 0.3)"); // Outer Glow
        gradient.addColorStop(1, "rgba(255, 50, 0, 0)"); // Fade out

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Solid Core
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw a single Planet
    function drawPlanet(planet) {
        // Calculate position based on angle and distance
        const x = centerX + Math.cos(planet.angle) * planet.dist;
        const y = centerY + Math.sin(planet.angle) * planet.dist;

        // Draw Orbit Path (faint line)
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX, centerY, planet.dist, 0, Math.PI * 2);
        ctx.stroke();

        // Draw Planet Body
        ctx.fillStyle = planet.color;
        ctx.beginPath();
        ctx.arc(x, y, planet.size, 0, Math.PI * 2);
        ctx.fill();

        // Add a slight shadow/shine effect for 3D look
        const planetGrad = ctx.createRadialGradient(x - planet.size/3, y - planet.size/3, planet.size/4, x, y, planet.size);
        planetGrad.addColorStop(0, "rgba(255,255,255,0.3)");
        planetGrad.addColorStop(1, "rgba(0,0,0,0.4)");
        
        ctx.fillStyle = planetGrad;
        ctx.beginPath();
        ctx.arc(x, y, planet.size, 0, Math.PI * 2);
        ctx.fill();

        // Special Case: Saturn's Rings
        if (planet.ring) {
            ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            // Elliptical ring
            ctx.ellipse(x, y, planet.size * 2.2, planet.size * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // Main Animation Loop
    function animate() {
        // Clear Canvas
        ctx.fillStyle = "#050510"; // Very dark blue/black background
        ctx.fillRect(0, 0, width, height);

        // Draw Background Elements
        drawStars();
        drawSun();

        // Update and Draw Planets
        planets.forEach(planet => {
            // Update Angle
            planet.angle += planet.speed;
            
            // Draw
            drawPlanet(planet);
        });

        // Request next frame
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);

    // Start
    resize();
    initPlanets();
    animate();

</script>

</body>
</html>
