<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const STAR_COUNT = 600;
        const ARM_COUNT = 4;           // Number of spiral arms
        const GALAXY_RADIUS_X = Math.min(width, height) * 0.35;
        const GALAXY_RADIUS_Y = GALAXY_RADIUS_X * 0.45; // Elliptical shape
        const ROTATION_SPEED = 0.0003; // Radians per frame

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Randomly assign to an arm or the bulge
                const isBulge = Math.random() < 0.2; // 20% chance for central bulge
                
                if (isBulge) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.pow(Math.random(), 0.5) * GALAXY_RADIUS_X * 0.25;
                    this.angle = angle;
                    this.radius = r;
                } else {
                    // Spiral arm logic
                    const armIndex = Math.floor(Math.random() * ARM_COUNT);
                    const baseAngle = (armIndex / ARM_COUNT) * Math.PI * 2;
                    
                    // Distance from center determines how much it winds
                    const dist = Math.pow(Math.random(), 0.7); // Power curve for distribution
                    const r = dist * GALAXY_RADIUS_X;
                    
                    // Spiral equation: theta = a + b * r
                    // Tighter winding = larger multiplier
                    const spiralFactor = 1.5; 
                    this.angle = baseAngle + (r / GALAXY_RADIUS_X) * spiralFactor * Math.PI;
                    this.radius = r;
                    
                    // Add scatter to make it look natural
                    this.scatterX = (Math.random() - 0.5) * (GALAXY_RADIUS_X * 0.15) * dist;
                    this.scatterY = (Math.random() - 0.5) * (GALAXY_RADIUS_Y * 0.15) * dist;
                }

                // Visual properties
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color variation based on distance
                // Core: Yellow/White, Outer: Blue/Purple
                const colorRoll = Math.random();
                if (this.radius < GALAXY_RADIUS_X * 0.2) {
                    // Hot/Bright core colors
                    this.r = 255;
                    this.g = 250 - Math.random() * 50;
                    this.b = 200 - Math.random() * 100;
                } else if (colorRoll > 0.7) {
                    // Blue stars
                    this.r = 150 + Math.random() * 100;
                    this.g = 150 + Math.random() * 100;
                    this.b = 255;
                } else if (colorRoll > 0.4) {
                    // White/Grey stars
                    const v = 200 + Math.random() * 55;
                    this.r = v;
                    this.g = v;
                    this.b = v;
                } else {
                    // Slight warm tint
                    this.r = 255;
                    this.g = 220 + Math.random() * 35;
                    this.b = 180 + Math.random() * 50;
                }
            }

            update(time) {
                this.currentAngle = this.angle + time * ROTATION_SPEED;
                
                // Twinkle effect
                this.brightness = 0.5 + 0.5 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
            }

            draw(ctx, cx, cy) {
                // Convert polar to cartesian
                const x = Math.cos(this.currentAngle) * this.radius;
                const y = Math.sin(this.currentAngle) * (GALAXY_RADIUS_Y / GALAXY_RADIUS_X) * this.radius;
                
                // Apply scatter
                const finalX = cx + x + (this.scatterX || 0);
                const finalY = cy + y + (this.scatterY || 0);

                const alpha = this.brightness * 0.9;
                
                // Draw star glow
                const gradient = ctx.createRadialGradient(finalX, finalY, 0, finalX, finalY, this.size * 2);
                gradient.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${alpha})`);
                gradient.addColorStop(1, `rgba(${this.r}, ${this.g}, ${this.b}, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(finalX, finalY, this.size * 2, 0, Math.PI * 2);
                ctx.fill();

                // Draw core point
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(finalX, finalY, this.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize Stars
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        // Background stars (static)
        const bgStars = [];
        for (let i = 0; i < 150; i++) {
            bgStars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random(),
                alpha: Math.random() * 0.5 + 0.1
            });
        }

        function drawCoreGlow(cx, cy) {
            const maxR = GALAXY_RADIUS_X * 0.3;
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
            
            // Bright white center fading to yellow/orange
            gradient.addColorStop(0, 'rgba(255, 255, 250, 0.4)');
            gradient.addColorStop(0.2, 'rgba(255, 220, 150, 0.15)');
            gradient.addColorStop(0.6, 'rgba(200, 150, 255, 0.05)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
            ctx.fill();
        }

        let startTime = performance.now();

        function animate(timestamp) {
            const elapsed = timestamp - startTime;

            // Clear screen
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Update dimensions dynamically if resized
            centerX = width / 2;
            centerY = height / 2;

            // Draw faint background stars
            ctx.fillStyle = '#ffffff';
            for (const star of bgStars) {
                ctx.globalAlpha = star.alpha;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.globalAlpha = 1.0;

            // Draw core glow behind stars
            drawCoreGlow(centerX, centerY);

            // Update and draw galaxy stars
            // Sort by radius so outer stars are drawn over inner ones (rough depth)
            // Actually, usually we draw back-to-front, but here they overlap significantly.
            // We'll just iterate through them.
            
            for (const star of stars) {
                star.update(elapsed);
                star.draw(ctx, centerX, centerY);
            }

            requestAnimationFrame(animate);
        }

        // Handle resize for background stars
        window.addEventListener('resize', () => {
            resize();
            bgStars.length = 0;
            for (let i = 0; i < 150; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random(),
                    alpha: Math.random() * 0.5 + 0.1
                });
            }
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
