<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1200;
        const ARM_COUNT = 3;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle
                this.angle = Math.random() * Math.PI * 2;
                
                // Distance from center (biased towards center for core density)
                // Using square root of random for uniform distribution in circle
                const r = Math.random();
                const dist = Math.pow(r, 0.5) * (Math.min(width, height) * 0.45);
                this.distance = dist;
                
                // Spiral arm offset
                // Calculate which arm this star belongs to
                const armIndex = Math.floor(Math.random() * ARM_COUNT);
                const armAngle = (armIndex * 2 * Math.PI) / ARM_COUNT;
                
                // Add some randomness to the angle to make arms fuzzy
                const spiralTightness = 0.5; // Lower = tighter spiral
                const armSpread = (Math.random() - 0.5) * 1.5; // Spread around the arm
                
                this.angle = armAngle + (this.distance * spiralTightness * 0.005) + armSpread;
                
                // Star properties
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color: mostly white/blue-ish, some yellow/red
                const colorRand = Math.random();
                if (colorRand < 0.7) {
                    // White/Blue
                    this.r = 200 + Math.random() * 55;
                    this.g = 200 + Math.random() * 55;
                    this.b = 255;
                } else if (colorRand < 0.9) {
                    // Yellow
                    this.r = 255;
                    this.g = 220 + Math.random() * 35;
                    this.b = 150 + Math.random() * 50;
                } else {
                    // Reddish
                    this.r = 255;
                    this.g = 100 + Math.random() * 100;
                    this.b = 80 + Math.random() * 50;
                }
                
                // Base brightness
                this.baseAlpha = 0.5 + Math.random() * 0.5;
            }

            update(time) {
                // Slow rotation
                const rotationSpeed = 0.0001 / (this.distance * 0.01 + 1); // Inner stars rotate faster
                this.angle += rotationSpeed;
                
                // Twinkle
                this.currentAlpha = this.baseAlpha * (0.7 + 0.3 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
            }

            draw(ctx) {
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;
                
                // Draw star
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.round(this.r)}, ${Math.round(this.g)}, ${Math.round(this.b)}, ${this.currentAlpha})`;
                ctx.fill();
                
                // Add glow for larger stars
                if (this.size > 1.2) {
                    ctx.beginPath();
                    ctx.arc(x, y, this.size * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${Math.round(this.r)}, ${Math.round(this.g)}, ${Math.round(this.b)}, ${this.currentAlpha * 0.1})`;
                    ctx.fill();
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Create a radial gradient for the core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.min(width, height) * 0.15);
            gradient.addColorStop(0, 'rgba(255, 250, 240, 0.9)');
            gradient.addColorStop(0.2, 'rgba(255, 220, 180, 0.5)');
            gradient.addColorStop(0.5, 'rgba(200, 150, 100, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, Math.min(width, height) * 0.15, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function animate(time) {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slight trail effect
            ctx.fillRect(0, 0, width, height);
            
            // Draw core
            drawCore();
            
            // Update and draw stars
            for (const star of stars) {
                star.update(time);
                star.draw(ctx);
            }
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
