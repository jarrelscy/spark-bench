<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden; /* Prevent scrollbars */
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];
    
    // Configuration for planets
    // Distances and sizes are scaled for visual aesthetics, not scientific accuracy
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6B3", radius: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#EB4D4B", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#F0932B", radius: 18, distance: 240, speed: 0.005, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#F6E58D", radius: 15, distance: 320, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#7ED6DF", radius: 10, distance: 400, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4834D4", radius: 10, distance: 480, speed: 0.001, angle: Math.random() * Math.PI * 2 }
    ];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    function generateStars() {
        stars = [];
        const starCount = 400;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Sun Glow
        ctx.shadowBlur = 50;
        ctx.shadowColor = "#F9CA24";
        
        // Sun Body
        const sunRadius = 35;
        const gradient = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.2, centerX, centerY, sunRadius);
        gradient.addColorStop(0, "#FFF");
        gradient.addColorStop(0.4, "#F9CA24");
        gradient.addColorStop(1, "#F0932B");

        ctx.beginPath();
        ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        
        // Reset shadow for other elements
        ctx.shadowBlur = 0;
    }

    function drawOrbitLines() {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        
        planets.forEach(planet => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    function drawPlanets() {
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Planet
            ctx.beginPath();
            
            // Special handling for Saturn's ring
            if (planet.hasRing) {
                ctx.save();
                ctx.translate(x, y);
                // Draw ring behind planet
                ctx.beginPath();
                ctx.ellipse(0, 0, planet.radius * 2, planet.radius * 0.8, Math.PI / 8, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(200, 200, 200, 0.6)";
                ctx.lineWidth = 4;
                ctx.stroke();
                
                // Draw planet body
                ctx.beginPath();
                ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();
                
                // Draw front part of ring (optional for detail, skipping for simplicity)
                ctx.restore();
            } else {
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();
            }
        });
    }

    function animate() {
        // Clear screen
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawOrbitLines();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Initialize
    window.addEventListener('resize', resize);
    resize(); // Initial setup
    animate(); // Start loop

</script>
</body>
</html>
