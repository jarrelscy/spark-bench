<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('solarSystem');
            const ctx = canvas.getContext('2d');
            
            let width, height, centerX, centerY;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                centerX = width / 2;
                centerY = height / 2;
                initStars();
            }

            // Starfield
            const stars = [];
            const STAR_COUNT = 400;

            function initStars() {
                stars.length = 0;
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 1.5 + 0.5,
                        opacity: Math.random()
                    });
                }
            }

            function drawStars() {
                ctx.fillStyle = '#fff';
                for (let star of stars) {
                    ctx.globalAlpha = star.opacity;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }

            // Sun
            const sun = {
                radius: 35,
                color: '#FDB813',
                glowColor: 'rgba(253, 184, 19, 0.4)',
                draw: function() {
                    // Glow
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, this.radius * 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.glowColor;
                    ctx.fill();

                    // Sun body
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    
                    // Sun light (shadow effect)
                    ctx.shadowBlur = 50;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            };

            // Planets
            const planets = [
                { name: 'Mercury', radius: 4, distance: 60, speed: 0.02, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
                { name: 'Venus', radius: 7, distance: 90, speed: 0.015, color: '#E3BB76', angle: Math.random() * Math.PI * 2 },
                { name: 'Earth', radius: 7.5, distance: 130, speed: 0.01, color: '#4F81BD', angle: Math.random() * Math.PI * 2 },
                { name: 'Mars', radius: 5, distance: 170, speed: 0.008, color: '#C1440E', angle: Math.random() * Math.PI * 2 },
                { name: 'Jupiter', radius: 18, distance: 240, speed: 0.004, color: '#D6A566', angle: Math.random() * Math.PI * 2 },
                { name: 'Saturn', radius: 15, distance: 310, speed: 0.003, color: '#EAD6B8', angle: Math.random() * Math.PI * 2, hasRing: true },
                { name: 'Uranus', radius: 10, distance: 370, speed: 0.002, color: '#A7C7E7', angle: Math.random() * Math.PI * 2 },
                { name: 'Neptune', radius: 9, distance: 420, speed: 0.0015, color: '#3E54E8', angle: Math.random() * Math.PI * 2 }
            ];

            function drawOrbit(distance) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            function drawPlanet(planet) {
                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit
                drawOrbit(planet.distance);

                // Draw Planet
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();

                // Planet shadow (to give 3D feel relative to sun)
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(x - planet.radius/3, y - planet.radius/3, planet.radius * 0.2, x, y, planet.radius);
                gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = gradient;
                ctx.fill();

                // Draw Saturn's Ring
                if (planet.hasRing) {
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI/2, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(234, 214, 184, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            }

            function updatePlanets() {
                for (let planet of planets) {
                    planet.angle += planet.speed;
                }
            }

            function animate() {
                // Clear screen
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                drawStars();
                
                sun.draw();

                for (let planet of planets) {
                    drawPlanet(planet);
                }

                updatePlanets();

                requestAnimationFrame(animate);
            }

            // Initialize and start
            window.addEventListener('resize', resize);
            resize();
            animate();
        })();
    </script>
</body>
</html>
