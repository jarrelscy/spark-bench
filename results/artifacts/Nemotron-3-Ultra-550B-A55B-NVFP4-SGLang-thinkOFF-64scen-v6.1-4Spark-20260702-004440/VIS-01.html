<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas { display: block; }
    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="solarSystem"></canvas>
  <div class="info">Click and drag to rotate view • Scroll to zoom</div>
  
  <script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');
    
    // Configuration
    const config = {
      sun: { radius: 40, color: '#FFD700', glowColor: '#FFA500' },
      planets: [
        { name: 'Mercury', distance: 70, radius: 6, speed: 0.04, color: '#B5B5B5', tilt: 0.1 },
        { name: 'Venus', distance: 110, radius: 10, speed: 0.015, color: '#E6C87A', tilt: 0.05 },
        { name: 'Earth', distance: 155, radius: 10, speed: 0.01, color: '#4A90D9', tilt: 0.2, hasMoon: true, moon: { distance: 18, radius: 3, speed: 0.06, color: '#AAAAAA' } },
        { name: 'Mars', distance: 205, radius: 8, speed: 0.008, color: '#E27B58', tilt: 0.15 },
        { name: 'Jupiter', distance: 280, radius: 24, speed: 0.002, color: '#D4A574', tilt: 0.03, hasRing: false },
        { name: 'Saturn', distance: 360, radius: 20, speed: 0.0009, color: '#F4E4BC', tilt: 0.25, hasRing: true, ring: { inner: 26, outer: 38, color: 'rgba(200,180,140,0.6)' } },
        { name: 'Uranus', distance: 420, radius: 14, speed: 0.0004, color: '#7DE3F4', tilt: 1.5 },
        { name: 'Neptune', distance: 475, radius: 13, speed: 0.00025, color: '#4B70DD', tilt: 0.3 }
      ],
      stars: 300,
      orbitColor: 'rgba(255,255,255,0.08)'
    };
    
    // State
    let width, height, centerX, centerY;
    let scale = 1;
    let offsetX = 0, offsetY = 0;
    let rotation = 0;
    let isDragging = false;
    let lastMouseX = 0, lastMouseY = 0;
    let time = 0;
    let stars = [];
    
    // Initialize
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
      generateStars();
    }
    
    function generateStars() {
      stars = [];
      for (let i = 0; i < config.stars; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.3,
          brightness: Math.random(),
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinkleOffset: Math.random() * Math.PI * 2
        });
      }
    }
    
    // Event handlers
    window.addEventListener('resize', resize);
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      canvas.style.cursor = 'grabbing';
    });
    
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      rotation += dx * 0.002;
      offsetX += dx;
      offsetY += dy;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    
    window.addEventListener('mouseup', () => {
      isDragging = false;
      canvas.style.cursor = 'grab';
    });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
      const newScale = Math.max(0.3, Math.min(3, scale * zoomFactor));
      // Zoom toward mouse position
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
      offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
      scale = newScale;
    }, { passive: false });
    
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
      }
    }, { passive: true });
    
    canvas.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      e.preventDefault();
      const dx = e.touches[0].clientX - lastMouseX;
      const dy = e.touches[0].clientY - lastMouseY;
      rotation += dx * 0.002;
      offsetX += dx;
      offsetY += dy;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    }, { passive: false });
    
    canvas.addEventListener('touchend', () => {
      isDragging = false;
    });
    
    // Drawing functions
    function drawStarfield() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
      
      for (const star of stars) {
        const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;
        const alpha = star.brightness * twinkle;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fill();
      }
    }
    
    function drawOrbit(distance) {
      ctx.beginPath();
      ctx.arc(centerX + offsetX, centerY + offsetY, distance * scale, 0, Math.PI * 2);
      ctx.strokeStyle = config.orbitColor;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    
    function drawSun() {
      const sunX = centerX + offsetX;
      const sunY = centerY + offsetY;
      const sunRadius = config.sun.radius * scale;
      
      // Glow layers
      const glowGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius * 3);
      glowGradient.addColorStop(0, 'rgba(255, 215, 0, 0.4)');
      glowGradient.addColorStop(0.3, 'rgba(255, 165, 0, 0.2)');
      glowGradient.addColorStop(0.6, 'rgba(255, 100, 0, 0.1)');
      glowGradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
      
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius * 3, 0, Math.PI * 2);
      ctx.fillStyle = glowGradient;
      ctx.fill();
      
      // Corona pulses
      const pulse = Math.sin(time * 2) * 0.1 + 1;
      const coronaGradient = ctx.createRadialGradient(sunX, sunY, sunRadius * 0.8, sunX, sunY, sunRadius * 1.5 * pulse);
      coronaGradient.addColorStop(0, 'rgba(255, 255, 200, 0.3)');
      coronaGradient.addColorStop(0.5, 'rgba(255, 200, 50, 0.15)');
      coronaGradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
      
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius * 1.5 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = coronaGradient;
      ctx.fill();
      
      // Sun surface
      const sunGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius);
      sunGradient.addColorStop(0, '#FFF8DC');
      sunGradient.addColorStop(0.3, '#FFD700');
      sunGradient.addColorStop(0.7, '#FFA500');
      sunGradient.addColorStop(1, '#FF8C00');
      
      ctx.beginPath();
      ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
      ctx.fillStyle = sunGradient;
      ctx.fill();
      
      // Sun spots (subtle)
      ctx.fillStyle = 'rgba(255, 120, 0, 0.3)';
      for (let i = 0; i < 5; i++) {
        const angle = (time * 0.1 + i * 2.5) % (Math.PI * 2);
        const dist = sunRadius * 0.3 * Math.sin(time * 0.5 + i);
        const spotX = sunX + Math.cos(angle) * dist;
        const spotY = sunY + Math.sin(angle) * dist;
        ctx.beginPath();
        ctx.arc(spotX, spotY, sunRadius * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function drawPlanet(planet, angle) {
      const x = centerX + offsetX + Math.cos(angle) * planet.distance * scale;
      const y = centerY + offsetY + Math.sin(angle) * planet.distance * scale;
      const radius = planet.radius * scale;
      
      if (radius < 0.5) return; // Too small to render
      
      // Planet shadow
      const shadowGradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
      shadowGradient.addColorStop(0, 'rgba(0,0,0,0.4)');
      shadowGradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(x, y, radius * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = shadowGradient;
      ctx.fill();
      
      // Planet body with 3D lighting
      const lightAngle = -Math.PI / 4; // Light from top-left
      const planetGradient = ctx.createRadialGradient(
        x + Math.cos(lightAngle) * radius * 0.3,
        y + Math.sin(lightAngle) * radius * 0.3,
        0,
        x - Math.cos(lightAngle) * radius * 0.5,
        y - Math.sin(lightAngle) * radius * 0.5,
        radius * 1.5
      );
      
      // Parse base color
      const baseColor = planet.color;
      const r = parseInt(baseColor.slice(1, 3), 16);
      const g = parseInt(baseColor.slice(3, 5), 16);
      const b = parseInt(baseColor.slice(5, 7), 16);
      
      planetGradient.addColorStop(0, `rgb(${Math.min(255, r + 60)}, ${Math.min(255, g + 60)}, ${Math.min(255, b + 60)})`);
      planetGradient.addColorStop(0.4, baseColor);
      planetGradient.addColorStop(1, `rgb(${Math.max(0, r - 60)}, ${Math.max(0, g - 60)}, ${Math.max(0, b - 60)})`);
      
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = planetGradient;
      ctx.fill();
      
      // Atmosphere glow for specific planets
      if (planet.name === 'Earth') {
        const atmoGradient = ctx.createRadialGradient(x, y, radius, x, y, radius * 1.15);
        atmoGradient.addColorStop(0, 'rgba(100, 200, 255, 0)');
        atmoGradient.addColorStop(1, 'rgba(100, 200, 255, 0.3)');
        ctx.beginPath();
        ctx.arc(x, y, radius * 1.15, 0, Math.PI * 2);
        ctx.fillStyle = atmoGradient;
        ctx.fill();
      }
      
      if (planet.name === 'Venus') {
        const atmoGradient = ctx.createRadialGradient(x, y, radius, x, y, radius * 1.1);
        atmoGradient.addColorStop(0, 'rgba(255, 200, 100, 0)');
        atmoGradient.addColorStop(1, 'rgba(255, 200, 100, 0.2)');
        ctx.beginPath();
        ctx.arc(x, y, radius * 1.1, 0, Math.PI * 2);
        ctx.fillStyle = atmoGradient;
        ctx.fill();
      }
      
      // Rings for Saturn
      if (planet.hasRing && planet.ring) {
        const ringInner = planet.ring.inner * scale;
        const ringOuter = planet.ring.outer * scale;
        const tilt = planet.tilt;
        
        // Draw ring as ellipse
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(tilt);
        ctx.scale(1, Math.cos(tilt) * 0.5 + 0.5);
        
        const ringGradient = ctx.createRadialGradient(0, 0, ringInner, 0, 0, ringOuter);
        ringGradient.addColorStop(0, planet.ring.color);
        ringGradient.addColorStop(0.5, 'rgba(200, 180, 140, 0.4)');
        ringGradient.addColorStop(1, 'rgba(180, 160, 120, 0.1)');
        
        ctx.beginPath();
        ctx.arc(0, 0, ringOuter, 0, Math.PI * 2);
        ctx.fillStyle = ringGradient;
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(0, 0, ringInner, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        
        ctx.restore();
      }
      
      // Moon for Earth
      if (planet.hasMoon && planet.moon) {
        const moonAngle = time * planet.moon.speed * 50;
        const moonX = x + Math.cos(moonAngle) * planet.moon.distance * scale;
        const moonY = y + Math.sin(moonAngle) * planet.moon.distance * scale;
        const moonRadius = planet.moon.radius * scale;
        
        if (moonRadius > 0.5) {
          const moonGradient = ctx.createRadialGradient(
            moonX - moonRadius * 0.3, moonY - moonRadius * 0.3, 0,
            moonX + moonRadius * 0.3, moonY + moonRadius * 0.3, moonRadius
          );
          moonGradient.addColorStop(0, '#DDDDDD');
          moonGradient.addColorStop(0.7, planet.moon.color);
          moonGradient.addColorStop(1, '#888888');
          
          ctx.beginPath();
          ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
          ctx.fillStyle = moonGradient;
          ctx.fill();
        }
      }
      
      // Label for larger planets when zoomed in
      if (scale > 1.2 && radius > 12) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.font = `${Math.max(10, 12 * scale)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(planet.name, x, y - radius - 8 * scale);
      }
    }
    
    function animate() {
      time += 0.016; // ~60fps
      
      drawStarfield();
      
      // Draw orbits
      for (const planet of config.planets) {
        drawOrbit(planet.distance);
      }
      
      // Draw sun
      drawSun();
      
      // Draw planets
      for (const planet of config.planets) {
        const angle = time * planet.speed * 50 + rotation;
        drawPlanet(planet, angle);
      }
      
      requestAnimationFrame(animate);
    }
    
    // Initialize and start
    resize();
    canvas.style.cursor = 'grab';
    animate();
  </script>
</body>
</html>
