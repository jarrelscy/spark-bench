<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1500;
        const ARM_COUNT = 3;
        const CORE_GLOW_RADIUS = 100;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        // Star class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle
                this.angle = Math.random() * Math.PI * 2;
                // Random distance from center (biased towards center for density)
                this.distance = Math.pow(Math.random(), 0.5) * Math.min(width, height) * 0.4;
                // Spiral arm offset
                this.armOffset = (Math.floor(Math.random() * ARM_COUNT) / ARM_COUNT) * Math.PI * 2;
                // Random spread from the arm
                this.spread = (Math.random() - 0.5) * 40;
                // Size
                this.size = Math.random() * 2 + 0.5;
                // Color variation
                const colors = ['#FFFFFF', '#FFEEDD', '#DDDEFF', '#FFDDEE', '#EEFFFF'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                // Twinkle phase
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                // Base brightness
                this.baseBrightness = Math.random() * 0.5 + 0.5;
                // Orbital speed (closer stars move faster)
                this.orbitalSpeed = (Math.random() * 0.0005 + 0.0002) / (this.distance / 100 + 1);
            }

            update(time) {
                this.angle += this.orbitalSpeed;
                this.brightness = this.baseBrightness * (0.7 + 0.3 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
            }

            draw() {
                // Calculate position with spiral arm influence
                const spiralAngle = this.angle + (this.distance / (Math.min(width, height) * 0.4)) * Math.PI;
                const x = centerX + (this.distance + this.spread) * Math.cos(spiralAngle + this.armOffset);
                const y = centerY + (this.distance + this.spread) * Math.sin(spiralAngle + this.armOffset);

                // Draw star
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.brightness;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Create stars
        function createStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        // Draw core glow
        function drawCore() {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_GLOW_RADIUS);
            gradient.addColorStop(0, 'rgba(255, 250, 240, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 240, 220, 0.4)');
            gradient.addColorStop(0.5, 'rgba(200, 180, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(centerX - CORE_GLOW_RADIUS, centerY - CORE_GLOW_RADIUS, CORE_GLOW_RADIUS * 2, CORE_GLOW_RADIUS * 2);
        }

        // Animation loop
        let time = 0;
        function animate() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Draw core glow
            drawCore();

            // Update and draw stars
            for (const star of stars) {
                star.update(time);
                star.draw();
            }

            time++;
            requestAnimationFrame(animate);
        }

        // Initialize
        resize();
        createStars();
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            resize();
            createStars();
        });
    </script>
</body>
</html>
