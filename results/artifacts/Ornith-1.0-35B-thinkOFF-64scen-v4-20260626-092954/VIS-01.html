<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            generateStars();
        });

        // Generate starfield
        const stars = [];
        function generateStars() {
            stars.length = 0;
            for (let i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }
        generateStars();

        // Sun
        const sun = {
            x: width / 2,
            y: height / 2,
            radius: 30,
            color: '#FFD700',
            glowColor: '#FF8C00'
        };

        // Planets
        const planets = [
            {
                name: 'Mercury',
                radius: 4,
                orbitRadius: 60,
                speed: 0.04,
                angle: Math.random() * Math.PI * 2,
                color: '#A9A9A9'
            },
            {
                name: 'Venus',
                radius: 7,
                orbitRadius: 90,
                speed: 0.025,
                angle: Math.random() * Math.PI * 2,
                color: '#FFC649'
            },
            {
                name: 'Earth',
                radius: 8,
                orbitRadius: 130,
                speed: 0.02,
                angle: Math.random() * Math.PI * 2,
                color: '#4B9CD3'
            },
            {
                name: 'Mars',
                radius: 6,
                orbitRadius: 170,
                speed: 0.016,
                angle: Math.random() * Math.PI * 2,
                color: '#FF6347'
            },
            {
                name: 'Jupiter',
                radius: 18,
                orbitRadius: 230,
                speed: 0.008,
                angle: Math.random() * Math.PI * 2,
                color: '#D2691E'
            },
            {
                name: 'Saturn',
                radius: 15,
                orbitRadius: 300,
                speed: 0.006,
                angle: Math.random() * Math.PI * 2,
                color: '#F4A460',
                hasRings: true
            }
        ];

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Glow effect
            const gradient = ctx.createRadialGradient(sun.x, sun.y, sun.radius * 0.5, sun.x, sun.y, sun.radius * 3);
            gradient.addColorStop(0, sun.color);
            gradient.addColorStop(0.5, sun.glowColor);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius * 3, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Sun body
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius, 0, Math.PI * 2);
            ctx.fillStyle = sun.color;
            ctx.fill();
        }

        function drawOrbits() {
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(sun.x, sun.y, planet.orbitRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });
        }

        function drawPlanets() {
            planets.forEach(planet => {
                const x = sun.x + Math.cos(planet.angle) * planet.orbitRadius;
                const y = sun.y + Math.sin(planet.angle) * planet.orbitRadius;

                // Draw planet
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();

                // Draw Saturn's rings
                if (planet.hasRings) {
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.5, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(244, 164, 96, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        function updatePlanets() {
            planets.forEach(planet => {
                planet.angle += planet.speed;
            });
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();
            drawOrbits();
            drawPlanets();
            updatePlanets();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
