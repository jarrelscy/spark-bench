<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystemCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarSystemCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas dimensions to fill the window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Solar System Setup ---

        // Constants
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const sunRadius = 20;
        const planets = [
            // { name, radius, color, orbitalPeriod (time for one full orbit in seconds), speed (angle/sec) }
            { name: "Mercury", radius: 50, color: "#A9A9A9", orbitalPeriod: 60, speed: 0.05 }, // Faster orbit
            { name: "Venus", radius: 80, color: "#FFD700", orbitalPeriod: 100, speed: 0.03 },
            { name: "Earth", radius: 120, color: "#1E90FF", orbitalPeriod: 150, speed: 0.02 },
            { name: "Mars", radius: 160, color: "#FF4500", orbitalPeriod: 200, speed: 0.015 },
            { name: "Jupiter", radius: 220, color: "#FFA500", orbitalPeriod: 300, speed: 0.01 },
            { name: "Saturn", radius: 280, color: "#DAA520", orbitalPeriod: 450, speed: 0.008 } // Slower orbit
        ];

        let planetsData = planets.map(p => ({
            ...p,
            angle: Math.random() * Math.PI * 2, // Start at a random position
            orbitRadius: p.radius,
            color: p.color
        }));

        // --- Drawing Functions ---

        function drawStarfield() {
            // Draw a subtle dark background and some random stars
            ctx.fillStyle = 'rgba(0, 0, 10, 1)'; // Very dark blue/black
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 1.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                ctx.fillRect(x, y, size, size);
            }
        }

        function drawSun() {
            const sun = planetsData[0];
            // Draw the Sun (glowing effect)
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, sun.radius * 3
            );
            gradient.addColorStop(0, 'rgba(255, 255, 150, 1)'); // Bright center
            gradient.addColorStop(0.5, 'rgba(255, 165, 0, 0.8)'); // Orange glow
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Fades to transparent

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius * 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw the Sun core
            ctx.fillStyle = '#FFFF88';
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlanet(planet) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = planet.color;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for next draw
        }

        // --- Animation Loop ---

        function animate() {
            // 1. Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Draw background
            drawStarfield();

            // 3. Update positions and Draw
            planetsData.forEach(planet => {
                // Calculate new angle based on speed (orbital motion)
                planet.angle += planet.speed;

                // Calculate x and y coordinates based on polar to Cartesian conversion
                const x = centerX + planet.orbitRadius * Math.cos(planet.angle);
                const y = centerY + planet.orbitRadius * Math.sin(planet.angle);

                // Draw the planet
                drawPlanet(planet);
            });

            // 4. Draw the Sun last so it sits on top
            drawSun();

            // Request next frame
            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();

    </script>
</body>
</html>
