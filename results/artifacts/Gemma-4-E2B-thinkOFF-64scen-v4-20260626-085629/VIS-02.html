<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- Galaxy Parameters ---
        const numStars = 500;
        const coreRadius = Math.min(width, height) * 0.1;
        const coreX = width / 2;
        const coreY = height / 2;
        const coreSize = 3;

        let stars = [];
        const starColorVariation = 360; // Color hue variation range
        const twinkleFactor = 0.1; // How much the brightness fluctuates

        // --- Star Object Definition ---
        class Star {
            constructor(x, y, distance, speed, colorHue) {
                this.x = x;
                this.y = y;
                this.distance = distance; // Distance from the core
                this.speed = speed;       // Angular velocity
                this.angle = Math.random() * Math.PI * 2; // Initial angle
                this.radius = Math.random() * 100; // Size variation
                this.colorHue = colorHue + (Math.random() - 0.5) * starColorVariation;
                this.brightness = Math.random() * 0.5 + 0.5; // Base brightness
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
            }

            update() {
                // Spiral movement: distance from core increases over time, speed is constant
                this.distance += this.speed * 0.01;
                
                // Calculate position on the spiral path
                const angle = this.angle + (this.distance * 0.005); // Spiral effect
                this.x = coreX + this.distance * Math.cos(angle);
                this.y = coreY + this.distance * Math.sin(angle);

                // Twinkle effect (subtle brightness fluctuation)
                this.brightness = Math.max(0.1, Math.min(1.0, this.brightness + Math.sin(Date.now() * this.twinkleSpeed) * twinkleFactor));
            }

            draw() {
                const radius = this.radius * (1 + Math.sin(Date.now() * 0.005 + this.angle * 5) * 0.2); // Pulsing size

                // Calculate color based on hue and brightness
                const hue = this.colorHue % 360;
                const saturation = 80;
                const lightness = 50 + this.brightness * 30; // Lightness modulated by brightness

                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                
                // Create a color string with dynamic brightness adjustment
                ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                ctx.globalAlpha = this.brightness; // Use alpha for twinkling effect
                ctx.fill();
                ctx.globalAlpha = 1.0; // Reset global alpha
            }
        }

        // --- Initialization ---
        function initStars() {
            for (let i = 0; i < numStars; i++) {
                // Distribute stars somewhat evenly across the spiral region
                const distance = Math.random() * (width / 2);
                const speed = Math.random() * 0.5 + 0.5; // Varying speed
                const colorHue = Math.random() * 360;
                
                // Initial angle spread
                const initialAngle = Math.random() * Math.PI * 2;

                stars.push(new Star(
                    coreX, coreY, 0, speed, colorHue
                ));
                // Set initial angle for the spiral effect
                stars[i].angle = initialAngle;
            }
        }

        // --- Animation Loop ---
        function animate() {
            // 1. Clear the canvas (Black background)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slight trail effect for a cosmic feel
            ctx.fillRect(0, 0, width, height);

            // 2. Draw the Core (Bright center)
            const gradient = ctx.createRadialGradient(coreX, coreY, coreSize, coreX, coreY, coreRadius * 2);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.5, 'rgba(255, 165, 0, 0.5)'); // Orange glow
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(coreX, coreY, coreRadius * 2, 0, Math.PI * 2);
            ctx.fill();


            // 3. Update and Draw Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        // --- Handle Resizing ---
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Re-center core if necessary, though for this setup, keeping core centered is fine.
        });

        // --- Start Application ---
        initStars();
        animate();

    </script>
</body>
</html>
