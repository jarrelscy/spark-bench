<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const planets = [];

        const planetData = [
            { name: "Mercury", color: "#A5A5A5", dist: 60, radius: 4, speed: 0.04 },
            { name: "Venus", color: "#E3BB76", dist: 90, radius: 7, speed: 0.015 },
            { name: "Earth", color: "#2271B3", dist: 130, radius: 7.5, speed: 0.01 },
            { name: "Mars", color: "#E27B58", dist: 170, radius: 5, speed: 0.008 },
            { name: "Jupiter", color: "#D39C7E", dist: 230, radius: 18, speed: 0.004 },
            { name: "Saturn", color: "#C5AB6E", dist: 290, radius: 15, speed: 0.002 }
        ];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;

            // Generate random starfield
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }

            // Initialize planets with starting angles
            planets.length = 0;
            planetData.forEach(data => {
                planets.push({
                    ...data,
                    angle: Math.random() * Math.PI * 2
                });
            });
        }

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            ctx.save();
            ctx.beginPath();
            const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 30);
            gradient.addColorStop(0, "#FFF5F2");
            gradient.addColorStop(0.2, "#FFD200");
            gradient.addColorStop(0.5, "#F7941E");
            gradient.addColorStop(1, "transparent");
            
            ctx.fillStyle = gradient;
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawPlanets() {
            planets.forEach(p => {
                // Draw Orbit Path
                ctx.beginPath();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
                ctx.lineWidth = 1;
                ctx.arc(centerX, centerY, p.dist, 0, Math.PI * 2);
                ctx.stroke();

                // Calculate Position
                const x = centerX + Math.cos(p.angle) * p.dist;
                const y = centerY + Math.sin(p.angle) * p.dist;

                // Draw Planet
                ctx.beginPath();
                ctx.fillStyle = p.color;
                ctx.arc(x, y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Add a small highlight to the planet for 3D effect
                ctx.beginPath();
                ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
                ctx.arc(x - p.radius*0.3, y - p.radius*0.3, p.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Update Angle
                p.angle += p.speed;
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawStars();
            drawSun();
            drawPlanets();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);

        init();
        animate();
    </script>
</body>
</html>
