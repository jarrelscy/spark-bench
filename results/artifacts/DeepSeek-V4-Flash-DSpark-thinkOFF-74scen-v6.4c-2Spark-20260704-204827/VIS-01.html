<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('solarCanvas');
            const ctx = canvas.getContext('2d');

            let W, H, cx, cy, scale;

            // ─── Starfield ───────────────────────────────────────────────
            const STAR_COUNT = 600;
            let stars = [];

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random(),
                        y: Math.random(),
                        r: 0.3 + Math.random() * 1.7,
                        brightness: 0.3 + Math.random() * 0.7,
                        twinkleSpeed: 0.5 + Math.random() * 2.0,
                        twinkleOffset: Math.random() * Math.PI * 2
                    });
                }
            }
            initStars();

            // ─── Planet Data ─────────────────────────────────────────────
            const planets = [{
                name: 'Mercury',
                orbitFrac: 0.14,
                speed: 0.032,
                angle: Math.random() * Math.PI * 2,
                color: '#b5b5b5',
                size: 3.5,
                glow: 'rgba(180,180,180,0.3)'
            }, {
                name: 'Venus',
                orbitFrac: 0.22,
                speed: 0.024,
                angle: Math.random() * Math.PI * 2,
                color: '#e8cda0',
                size: 5.5,
                glow: 'rgba(232,205,160,0.3)'
            }, {
                name: 'Earth',
                orbitFrac: 0.31,
                speed: 0.020,
                angle: Math.random() * Math.PI * 2,
                color: '#4b8bbe',
                size: 6.0,
                glow: 'rgba(75,139,190,0.3)'
            }, {
                name: 'Mars',
                orbitFrac: 0.40,
                speed: 0.016,
                angle: Math.random() * Math.PI * 2,
                color: '#c1440e',
                size: 4.5,
                glow: 'rgba(193,68,14,0.3)'
            }, {
                name: 'Jupiter',
                orbitFrac: 0.52,
                speed: 0.010,
                angle: Math.random() * Math.PI * 2,
                color: '#d4a574',
                size: 11.0,
                glow: 'rgba(212,165,116,0.3)'
            }, {
                name: 'Saturn',
                orbitFrac: 0.64,
                speed: 0.007,
                angle: Math.random() * Math.PI * 2,
                color: '#ead6b8',
                size: 9.0,
                glow: 'rgba(234,214,184,0.3)',
                rings: true
            }, {
                name: 'Uranus',
                orbitFrac: 0.76,
                speed: 0.005,
                angle: Math.random() * Math.PI * 2,
                color: '#7ec8e3',
                size: 7.0,
                glow: 'rgba(126,200,227,0.3)'
            }, {
                name: 'Neptune',
                orbitFrac: 0.88,
                speed: 0.0035,
                angle: Math.random() * Math.PI * 2,
                color: '#3b4fbd',
                size: 6.5,
                glow: 'rgba(59,79,189,0.3)'
            }];

            // ─── Resize ──────────────────────────────────────────────────
            function resize() {
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                W = canvas.width = rect.width * dpr;
                H = canvas.height = rect.height * dpr;
                cx = W / 2;
                cy = H / 2;
                scale = Math.min(W, H) * 0.44;
                ctx.scale(dpr, dpr);
                // Reset transform for consistent drawing
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
            }

            window.addEventListener('resize', resize);
            resize();

            // Re-init stars on resize to redistribute
            // But we want stars to be in fractional positions so they adapt
            // Actually stars are stored as fractions (0-1) so they auto-scale

            // ─── Drawing Helpers ────────────────────────────────────────

            function drawStarfield(time) {
                const w = canvas.width;
                const h = canvas.height;
                for (const star of stars) {
                    const sx = star.x * w;
                    const sy = star.y * h;
                    const twinkle = 0.6 + 0.4 * Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
                    const alpha = star.brightness * twinkle;
                    const r = star.r * (w / 1200);
                    ctx.beginPath();
                    ctx.arc(sx, sy, Math.max(0.5, r), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }
            }

            function drawSun(time) {
                const sunRadius = scale * 0.09;
                const glowRadius = sunRadius * 4.5;

                // Outer glow
                const grad1 = ctx.createRadialGradient(cx, cy, sunRadius * 0.2, cx, cy, glowRadius);
                grad1.addColorStop(0, 'rgba(255,220,100,0.6)');
                grad1.addColorStop(0.15, 'rgba(255,200,80,0.35)');
                grad1.addColorStop(0.35, 'rgba(255,160,40,0.12)');
                grad1.addColorStop(0.6, 'rgba(255,120,20,0.04)');
                grad1.addColorStop(1, 'rgba(255,80,0,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = grad1;
                ctx.fill();

                // Core glow
                const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunRadius * 1.8);
                grad2.addColorStop(0, 'rgba(255,255,255,1)');
                grad2.addColorStop(0.08, 'rgba(255,255,220,1)');
                grad2.addColorStop(0.2, 'rgba(255,240,180,0.95)');
                grad2.addColorStop(0.5, 'rgba(255,200,100,0.7)');
                grad2.addColorStop(0.8, 'rgba(255,160,60,0.3)');
                grad2.addColorStop(1, 'rgba(255,120,40,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius * 1.8, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();

                // Sharp sun disc
                const grad3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunRadius);
                grad3.addColorStop(0, '#fffbe6');
                grad3.addColorStop(0.3, '#ffe566');
                grad3.addColorStop(0.7, '#ffaa33');
                grad3.addColorStop(0.85, '#ff8800');
                grad3.addColorStop(1, '#cc5500');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius, 0, Math.PI * 2);
                ctx.fillStyle = grad3;
                ctx.fill();

                // Subtle corona shimmer
                const shimmer = 0.92 + 0.08 * Math.sin(time * 0.6);
                const grad4 = ctx.createRadialGradient(cx, cy, sunRadius * 0.5, cx, cy, sunRadius * 2.2);
                grad4.addColorStop(0, `rgba(255,220,150,${0.15 * shimmer})`);
                grad4.addColorStop(0.5, `rgba(255,180,80,${0.06 * shimmer})`);
                grad4.addColorStop(1, 'rgba(255,120,40,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = grad4;
                ctx.fill();
            }

            function drawOrbits() {
                const w = canvas.width;
                const h = canvas.height;
                for (const planet of planets) {
                    const orbitR = planet.orbitFrac * scale;
                    ctx.beginPath();
                    ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                    ctx.lineWidth = 0.8 * (w / 1200);
                    ctx.setLineDash([4, 8]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            function drawPlanet(planet, time) {
                const orbitR = planet.orbitFrac * scale;
                const px = cx + orbitR * Math.cos(planet.angle);
                const py = cy + orbitR * Math.sin(planet.angle);
                const size = planet.size * (scale / 500);

                // Planet glow
                const glowR = size * 3.5;
                const grad = ctx.createRadialGradient(px, py, size * 0.2, px, py, glowR);
                grad.addColorStop(0, planet.glow);
                grad.addColorStop(0.4, planet.glow.replace('0.3', '0.08'));
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.beginPath();
                ctx.arc(px, py, glowR, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Saturn rings
                if (planet.rings) {
                    const ringW = size * 2.6;
                    const ringH = size * 0.6;
                    const tilt = 0.35;
                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(planet.angle + 0.3);
                    ctx.scale(1, tilt);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringW, ringH, 0, 0, Math.PI * 2);
                    const ringGrad = ctx.createRadialGradient(0, 0, size * 0.7, 0, 0, ringW);
                    ringGrad.addColorStop(0, 'rgba(210,190,160,0.1)');
                    ringGrad.addColorStop(0.2, 'rgba(210,190,160,0.5)');
                    ringGrad.addColorStop(0.35, 'rgba(180,160,130,0.7)');
                    ringGrad.addColorStop(0.5, 'rgba(210,190,160,0.3)');
                    ringGrad.addColorStop(0.65, 'rgba(180,160,130,0.6)');
                    ringGrad.addColorStop(0.8, 'rgba(210,190,160,0.3)');
                    ringGrad.addColorStop(1, 'rgba(210,190,160,0.05)');
                    ctx.fillStyle = ringGrad;
                    ctx.fill();
                    ctx.restore();
                }

                // Planet body
                const bodyGrad = ctx.createRadialGradient(
                    px - size * 0.3, py - size * 0.3, size * 0.1,
                    px, py, size
                );
                const col = planet.color;
                bodyGrad.addColorStop(0, lightenColor(col, 40));
                bodyGrad.addColorStop(0.5, col);
                bodyGrad.addColorStop(1, darkenColor(col, 40));
                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fillStyle = bodyGrad;
                ctx.fill();

                // Specular highlight
                ctx.beginPath();
                ctx.arc(px - size * 0.25, py - size * 0.25, size * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fill();

                // Name label
                const w = canvas.width;
                const labelSize = Math.max(9, Math.min(13, 13 * (w / 1200)));
                ctx.font = `${labelSize}px "Segoe UI", Arial, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.fillText(planet.name, px, py + size + 5);
            }

            // ─── Color Helpers ───────────────────────────────────────────
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 200, g: 200, b: 200 };
            }

            function lightenColor(hex, amt) {
                const { r, g, b } = hexToRgb(hex);
                const nr = Math.min(255, r + amt);
                const ng = Math.min(255, g + amt);
                const nb = Math.min(255, b + amt);
                return `rgb(${nr},${ng},${nb})`;
            }

            function darkenColor(hex, amt) {
                const { r, g, b } = hexToRgb(hex);
                const nr = Math.max(0, r - amt);
                const ng = Math.max(0, g - amt);
                const nb = Math.max(0, b - amt);
                return `rgb(${nr},${ng},${nb})`;
            }

            // ─── Animation Loop ──────────────────────────────────────────
            let lastTime = 0;
            let elapsed = 0;

            function animate(timestamp) {
                const dt = lastTime ? Math.min((timestamp - lastTime) / 1000, 0.05) : 0.016;
                lastTime = timestamp;
                elapsed += dt;

                const w = canvas.width;
                const h = canvas.height;

                // Clear
                ctx.clearRect(0, 0, w, h);

                // Background solid
                ctx.fillStyle = '#05080f';
                ctx.fillRect(0, 0, w, h);

                // Starfield
                drawStarfield(elapsed);

                // Orbits
                drawOrbits();

                // Sun
                drawSun(elapsed);

                // Update & draw planets
                for (const planet of planets) {
                    planet.angle += planet.speed * dt * 1.2;
                    drawPlanet(planet, elapsed);
                }

                // Subtle vignette
                const vigGrad = ctx.createRadialGradient(cx, cy, scale * 0.5, cx, cy, scale * 1.2);
                vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
                vigGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
                ctx.fillStyle = vigGrad;
                ctx.fillRect(0, 0, w, h);

                requestAnimationFrame(animate);
            }

            // Handle resize for star repositioning
            // Stars use fractional coords so they auto-adapt

            requestAnimationFrame(animate);

            // ─── Keyboard shortcut: reset view ──────────────────────────
            // (no-op, but nice to have)

            console.log('🌌 Solar System Animation running!');
        })();
    </script>
</body>
</html>
