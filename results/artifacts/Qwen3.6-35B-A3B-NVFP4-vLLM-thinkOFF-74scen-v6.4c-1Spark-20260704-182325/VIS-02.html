<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1500;
        const ARM_COUNT = 3;
        const GALAXY_RADIUS = 300;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle for spiral arm placement
                this.angle = Math.random() * Math.PI * 2;
                
                // Distance from center (weighted towards center)
                this.distance = Math.random() * GALAXY_RADIUS;
                
                // Spread perpendicular to the arm to create thickness
                this.spread = (Math.random() - 0.5) * (this.distance * 0.3 + 20);
                
                // Angular offset to create the spiral effect
                // The further out, the more the angle shifts
                this.spiralOffset = this.distance * 0.01;
                
                // Rotation speed (inner stars move faster)
                this.speed = (0.002 + Math.random() * 0.002) / (this.distance * 0.005 + 0.5);
                
                // Size
                this.size = Math.random() * 1.5 + 0.5;
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color variation: Blue-ish for outer, Yellow/White for inner
                const colorChoice = Math.random();
                if (colorChoice < 0.6) {
                    // White/Yellow (older stars, more common)
                    this.r = 255;
                    this.g = 240 + Math.random() * 15;
                    this.b = 200 + Math.random() * 55;
                } else if (colorChoice < 0.85) {
                    // Blue (young, hot stars)
                    this.r = 150 + Math.random() * 105;
                    this.g = 180 + Math.random() * 75;
                    this.b = 255;
                } else {
                    // Reddish/Orange (very old or specific types)
                    this.r = 255;
                    this.g = 150 + Math.random() * 100;
                    this.b = 100 + Math.random() * 50;
                }
                
                // Brightness base
                this.brightness = 0.5 + Math.random() * 0.5;
            }

            update(time) {
                this.angle += this.speed * 0.1;
                
                // Calculate current position based on spiral arm
                const currentAngle = this.angle + this.spiralOffset;
                
                // Apply spiral arm logic: 
                // We use a sine wave to create the "arms" density
                const armIndex = Math.floor(this.angle / (Math.PI * 2 / ARM_COUNT));
                const armAngle = (armIndex * (Math.PI * 2 / ARM_COUNT)) + this.spiralOffset;
                
                // Distance from the ideal arm center
                const distFromArm = Math.abs((this.angle - armAngle) % (Math.PI * 2 / ARM_COUNT));
                
                // If star is far from any arm, move it closer or remove it (simplified: just position it)
                // For this simulation, we'll just place them in the spiral
                
                const x = centerX + Math.cos(currentAngle) * this.distance;
                const y = centerY + Math.sin(currentAngle) * this.distance;
                
                // Twinkle effect
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                this.currentBrightness = this.brightness * (0.7 + 0.3 * twinkle);
                
                this.x = x;
                this.y = y;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.floor(this.r)}, ${Math.floor(this.g)}, ${Math.floor(this.b)}, ${this.currentBrightness})`;
                ctx.fill();
            }
        }

        // Initialize stars
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        function drawCore(time) {
            // Core glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 80);
            gradient.addColorStop(0, 'rgba(255, 250, 240, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 230, 200, 0.8)');
            gradient.addColorStop(0.5, 'rgba(200, 180, 150, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
            ctx.fill();
            
            // Core stars (dense cluster)
            for (let i = 0; i < 100; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 30;
                const x = centerX + Math.cos(angle) * dist;
                const y = centerY + Math.sin(angle) * dist;
                
                const twinkle = Math.sin(time * 0.05 + Math.random() * 10);
                const brightness = 0.8 + 0.2 * twinkle;
                
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 1.2, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 245, 230, ${brightness})`;
                ctx.fill();
            }
        }

        function animate(time) {
            // Clear canvas with slight fade for motion blur effect (optional, but clean clear is better for stars)
            ctx.clearRect(0, 0, width, height);
            
            // Draw background stars (static, faint)
            // For performance, we'll just draw the galaxy stars
            
            // Draw core first (behind stars)
            drawCore(time);
            
            // Update and draw galaxy stars
            stars.forEach(star => {
                star.update(time);
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
