<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* Deep space black */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Starfield data
    const stars = [];
    const numStars = 400;

    function initStars() {
        stars.length = 0;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }
    initStars();
    // Re-init stars on resize to fill screen
    window.addEventListener('resize', initStars);

    // Planet Configuration
    // Distances and sizes are scaled for visual appeal, not scientific accuracy
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6F2", radius: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#FF5733", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D9A066", radius: 18, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#EAD6B8", radius: 15, distance: 320, speed: 0.002, angle: Math.random() * Math.PI * 2, hasRing: true }
    ];

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Sun Glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
        gradient.addColorStop(0, "rgba(255, 200, 50, 1)");
        gradient.addColorStop(0.2, "rgba(255, 160, 0, 0.8)");
        gradient.addColorStop(0.5, "rgba(255, 100, 0, 0.3)");
        gradient.addColorStop(1, "rgba(255, 50, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Sun Core
        ctx.fillStyle = "#FFD700";
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#FFA500";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0; // Reset shadow
    }

    function drawPlanets() {
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path (faint line)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Planet Shadow (simple shading effect)
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, planet.angle + Math.PI/2, planet.angle + Math.PI * 1.5);
            ctx.fill();

            // Draw Saturn's Ring
            if (planet.hasRing) {
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                // Draw an ellipse for the ring
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });
    }

    function animate() {
        // Clear screen
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Start animation loop
    animate();

</script>
</body>
</html>
