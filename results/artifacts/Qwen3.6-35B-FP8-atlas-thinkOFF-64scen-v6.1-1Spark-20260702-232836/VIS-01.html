<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        window.addEventListener('resize', resize);

        // Starfield
        let stars = [];
        function generateStars() {
            stars = [];
            for (let i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random()
                });
            }
        }

        // Planet Data
        // Distances and sizes are scaled for visual representation, not realism
        const planets = [
            { name: "Mercury", radius: 6, orbitRadius: 60, speed: 0.02, color: "#A5A5A5", angle: Math.random() * Math.PI * 2 },
            { name: "Venus", radius: 10, orbitRadius: 90, speed: 0.015, color: "#E3BB76", angle: Math.random() * Math.PI * 2 },
            { name: "Earth", radius: 11, orbitRadius: 130, speed: 0.01, color: "#22A6F2", angle: Math.random() * Math.PI * 2 },
            { name: "Mars", radius: 8, orbitRadius: 170, speed: 0.008, color: "#FF5733", angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", radius: 24, orbitRadius: 240, speed: 0.005, color: "#D9A066", angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", radius: 20, orbitRadius: 310, speed: 0.003, color: "#EAD6B8", hasRings: true, angle: Math.random() * Math.PI * 2 },
            { name: "Uranus", radius: 15, orbitRadius: 370, speed: 0.002, color: "#A7DCD6", angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", radius: 14, orbitRadius: 420, speed: 0.001, color: "#4b70dd", angle: Math.random() * Math.PI * 2 }
        ];

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer Glow
            ctx.beginPath();
            ctx.arc(centerX, centerY, 45, 0, Math.PI * 2);
            let sunGradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
            sunGradient.addColorStop(0, "rgba(255, 255, 200, 1)");
            sunGradient.addColorStop(0.2, "rgba(255, 200, 0, 1)");
            sunGradient.addColorStop(0.5, "rgba(255, 100, 0, 0.6)");
            sunGradient.addColorStop(1, "rgba(255, 50, 0, 0)");
            ctx.fillStyle = sunGradient;
            ctx.fill();

            // Core
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
        }

        function drawPlanet(planet) {
            // Calculate position
            planet.x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            planet.y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Draw Orbit Path
            ctx.beginPath((centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.stroke();

            // Draw Planet
            ctx.beginPath();
            ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
            
            // Create a simple 3D shading effect for the planet
            let grad = ctx.createRadialGradient(
                planet.x - planet.radius * 0.3, 
                planet.y - planet.radius * 0.3, 
                planet.radius * 0.1, 
                planet.x, 
                planet.y, 
                planet.radius
            );
            grad.addColorStop(0, lightenColor(planet.color, 50));
            grad.addColorStop(1, planet.color);
            ctx.fillStyle = grad;
            ctx.fill();

            // Draw Saturn's Rings
            if (planet.hasRings) {
                ctx.beginPath();
                ctx.ellipse(planet.x, planet.y, planet.radius * 2.2, planet.radius * 0.6, planet.angle + Math.PI / 4, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        // Helper to lighten hex colors
        function lightenColor(color, percent) {
            let num = parseInt(color.replace("#",""),16),
            amt = Math.round(2.55 * percent),
            R = (num >> 16) + amt,
            B = (num >> 8 & 0x00FF) + amt,
            G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; // Trail effect for stars? No, just clear for clean look
            ctx.clearRect(0, 0, width, height);
            
            drawStars();
            drawSun();

            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        resize();
        animate();

    </script>
</body>
</html>
