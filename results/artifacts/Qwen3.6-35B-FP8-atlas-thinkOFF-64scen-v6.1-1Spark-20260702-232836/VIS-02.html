<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        
        // Configuration
        const STAR_COUNT = 800;
        const ARM_COUNT = 3;
        const CORE_RADIUS = 20;
        const GALAXY_RADIUS = 400;
        const ROTATION_SPEED = 0.0005;
        const TWINKLE_SPEED = 0.05;

        let stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            // Re-scale galaxy radius based on screen size
            GALAXY_RADIUS = Math.min(width, height) * 0.45;
        }

        class Star {
            constructor(armIndex, totalArms) {
                this.reset(armIndex, totalArms);
            }

            reset(armIndex, totalArms) {
                // Distance from center
                this.distance = Math.random() * GALAXY_RADIUS;
                
                // Base angle based on spiral arm
                const armAngle = (armIndex / totalArms) * Math.PI * 2;
                
                // Add some randomness to the angle to spread the arms
                // The further out, the more spread (spiral effect)
                const spiralTightness = 0.005; 
                const spiralAngle = this.distance * spiralTightness;
                
                // Gaussian-ish distribution for density (more stars near center/arm path)
                const randomness = (Math.random() - 0.5) * (2 + this.distance * 0.01);
                
                this.angle = armAngle + spiralAngle + randomness;
                
                // Orbital speed: closer stars move faster (Keplerian-ish)
                // Using a simplified power law
                const minSpeed = 0.0002;
                const maxSpeed = 0.005;
                // Inverse square root of distance for rotation speed
                const speedFactor = Math.pow(this.distance + 1, -0.5);
                this.speed = minSpeed + (maxSpeed - minSpeed) * speedFactor;
                
                // Size
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color variation
                // 0.0 = Blue/White (hot, young, often outer arms)
                // 0.5 = Yellow/White (middle)
                // 1.0 = Red/Orange (older, core)
                const colorTendency = this.distance / GALAXY_RADIUS;
                this.hue = (Math.random() * 0.1 + 0.6) + (colorTendency * 0.3); // 0.6 (blue) to 0.9 (red)
                this.saturation = 0.5 + Math.random() * 0.5;
                this.lightness = 70 + Math.random() * 30;
                
                // Twinkle
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.twinkleSpeed = 0.02 + Math.random() * 0.05;
            }

            update(time) {
                // Update position
                this.angle += this.speed;
                
                // Update twinkle
                this.twinklePhase += this.twinkleSpeed;
            }

            draw(ctx) {
                // Calculate current x, y
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;

                // Calculate twinkle alpha
                const twinkle = 0.5 + 0.5 * Math.sin(this.twinklePhase);
                const alpha = 0.3 + 0.7 * twinkle;

                // Draw star
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue * 360}, ${this.saturation * 100}%, ${this.lightness}%, ${alpha})`;
                ctx.fill();
            }
        }

        function init() {
            resize();
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                const armIndex = Math.floor(Math.random() * ARM_COUNT);
                stars.push(new Star(armIndex, ARM_COUNT));
            }
        }

        function drawCore() {
            // Draw a bright, glowing core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_RADIUS * 2);
            gradient.addColorStop(0, 'rgba(255, 255, 240, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 240, 200, 0.8)');
            gradient.addColorStop(0.5, 'rgba(200, 180, 150, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_RADIUS * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Clear canvas with a very slight fade for potential trails (optional, but keeping it clean here)
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);

            // Draw core
            drawCore();

            // Update and draw stars
            for (const star of stars) {
                star.update();
                star.draw(ctx);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            // Re-initialize stars to fit new size
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
