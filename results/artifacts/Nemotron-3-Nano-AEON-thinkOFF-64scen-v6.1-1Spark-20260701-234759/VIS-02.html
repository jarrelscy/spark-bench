<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width = window.innerWidth;
        const height = canvas.height = window.innerHeight;

        const coreRadius = 30;
        const coreColor = 'yellow';

        const starsCount = 200;
        const stars = [];

        for (let i = 0; i < starsCount; i++) {
            const radius = Math.random() * (width/2 - coreRadius) + coreRadius;
            const angle = Math.random() * Math.PI * 2;
            const x = width/2 + Math.cos(angle) * radius;
            const y = height/2 + Math.sin(angle) * radius;
            const size = Math.random() * 2 + 1;
            const speed = Math.random() * 0.01 + 0.005;
            const color = `hsl(${Math.random()*100+50}, 70%, ${Math.random()*30+30}%)`;
            stars.push({x, y, size, speed, color});
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = coreColor;
            ctx.beginPath();
            ctx.arc(width/2, height/2, coreRadius, 0, Math.PI*2);
            ctx.fill();

            stars.forEach(star => {
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
                ctx.fill();

                // twinkle
                if (Math.random() < 0.02) {
                    ctx.fillStyle = 'white';
                    ctx.fillText('*', star.x, star.y);
                }

                // rotate around core
                const angleOffset = Math.atan2(star.y - height/2, star.x - width/2);
                const rotAngle = (angleOffset + (Math.random()*2-1)) * star.speed;
                const newAngle = Math.atan2(star.y, star.x);
                const newX = width/2 + Math.cos(newAngle) * star.size * 2;
                const newY = height/2 + Math.sin(newAngle) * star.size * 2;
                star.x = newX;
                star.y = newY;
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
