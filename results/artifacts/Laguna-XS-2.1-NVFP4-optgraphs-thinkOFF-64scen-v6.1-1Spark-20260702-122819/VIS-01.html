<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #444;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = window.innerWidth * 0.9;
        canvas.height = window.innerHeight * 0.9;
        
        // Center of the canvas
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        
        // Array to store stars
        const stars = [];
        const numStars = 200;
        
        // Create stars
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2,
                brightness: Math.random()
            });
        }
        
        // Planets configuration
        const planets = [
            { name: 'Mercury', radius: 60, color: '#A9A9A9', speed: 0.02 },
            { name: 'Venus', radius: 100, color: '#FFA500', speed: 0.015 },
            { name: 'Earth', radius: 140, color: '#4169E1', speed: 0.01 },
            { name: 'Mars', radius: 180, color: '#CD5C5C', speed: 0.008 },
            { name: 'Jupiter', radius: 230, color: '#DEB887', speed: 0.006 },
            { name: 'Saturn', radius: 280, color: '#F4A460', speed: 0.005 }
        ];
        
        // Add orbit angles to planets
        planets.forEach(planet => {
            planet.angle = Math.random() * Math.PI * 2;
        });
        
        // Animation loop
        function animate() {
            // Clear canvas with semi-transparent black for trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.brightness;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Draw sun
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'yellow');
            gradient.addColorStop(0.5, 'orange');
            gradient.addColorStop(1, 'red');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fill();
            
            // Add glow to sun
            const sunGlow = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, 150);
            sunGlow.addColorStop(0, 'rgba(255, 255, 0, 0.8)');
            sunGlow.addColorStop(0.3, 'rgba(255, 165, 0, 0.4)');
            sunGlow.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw planets
            planets.forEach(planet => {
                // Update planet position
                planet.angle += planet.speed;
                
                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.radius;
                const y = centerY + Math.sin(planet.angle) * planet.radius;
                
                // Draw orbit path
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Draw planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fill();
                
                // Add glow to planet
                const planetGlow = ctx.createRadialGradient(x, y, 5, x, y, 20);
                planetGlow.addColorStop(0, planet.color);
                planetGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = planetGlow;
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // Start animation
        animate();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth * 0.9;
            canvas.height = window.innerHeight * 0.9;
        });
        
        // Use requestAnimationFrame for smooth animation
        function loop() {
            animate();
            requestAnimationFrame(loop);
        }
        
        loop();
    </script>
</body>
</html>
