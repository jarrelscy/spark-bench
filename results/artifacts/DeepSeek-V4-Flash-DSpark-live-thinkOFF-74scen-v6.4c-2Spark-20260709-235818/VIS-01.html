<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let width, height, centerX, centerY, scale;

            // Planet data: name, base size (px), base orbit radius (px), angular speed (rad/s), color, hasRing
            const PLANET_DATA = [{
                name: 'Mercury',
                size: 4,
                orbit: 60,
                speed: 2.8,
                color: '#b5b5b5'
            }, {
                name: 'Venus',
                size: 7,
                orbit: 90,
                speed: 2.0,
                color: '#e8cda0'
            }, {
                name: 'Earth',
                size: 8,
                orbit: 125,
                speed: 1.6,
                color: '#4b8bbe'
            }, {
                name: 'Mars',
                size: 5.5,
                orbit: 160,
                speed: 1.3,
                color: '#c1440e'
            }, {
                name: 'Jupiter',
                size: 16,
                orbit: 210,
                speed: 0.85,
                color: '#d4a574'
            }, {
                name: 'Saturn',
                size: 13,
                orbit: 265,
                speed: 0.55,
                color: '#ead6b8',
                hasRing: true
            }];

            // Stars
            let stars = [];

            // Time tracking
            let startTime = performance.now();

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                centerX = width / 2;
                centerY = height / 2;

                // Scale factor: use 42% of the smaller dimension as max orbit
                const maxBaseOrbit = PLANET_DATA[PLANET_DATA.length - 1].orbit;
                const maxAllowed = Math.min(width, height) * 0.42;
                scale = maxAllowed / maxBaseOrbit;

                // Regenerate stars for new size
                generateStars();
            }

            function generateStars() {
                stars = [];
                const count = Math.min(400, Math.floor((width * height) / 4000));
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 2.2 + 0.3,
                        baseAlpha: Math.random() * 0.6 + 0.4,
                        twinkleSpeed: Math.random() * 1.8 + 0.4,
                        twinkleOffset: Math.random() * Math.PI * 2
                    });
                }
            }

            function drawStars(time) {
                for (const star of stars) {
                    const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;
                    const alpha = star.baseAlpha * twinkle;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                }
            }

            function drawOrbit(radius, time) {
                const r = radius * scale;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                ctx.lineWidth = 0.8;
                ctx.stroke();

                // Subtle glow on orbit path
                const grad = ctx.createRadialGradient(centerX, centerY, r - 2, centerX, centerY, r + 2);
                grad.addColorStop(0, 'rgba(255,255,255,0)');
                grad.addColorStop(0.5, 'rgba(255,255,255,0.02)');
                grad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            function drawSun(time) {
                // Outer glow layer 1 (large)
                const glowRadius1 = 80 * scale;
                const grad1 = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius1);
                grad1.addColorStop(0, 'rgba(255, 200, 50, 0.3)');
                grad1.addColorStop(0.3, 'rgba(255, 150, 20, 0.15)');
                grad1.addColorStop(0.6, 'rgba(255, 100, 0, 0.05)');
                grad1.addColorStop(1, 'rgba(255, 50, 0, 0)');
                ctx.beginPath();
                ctx.arc(centerX, centerY, glowRadius1, 0, Math.PI * 2);
                ctx.fillStyle = grad1;
                ctx.fill();

                // Outer glow layer 2 (medium)
                const glowRadius2 = 50 * scale;
                const grad2 = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius2);
                grad2.addColorStop(0, 'rgba(255, 220, 80, 0.5)');
                grad2.addColorStop(0.4, 'rgba(255, 180, 40, 0.25)');
                grad2.addColorStop(0.7, 'rgba(255, 120, 10, 0.08)');
                grad2.addColorStop(1, 'rgba(255, 60, 0, 0)');
                ctx.beginPath();
                ctx.arc(centerX, centerY, glowRadius2, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();

                // Inner glow
                const glowRadius3 = 30 * scale;
                const grad3 = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, glowRadius3);
                grad3.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
                grad3.addColorStop(0.3, 'rgba(255, 230, 100, 0.6)');
                grad3.addColorStop(0.6, 'rgba(255, 180, 50, 0.3)');
                grad3.addColorStop(1, 'rgba(255, 120, 20, 0)');
                ctx.beginPath();
                ctx.arc(centerX, centerY, glowRadius3, 0, Math.PI * 2);
                ctx.fillStyle = grad3;
                ctx.fill();

                // Sun body
                const sunRadius = 18 * scale;
                const pulse = 1 + Math.sin(time * 0.5) * 0.02;
                const r = sunRadius * pulse;
                const grad4 = ctx.createRadialGradient(
                    centerX - r * 0.25, centerY - r * 0.25, r * 0.05,
                    centerX, centerY, r
                );
                grad4.addColorStop(0, '#fffbe6');
                grad4.addColorStop(0.3, '#ffe44d');
                grad4.addColorStop(0.7, '#ffaa00');
                grad4.addColorStop(1, '#e06600');
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.fillStyle = grad4;
                ctx.fill();

                // Sun highlight
                const grad5 = ctx.createRadialGradient(
                    centerX - r * 0.3, centerY - r * 0.3, r * 0.02,
                    centerX - r * 0.2, centerY - r * 0.2, r * 0.5
                );
                grad5.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                grad5.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.fillStyle = grad5;
                ctx.fill();

                // Corona rays (subtle)
                ctx.save();
                ctx.translate(centerX, centerY);
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 + time * 0.02;
                    const len = r * (0.6 + Math.sin(time * 0.3 + i * 1.2) * 0.2);
                    const grad6 = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r + len);
                    grad6.addColorStop(0, 'rgba(255, 200, 100, 0)');
                    grad6.addColorStop(0.5, 'rgba(255, 180, 60, 0.06)');
                    grad6.addColorStop(1, 'rgba(255, 120, 20, 0)');
                    ctx.save();
                    ctx.rotate(angle);
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 0.8);
                    ctx.lineTo(4, -(r + len));
                    ctx.lineTo(-4, -(r + len));
                    ctx.closePath();
                    ctx.fillStyle = grad6;
                    ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            }

            function drawPlanet(planet, time) {
                const elapsed = (time - startTime) / 1000;
                const angle = planet.angle + elapsed * planet.speed;
                const orbitR = planet.orbit * scale;
                const size = planet.size * scale * (0.8 + 0.4 * (planet.orbit / 265));

                const x = centerX + Math.cos(angle) * orbitR;
                const y = centerY + Math.sin(angle) * orbitR;

                // Planet glow (subtle)
                const glowSize = size * 3;
                const gradGlow = ctx.createRadialGradient(x, y, size * 0.5, x, y, glowSize);
                const color = planet.color;
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                gradGlow.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.15)`);
                gradGlow.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                ctx.beginPath();
                ctx.arc(x, y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = gradGlow;
                ctx.fill();

                // Saturn rings
                if (planet.hasRing) {
                    const ringOuter = size * 2.2;
                    const ringInner = size * 1.3;
                    const tilt = 0.3;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(1, tilt);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringOuter, ringOuter, 0, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(210, 190, 160, 0.25)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(210, 190, 160, 0.15)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Inner ring
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringInner, ringInner, 0, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(180, 160, 130, 0.15)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(180, 160, 130, 0.1)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Ring gap
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringInner * 0.85, ringInner * 0.85, 0, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(0,0,0,0.15)';
                    ctx.fill();

                    ctx.restore();

                    // Draw planet body on top of rings
                    drawPlanetBody(x, y, size, planet.color);
                } else {
                    drawPlanetBody(x, y, size, planet.color);
                }

                // Small highlight
                const gradHighlight = ctx.createRadialGradient(
                    x - size * 0.3, y - size * 0.3, size * 0.02,
                    x - size * 0.2, y - size * 0.2, size * 0.6
                );
                gradHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
                gradHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = gradHighlight;
                ctx.fill();

                return { x, y, size, name: planet.name };
            }

            function drawPlanetBody(x, y, size, color) {
                const grad = ctx.createRadialGradient(
                    x - size * 0.25, y - size * 0.25, size * 0.05,
                    x, y, size
                );
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                const r2 = Math.min(255, r + 60);
                const g2 = Math.min(255, g + 60);
                const b2 = Math.min(255, b + 60);
                grad.addColorStop(0, `rgb(${r2}, ${g2}, ${b2})`);
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, `rgb(${Math.max(0, r - 40)}, ${Math.max(0, g - 40)}, ${Math.max(0, b - 40)})`);
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Subtle edge
                ctx.strokeStyle = `rgba(255, 255, 255, 0.05)`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }

            function drawLabels(planetPositions) {
                for (const p of planetPositions) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.font = `${Math.max(10, 11 * scale)}px Arial, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(p.name, p.x, p.y - p.size - 6);
                }
            }

            function animate() {
                const time = performance.now();

                // Clear with dark background
                ctx.fillStyle = '#05060a';
                ctx.fillRect(0, 0, width, height);

                // Draw stars
                drawStars(time / 1000);

                // Draw orbits
                for (const planet of PLANET_DATA) {
                    drawOrbit(planet.orbit, time / 1000);
                }

                // Draw Sun
                drawSun(time / 1000);

                // Draw planets and collect positions for labels
                const positions = [];
                for (const planet of PLANET_DATA) {
                    const pos = drawPlanet(planet, time);
                    positions.push(pos);
                }

                // Draw labels
                drawLabels(positions);

                requestAnimationFrame(animate);
            }

            // Handle resize
            window.addEventListener('resize', resize);

            // Initialize
            resize();
            startTime = performance.now();
            animate();

            // Handle visibility change to keep time consistent
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    startTime = performance.now() - ((performance.now() - startTime) % 1000);
                }
            });

        })();
    </script>
</body>
</html>
