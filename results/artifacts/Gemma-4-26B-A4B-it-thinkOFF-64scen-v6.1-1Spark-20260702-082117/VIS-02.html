<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 800;
        let angleOffset = 0;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;

            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                // Distance from center (radius)
                const radius = Math.random() * (Math.min(width, height) * 0.45);
                
                // Spiral math: angle is a function of radius
                // The "tightness" of the spiral is controlled by the multiplier
                const spiralTightness = 0.02; 
                const baseAngle = radius * spiralTightness;
                
                // Random offset for star placement within the arm
                const dispersion = (Math.random() - 0.5) * (radius * 0.3);
                const randomAngle = baseAngle + (Math.random() * 0.5) + dispersion;

                stars.push({
                    radius: radius,
                    angle: randomAngle,
                    size: Math.random() * 1.5 + 0.5,
                    // Subtle color variations: blues, purples, and whites
                    color: `hsla(${200 + Math.random() * 60}, ${70 + Math.random() * 30}%, ${70 + Math.random() * 30}%,`,
                    twinkleSpeed: 0.01 + Math.random() * 0.05,
                    twinklePhase: Math.random() * Math.PI * 2,
                    // Speed is faster near the center (Keplerian-ish)
                    rotationSpeed: (1 / (radius * 0.01 + 1)) * 0.005
                });
            }
        }

        function draw() {
            // Slight fade effect for motion blur/glow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 230, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 200, 100, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                // Update rotation
                star.angle += star.rotationSpeed;
                
                // Calculate position
                const x = centerX + Math.cos(star.angle) * star.radius;
                const y = centerY + Math.sin(star.angle) * star.radius;

                // Calculate twinkle (opacity oscillation)
                star.twinklePhase += star.twinkleSpeed;
                const opacity = 0.4 + Math.abs(Math.sin(star.twinklePhase)) * 0.6;

                // Draw star
                ctx.beginPath();
                ctx.arc(x, y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `${star.color} ${opacity})`;
                ctx.fill();

                // Add a tiny glow to larger stars
                if (star.size > 1.2) {
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = 'white';
                } else {
                    ctx.shadowBlur = 0;
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        init();
        draw();
    </script>
</body>
</html>
