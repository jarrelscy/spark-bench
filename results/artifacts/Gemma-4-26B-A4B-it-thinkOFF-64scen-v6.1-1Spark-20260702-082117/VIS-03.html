<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let rotation = 0;

        // Configuration
        const numNodes = 40;       // Number of pairs
        const helixRadius = 120;   // Radius of the spiral
        const verticalSpacing = 15; // Distance between nodes vertically
        const twistSpeed = 0.02;   // Speed of rotation
        const nodeSize = 4;        // Radius of the dots

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            // Clear background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            
            // Calculate total height of the helix to center it
            const totalHeight = numNodes * verticalSpacing;
            const startY = centerY - (totalHeight / 2);

            rotation += twistSpeed;

            for (let i = 0; i < numNodes; i++) {
                // Calculate vertical position
                const y = startY + (i * verticalSpacing);

                // Calculate angle for this specific node pair
                // Adding (i * constant) creates the spiral effect
                const angleOffset = i * 0.4; 
                const angle1 = rotation + angleOffset;
                const angle2 = rotation + angleOffset + Math.PI; // Opposite side

                // Calculate X positions using sine/cosine
                const x1 = centerX + Math.sin(angle1) * helixRadius;
                const x2 = centerX + Math.sin(angle2) * helixRadius;

                // 1. Draw the connecting rung (the horizontal bond)
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 2. Draw Strand 1 (Blue-ish)
                ctx.beginPath();
                ctx.arc(x1, y, nodeSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(200, 80%, 60%, 0.8)`;
                ctx.fill();

                // 3. Draw Strand 2 (Red/Pink-ish)
                ctx.beginPath();
                ctx.arc(x2, y, nodeSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(340, 80%, 60%, 0.8)`;
                ctx.fill();
                
                // Add a little glow effect to nodes
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;
            }

            // Reset shadow for next frame performance
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
