<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const planets = [];

        // Planet configuration: distance, radius, speed, color, name
        const planetData = [
            { dist: 60,  radius: 4,  speed: 0.04,  color: '#A5A5A5', name: 'Mercury' },
            { dist: 90,  radius: 7,  speed: 0.015, color: '#E3BB76', name: 'Venus' },
            { dist: 130, radius: 8,  speed: 0.01,  color: '#2271B3', name: 'Earth' },
            { dist: 170, radius: 6,  speed: 0.008, color: '#E27B58', name: 'Mars' },
            { dist: 240, radius: 18, speed: 0.004, color: '#D39C7E', name: 'Jupiter' },
            { dist: 310, radius: 14, speed: 0.002, color: '#C5AB6E', name: 'Saturn' }
        ];

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;

            // Generate Starfield
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }

            // Initialize Planets
            planets.length = 0;
            planetData.forEach(data => {
                planets.push({
                    distance: data.dist,
                    radius: data.radius,
                    speed: data.speed,
                    color: data.color,
                    angle: Math.random() * Math.PI * 2 // Random starting position
                });
            });
        }

        function drawSun() {
            // Sun Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 40);
            gradient.addColorStop(0, '#FFF5F2');
            gradient.addColorStop(0.2, '#FFD200');
            gradient.addColorStop(0.5, '#F7941E');
            gradient.addColorStop(1, 'transparent');

            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Sun Core
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#FFCC00';
            ctx.fill();
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            drawSun();

            // Draw Planets and Orbits
            planets.forEach(p => {
                // Draw Orbit Path
                ctx.beginPath();
                ctx.arc(centerX, centerY, p.distance, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Update Position
                p.angle += p.speed;

                // Calculate Planet Position
                const x = centerX + Math.cos(p.angle) * p.distance;
                const y = centerY + Math.sin(p.angle) * p.distance;

                // Draw Planet Shadow/Glow
                ctx.beginPath();
                ctx.arc(x, y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow for next drawings
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        init();
        draw();
    </script>
</body>
</html>
