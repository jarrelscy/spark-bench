<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];

        // Planet configuration
        const planets = [
            { name: 'Mercury', dist: 60, size: 3, speed: 0.02, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', dist: 90, size: 5, speed: 0.015, color: '#E3BB76', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', dist: 130, size: 5.5, speed: 0.01, color: '#22A6F2', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', dist: 170, size: 4, speed: 0.008, color: '#E27B58', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', dist: 240, size: 12, speed: 0.004, color: '#C69C6D', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', dist: 310, size: 10, speed: 0.003, color: '#F4D198', angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: 'Uranus', dist: 370, size: 8, speed: 0.002, color: '#BDE0FE', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', dist: 420, size: 7.5, speed: 0.001, color: '#5B5DDF', angle: Math.random() * Math.PI * 2 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        function generateStars() {
            stars = [];
            const starCount = Math.floor((width * height) / 3000);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function drawBackground() {
            // Draw stars
            ctx.fillStyle = 'white';
            for (let star of stars) {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            const sunRadius = 35;
            
            // Sun glow
            const gradient = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.5, centerX, centerY, sunRadius * 3);
            gradient.addColorStop(0, 'rgba(255, 220, 50, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 150, 0, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 80, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius * 3, 0, Math.PI * 2);
            ctx.fill();

            // Sun core
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.dist;
            const y = centerY + Math.sin(planet.angle) * planet.dist;

            // Draw orbit path
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.dist, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fill();

            // Draw Saturn's Ring
            if (planet.hasRing) {
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.size * 2, planet.size * 0.5, planet.angle + Math.PI / 2, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawBackground();
            drawSun();

            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
