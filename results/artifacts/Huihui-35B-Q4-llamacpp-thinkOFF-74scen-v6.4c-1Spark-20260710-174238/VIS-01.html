<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateStars();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Starfield configuration
        const stars = [];
        const starCount = 1000;

        function generateStars() {
            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.8 + 0.2
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Sun configuration
        const sunRadius = 40;
        const sunColor = '#FDB813';
        const sunGlowColor = 'rgba(253, 184, 19, 0.3)';

        function drawSun() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, sunRadius, centerX, centerY, sunRadius * 4);
            gradient.addColorStop(0, 'rgba(253, 184, 19, 0.4)');
            gradient.addColorStop(1, 'rgba(253, 184, 19, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius * 4, 0, Math.PI * 2);
            ctx.fill();

            // Sun body
            ctx.fillStyle = sunColor;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Inner glow effect
            const innerGradient = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.5, centerX, centerY, sunRadius);
            innerGradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            innerGradient.addColorStop(1, 'rgba(253, 184, 19, 0)');
            ctx.fillStyle = innerGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // Planet configuration
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 80, speed: 0.04, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 6, orbitRadius: 120, speed: 0.03, color: '#E6C288', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 7, orbitRadius: 160, speed: 0.025, color: '#4B9CD3', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 5, orbitRadius: 200, speed: 0.02, color: '#C1440E', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 12, orbitRadius: 260, speed: 0.015, color: '#D4A574', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 10, orbitRadius: 320, speed: 0.012, color: '#E8D5A3', angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: 'Uranus', radius: 8, orbitRadius: 380, speed: 0.01, color: '#73C2D0', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', radius: 8, orbitRadius: 440, speed: 0.008, color: '#3E54E8', angle: Math.random() * Math.PI * 2 }
        ];

        function drawPlanet(planet) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Draw orbit path
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Saturn's ring
            if (planet.hasRing) {
                ctx.strokeStyle = 'rgba(232, 213, 163, 0.6)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Add subtle glow to planet
            const glow = ctx.createRadialGradient(x, y, planet.radius * 0.8, x, y, planet.radius * 1.5);
            glow.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Store position for potential label drawing
            planet.x = x;
            planet.y = y;
        }

        // Animation loop
        function animate() {
            // Clear canvas with dark background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            drawStars();

            // Draw Sun
            drawSun();

            // Update and draw planets
            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
