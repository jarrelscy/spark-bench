<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        let animationId;

        // Galaxy configuration
        const CONFIG = {
            starCount: 1500,
            coreRadius: 30,
            maxRadius: 400,
            armCount: 3,
            armSpread: 1.5, // How much the arms spread out
            rotationSpeed: 0.0005,
            twinkleSpeed: 0.02,
            colors: [
                '#ffffff', // White
                '#ffe4c4', // Bisque
                '#add8e6', // Light Blue
                '#ffd700', // Gold
                '#ffb6c1', // Light Pink
                '#e6e6fa', // Lavender
                '#fffacd'  // Lemon Chiffon
            ]
        };

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            
            // Regenerate stars on resize to fit the screen
            generateStars();
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random distance from center
                this.distance = Math.random() * CONFIG.maxRadius;
                
                // Determine which arm this star belongs to
                const armIndex = Math.floor(Math.random() * CONFIG.armCount);
                const armAngle = (armIndex / CONFIG.armCount) * Math.PI * 2;
                
                // Add randomness to the angle based on distance (spiral effect)
                // Closer stars are more tightly wound, further stars spread out
                const spiralFactor = this.distance / CONFIG.maxRadius;
                const angleOffset = (armIndex * CONFIG.armSpread) * spiralFactor + (Math.random() - 0.5) * 0.5;
                
                this.angle = armAngle + angleOffset;
                
                // Size based on distance (closer stars are generally brighter/larger)
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color selection
                this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                
                // Twinkle properties
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.twinkleSpeed = CONFIG.twinkleSpeed * (0.5 + Math.random());
                
                // Brightness variation
                this.baseBrightness = 0.6 + Math.random() * 0.4;
                
                // Rotation speed (closer stars rotate faster)
                this.rotationSpeed = CONFIG.rotationSpeed * (1 - spiralFactor * 0.5);
            }

            update(time) {
                // Update rotation
                this.angle += this.rotationSpeed;
                
                // Update twinkle
                this.twinklePhase += this.twinkleSpeed;
                
                // Calculate current brightness with twinkle
                this.currentBrightness = this.baseBrightness + Math.sin(this.twinklePhase) * 0.2;
            }

            draw(ctx) {
                // Calculate position
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;
                
                // Skip drawing if off screen
                if (x < -10 || x > width + 10 || y < -10 || y > height + 10) return;
                
                // Draw star with glow effect
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.currentBrightness;
                ctx.fill();
                
                // Add glow for larger stars
                if (this.size > 1.2) {
                    ctx.beginPath();
                    ctx.arc(x, y, this.size * 2, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.currentBrightness * 0.2;
                    ctx.fill();
                }
            }
        }

        function generateStars() {
            stars = [];
            for (let i = 0; i < CONFIG.starCount; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Draw the bright core with gradient
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CONFIG.coreRadius);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            coreGradient.addColorStop(0.3, 'rgba(255, 240, 200, 0.6)');
            coreGradient.addColorStop(0.6, 'rgba(255, 200, 150, 0.3)');
            coreGradient.addColorStop(1, 'rgba(255, 150, 100, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, CONFIG.coreRadius, 0, Math.PI * 2);
            ctx.fillStyle = coreGradient;
            ctx.fill();
        }

        function animate(time) {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Draw core
            drawCore();
            
            // Update and draw all stars
            ctx.globalAlpha = 1;
            for (const star of stars) {
                star.update(time);
                star.draw(ctx);
            }
            
            // Request next frame
            animationId = requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        animate(0);
    </script>
</body>
</html>
