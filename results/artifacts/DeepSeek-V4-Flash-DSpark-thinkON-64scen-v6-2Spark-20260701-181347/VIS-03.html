<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            background: #0a0a0f;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('dnaCanvas');
            const ctx = canvas.getContext('2d');

            // ─── Sizing ───────────────────────────────────────────────
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // ─── DNA Parameters ──────────────────────────────────────
            const NUM_PAIRS = 26;
            const RADIUS = 82;
            const HEIGHT = 380;
            const TOTAL_TWIST = 4.2 * Math.PI;
            const FOCAL_LENGTH = 520;
            const NODE_RADIUS_BASE = 3.8;
            const STRAND_LINE_WIDTH = 2.6;
            const RUNG_LINE_WIDTH = 1.6;

            // Colors (RGB)
            const COLORS = {
                strand1: { r: 0, g: 200, b: 220 },
                strand2: { r: 225, g: 40, b: 100 },
                rung: { r: 255, g: 255, b: 255 },
                glow1: { r: 0, g: 220, b: 255 },
                glow2: { r: 255, g: 60, b: 130 }
            };

            // ─── 3D Helpers ──────────────────────────────────────────
            function generateHelix(rotation) {
                const pts1 = [];
                const pts2 = [];
                for (let i = 0; i < NUM_PAIRS; i++) {
                    const t = i / (NUM_PAIRS - 1);
                    const y = -HEIGHT / 2 + t * HEIGHT;
                    const angle = rotation + t * TOTAL_TWIST;
                    const x1 = RADIUS * Math.cos(angle);
                    const z1 = RADIUS * Math.sin(angle);
                    const x2 = RADIUS * Math.cos(angle + Math.PI);
                    const z2 = RADIUS * Math.sin(angle + Math.PI);
                    pts1.push({ x: x1, y: y, z: z1 });
                    pts2.push({ x: x2, y: y, z: z2 });
                }
                return { pts1, pts2 };
            }

            function project(p) {
                const scale = FOCAL_LENGTH / (FOCAL_LENGTH + p.z);
                return {
                    x: p.x * scale + W / 2,
                    y: p.y * scale + H / 2,
                    scale: scale,
                    z: p.z,
                    depth: p.z
                };
            }

            // ─── Depth styling ───────────────────────────────────────
            function depthFactor(z) {
                // map z from [-RADIUS, +RADIUS] to [0.25, 1.0]
                const norm = (z + RADIUS) / (2 * RADIUS);
                return 0.25 + 0.75 * Math.max(0, Math.min(1, norm));
            }

            function colorWithDepth(color, z, alphaOverride) {
                const f = depthFactor(z);
                const a = alphaOverride !== undefined ? alphaOverride : f;
                return `rgba(${Math.round(color.r * f)},${Math.round(color.g * f)},${Math.round(color.b * f)},${a})`;
            }

            function colorBlend(c1, c2, t) {
                return {
                    r: Math.round(c1.r + (c2.r - c1.r) * t),
                    g: Math.round(c1.g + (c2.g - c1.g) * t),
                    b: Math.round(c1.b + (c2.b - c1.b) * t)
                };
            }

            // ─── Rendering ───────────────────────────────────────────
            function render(timestamp) {
                const rotation = timestamp * 0.00045;

                // Generate helix
                const { pts1, pts2 } = generateHelix(rotation);

                // Project all points
                const proj1 = pts1.map(p => project(p));
                const proj2 = pts2.map(p => project(p));

                // Build segments: [type, p1, p2, avgDepth]
                const segments = [];

                // Backbone segments for strand 1
                for (let i = 0; i < NUM_PAIRS - 1; i++) {
                    const p1 = proj1[i];
                    const p2 = proj1[i + 1];
                    const avgZ = (p1.z + p2.z) / 2;
                    segments.push({ type: 'strand1', p1, p2, depth: avgZ });
                }

                // Backbone segments for strand 2
                for (let i = 0; i < NUM_PAIRS - 1; i++) {
                    const p1 = proj2[i];
                    const p2 = proj2[i + 1];
                    const avgZ = (p1.z + p2.z) / 2;
                    segments.push({ type: 'strand2', p1, p2, depth: avgZ });
                }

                // Rung segments
                for (let i = 0; i < NUM_PAIRS; i++) {
                    const p1 = proj1[i];
                    const p2 = proj2[i];
                    const avgZ = (p1.z + p2.z) / 2;
                    segments.push({ type: 'rung', p1, p2, depth: avgZ });
                }

                // Sort segments back-to-front
                segments.sort((a, b) => a.depth - b.depth);

                // ─── Draw segments ───────────────────────────────────
                for (const seg of segments) {
                    const { p1, p2, depth } = seg;
                    const f = depthFactor(depth);

                    if (seg.type === 'strand1') {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = colorWithDepth(COLORS.strand1, depth);
                        ctx.lineWidth = STRAND_LINE_WIDTH * (0.5 + 0.5 * f);
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    } else if (seg.type === 'strand2') {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = colorWithDepth(COLORS.strand2, depth);
                        ctx.lineWidth = STRAND_LINE_WIDTH * (0.5 + 0.5 * f);
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    } else if (seg.type === 'rung') {
                        // Rung color: blend between the two strand colors
                        const blendColor = colorBlend(COLORS.strand1, COLORS.strand2, 0.5);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = colorWithDepth(blendColor, depth, 0.3 + 0.5 * f);
                        ctx.lineWidth = RUNG_LINE_WIDTH * (0.4 + 0.6 * f);
                        ctx.lineCap = 'round';
                        ctx.stroke();

                        // Subtle glow on rung
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(255,255,255,${0.04 + 0.06 * f})`;
                        ctx.lineWidth = RUNG_LINE_WIDTH * (1.2 + 1.0 * f);
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    }
                }

                // ─── Draw nodes (sorted back-to-front) ──────────────
                const nodes = [];
                for (let i = 0; i < NUM_PAIRS; i++) {
                    nodes.push({ type: 'strand1', ...proj1[i] });
                    nodes.push({ type: 'strand2', ...proj2[i] });
                }
                nodes.sort((a, b) => a.z - b.z);

                for (const node of nodes) {
                    const f = depthFactor(node.z);
                    const r = NODE_RADIUS_BASE * (0.4 + 0.6 * f);
                    const color = node.type === 'strand1' ? COLORS.strand1 : COLORS.strand2;
                    const glowColor = node.type === 'strand1' ? COLORS.glow1 : COLORS.glow2;

                    // Outer glow
                    const grad = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, r * 3.2);
                    const gc = glowColor;
                    grad.addColorStop(0, `rgba(${gc.r},${gc.g},${gc.b},${0.15 * f})`);
                    grad.addColorStop(0.5, `rgba(${gc.r},${gc.g},${gc.b},${0.05 * f})`);
                    grad.addColorStop(1, `rgba(${gc.r},${gc.g},${gc.b},0)`);
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r * 3.2, 0, 2 * Math.PI);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Node body
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r, 0, 2 * Math.PI);
                    ctx.fillStyle = colorWithDepth(color, node.z, 0.7 + 0.3 * f);
                    ctx.fill();

                    // Bright core
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r * 0.5, 0, 2 * Math.PI);
                    ctx.fillStyle = `rgba(255,255,255,${0.2 + 0.3 * f})`;
                    ctx.fill();

                    // Subtle ring
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, r * 0.85, 0, 2 * Math.PI);
                    ctx.strokeStyle = `rgba(255,255,255,${0.08 + 0.12 * f})`;
                    ctx.lineWidth = 0.6;
                    ctx.stroke();
                }

                // ─── Very subtle ambient glow at center ─────────────
                const grad2 = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 300);
                grad2.addColorStop(0, 'rgba(30, 40, 60, 0.08)');
                grad2.addColorStop(0.5, 'rgba(20, 30, 50, 0.04)');
                grad2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad2;
                ctx.fillRect(0, 0, W, H);
            }

            // ─── Animation Loop ──────────────────────────────────────
            let startTime = null;

            function animate(time) {
                if (startTime === null) startTime = time;
                const elapsed = time - startTime;

                // Clear
                ctx.clearRect(0, 0, W, H);

                // Draw a very subtle grid or vignette
                const vig = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
                vig.addColorStop(0, 'rgba(10, 12, 20, 0)');
                vig.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
                ctx.fillStyle = vig;
                ctx.fillRect(0, 0, W, H);

                // Render the helix
                render(elapsed);

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            // ─── Handle resize during animation ──────────────────────
            window.addEventListener('resize', () => {
                resize();
            });

        })();
    </script>
</body>
</html>
