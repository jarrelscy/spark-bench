<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spiral Galaxy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
(function() {
  const canvas = document.getElementById('galaxy');
  const ctx = canvas.getContext('2d');

  let W, H, cx, cy, maxRadius;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
    maxRadius = Math.min(W, H) * 0.46;
  }
  window.addEventListener('resize', () => {
    resize();
    initStars();
  });

  const FLATTEN = 0.38; // perspective tilt of the disk
  const NUM_ARMS = 4;
  const STARS_PER_ARM = 220;
  const NUM_CORE_STARS = 150;
  const NUM_BG_STARS = 250;

  let armStars = [];
  let coreStars = [];
  let bgStars = [];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function starColor() {
    // Slight color variation: whitish, blue-ish, yellow-ish, reddish
    const roll = Math.random();
    if (roll < 0.55) return [255, 255, 255];        // white
    if (roll < 0.75) return [180, 200, 255];        // blue-white
    if (roll < 0.90) return [255, 235, 180];        // warm yellow
    return [255, 190, 160];                          // pale red/orange
  }

  function initStars() {
    armStars = [];
    coreStars = [];
    bgStars = [];

    const totalWinding = Math.PI * 2.6; // how tightly arms wind
    const spiralTightness = totalWinding / maxRadius;

    for (let a = 0; a < NUM_ARMS; a++) {
      const armBaseAngle = (Math.PI * 2 / NUM_ARMS) * a;
      for (let i = 0; i < STARS_PER_ARM; i++) {
        // bias radius toward outer regions a bit, but keep spread
        const t = Math.pow(Math.random(), 0.55);
        const r = 20 + t * (maxRadius - 20);

        // angular thickness of arm - thicker near core, thinner outward
        const thickness = rand(-1, 1) * (0.55 / (1 + r * 0.02));
        const spiralAngle = armBaseAngle + r * spiralTightness + thickness;

        // slight radius jitter for a fuzzier arm look
        const rJitter = r + rand(-8, 8);

        const [cr, cg, cb] = starColor();
        const size = rand(0.5, 2.2);
        const brightnessBase = rand(0.45, 1);
        const twinkleSpeed = rand(0.6, 2.4);
        const twinklePhase = rand(0, Math.PI * 2);

        // differential rotation: inner stars rotate faster
        const omega = 0.9 / (rJitter * 0.02 + 1);

        armStars.push({
          r: rJitter,
          theta0: spiralAngle,
          omega: omega,
          size: size,
          color: [cr, cg, cb],
          brightnessBase: brightnessBase,
          twinkleSpeed: twinkleSpeed,
          twinklePhase: twinklePhase
        });
      }
    }

    // Dense bright core stars, scattered near center in all directions
    for (let i = 0; i < NUM_CORE_STARS; i++) {
      const r = Math.pow(Math.random(), 1.6) * maxRadius * 0.18;
      const theta0 = rand(0, Math.PI * 2);
      const omega = 1.4 / (r * 0.02 + 1);
      const size = rand(0.6, 2.0);
      const brightnessBase = rand(0.7, 1);
      const twinkleSpeed = rand(0.8, 3);
      const twinklePhase = rand(0, Math.PI * 2);
      const [cr, cg, cb] = Math.random() < 0.7 ? [255, 250, 230] : starColor();

      coreStars.push({
        r, theta0, omega, size,
        color: [cr, cg, cb],
        brightnessBase, twinkleSpeed, twinklePhase
      });
    }

    // Faint static background field stars for depth
    for (let i = 0; i < NUM_BG_STARS; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: rand(0.3, 1.2),
        brightnessBase: rand(0.1, 0.5),
        twinkleSpeed: rand(0.2, 1),
        twinklePhase: rand(0, Math.PI * 2)
      });
    }
  }

  function drawCoreGlow(time) {
    const pulse = 1 + 0.08 * Math.sin(time * 0.0015);
    const baseRadius = maxRadius * 0.14 * pulse;

    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseRadius * 3);
    gradient.addColorStop(0, 'rgba(255,255,240,1)');
    gradient.addColorStop(0.15, 'rgba(255,240,200,0.85)');
    gradient.addColorStop(0.4, 'rgba(255,210,150,0.35)');
    gradient.addColorStop(1, 'rgba(255,200,120,0)');

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.ellipse(cx, cy, baseRadius * 3, baseRadius * 3 * FLATTEN, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawStar(x, y, size, color, brightness) {
    const [r, g, b] = color;
    const alpha = Math.max(0, Math.min(1, brightness));
    ctx.beginPath();
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();

    // subtle glow for brighter stars
    if (size > 1.3 && alpha > 0.6) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, size * 4);
      glowGrad.addColorStop(0, `rgba(${r},${g},${b},${alpha * 0.5})`);
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(x, y, size * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function render(time) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Background field stars
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const tw = 0.6 + 0.4 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinklePhase);
      const brightness = s.brightnessBase * tw;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, brightness)})`;
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    drawCoreGlow(time);

    // Spiral arm stars
    for (let i = 0; i < armStars.length; i++) {
      const s = armStars[i];
      const angle = s.theta0 + s.omega * time * 0.00035;
      const x = cx + s.r * Math.cos(angle);
      const y = cy + s.r * Math.sin(angle) * FLATTEN;

      const tw = 0.55 + 0.45 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinklePhase);
      const brightness = s.brightnessBase * tw;

      drawStar(x, y, s.size, s.color, brightness);
    }

    // Core stars (drawn after arms so bright core pops on top)
    for (let i = 0; i < coreStars.length; i++) {
      const s = coreStars[i];
      const angle = s.theta0 + s.omega * time * 0.00035;
      const x = cx + s.r * Math.cos(angle);
      const y = cy + s.r * Math.sin(angle) * FLATTEN;

      const tw = 0.6 + 0.4 * Math.sin(time * 0.001 * s.twinkleSpeed + s.twinklePhase);
      const brightness = s.brightnessBase * tw;

      drawStar(x, y, s.size, s.color, brightness);
    }

    requestAnimationFrame(render);
  }

  resize();
  initStars();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
