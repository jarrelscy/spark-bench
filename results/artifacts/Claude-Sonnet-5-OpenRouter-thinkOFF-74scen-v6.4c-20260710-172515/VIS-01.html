<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
  }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: rgba(255,255,255,0.6);
    font-family: Arial, sans-serif;
    font-size: 13px;
    user-select: none;
  }
</style>
</head>
<body>
<div id="info">Solar System Simulation</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height, centerX, centerY;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;
  centerX = width / 2;
  centerY = height / 2;
  generateStars();
}

window.addEventListener('resize', resize);

// ---------- Starfield ----------
let stars = [];
function generateStars() {
  stars = [];
  const starCount = Math.floor((width * height) / 2000);
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      radius: Math.random() * 1.3 + 0.2,
      baseAlpha: Math.random() * 0.6 + 0.3,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(time) {
  ctx.fillStyle = '#000010';
  ctx.fillRect(0, 0, width, height);

  for (const s of stars) {
    const alpha = s.baseAlpha + Math.sin(time * s.twinkleSpeed + s.phase) * 0.3;
    ctx.beginPath();
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, alpha))})`;
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Planets ----------
// Each planet: name, orbit radius, orbital speed (radians/frame-ish), size, color, angle offset
const planets = [
  { name: 'Mercury', orbitRadius: 45,  speed: 0.0210, size: 3.2, color: '#b1adad', angle: Math.random()*Math.PI*2, tilt: 0.15 },
  { name: 'Venus',   orbitRadius: 65,  speed: 0.0160, size: 5.5, color: '#e6c78c', angle: Math.random()*Math.PI*2, tilt: 0.10 },
  { name: 'Earth',   orbitRadius: 90,  speed: 0.0120, size: 6,   color: '#4f9be0', angle: Math.random()*Math.PI*2, tilt: 0.08,
    moon: { orbitRadius: 14, speed: 0.09, size: 1.8, color: '#cccccc', angle: 0 } },
  { name: 'Mars',    orbitRadius: 115, speed: 0.0095, size: 4.2, color: '#e07a4f', angle: Math.random()*Math.PI*2, tilt: 0.12 },
  { name: 'Jupiter', orbitRadius: 160, speed: 0.0055, size: 13,  color: '#dcb896', angle: Math.random()*Math.PI*2, tilt: 0.05 },
  { name: 'Saturn',  orbitRadius: 205, speed: 0.0038, size: 11,  color: '#e5d3a3', angle: Math.random()*Math.PI*2, tilt: 0.04, ring: true },
  { name: 'Uranus',  orbitRadius: 245, speed: 0.0026, size: 8,   color: '#9fdbe0', angle: Math.random()*Math.PI*2, tilt: 0.03 },
  { name: 'Neptune', orbitRadius: 280, speed: 0.0020, size: 7.8, color: '#5b7fe0', angle: Math.random()*Math.PI*2, tilt: 0.02 }
];

// Scale factor to fit orbits nicely depending on screen size
function getScale() {
  return Math.min(width, height) / 750;
}

function drawOrbit(radius) {
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
  ctx.stroke();
}

function drawSun(time) {
  const pulse = Math.sin(time * 0.002) * 3;
  const baseRadius = 30;
  const radius = baseRadius + pulse;

  // Outer glow
  const glowRadius = radius * 4;
  const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.3, centerX, centerY, glowRadius);
  gradient.addColorStop(0, 'rgba(255, 240, 180, 0.9)');
  gradient.addColorStop(0.3, 'rgba(255, 200, 100, 0.4)');
  gradient.addColorStop(1, 'rgba(255, 150, 50, 0)');
  ctx.beginPath();
  ctx.fillStyle = gradient;
  ctx.arc(centerX, centerY, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  // Core
  const coreGradient = ctx.createRadialGradient(
    centerX - radius * 0.3, centerY - radius * 0.3, radius * 0.1,
    centerX, centerY, radius
  );
  coreGradient.addColorStop(0, '#fffbe0');
  coreGradient.addColorStop(0.5, '#ffd35c');
  coreGradient.addColorStop(1, '#ff8c1a');

  ctx.beginPath();
  ctx.fillStyle = coreGradient;
  ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlanet(p, scale) {
  const r = p.orbitRadius * scale;
  drawOrbit(r);

  p.angle += p.speed;

  // slight elliptical orbit using tilt as y-scale factor
  const x = centerX + Math.cos(p.angle) * r;
  const y = centerY + Math.sin(p.angle) * r * (1 - p.tilt);

  // Shadow/glow behind planet
  ctx.beginPath();
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.arc(x, y, p.size * scale + 2, 0, Math.PI * 2);
  ctx.fill();

  // Saturn ring (drawn before planet body partly, and after for front arc effect)
  if (p.ring) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(0.4);
    ctx.scale(1, 0.35);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(230, 220, 180, 0.7)';
    ctx.lineWidth = p.size * scale * 0.5;
    ctx.arc(0, 0, p.size * scale * 1.9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Planet body with simple shading
  const planetGradient = ctx.createRadialGradient(
    x - p.size * scale * 0.3, y - p.size * scale * 0.3, p.size * scale * 0.1,
    x, y, p.size * scale
  );
  planetGradient.addColorStop(0, lightenColor(p.color, 40));
  planetGradient.addColorStop(1, p.color);

  ctx.beginPath();
  ctx.fillStyle = planetGradient;
  ctx.arc(x, y, p.size * scale, 0, Math.PI * 2);
  ctx.fill();

  // Moon for Earth
  if (p.moon) {
    p.moon.angle += p.moon.speed;
    const mr = p.moon.orbitRadius * scale;
    const mx = x + Math.cos(p.moon.angle) * mr;
    const my = y + Math.sin(p.moon.angle) * mr * 0.6;

    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.ellipse(x, y, mr, mr * 0.6, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle = p.moon.color;
    ctx.arc(mx, my, p.moon.size * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  // subtle label (optional, small and faded)
  ctx.font = `${10}px Arial`;
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillText(p.name, x + p.size * scale + 4, y + 3);
}

function lightenColor(hex, amt) {
  let col = hex.replace('#', '');
  if (col.length === 3) {
    col = col.split('').map(c => c + c).join('');
  }
  const num = parseInt(col, 16);
  let r = (num >> 16) + amt;
  let g = ((num >> 8) & 0x00FF) + amt;
  let b = (num & 0x0000FF) + amt;
  r = Math.min(255, Math.max(0, r));
  g = Math.min(255, Math.max(0, g));
  b = Math.min(255, Math.max(0, b));
  return `rgb(${r},${g},${b})`;
}

// ---------- Animation Loop ----------
let lastTime = 0;
function animate(time) {
  drawStars(time);

  const scale = getScale();

  drawSun(time);

  for (const p of planets) {
    drawPlanet(p, scale);
  }

  requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
