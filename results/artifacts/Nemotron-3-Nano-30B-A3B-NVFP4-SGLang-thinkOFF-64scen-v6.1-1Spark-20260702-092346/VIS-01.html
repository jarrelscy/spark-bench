<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar System Animation</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; }
        canvas { display:block; }
    </style>
</head>
<body>
    <canvas id="solar"></canvas>
    <script>
        const canvas = document.getElementById('solar');
        const ctx = canvas.getContext('2d');
        
        // Set full window size
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Starfield background
        const stars = [];
        const starCount = 150;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                speed: Math.random() * 0.15 + 0.05
            });
        }
        
        // Solar system parameters
        const sunRadius = 30;
        const planets = [
            { name: 'Mercury', radius: 40, orbitRadius: 100, orbitSpeed: 0.02, glow: 0.8 },
            { name: 'Venus',   radius: 60, orbitRadius: 150, orbitSpeed: 0.015, glow: 0.9 },
            { name: 'Earth',   radius: 65, orbitRadius: 200, orbitSpeed: 0.01, glow: 1.0 },
            { name: 'Mars',    radius: 45, orbitRadius: 250, orbitSpeed: 0.008, glow: 0.7 },
            { name: 'Jupiter', radius: 80, orbitRadius: 300, orbitSpeed: 0.005, glow: 0.6 },
            { name: 'Saturn',  radius: 70, orbitRadius: 350, orbitSpeed: 0.004, glow: 0.5 }
        ];
        
        // Animation loop
        function animate() {
            // Clear canvas with starfield background
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            for (const star of stars) {
                const brightness = 1 - Math.sin(Date.now() * star.speed * 0.001) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.8})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw Sun
            const time = Date.now() * 0.001;
            const sunX = canvas.width / 2;
            const sunY = canvas.height / 2;
            
            // Glowing Sun
            const glowSize = sunRadius * 3;
            const gradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, glowSize);
            gradient.addColorStop(0, `rgba(255, 200, 0, ${planets[0].glow})`);
            gradient.addColorStop(0.5, `rgba(255, 150, 0, ${planets[0].glow * 0.7})`);
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(sunX, sunY, glowSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw planets
            for (const planet of planets) {
                const angle = time * planet.orbitSpeed;
                const x = sunX + planet.orbitRadius * Math.cos(angle);
                const y = sunY + planet.orbitRadius * Math.sin(angle);
                
                // Orbit path (subtle)
                ctx.strokeStyle = 'rgba(100, 100, 100, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(sunX, sunY, planet.orbitRadius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Planet glow
                const glowRadius = planet.radius * 1.5;
                const glowGradient = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
                glowGradient.addColorStop(0, `rgba(255, 255, 255, ${planet.glow * 0.3})`);
                glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = glowGradient;
                ctx.beginPath();
                ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
                ctx.fill();
                
                // Planet core
                ctx.fillStyle = planet.name === 'Earth' ? '#1e90ff' : 
                               planet.name === 'Mars' ? '#ff4500' : 
                               '#aaaaff';
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
