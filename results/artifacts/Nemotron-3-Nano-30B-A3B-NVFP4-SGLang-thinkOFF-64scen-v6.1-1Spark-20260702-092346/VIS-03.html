<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DNA Helix</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas></canvas>
  <script>
    const canvas = document.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = canvas.width = window.innerWidth;
    const HEIGHT = canvas.height = window.innerHeight;
    
    const numNodes = 100;
    const nodes = [];
    const radius = 150;
    const pitch = 80;
    const nodeSpacing = 2 * Math.PI / numNodes;
    
    // Generate nodes
    for (let i = 0; i < numNodes; i++) {
      const t = i * nodeSpacing;
      nodes.push({
        x: Math.cos(t) * radius,
        y: Math.sin(t) * radius,
        z: t * pitch,
        phase: t,
        color: Math.random() * 0.5 + 0.5
      });
    }
    
    let angle = 0;
    
    function draw() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      
      // Draw rungs
      for (let i = 0; i < numNodes; i++) {
        const j = (i + 1) % numNodes;
        const a = nodes[i];
        const b = nodes[j];
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(a.x + WIDTH/2, a.y + HEIGHT/2);
        ctx.lineTo(b.x + WIDTH/2, b.y + HEIGHT/2);
        ctx.stroke();
      }
      
      // Draw strands with color variation
      for (let i = 0; i < numNodes; i++) {
        const t = i * nodeSpacing;
        const node = nodes[i];
        
        // Base color with variation
        const hue = (i % 2 === 0) ? 200 + node.color * 30 : 300 + node.color * 30;
        const color = `hsl(${hue}, 80%, 60%)`;
        
        // Draw as glowing point
        const x = node.x * Math.cos(angle) - node.y * Math.sin(angle) + WIDTH/2;
        const y = node.x * Math.sin(angle) + node.y * Math.cos(angle) + HEIGHT/2;
        
        const gradient = ctx.createRadialGradient(
          x, y, 0,
          x, y, 6
        );
        gradient.addColorStop(0, color);
        gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      
      angle += 0.01;
      requestAnimationFrame(draw);
    }
    
    requestAnimationFrame(draw);
    
    // Handle resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
