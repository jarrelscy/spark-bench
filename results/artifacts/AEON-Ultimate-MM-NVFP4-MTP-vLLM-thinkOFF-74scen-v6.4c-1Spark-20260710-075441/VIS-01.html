<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden; /* Prevent scrollbars */
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #aaa;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <strong>Solar System</strong><br>
        <span style="font-size: 0.8em;">Animated via HTML5 Canvas</span>
    </div>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration for the planets
        // Distances and sizes are not to scale for visual clarity
        const planets = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus", color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
            { name: "Earth", color: "#22A096", radius: 7, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
            { name: "Mars", color: "#D9534F", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D9A076", radius: 18, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", color: "#E0C080", radius: 15, distance: 310, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus", color: "#76D9D9", radius: 10, distance: 370, speed: 0.002, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#4F76D9", radius: 10, distance: 420, speed: 0.0015, angle: Math.random() * Math.PI * 2 }
        ];

        // Generate Starfield
        const stars = [];
        const numStars = 400;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            
            // Re-generate stars on resize to fill screen
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        // Initial setup
        resize();
        window.addEventListener('resize', resize);

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Sun Glow
            ctx.shadowBlur = 40;
            ctx.shadowColor = "#FDB813";
            
            // Sun Body
            ctx.fillStyle = "#FDB813";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fill();

            // Reset shadow for other elements
            ctx.shadowBlur = 0;
        }

        function drawOrbit(distance) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanets() {
            planets.forEach(planet => {
                // Update angle
                planet.angle += planet.speed;

                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit Path
                drawOrbit(planet.distance);

                // Draw Planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Add a subtle shadow for depth (light coming from center)
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, Math.PI/2, Math.PI*1.5); // Simple crescent shadow
                ctx.fill();

                // Draw Saturn's Ring
                if (planet.hasRing) {
                    ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    // Elliptical ring effect
                    ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw layers
            drawStars();
            drawSun();
            drawPlanets();

            requestAnimationFrame(animate);
        }

        // Start animation loop
        animate();

    </script>
</body>
</html>
