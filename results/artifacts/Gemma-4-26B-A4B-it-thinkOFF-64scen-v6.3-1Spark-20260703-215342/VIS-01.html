<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const planets = [];

        // Resize handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Generate Starfield
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }

        // Planet Class
        class Planet {
            constructor(distance, radius, speed, color, name) {
                this.distance = distance;
                this.radius = radius;
                this.speed = speed;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += this.speed;
            }

            draw() {
                // Draw Orbit Path
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.arc(centerX, centerY, this.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Calculate Position
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;

                // Draw Planet
                ctx.beginPath();
                ctx.arc(x, y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow for performance
            }
        }

        // Initialize Planets (Distance, Radius, Speed, Color)
        planets.push(new Planet(60, 6, 0.04, '#A5A5A5'));   // Mercury-like
        planets.push(new Planet(90, 10, 0.015, '#E3BB76'));  // Venus-like
        planets.push(new Planet(130, 11, 0.01, '#2271B3'));  // Earth-like
        planets.push(new Planet(170, 8, 0.008, '#E27B58'));  // Mars-like
        planets.push(new Planet(230, 18, 0.005, '#D39C7E')); // Jupiter-like
        planets.push(new Planet(300, 14, 0.003, '#C5AB6E')); // Saturn-like

        function drawSun() {
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#FF8C00';
            ctx.fill();
            ctx.restore();
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function animate() {
            // Clear Canvas
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();

            planets.forEach(planet => {
                planet.update();
                planet.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
