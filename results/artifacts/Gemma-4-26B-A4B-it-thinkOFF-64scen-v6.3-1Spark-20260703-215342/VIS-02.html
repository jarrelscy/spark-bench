<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 600;
        const spiralArms = 3;
        const rotationSpeed = 0.002;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Distance from center
                this.distance = Math.random() * (Math.min(width, height) * 0.45);
                
                // Spiral math: angle = (arm_offset) + (distance * density_factor)
                const armOffset = (Math.PI * 2 / spiralArms) * Math.floor(Math.random() * spiralArms);
                this.angle = armOffset + (this.distance * 0.01);
                
                // Add some randomness to position so it looks like a cloud, not a line
                this.angleOffset = (Math.random() - 0.5) * 0.5;
                this.armSpread = (Math.random() - 0.5) * 0.3;
                
                // Color: Blueish, White, or Yellowish
                const colors = ['#ffffff', '#e0f7fa', '#fff9c4', '#bbdefb', '#f8bbd0'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            draw() {
                // Spiral rotation logic
                this.angle += rotationSpeed;
                
                // Calculate position with a bit of orbital noise
                const currentAngle = this.angle + this.angleOffset;
                const x = centerX + Math.cos(currentAngle) * this.distance;
                const y = centerY + Math.sin(currentAngle) * this.distance;

                // Twinkle effect
                const opacity = 0.5 + Math.sin(this.twinklePhase) * 0.5;
                this.twinklePhase += this.twinkleSpeed;

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = opacity;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // Initialize stars
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        function drawCore() {
            // Create a glow effect for the center
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 200, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Clear with slight trail effect
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            drawCore();

            stars.forEach(star => star.draw());

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
