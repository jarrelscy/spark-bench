<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
           ;
        }
        body {
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="Canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let W, H, centerX, centerY;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            centerX = W / 2;
            centerY = H / 2;
        }
        resize();
        window.addEventListener('resize', resize);

        // Star data
        const numStars = 400;
        const stars = [];
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * 2000 - 500,
                y: Math.random() * 2000 - 500,
                r: Math.random() * 1.5 + 0.3,
                brightness: Math.random(),
                twinkleSpeed: Math.random() * 0.02 + 0.005
            });
        }

        // Planet data
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 55, speed: 0.04, color: '#b5b5b5', angle: Math.random() * Math.PI * 2, eccentricity: 0.1 },
            { name: 'Venus', radius: 7, orbitRadius: 85, speed: 0.025, color: '#e8cda0', angle: Math.random() * Math.PI * 2, eccentricity: 0.05 },
            { name: 'Earth', radius: 8, orbitRadius: 120, speed: 0.018, color: '#4d9de0', angle: Math.random() * Math.PI * 2, eccentricity: 0.08 },
            { name: 'Mars', radius: 6, orbitRadius: 160, speed: 0.014, color: '#e07040', angle: Math.random() * Math.PI * 2, eccentricity: 0.12 },
            { name: 'Jupiter', radius: 16, orbitRadius: 220, speed: 0.008, color: '#d4a574', angle: Math.random() * Math.PI * 2, eccentricity: 0.06 },
            { name: 'Saturn', radius: 13, orbitRadius: 290, speed: 0.006, color: '#e8d5a3', angle: Math.random() * Math.PI * 2, eccentricity: 0.09, hasRings: true },
            { name: 'Uranus', radius: 10, orbitRadius: 350, speed: 0.004, color: '#a0dce8', angle: Math.random() * Math.PI * 2, eccentricity: 0.07 },
            { name: 'Neptune', radius: 9, orbitRadius: 400, speed: 0.003, color: '#5070e0', angle: Math.random() * Math.PI * 2, eccentricity: 0.05 }
        ];

        // Sun glow layers
        function drawSunGlow(cx, cy, time) {
            // Outer corona
            const gradient3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
            gradient3.addColorStop(0, 'rgba(255, 200, 50, 0.15)');
            gradient3.addColorStop(0.5, 'rgba(255, 150, 30, 0.08)');
            gradient3.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = gradient3;
            ctx.beginPath();
            ctx.arc(cx, cy, 120, 0, Math.PI * 2);
            ctx.fill();

            // Mid corona
            const gradient2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
            gradient2.addColorStop(0, 'rgba(255, 180, 50, 0.3)');
            gradient2.addColorStop(0.6, 'rgba(255, 140, 30, 0.15)');
            gradient2.addColorStop(1, 'rgba(255, 100, 20, 0)');
            ctx.fillStyle = gradient2;
            ctx.beginPath();
            ctx.arc(cx, cy, 70, 0, Math.PI * 2);
            ctx.fill();

            // Inner glow
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 35);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
            gradient.addColorStop(0.3, 'rgba(255, 200, 50, 0.6)');
            gradient.addColorStop(0.7, 'rgba(255, 150, 30, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, 35, 0, Math.PI * 2);
            ctx.fill();

            // Sun body
            const sunGrad = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, 25);
            sunGrad.addColorStop(0, '#fff8e0');
            sunGrad.addColorStop(0.5, '#ffdd44');
            sunGrad.addColorStop(1, '#ffaa00');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, 25, 0, Math.PI * 2);
            ctx.fill();

            // Sun surface detail - pulsing
            ctx.fillStyle = 'rgba(255, 220, 100, 0.4)';
            ctx.beginPath();
            ctx.arc(cx, cy, 27, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOrbit(planet, cx, cy) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.ellipse(cx, cy, planet.orbitRadius, planet.orbitRadius * (1 - planet.eccentricity), 0, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet, cx, cy, time) {
            const x = cx + Math.cos(planet.angle) * planet.orbitRadius;
            const y = cy + Math.sin(planet.angle) * planet.orbitRadius * (1 - planet.eccentricity);

            // Planet glow
            const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, planet.radius * 2.5);
            glowGrad.addColorStop(0, planet.color + '40');
            glowGrad.addColorStop(1, planet.color + '00');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Planet body
            const bodyGrad = ctx.createRadialGradient(x - planet.radius * 0.3, y - planet.radius * 0.3, 0, x, y, planet.radius);
            bodyGrad.addColorStop(0, '#fff');
            bodyGrad.addColorStop(0.5, planet.color);
            bodyGrad.addColorStop(1, darkenColor(planet.color, 0.5));
            ctx.fillStyle = bodyGrad;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Saturn rings
            if (planet.hasRings) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(0.4);
                ctx.scale(1, 0.3);

                // Outer ring
                ctx.strokeStyle = 'rgba(210, 180, 140, 0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, planet.radius * 1.8, 0, Math.PI * 2);
                ctx.stroke();

                // Inner ring
                ctx.strokeStyle = 'rgba(190, 160, 120, 0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, planet.radius * 1.4, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();
            }

            // Draw name label
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '10px Arial';
            ctx.fillText(planet.name, x + planet.radius + 5, y - 5);

            return { x, y };
        }

        function darkenColor(hex, factor) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, ), 16);
            return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
        }

        let time = 0;
        function animate() {
            time += 0.016;

            // Clear
            ctx.fillStyle = 'rgba(0, 0, 10, 1)';
            ctx.fillRect(0, 0, W, H);

            // Draw stars
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed * 100 + star.x);
                const alpha = star.brightness * twinkle;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw orbits
            for (let i = 0; i < planets.length; i++) {
                drawOrbit(planets[i], centerX, centerY);
            }

            // Draw planets
            for (let i = 0; i < planets.length; i++) {
                drawPlanet(planets[i], centerX, centerY, time);
            }

            // Draw Sun (on top of orbits, behind planets slightly)
            drawSunGlow(centerX, centerY, time);

            // Update planet angles
            for (let i = 0; i < planets.length; i++) {
                planets[i].angle += planets[i].speed;
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
