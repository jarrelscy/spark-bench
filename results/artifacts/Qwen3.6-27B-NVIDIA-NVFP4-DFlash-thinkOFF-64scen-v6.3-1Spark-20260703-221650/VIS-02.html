<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        
        // Configuration
        const STAR_COUNT = 1200;
        const ARM_COUNT = 3;
        const ARM_SPREAD = 0.5; // How wide the arms are
        const GALAXY_SIZE = 300; // Base radius
        const CORE_RADIUS = 15;
        
        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            
            // Adjust galaxy size based on screen size
            const minDim = Math.min(width, height);
            GALAXY_SIZE = minDim * 0.35;
            
            initStars();
        }

        // Helper: Random number between min and max
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Helper: Get random color based on distance from core
        function getStarColor(distRatio) {
            // distRatio: 0 = center, 1 = edge
            // Center: Warm (Red/Orange/Yellow)
            // Outer: Cool (Blue/Cyan/Purple)
            
            if (distRatio < 0.2) {
                // Core: Bright yellow/orange
                return `rgba(255, ${random(200, 255)}, ${random(50, 150)},`;
            } else if (distRatio < 0.6) {
                // Mid: White/Blueish
                return `rgba(${random(200, 255)}, ${random(200, 255)}, ${random(220, 255)},`;
            } else {
                // Edge: Deep Blue/Purple
                return `rgba(${random(100, 180)}, ${random(150, 220)}, ${random(200, 255)},`;
            }
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distribution logic
                // Most stars near center, fewer at edges
                // Using sqrt of random for better distribution
                const r = Math.sqrt(Math.random()) * GALAXY_SIZE;
                
                // Angle logic for spiral arms
                // Base angle based on radius (twist)
                const twist = r * 0.02; 
                // Random arm selection
                const armAngle = (Math.floor(Math.random() * ARM_COUNT) * (Math.PI * 2 / ARM_COUNT));
                // Random spread within the arm
                const spread = random(-ARM_SPREAD, ARM_SPREAD);
                
                this.angle = armAngle + twist + spread;
                this.distance = r;
                this.radius = random(0.5, 2.5);
                // Some stars are brighter/larger
                if (Math.random() > 0.9) this.radius = random(2, 3.5);

                // Color
                const distRatio = r / GALAXY_SIZE;
                this.colorBase = getStarColor(distRatio);
                
                // Twinkle properties
                this.twinkleSpeed = random(0.02, 0.08);
                this.twinkleOffset = random(0, Math.PI * 2);
                
                // Rotation speed (closer to center = faster)
                this.rotationSpeed = 0.0005 + (1 - distRatio) * 0.002;
            }

            update(time) {
                // Rotate around center
                this.angle += this.rotationSpeed;
                
                // Twinkle effect
                // Oscillate opacity between 0.3 and 1.0
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                // Normalize sine (-1 to 1) to (0.3 to 1.0)
                this.opacity = 0.3 + (twinkle + 1) * 0.35;
            }

            draw(ctx) {
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;

                ctx.beginPath();
                ctx.arc(x, y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.colorBase + this.opacity + ')';
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Draw the bright glowing center
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_RADIUS * 3);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 220, 150, 0.8)');
            gradient.addColorStop(0.5, 'rgba(200, 150, 100, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_RADIUS * 3, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function animate(time) {
            // Clear canvas with slight fade for trail effect (optional, but clean clear is better for this style)
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw Core
            drawCore();

            // Update and Draw Stars
            // Use 'lighter' composite operation for glowing star effect
            ctx.globalCompositeOperation = 'lighter';
            
            for (let star of stars) {
                star.update(time);
                star.draw(ctx);
            }
            
            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
