<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration for the planets
    // Distances and sizes are relative for visual fit, not astronomical scale
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6F2", radius: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#DF5033", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D6A566", radius: 18, distance: 230, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#EAD6B8", radius: 15, distance: 290, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#D1F3F8", radius: 10, distance: 340, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#5B5DDF", radius: 9, distance: 380, speed: 0.001, angle: Math.random() * Math.PI * 2 }
    ];

    // Starfield data
    let stars = [];
    const numStars = 400;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    function generateStars() {
        stars = [];
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Outer glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
        gradient.addColorStop(0, "rgba(255, 223, 0, 1)");
        gradient.addColorStop(0.2, "rgba(255, 165, 0, 0.8)");
        gradient.addColorStop(0.5, "rgba(255, 69, 0, 0.2)");
        gradient.addColorStop(1, "rgba(255, 69, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Solid core
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawOrbit(distance) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
        ctx.stroke();
    }

    function drawPlanet(planet) {
        // Calculate position
        const x = centerX + Math.cos(planet.angle) * planet.distance;
        const y = centerY + Math.sin(planet.angle) * planet.distance;

        // Draw Saturn's ring if applicable
        if (planet.hasRing) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(Math.PI / 4); // Tilt the ring
            ctx.beginPath();
            ctx.ellipse(0, 0, planet.radius * 2.2, planet.radius * 0.8, 0, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();
        }

        // Draw Planet
        ctx.fillStyle = planet.color;
        ctx.beginPath();
        ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
        ctx.fill();

        // Simple shadow effect (darken the side away from sun)
        // We calculate the angle to the sun
        const angleToSun = Math.atan2(centerY - y, centerX - x);
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angleToSun);
        
        // Create a gradient for the shadow
        const shadowGrad = ctx.createRadialGradient(planet.radius * 0.3, 0, 0, 0, 0, planet.radius);
        shadowGrad.addColorStop(0, "rgba(0,0,0,0)");
        shadowGrad.addColorStop(1, "rgba(0,0,0,0.6)");
        
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function animate() {
        // Clear canvas
        ctx.fillStyle = "#050505"; // Very dark blue/black
        ctx.fillRect(0, 0, width, height);

        // Draw background stars
        drawStars();

        // Draw Sun
        drawSun();

        // Draw orbits and planets
        planets.forEach(planet => {
            drawOrbit(planet.distance);
            drawPlanet(planet);
            
            // Update angle
            planet.angle += planet.speed;
        });

        requestAnimationFrame(animate);
    }

    // Initialization
    window.addEventListener('resize', resize);
    resize();
    animate();

</script>
</body>
</html>
