<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const numStars = 1500;
        const numArms = 4;
        const stars = [];

        // Colors for stars (blue-white to red-orange)
        const starColors = [
            { r: 200, g: 220, b: 255 }, // Blue-white
            { r: 255, g: 255, b: 255 }, // White
            { r: 255, g: 240, b: 200 }, // Yellow
            { r: 255, g: 200, b: 150 }, // Orange
            { r: 255, g: 150, b: 100 }  // Red-orange
        ];

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random distance from center (with clustering towards center)
                this.distance = Math.random() * Math.min(width, height) * 0.4 + 20;
                
                // Random angle
                this.angle = Math.random() * Math.PI * 2;
                
                // Orbital speed (faster closer to center)
                this.speed = (0.0005 + Math.random() * 0.001) / (this.distance / 100 + 0.5);
                
                // Star properties
                this.size = Math.random() * 2 + 0.5;
                this.color = starColors[Math.floor(Math.random() * starColors.length)];
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.02 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Spiral arm assignment
                this.arm = Math.floor(Math.random() * numArms);
                this.armOffset = (Math.random() - 0.5) * 0.5; // Spread within arm
            }

            update(time) {
                // Update angle based on speed and time
                this.angle += this.speed * 0.016; // ~60fps
                
                // Calculate position with spiral effect
                const spiralAngle = this.angle + this.arm * (Math.PI * 2 / numArms) + this.armOffset;
                
                // Add some vertical oscillation for 3D effect
                const verticalOffset = Math.sin(this.angle * 2 + this.twinkleOffset) * 5;
                
                // Convert polar to cartesian coordinates
                this.x = centerX + Math.cos(spiralAngle) * this.distance;
                this.y = centerY + Math.sin(spiralAngle) * this.distance * 0.6 + verticalOffset;
                
                // Calculate twinkle factor (0.5 to 1.5)
                this.twinkleFactor = 0.7 + 0.3 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
            }

            draw() {
                const { r, g, b } = this.color;
                const alpha = this.twinkleFactor;
                
                // Draw star with glow effect
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.twinkleFactor, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.fill();
                
                // Add glow for larger stars
                if (this.size > 1.2) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2 * this.twinkleFactor, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`;
                    ctx.fill();
                }
            }
        }

        function createStars() {
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Draw bright core with gradient
            const coreRadius = Math.min(width, height) * 0.08;
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 240, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 240, 200, 0.4)');
            gradient.addColorStop(0.8, 'rgba(255, 200, 150, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 150, 100, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function animate(time) {
            // Clear canvas with slight trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw galaxy core
            drawCore();
            
            // Update and draw stars
            for (const star of stars) {
                star.update(time);
                star.draw();
            }
            
            requestAnimationFrame(animate);
        }

        // Initialize
        resizeCanvas();
        createStars();
        requestAnimationFrame(animate);

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            createStars();
        });
    </script>
</body>
</html>
