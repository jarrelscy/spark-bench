<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let angle = 0;

        // Configuration
        const numNodes = 40;      // Number of pairs in the helix
        const helixRadius = 150;  // Radius of the spiral
        const helixHeight = 600;  // Vertical spread
        const nodeSpacing = 15;   // Vertical distance between nodes
        const rotationSpeed = 0.01;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            // Clear background with a slight fade effect for motion blur
            ctx.fillStyle = 'rgba(5, 5, 5, 1)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw the DNA structure
            for (let i = 0; i < numNodes; i++) {
                // Calculate vertical position
                const y = (centerY - helixHeight / 2) + (i * nodeSpacing);
                
                // Calculate rotation offset for this specific node
                const rotationOffset = i * 0.3;
                const currentAngle = angle + rotationOffset;

                // Calculate X coordinates for the two strands (sinusoidal)
                const x1 = centerX + Math.sin(currentAngle) * helixRadius;
                const x2 = centerX + Math.sin(currentAngle + Math.PI) * helixRadius;

                // Calculate Z-depth effect (scaling size based on X position to simulate 3D)
                const depth1 = (Math.cos(currentAngle) + 1) / 2;
                const depth2 = (Math.cos(currentAngle + Math.PI) + 1) / 2;

                // Draw the connecting rung
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.strokeStyle = `rgba(100, 100, 100, ${0.1 + (depth1 + depth2) / 4})`; // Subtle rungs
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Node 1 (Strand A)
                ctx.beginPath();
                ctx.arc(x1, y, 4 * depth1 + 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(200, 80%, 60%, ${0.3 + depth1 * 0.7})`; // Blueish
                ctx.fill();

                // Draw Node 2 (Strand B)
                ctx.beginPath();
                ctx.arc(x2, y, 4 * depth2 + 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(300, 80%, 60%, ${0.3 + depth2 * 0.7})`; // Pinkish/Purple
                ctx.fill();
            }

            angle += rotationSpeed;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
