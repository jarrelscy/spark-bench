<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 800;
        const spiralArms = 3;
        const coreGlow = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Distance from center
                this.distance = Math.random() * (Math.min(width, height) * 0.45);
                
                // Spiral math: angle = distance * constant + arm offset
                const armAngle = (Math.PI * 2 / spiralArms);
                const armOffset = Math.floor(Math.random() * spiralArms) * armAngle;
                const spiralTightness = 0.005;
                
                this.angle = Math.atan2(0, 1) + (this.distance * spiralTightness) + armOffset;
                
                // Add some randomness to the "width" of the arms
                this.angle += (Math.random() - 0.5) * 0.5;
                
                // Velocity: stars closer to center move faster (Kepler-ish)
                this.speed = (0.002 + Math.random() * 0.005) * (1 - (this.distance / (Math.min(width, height) * 0.5)));
                
                // Color variation: blues, purples, whites
                const colors = [
                    'rgba(173, 216, 230, ', // Light Blue
                    'rgba(230, 190, 255, ', // Lavender
                    'rgba(255, 255, 255, ', // White
                    'rgba(150, 150, 255, '  // Soft Blue
                ];
                this.colorBase = colors[Math.floor(Math.random() * colors.length)];
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                this.angle += this.speed;
                this.twinklePhase += this.twinkleSpeed;
            }

            draw() {
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;
                
                const opacity = 0.5 + Math.sin(this.twinklePhase) * 0.5;
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.colorBase + opacity + ')';
                ctx.fill();
            }
        }

        function createGalaxy() {
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreGlow);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(100, 150, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Clear background
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw core glow
            drawCore();

            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        createGalaxy();
        animate();
    </script>
</body>
</html>
