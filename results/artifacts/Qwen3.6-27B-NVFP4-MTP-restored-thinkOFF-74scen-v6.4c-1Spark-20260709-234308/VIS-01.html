<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* Fallback color */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
    const canvas = document.getElementById('solarCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration for the planets
    // Distances and sizes are artistic, not to scale, for visual balance
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus", color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth", color: "#22A6B3", radius: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars", color: "#FF6B6B", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#F09F59", radius: 18, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn", color: "#F9E79F", radius: 15, distance: 310, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus", color: "#7DE2D6", radius: 10, distance: 380, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4B7BEB", radius: 10, distance: 440, speed: 0.0015, angle: Math.random() * Math.PI * 2 }
    ];

    // Starfield generation
    const stars = [];
    const numStars = 400;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        
        // Regenerate stars on resize to fill screen
        stars.length = 0;
        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Outer Glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 80);
        gradient.addColorStop(0, "rgba(255, 200, 50, 1)");
        gradient.addColorStop(0.4, "rgba(255, 100, 0, 0.5)");
        gradient.addColorStop(1, "rgba(255, 50, 0, 0)");
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
        ctx.fill();

        // Sun Core
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner bright core
        ctx.fillStyle = "#FFF";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawOrbit(distance) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
        ctx.stroke();
    }

    function drawPlanet(planet) {
        // Calculate position
        const x = centerX + Math.cos(planet.angle) * planet.distance;
        const y = centerY + Math.sin(planet.angle) * planet.distance;

        // Draw Orbit Path (only once per frame, but logic is simpler here)
        // Ideally we'd draw all orbits first, but drawing them here works visually too
        
        // Draw Planet Body
        ctx.fillStyle = planet.color;
        ctx.beginPath();
        ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
        ctx.fill();

        // Draw Ring for Saturn
        if (planet.hasRing) {
            ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            // Simple visual trick for ring: draw an ellipse
            ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, 0, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Simple shadow effect (away from sun)
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.beginPath();
        // Shadow is roughly opposite to the sun
        const shadowX = x - (centerX - x) * 0.1; 
        const shadowY = y - (centerY - y) * 0.1;
        // Just darken the side facing away
        ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Re-draw body partially to make it look 3D? 
        // For simplicity, let's just draw a highlight
        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
        ctx.beginPath();
        ctx.arc(x - planet.radius/3, y - planet.radius/3, planet.radius/3, 0, Math.PI * 2);
        ctx.fill();
    }

    function animate() {
        // Clear Canvas
        ctx.fillStyle = "#050505"; // Very dark blue/black
        ctx.fillRect(0, 0, width, height);

        drawStars();

        // Draw Orbits first so they are behind planets
        planets.forEach(p => drawOrbit(p.distance));

        drawSun();

        // Update and Draw Planets
        planets.forEach(planet => {
            planet.angle += planet.speed;
            drawPlanet(planet);
        });

        requestAnimationFrame(animate);
    }

    // Initialization
    window.addEventListener('resize', resize);
    resize();
    animate();

</script>
</body>
</html>
