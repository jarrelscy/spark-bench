<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const planets = [];
        const stars = [];

        // Configuration
        const SUN_RADIUS = 30;
        const COLORS = ['#A5A5A5', '#E3BB76', '#2E7D32', '#FF7043', '#2196F3', '#9C27B0', '#FFD600'];

        function init() {
            resize();
            createStars();
            createPlanets();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createStars() {
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function createPlanets() {
            planets.length = 0;
            // Data: [orbitRadius, speed, size, color]
            const data = [
                [60, 0.04, 4, COLORS[1]],   // Mercury
                [90, 0.015, 7, COLORS[2]],   // Venus
                [130, 0.01, 8, COLORS[3]],   // Earth
                [180, 0.008, 6, COLORS[4]],  // Mars
                [240, 0.006, 12, COLORS[5]], // Jupiter
                [300, 0.004, 10, COLORS[6]]  // Saturn
            ];

            data.forEach((p, index) => {
                planets.push({
                    distance: p[0],
                    speed: p[1],
                    radius: p[2],
                    color: p[3],
                    angle: Math.random() * Math.PI * 2
                });
            });
        }

        function drawSun() {
            const centerX = width / 2;
            const centerY = height / 2;

            // Outer Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, SUN_RADIUS * 0.5, centerX, centerY, SUN_RADIUS * 2.5);
            gradient.addColorStop(0, 'rgba(255, 180, 0, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 100, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, SUN_RADIUS * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, SUN_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            
            // Sun highlight
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(centerX - SUN_RADIUS/3, centerY - SUN_RADIUS/3, SUN_RADIUS/4, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            const centerX = width / 2;
            const centerY = height / 2;

            drawSun();

            // Draw Planets
            planets.forEach(planet => {
                // Update position
                planet.angle += planet.speed;
                
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit Path
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Small highlight on planet
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(x - planet.radius/3, y - planet.radius/3, planet.radius/3, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            createStars();
        });

        init();
    </script>
</body>
</html>
