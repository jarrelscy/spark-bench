<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const stars = [];
        const starCount = 1200;
        
        // Configuration
        const coreColor = 'rgba(255, 255, 200, 0.8)';
        const colors = ['#ffffff', '#fff4e6', '#ffecff', '#e6f7ff', '#fff0cc'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Spiral math parameters
                // Distance from center (radius)
                this.radius = Math.random() * Math.min(width, height) * 0.45;
                // Angle in radians
                this.angle = Math.random() * Math.PI * 2;
                // Spiral arm offset (how many "arms")
                this.armOffset = (Math.random() - 0.5) * 0.8;
                // Speed (inner stars move faster)
                this.speed = (1 / (this.radius + 50)) * 0.5 + 0.1;
                // Size and color
                this.size = Math.random() * 1.5 + 0.2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.opacity = Math.random();
                this.opacityChange = Math.random() * 0.02;
            }

            update() {
                // Rotate the star
                this.angle += this.speed;
                
                // Twinkle effect
                this.opacity += this.opacityChange;
                if (this.opacity > 1 || this.opacity < 0.2) {
                    this.opacityChange *= -1;
                }

                // Position calculation: 
                // Polar to Cartesian coordinates with a spiral twist
                // The formula: angle = base_angle + spiral_factor * radius
                const spiralFactor = 0.002;
                const currentAngle = this.angle + (this.radius * spiralFactor) + this.armOffset;
                
                this.x = width / 2 + Math.cos(currentAngle) * this.radius;
                this.y = height / 2 + Math.sin(currentAngle) * this.radius;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
            }
        }

        // Populate stars
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        function animate() {
            // Create a slight trail effect by not fully clearing
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, 60
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.globalAlpha = 1;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 60, 0, Math.PI * 2);
            ctx.fill();

            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
