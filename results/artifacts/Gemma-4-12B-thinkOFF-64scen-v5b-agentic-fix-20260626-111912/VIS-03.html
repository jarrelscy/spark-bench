<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let animationFrame;

        // Configuration
        const nodeCount = 40;
        const helixRadius = 120;
        const helixPitch = 0.4; // Controls how "stretched" the helix is
        const rotationSpeed = 0.02;
        
        let rotation = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            // Clear screen with a slight trail effect (optional, currently solid)
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw the DNA strands
            // Strand 1 (Blueish)
            // Strand 2 (Reddish)
            
            for (let i = 0; i < nodeCount; i++) {
                // Calculate the vertical position (Y)
                // We distribute nodes along the Y axis
                const y = centerY - (nodeCount * 10 / 2) + (i * 15);
                
                // Calculate the angle for this node
                // The two strands are 180 degrees (PI) apart
                const angle1 = (i * helixPitch) + rotation;
                const angle2 = (i * helixPitch) + rotation + Math.PI;

                // Calculate X positions using Sine and Cosine
                const x1 = centerX + Math.cos(angle1) * helixRadius;
                const x2 = centerX + Math.cos(angle2) * helixRadius;

                // Draw Rungs (horizontal connections)
                // Only draw rungs every few nodes or every node for a dense look
                if (i % 2 === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x1, y);
                    ctx.lineTo(x2, y);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Draw Nodes
                // Strand 1
                ctx.beginPath();
                ctx.arc(x1, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${200 + (i % 10)}, 80%, 60%, 0.8)`;
                ctx.fill();

                // Strand 2
                ctx.beginPath();
                ctx.arc(x2, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${340 + (i % 10)}, 80%, 60%, 0.8)`;
                ctx.fill();
            }

            // Update rotation
            rotation += rotationSpeed;

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
