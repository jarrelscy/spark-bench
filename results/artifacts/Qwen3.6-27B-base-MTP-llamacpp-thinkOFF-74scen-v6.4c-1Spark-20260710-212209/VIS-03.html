<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating DNA Double Helix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510; /* Dark background */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="dnaCanvas"></canvas>

<script>
    const canvas = document.getElementById('dnaCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let rotationAngle = 0;

    // DNA Configuration
    const config = {
        amplitude: 150,      // Width of the helix
        frequency: 0.02,     // How tight the spiral is
        nodeCount: 60,       // Number of rungs/nodes
        nodeSpacing: 12,     // Vertical distance between nodes
        rotationSpeed: 0.02, // Speed of rotation
        depthFactor: 0.5     // Scale factor for depth simulation
    };

    // Colors
    const colors = {
        strand1: { r: 0, g: 255, b: 255 }, // Cyan
        strand2: { r: 255, g: 0, b: 255 }, // Magenta
        rung: { r: 100, g: 100, b: 100 }   // Gray
    };

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    /**
     * Calculates the 3D position of a node on the helix.
     * @param {number} index - The index of the node (0 to nodeCount)
     * @param {number} angleOffset - 0 for strand 1, PI for strand 2
     * @returns {Object} {x, y, z, scale}
     */
    function getNodePosition(index, angleOffset) {
        // Calculate Y position centered on screen
        const totalHeight = config.nodeCount * config.nodeSpacing;
        const y = (index * config.nodeSpacing) - (totalHeight / 2) + (height / 2);

        // Calculate rotation for this specific node based on index to create the spiral shape
        // We add a global rotationAngle to make it spin over time
        const theta = (index * config.frequency) + rotationAngle + angleOffset;

        // X and Z are calculated using sine/cosine to form the circle of the helix
        // X is the horizontal displacement
        // Z represents depth (0 to 1 normalized later for scaling)
        const x = Math.cos(theta) * config.amplitude;
        const z = Math.sin(theta) * config.amplitude;

        // Normalize Z for depth sorting and scaling (Z goes from -amplitude to +amplitude)
        // We map it to a scale factor so nodes in the back look smaller
        const normalizedZ = (z + config.amplitude) / (2 * config.amplitude); // 0 (back) to 1 (front)
        const scale = 1 - (normalizedZ * config.depthFactor);

        return { x, y, z, scale, normalizedZ };
    }

    function draw() {
        // Clear canvas
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, width, height);

        const centerX = width / 2;
        const centerY = height / 2;

        // Store all points to draw them in correct depth order (Painter's Algorithm)
        // We need to draw nodes from furthest (lowest Z) to closest (highest Z)
        const renderQueue = [];

        for (let i = 0; i < config.nodeCount; i++) {
            // Get positions for both strands at this vertical index
            const p1 = getNodePosition(i, 0);
            const p2 = getNodePosition(i, Math.PI);

            // Store the rung (connection)
            renderQueue.push({
                type: 'rung',
                z: (p1.z + p2.z) / 2, // Average Z for sorting
                p1: { x: centerX + p1.x, y: p1.y, scale: p1.scale },
                p2: { x: centerX + p2.x, y: p2.y, scale: p2.scale }
            });

            // Store the nodes (circles)
            renderQueue.push({
                type: 'node',
                strand: 1,
                z: p1.z,
                x: centerX + p1.x,
                y: p1.y,
                scale: p1.scale
            });

            renderQueue.push({
                type: 'node',
                strand: 2,
                z: p2.z,
                x: centerX + p2.x,
                y: p2.y,
                scale: p2.scale
            });
        }

        // Sort the queue by Z depth (ascending)
        renderQueue.sort((a, b) => a.z - b.z);

        // Draw everything in order
        renderQueue.forEach(item => {
            if (item.type === 'rung') {
                drawRung(item);
            } else {
                drawNode(item);
            }
        });

        // Update rotation
        rotationAngle += config.rotationSpeed;

        requestAnimationFrame(draw);
    }

    function drawRung(item) {
        ctx.beginPath();
        ctx.moveTo(item.p1.x, item.p1.y);
        ctx.lineTo(item.p2.x, item.p2.y);
        
        // Calculate opacity based on depth to fade out back rungs
        const alpha = 0.1 + (0.4 * ((item.z + config.amplitude) / (2 * config.amplitude)));
        
        ctx.strokeStyle = `rgba(${colors.rung.r}, ${colors.rung.g}, ${colors.rung.b}, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawNode(item) {
        const radius = 4 * item.scale;
        const alpha = 0.5 + (0.5 * ((item.z + config.amplitude) / (2 * config.amplitude)));

        ctx.beginPath();
        ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
        
        if (item.strand === 1) {
            ctx.fillStyle = `rgba(${colors.strand1.r}, ${colors.strand1.g}, ${colors.strand1.b}, ${alpha})`;
        } else {
            ctx.fillStyle = `rgba(${colors.strand2.r}, ${colors.strand2.g}, ${colors.strand2.b}, ${alpha})`;
        }
        
        ctx.fill();
    }

    // Start animation
    requestAnimationFrame(draw);

</script>
</body>
</html>
