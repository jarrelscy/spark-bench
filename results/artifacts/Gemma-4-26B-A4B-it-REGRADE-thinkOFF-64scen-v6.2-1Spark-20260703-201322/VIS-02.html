<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 800;
        const spiralArms = 3;
        const rotationSpeed = 0.002;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center
                this.distance = Math.random() * (Math.min(width, height) / 2.5);
                
                // Angle for spiral math
                // We use a logarithmic spiral formula: r = a * e^(b * theta)
                // Or more simply for visual effect: angle = distance * factor
                this.angle = Math.random() * Math.PI * 2;
                this.armOffset = (Math.random() * (Math.PI * 2 / spiralArms));
                
                // Color variation (Blues, purples, whites)
                const hue = Math.random() * 60 + 200; // 200-260 range (Blues/Purples)
                this.color = `hsla(${hue}, ${Math.random() * 50 + 50}%, ${Math.random() * 50 + 50}%,`;
                
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.opacity = Math.random();
                this.twinkleDir = 1;
            }

            update() {
                // Rotation
                this.angle += rotationSpeed;
                
                // Twinkle effect
                this.opacity += this.twinkleSpeed * this.twinkleDir;
                if (this.opacity >= 1 || this.opacity <= 0.2) {
                    this.twinkleDir *= -1;
                }
            }

            draw() {
                // Spiral math: position shifts based on distance to create the arm effect
                const spiralFactor = 0.005; 
                const currentAngle = this.angle + (this.distance * spiralFactor);
                
                const x = centerX + Math.cos(currentAngle) * this.distance;
                const y = centerY + Math.sin(currentAngle) * this.distance;

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `${this.color}${this.opacity})`;
                ctx.fill();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Central glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 200, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Clear background
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Draw core glow on top of stars to make it look like a center
            drawCore();

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
    </script>
</body>
</html>
