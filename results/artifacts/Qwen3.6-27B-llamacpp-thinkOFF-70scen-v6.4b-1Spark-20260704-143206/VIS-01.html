<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Starfield array
        const stars = [];
        const numStars = 200;

        // Planet Configuration
        // Distances and sizes are stylized for visual fit, not astronomical accuracy
        const planets = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60,  speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90,  speed: 0.025, angle: Math.random() * Math.PI * 2 },
            { name: "Earth",   color: "#22A6F2", radius: 7.5, distance: 130, speed: 0.02,  angle: Math.random() * Math.PI * 2 },
            { name: "Mars",    color: "#DF4832", radius: 5, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D6A566", radius: 18, distance: 240, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn",  color: "#F2D399", radius: 15, distance: 320, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus",  color: "#93B8BE", radius: 10, distance: 400, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#4b70dd", radius: 10, distance: 480, speed: 0.003, angle: Math.random() * Math.PI * 2 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        function generateStars() {
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Outer Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = "#FFD700";
            
            // Sun Body
            const sunRadius = 30;
            const gradient = ctx.createRadialGradient(0, 0, sunRadius * 0.2, 0, 0, sunRadius);
            gradient.addColorStop(0, "#FFFFA0");
            gradient.addColorStop(0.5, "#FFD700");
            gradient.addColorStop(1, "#FF8C00");
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function drawOrbit(distance) {
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
            ctx.lineWidth = 1;
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            // Update Angle
            planet.angle += planet.speed;

            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path
            drawOrbit(planet.distance);

            ctx.save();
            ctx.translate(x, y);

            // Saturn's Ring (draw behind planet if needed, but simple 2D here)
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                ctx.ellipse(0, 0, planet.radius * 2.2, planet.radius * 0.8, Math.PI / 8, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Planet Body
            ctx.beginPath();
            ctx.fillStyle = planet.color;
            ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Simple shading (shadow on the side away from sun)
            // Calculate angle to sun
            const angleToSun = Math.atan2(centerY - y, centerX - x);
            
            ctx.fillStyle = "rgba(0,0,0,0.4)";
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius, angleToSun - Math.PI/2, angleToSun + Math.PI/2);
            ctx.fill();

            ctx.restore();
        }

        function animate() {
            // Clear Canvas
            ctx.fillStyle = "#050510"; // Deep space dark blue/black
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();

            planets.forEach(drawPlanet);

            requestAnimationFrame(animate);
        }

        // Initialization
        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
