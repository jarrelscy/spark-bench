<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const numStars = 1200; // Number of stars in the galaxy

        // Configuration
        const config = {
            arms: 3, // Number of spiral arms
            armSpread: 0.8, // How tight the spiral is
            coreRadius: 60,
            galaxyRadius: 300,
            rotationSpeed: 0.0005, // Base rotation speed
            coreGlowColor: '#fff',
            coreGlowSize: 150
        };

        // Resize canvas to fit window
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }

        // Star Class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Randomly assign to one of the spiral arms
                const armIndex = Math.floor(Math.random() * config.arms);
                
                // Distance from center (Gaussian-like distribution for density)
                // We use Math.random() * Math.random() to bias towards center slightly, 
                // then scale to galaxy radius
                const rand = Math.random();
                const dist = rand * config.galaxyRadius;

                // Calculate angle based on distance to create spiral shape
                // The further out, the more the angle wraps around
                const angleOffset = (dist / config.galaxyRadius) * Math.PI * 4 * config.armSpread;
                
                // Base angle for this arm (0, 120, 240 degrees)
                const armAngle = (armIndex * 2 * Math.PI) / config.arms;

                // Add some randomness to scatter stars around the arm
                const scatter = (Math.random() - 0.5) * (Math.PI / 3) * (1 - dist/config.galaxyRadius);

                this.angle = armAngle + angleOffset + scatter;
                this.dist = dist;
                
                // Rotation speed: closer stars move faster (Keplerian-ish logic)
                // We add some variance to individual stars
                this.speed = (config.rotationSpeed * (1000 / (dist + 50))) * (0.8 + Math.random() * 0.4);

                // Size
                this.size = Math.random() * 1.5 + 0.5;

                // Color
                // Core stars are warm (white/yellow), outer stars are cool (blue/purple)
                const hueBase = 200 + (Math.random() * 60); // Blue to Purple
                const isCore = dist < config.coreRadius;
                if (isCore) {
                    this.hue = 40 + Math.random() * 20; // Yellow/White
                    this.saturation = 20;
                    this.lightness = 90;
                } else {
                    this.hue = hueBase;
                    this.saturation = 50 + Math.random() * 50;
                    this.lightness = 50 + Math.random() * 40;
                }

                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            update() {
                // Update angle
                this.angle += this.speed;
                
                // Update twinkle phase
                this.twinklePhase += this.twinkleSpeed;
            }

            draw(ctx, centerX, centerY) {
                // Convert polar to cartesian
                const x = centerX + Math.cos(this.angle) * this.dist;
                const y = centerY + Math.sin(this.angle) * this.dist;

                // Calculate opacity based on twinkle
                const opacity = 0.5 + 0.5 * Math.sin(this.twinklePhase);

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${opacity})`;
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function drawCore(ctx, centerX, centerY) {
            // Draw the bright central core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, config.coreGlowSize);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 240, 200, 0.8)');
            gradient.addColorStop(0.4, 'rgba(200, 150, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, config.coreGlowSize, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Clear canvas with a slight fade effect for motion blur (optional, strictly clearing here for crispness)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw the core glow
            drawCore(ctx, centerX, centerY);

            // Update and draw stars
            for (const star of stars) {
                star.update();
                star.draw(ctx, centerX, centerY);
            }

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
