<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;
const stars = [];
const NUM_STARS = 900;
const NUM_ARMS = 4;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

function randomColor() {
  const palette = [
    [255, 255, 255],
    [255, 255, 220],
    [220, 230, 255],
    [255, 230, 200],
    [200, 255, 255],
    [255, 210, 180]
  ];
  return palette[Math.floor(Math.random() * palette.length)];
}

function initStars() {
  stars.length = 0;
  const maxR = Math.min(W, H) * 0.42;
  const perArm = Math.floor(NUM_STARS / NUM_ARMS);
  for (let arm = 0; arm < NUM_ARMS; arm++) {
    for (let i = 0; i < perArm; i++) {
      const t = i / perArm;
      let r = t * maxR;
      let theta = t * Math.PI * 5 + (arm * Math.PI * 2 / NUM_ARMS);
      // arm thickness / noise
      r += (Math.random() - 0.5) * (12 + t * 40);
      theta += (Math.random() - 0.5) * 0.45;
      // some scattered disk stars
      if (Math.random() < 0.18) {
        r = Math.pow(Math.random(), 0.7) * maxR;
        theta = Math.random() * Math.PI * 2;
      }
      r = Math.max(3, r);
      stars.push({
        r,
        theta,
        speed: (0.008 + Math.random() * 0.004) / (1 + r * 0.008),
        size: 0.4 + Math.random() * 1.6 + (Math.random() < 0.08 ? 1.2 : 0),
        color: randomColor(),
        phase: Math.random() * Math.PI * 2,
        twinkle: 0.03 + Math.random() * 0.04
      });
    }
  }
}
initStars();

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // bright core with soft glow
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 90);
  g.addColorStop(0, 'rgba(255,255,245,1)');
  g.addColorStop(0.08, 'rgba(255,245,210,0.95)');
  g.addColorStop(0.25, 'rgba(255,200,120,0.45)');
  g.addColorStop(0.55, 'rgba(255,140,60,0.12)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(CX, CY, 90, 0, Math.PI * 2);
  ctx.fill();

  // tiny hot center
  const g2 = ctx.createRadialGradient(CX, CY, 0, CX, CY, 12);
  g2.addColorStop(0, 'rgba(255,255,255,1)');
  g2.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = g2;
  ctx.beginPath();
  ctx.arc(CX, CY, 12, 0, Math.PI * 2);
  ctx.fill();

  // stars
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.theta += s.speed;
    s.phase += s.twinkle;
    const x = CX + Math.cos(s.theta) * s.r;
    const y = CY + Math.sin(s.theta) * s.r;
    const alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(x, y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${alpha})`;
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
