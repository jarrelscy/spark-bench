<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let phase = 0;

        // Configuration
        const nodesCount = 40;      // Number of points per strand
        const helixRadius = 80;     // Width of the spiral
        const helixHeight = 600;    // Total vertical span
        const nodeRadius = 4;       // Size of the spheres
        const rotationSpeed = 0.02; // Speed of rotation

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            const centerX = width / 2;
            const centerY = height / 2;
            
            // We store points to draw rungs after calculating positions
            const points1 = [];
            const points2 = [];

            for (let i = 0; i < nodesCount; i++) {
                // Vertical spacing
                const y = centerY - (helixHeight / 2) + (i * (helixHeight / (nodesCount - 1)));
                
                // Calculate rotation for each point (offset by i to create the spiral)
                const angle = phase + (i * 0.3);
                
                // Strand 1: Sin/Cos for X and Z (simulated depth)
                const x1 = centerX + Math.cos(angle) * helixRadius;
                const z1 = Math.sin(angle); // Used for depth sorting/scaling

                // Strand 2: Opposite phase (angle + PI)
                const x2 = centerX + Math.cos(angle + Math.PI) * helixRadius;
                const z2 = Math.sin(angle + Math.PI);

                points1.push({ x: x1, y: y, z: z1 });
                points2.push({ x: x2, y: y, z: z2 });
            }

            // Draw Rungs first (so they appear behind the nodes)
            for (let i = 0; i < nodesCount; i++) {
                const p1 = points1[i];
                const p2 = points2[i];
                
                // Only draw rung if it's not too "deep" (simple depth cue)
                const opacity = (p1.z + p2.z + 2) / 4; // Average depth
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(100, 100, 100, ${0.2 + (p1.z + 1) * 0.3})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Draw Nodes
            for (let i = 0; i < nodesCount; i++) {
                const p1 = points1[i];
                const p2 = points2[i];

                // Strand 1 - Cyan/Blue
                drawNode(p1.x, p1.y, p1.z, '#4da6ff');
                // Strand 2 - Magenta/Purple
                drawNode(p2.x, p2.y, p2.z, '#ff4da6');
            }

            phase += rotationSpeed;
            requestAnimationFrame(draw);
        }

        function drawNode(x, y, z, color) {
            // Depth effect: scale size and color brightness based on Z
            const scale = (z + 2) / 2; // range 0.5 to 1.5
            const size = nodeRadius * scale;
            
            // Fade color based on depth
            ctx.globalAlpha = 0.4 + (scale * 0.3);
            
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            // Add a small highlight for a 3D sphere effect
            ctx.beginPath();
            ctx.arc(x - size/3, y - size/3, size/4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fill();
            
            ctx.globalAlpha = 1.0;
        }

        draw();
    </script>
</body>
</html>
