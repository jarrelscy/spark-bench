<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Starfield
        const stars = [];
        const numStars = 300;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                brightness: Math.random()
            });
        }

        // Planet data
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 50, speed: 0.02, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 7, orbitRadius: 80, speed: 0.015, color: '#FFC649', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 8, orbitRadius: 120, speed: 0.012, color: '#4B9CD3', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 160, speed: 0.01, color: '#E55342', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 15, orbitRadius: 220, speed: 0.006, color: '#D4A574', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 12, orbitRadius: 280, speed: 0.004, color: '#F4D03F', angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        // Draw stars
        function drawStars() {
            stars.forEach(star => {
                const flicker = 0.5 + Math.sin(Date.now() * 0.001 + star.brightness * 100) * 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness * flicker})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Draw Sun
        function drawSun() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Sun glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 40);
            gradient.addColorStop(0, '#FFF700');
            gradient.addColorStop(0.3, '#FF8C00');
            gradient.addColorStop(0.7, 'rgba(255, 140, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Sun core
            ctx.fillStyle = '#FFF700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw orbit path
        function drawOrbit(orbitRadius) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Draw planet
        function drawPlanet(planet) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;
            
            // Planet glow
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, planet.radius * 2);
            gradient.addColorStop(0, planet.color);
            gradient.addColorStop(0.7, planet.color + '80');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Planet body
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Saturn's rings
            if (planet.hasRings) {
                ctx.strokeStyle = 'rgba(244, 208, 63, 0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Planet name
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 15);
        }

        // Update planet positions
        function updatePlanets() {
            planets.forEach(planet => {
                planet.angle += planet.speed;
            });
        }

        // Animation loop
        function animate() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            drawStars();
            
            // Draw orbits
            planets.forEach(planet => {
                drawOrbit(planet.orbitRadius);
            });
            
            // Draw Sun
            drawSun();
            
            // Update and draw planets
            updatePlanets();
            planets.forEach(planet => {
                drawPlanet(planet);
            });
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
