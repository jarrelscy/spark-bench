<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const planets = [];
        const stars = [];

        // Configuration
        const SUN_SIZE = 40;
        const COLORS = ['#A5A5A5', '#E3BB76', '#2E7D32', '#FF7043', '#2962FF', '#9C27B0', '#F44336'];

        function init() {
            resize();
            createStars();
            createPlanets();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createStars() {
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function createPlanets() {
            planets.length = 0;
            // Data: [distance, radius, speed, color, name]
            const data = [
                [60, 4, 0.04, COLORS[0]],
                [90, 7, 0.015, COLORS[1]],
                [130, 10, 0.01, COLORS[2]],
                [180, 12, 0.008, COLORS[3]],
                [240, 15, 0.006, COLORS[4]],
                [310, 18, 0.004, COLORS[5]]
            ];

            data.forEach((item, index) => {
                planets.push({
                    distance: item[0],
                    radius: item[1],
                    speed: item[2],
                    color: item[3],
                    angle: Math.random() * Math.PI * 2
                });
            });
        }

        function drawSun() {
            const centerX = width / 2;
            const centerY = height / 2;

            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, SUN_SIZE * 2.5);
            gradient.addColorStop(0, 'rgba(255, 200, 0, 0.8)');
            gradient.addColorStop(0.4, 'rgba(255, 100, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, SUN_SIZE * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Core
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, SUN_SIZE, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            const centerX = width / 2;
            const centerY = height / 2;

            drawSun();

            // Draw Planets
            planets.forEach(p => {
                // Update position
                p.angle += p.speed;
                const x = centerX + Math.cos(p.angle) * p.distance;
                const y = centerY + Math.sin(p.angle) * p.distance;

                // Draw Orbit Path
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, p.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Add a small highlight/shine
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(x - p.radius/3, y - p.radius/3, p.radius/3, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            createStars();
        });

        init();
    </script>
</body>
</html>
