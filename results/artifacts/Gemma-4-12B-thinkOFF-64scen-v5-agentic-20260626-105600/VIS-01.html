<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Starfield generation
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }

        // Planet data: [orbitRadius, orbitSpeed, size, color]
        const planets = [
            { name: "Mercury", dist: 60, speed: 0.04, size: 4, color: "#A5A5A5" },
            { name: "Venus", dist: 90, speed: 0.015, size: 8, color: "#E3BB76" },
            { name: "Earth", dist: 130, speed: 0.01, size: 9, color: "#2271B3" },
            { name: "Mars", dist: 170, speed: 0.008, size: 7, color: "#E27B58" },
            { name: "Jupiter", dist: 230, speed: 0.004, size: 18, color: "#D39C7E" },
            { name: "Saturn", dist: 300, speed: 0.002, size: 15, color: "#C5AB6E" }
        ];

        // Track current angles
        planets.forEach(p => p.angle = Math.random() * Math.PI * 2);

        function draw() {
            // Clear background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw Stars
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.globalAlpha = s.opacity;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Sun with glow
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, 35);
            sunGradient.addColorStop(0, "#FFF5F2");
            sunGradient.addColorStop(0.2, "#FFD200");
            sunGradient.addColorStop(0.5, "#F7941D");
            sunGradient.addColorStop(1, "transparent");

            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fill();

            // Draw Planets
            planets.forEach(p => {
                // Update position
                p.angle += p.speed;
                const x = centerX + Math.cos(p.angle) * p.dist;
                const y = centerY + Math.sin(p.angle) * p.dist;

                // Draw Orbit Path
                ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
                ctx.beginPath();
                ctx.arc(centerX, centerY, p.dist, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();

                // Add a small highlight/shine to planet
                ctx.fillStyle = "rgba(255,255,255,0.3)";
                ctx.beginPath();
                ctx.arc(x - p.size*0.3, y - p.size*0.3, p.size/3, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
