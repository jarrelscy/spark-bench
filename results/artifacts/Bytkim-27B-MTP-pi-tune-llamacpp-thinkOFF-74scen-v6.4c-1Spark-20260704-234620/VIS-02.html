<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 1500;
        
        // Galaxy configuration
        const arms = 3;
        const armSpread = 0.8; // How wide the arms are
        const rotationSpeed = 0.0002;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center (logarithmic distribution for density)
                this.distance = Math.random() < 0.1 ? Math.random() * 50 : Math.pow(Math.random(), 2) * 300;
                
                // Angle determines the spiral shape
                const angleOffset = (Math.random() - 0.5) * armSpread;
                this.angle = (this.distance / 400) * arms * Math.PI + angleOffset;
                
                // Randomize starting rotation for some depth variation
                this.rotationSpeed = rotationSpeed * (1 / (this.distance * 0.02 + 1));
                
                // Color variation: Core is yellow/white, outer is blue/purple
                const hue = 360 - ((this.distance / 300) * 180); 
                const saturation = Math.random() < 0.2 ? 0 : Math.floor(Math.random() * 40 + 20);
                const lightness = Math.floor(Math.random() * 50 + 50);
                
                this.color = `hsla(${hue}, ${saturation}%, ${lightness}%,`;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Twinkle properties
                this.alpha = Math.random();
                this.alphaSpeed = Math.random() * 0.02 + 0.005;
            }

            update() {
                this.angle += this.rotationSpeed;
                
                // Twinkle effect
                this.alpha += this.alphaSpeed;
                if (this.alpha > 1 || this.alpha < 0.2) {
                    this.alphaSpeed *= -1;
                }
            }

            draw(ctx) {
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;
                
                ctx.fillStyle = `${this.color} ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function drawCoreGlow() {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 120);
            gradient.addColorStop(0, 'rgba(255, 240, 200, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 230, 180, 0.3)');
            gradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 120, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Fade effect for trails (optional, but set to 0 here for crisp stars)
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            drawCoreGlow();

            stars.forEach(star => {
                star.update();
                star.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
    </script>
</body>
</html>
