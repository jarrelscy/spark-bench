<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating DNA Double Helix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510; /* Dark background */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            display: block;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        /* Subtle vignette effect */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 50%, #000000 100%);
        }
    </style>
</head>
<body>

<div class="vignette"></div>
<canvas id="dnaCanvas"></canvas>

<script>
    const canvas = document.getElementById('dnaCanvas');
    const ctx = canvas.getContext('2d');

    // Configuration
    const config = {
        strandRadius: 100,     // Width of the helix
        nodeSpacing: 8,        // Distance between nodes along the Y axis
        rotationSpeed: 0.03,   // Speed of the spiral rotation
        verticalSpeed: 0.5,    // Speed at which DNA moves down screen
        colors: {
            strand1: '#4facfe', // Cyan/Blue
            strand2: '#ff6a00', // Orange/Pink
            rung: 'rgba(255, 255, 255, 0.15)',
            node1: '#00f2fe',
            node2: '#ff9a44'
        }
    };

    let width, height;
    let rotationAngle = 0;
    let verticalOffset = 0;

    // Resize canvas to fill window
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    window.addEventListener('resize', resize);
    resize();

    /**
     * Calculates the 3D coordinates of a node on the helix.
     * @param {number} y - The vertical position.
     * @param {number} phaseOffset - 0 for strand 1, PI for strand 2.
     * @returns {{x: number, y: number, z: number}}
     */
    function getNodePosition(y, phaseOffset) {
        const angle = rotationAngle + (y / config.strandRadius);
        
        // Calculate position on the circle
        const x = Math.sin(angle + phaseOffset) * config.strandRadius;
        const z = Math.cos(angle + phaseOffset) * config.strandRadius;

        return { x, y, z };
    }

    /**
     * Projects a 3D point to 2D canvas coordinates.
     * We use perspective projection: size depends on depth (z).
     */
    function project(point) {
        const focalLength = 800; // Controls perspective intensity
        const scale = focalLength / (focalLength - point.z);
        
        return {
            x: width / 2 + point.x * scale,
            y: height / 2 + point.y * scale,
            scale: scale
        };
    }

    /**
     * Draws a connecting rung between two projected points.
     */
    function drawRung(p1, p2) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        
        // Rungs get smaller/fainter if they are further back
        const averageScale = (p1.scale + p2.scale) / 2;
        const opacity = Math.max(0.05, Math.min(0.3, averageScale * 0.15));
        
        ctx.strokeStyle = config.colors.rung.replace('0.15', opacity);
        ctx.lineWidth = 1 * averageScale;
        ctx.stroke();
    }

    /**
     * Draws a node (circle) at the projected position.
     */
    function drawNode(projectedPoint, color, zIndex) {
        const radius = 4 * projectedPoint.scale;
        
        // Only draw if within reasonable screen bounds to prevent overflow issues
        if (projectedPoint.y < -100 || projectedPoint.y > height + 100) return;

        ctx.beginPath();
        ctx.arc(projectedPoint.x, projectedPoint.y, radius, 0, Math.PI * 2);
        
        // Add a slight glow/shadow effect based on depth
        ctx.shadowBlur = 10 * projectedPoint.scale;
        ctx.shadowColor = color;
        ctx.fillStyle = color;
        ctx.fill();
        
        // Reset shadow for other drawing operations
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';
    }

    /**
     * Draws a line segment connecting two nodes.
     */
    function drawStrandSegment(p1, p2, color) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        
        const avgScale = (p1.scale + p2.scale) / 2;
        ctx.lineWidth = 6 * avgScale;
        ctx.lineCap = 'round';
        ctx.strokeStyle = color;
        
        // Simple depth cueing: lines in back are slightly transparent
        if (avgScale < 0.8) {
            ctx.globalAlpha = 0.5;
        } else {
            ctx.globalAlpha = 1.0;
        }
        
        ctx.stroke();
        ctx.globalAlpha = 1.0;
    }

    function draw() {
        // Clear screen with a slight trail effect for smoothness (optional, here just clear)
        ctx.clearRect(0, 0, width, height);

        // Calculate how many nodes we need to cover the screen plus some buffer
        const totalNodes = Math.ceil(height / config.nodeSpacing) + 20;
        
        // Prepare drawing data
        const drawList = [];

        for (let i = 0; i < totalNodes; i++) {
            // Calculate Y position relative to center, moving downwards
            let y = -height/2 + (i * config.nodeSpacing) + verticalOffset;
            
            // Wrap the vertical movement so it loops seamlessly
            const fullHeight = height + 100; 
            if (y > height/2 + 50) {
                y -= fullHeight;
            }

            const node1 = getNodePosition(y, 0);
            const node2 = getNodePosition(y, Math.PI);

            const p1 = project(node1);
            const p2 = project(node2);

            // Add items to the draw list. 
            // We include Z-depth to sort them later for correct rendering order (Painter's Algorithm).
            drawList.push({ type: 'node', point: p1, z: node1.z, color: config.colors.node1 });
            drawList.push({ type: 'node', point: p2, z: node2.z, color: config.colors.node2 });
            
            // Add rung
            drawList.push({ type: 'rung', points: [p1, p2], z: (node1.z + node2.z) / 2 });

            // If not the first node, add strand segments connecting to previous nodes
            if (i > 0) {
                let prevY = y - config.nodeSpacing;
                if (y < -height/2 && prevY > height/2) prevY += fullHeight; // Handle wrap-around logic for drawing

                const prevNode1 = getNodePosition(prevY, 0);
                const prevNode2 = getNodePosition(prevY, Math.PI);
                
                const pp1 = project(prevNode1);
                const pp2 = project(prevNode2);

                drawList.push({ type: 'line', points: [pp1, p1], z: (node1.z + prevNode1.z)/2, color: config.colors.strand1 });
                drawList.push({ type: 'line', points: [pp2, p2], z: (node2.z + prevNode2.z)/2, color: config.colors.strand2 });
            }
        }

        // Sort by Z depth. 
        // Negative Z is "back", Positive Z is "front".
        // We want to draw back items first.
        drawList.sort((a, b) => a.z - b.z);

        // Execute drawing commands in sorted order
        for (const item of drawList) {
            if (item.type === 'node') {
                drawNode(item.point, item.color);
            } else if (item.type === 'rung') {
                drawRung(item.points[0], item.points[1]);
            } else if (item.type === 'line') {
                drawStrandSegment(item.points[0], item.points[1], item.color);
            }
        }

        // Update animation state
        rotationAngle += config.rotationSpeed;
        verticalOffset = (verticalOffset + config.verticalSpeed) % config.nodeSpacing;

        requestAnimationFrame(draw);
    }

    // Start animation loop
    requestAnimationFrame(draw);

</script>
</body>
</html>
