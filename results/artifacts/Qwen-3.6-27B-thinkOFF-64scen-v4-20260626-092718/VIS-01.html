<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration for the Solar System
    const starCount = 400;
    let stars = [];

    // Planet Configuration
    // Distances and sizes are stylized for visual clarity, not 1:1 realism
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6B3", radius: 7.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#EB4D4B", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#F0932B", radius: 18, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#F6E58D", radius: 15, distance: 320, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#7ED6DF", radius: 10, distance: 390, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4834D4", radius: 10, distance: 450, speed: 0.001, angle: Math.random() * Math.PI * 2 }
    ];

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    function generateStars() {
        stars = [];
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Sun Glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
        gradient.addColorStop(0, "rgba(255, 255, 0, 1)");
        gradient.addColorStop(0.2, "rgba(255, 165, 0, 0.8)");
        gradient.addColorStop(0.5, "rgba(255, 69, 0, 0.2)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Sun Core
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawOrbits() {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        planets.forEach(planet => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    function drawPlanets() {
        planets.forEach(planet => {
            // Update Angle
            planet.angle += planet.speed;

            // Calculate Position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Saturn's Ring
            if (planet.hasRing) {
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Ellipse logic for the ring
                ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.7, planet.angle + Math.PI/4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });
    }

    function animate() {
        // Clear Canvas
        ctx.clearRect(0, 0, width, height);

        // Background
        ctx.fillStyle = "#050505"; // Very dark grey/black
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawOrbits();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);

    // Initialization
    resize();
    animate();

</script>

</body>
</html>
