<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Resize canvas to fill screen
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Starfield Data
        const stars = [];
        const starCount = 400;

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    twinkleSpeed: 0.02 + Math.random() * 0.05
                });
            }
        }

        // Planet Data
        // Distances and sizes are scaled for visual aesthetics, not astronomical accuracy
        const planets = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus", color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
            { name: "Earth", color: "#22A6F2", radius: 7, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
            { name: "Mars", color: "#DD4C22", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D9A066", radius: 18, distance: 230, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", color: "#EAD6B8", radius: 15, distance: 290, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus", color: "#D1F3F8", radius: 10, distance: 340, speed: 0.002, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#5B5DDF", radius: 10, distance: 390, speed: 0.001, angle: Math.random() * Math.PI * 2 }
        ];

        // Initialize stars
        initStars();

        // Animation Loop
        function animate() {
            // Clear canvas
            ctx.fillStyle = '#050505'; // Very dark background, not pure black for depth
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            drawStars();

            // Draw Sun
            drawSun();

            // Draw Planets
            drawPlanets();

            requestAnimationFrame(animate);
        }

        function drawStars() {
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();

                // Twinkle effect
                star.opacity += star.twinkleSpeed;
                if (star.opacity > 1 || star.opacity < 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
            }
        }

        function drawSun() {
            const sunRadius = 30;

            // Outer Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.5, centerX, centerY, sunRadius * 4);
            gradient.addColorStop(0, 'rgba(255, 230, 0, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 160, 0, 0.6)');
            gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius * 4, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Sun Body
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#FF4500';
            ctx.fill();
            
            // Reset shadow for other elements
            ctx.shadowBlur = 0;
        }

        function drawPlanets() {
            planets.forEach(planet => {
                // Update angle
                planet.angle += planet.speed;

                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit Path (faint line)
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Draw Planet
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                
                // Add a slight shadow to the planet for 3D effect
                ctx.shadowBlur = 5;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw Saturn's Ring
                if (planet.hasRing) {
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI / 4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        // Start animation
        animate();

    </script>
</body>
</html>
