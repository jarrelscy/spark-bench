<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration
        const CONFIG = {
            starCount: 2500,
            coreSize: 150,
            armCount: 3,
            armWidth: 60, // How wide the arms are
            spiralTightness: 0.003, // Lower is tighter
            rotationSpeed: 0.0005, // Base speed
            starColorBase: 200, // Hue base (blue-ish)
            starColorRange: 60, // Variation in hue
            coreColor: '#ffe6cc', // Warm white/yellow
            coreGlow: '#ffaa00'
        };

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center (0 to width/2)
                this.distance = Math.random() * (Math.min(width, height) / 2);
                
                // Calculate base angle based on distance to form spiral
                // The further out, the more the angle shifts to create the spiral
                const spiralAngle = this.distance * CONFIG.spiralTightness;
                
                // Pick one of the arms
                const armIndex = Math.floor(Math.random() * CONFIG.armCount);
                const armAngle = (Math.PI * 2 / CONFIG.armCount) * armIndex;
                
                // Add randomness to the angle to give the arm width (scatter)
                const scatter = (Math.random() - 0.5) * (CONFIG.armWidth / 100);
                
                this.angle = armAngle + spiralAngle + scatter;
                
                // Size
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color (Hue, Saturation, Lightness)
                // Stars closer to center are warmer (lower hue), outer are bluer (higher hue)
                const hue = CONFIG.starColorBase - (this.distance / (Math.min(width, height)/2)) * CONFIG.starColorRange;
                const sat = 50 + Math.random() * 50;
                const light = 60 + Math.random() * 40;
                this.color = `hsl(${hue}, ${sat}%, ${light}%)`;
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = 0.5 + Math.random() * 0.5;
                
                // Orbital speed: closer stars move faster (Keplerian-ish approximation)
                // We clamp the speed so outer stars aren't too slow
                this.orbitSpeed = (CONFIG.rotationSpeed * (1000 / (this.distance + 100)));
            }

            update(time) {
                // Update angle
                this.angle += this.orbitSpeed;
                
                // Calculate position
                this.x = centerX + Math.cos(this.angle) * this.distance;
                this.y = centerY + Math.sin(this.angle) * this.distance;
                
                // Calculate twinkle
                this.alpha = this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.3;
                if (this.alpha < 0.1) this.alpha = 0.1; // Don't disappear completely
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let stars = [];

        function init() {
            resize();
            stars = [];
            for (let i = 0; i < CONFIG.starCount; i++) {
                stars.push(new Star());
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        function drawCore() {
            // Draw the bright center
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CONFIG.coreSize);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(0.2, CONFIG.coreColor);
            gradient.addColorStop(0.5, CONFIG.coreGlow);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CONFIG.coreSize, 0, Math.PI * 2);
            ctx.fill();
        }

        let time = 0;

        function animate() {
            // Clear canvas with a slight fade effect for trails (optional, but looks nice)
            // Using solid black for crisp stars
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            time++;

            // Draw Core
            drawCore();

            // Update and Draw Stars
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for glowing effect
            stars.forEach(star => {
                star.update(time);
                star.draw();
            });
            ctx.globalCompositeOperation = 'source-over'; // Reset blending

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            // Re-initialize stars so they fit the new dimensions
            init();
        });

        init();
        animate();

    </script>
</body>
</html>
