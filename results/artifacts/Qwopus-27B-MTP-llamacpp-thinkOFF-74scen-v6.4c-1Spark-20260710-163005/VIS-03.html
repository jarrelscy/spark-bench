<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Double Helix</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0a0a1a;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
overflow: hidden;
}
canvas {
display: block;
border-radius: 8px;
}
</style>
</head>
<body>
<canvas id="dna"></canvas>
<script>
const canvas = document.getElementById('dna');
const ctx = canvas.getContext('2d');

const W = canvas.width = 800;
const H = canvas.height = 600;

const NUM_NODES = 60;
const AMPLITUDE = 140;
const VERTICAL_SPACING = H / NUM_NODES;
const ROTATION_SPEED = 0.015;
const RUNG_COLOR = 'rgba(255, 255, 255, 0.35)';
const NODE_RADIUS = 4;
const NODE_RADIUS_BG = 18;

let rotation = 0;

// Color definitions for the two strands
const strandA = {
    core: '#ff6b6b',
    glow: '#ff4757',
    highlight: '#ff8a80',
    shadow: '#c0392b'
};

const strandB = {
    core: '#4ecdc4',
    glow: '#2ed8a3',
    highlight: '#6ee7b7',
    shadow: '#1a9e7a'
};

// Base pair colors for rungs
const baseColors = [
    'rgba(147, 112, 219, 0.5)',  // purple
    'rgba(255, 165, 0, 0.5)',    // orange
    'rgba(0, 206, 209, 0.5)',    // dark turquoise
    'rgba(255, 105, 180, 0.5)',  // hot pink
];

function getNodePosition(nodeIndex, rotationOffset, strand) {
    const y = nodeIndex * VERTICAL_SPACING + (VERTICAL_SPACING / 2);
    const phase = (nodeIndex * Math.PI * 2) / 12;
    const angle = phase + rotationOffset + (strand === 'B' ? Math.PI : 0);
    const x = W / 2 + Math.sin(angle) * AMPLITUDE;
    const z = Math.cos(angle); // depth value for 3D effect
    return { x, y, z };
}

function drawBackground() {
    // Dark gradient background
    const gradient = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W / 1.5);
    gradient.addColorStop(0, '#111133');
    gradient.addColorStop(0.5, '#0d0d22');
    gradient.addColorStop(1, '#050510');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    // Subtle center glow
    const centerGlow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 250);
    centerGlow.addColorStop(0, 'rgba(100, 100, 200, 0.08)');
    centerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = centerGlow;
    ctx.fillRect(0, 0, W, H);
}

function drawGlow(x, y, radius, color, alpha) {
    const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
    glow.addColorStop(0, color.replace(')', `, ${alpha})`).replace('rgb', 'rgba'));
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
}

function drawNode(x, y, z, strand) {
    const colors = strand === 'A' ? strandA : strandB;
    
    // Depth-based scaling and opacity
    const depthFactor = (z + 1) / 2; // 0 to 1
    const scale = 0.6 + depthFactor * 0.4;
    const opacity = 0.5 + depthFactor * 0.5;
    const radius = NODE_RADIUS * scale;

    // Outer glow
    ctx.save();
    ctx.globalAlpha = opacity * 0.4;
    const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, NODE_RADIUS_BG * scale);
    glowGrad.addColorStop(0, colors.glow);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(x, y, NODE_RADIUS_BG * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Main node
    ctx.save();
    ctx.globalAlpha = opacity;
    const nodeGrad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
    nodeGrad.addColorStop(0, colors.highlight);
    nodeGrad.addColorStop(0.6, colors.core);
    nodeGrad.addColorStop(1, colors.shadow);
    ctx.fillStyle = nodeGrad;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawConnectingLine(points, color, opacity) {
    if (points.length < 2) return;
    
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.stroke();
    ctx.restore();
}

function drawRung(posA, posB) {
    const avgZ = (posA.z + posB.z) / 2;
    const depthFactor = (avgZ + 1) / 2;
    const opacity = 0.15 + depthFactor * 0.35;
    
    // Rung line
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.strokeStyle = RUNG_COLOR;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(posA.x, posA.y);
    ctx.lineTo(posB.x, posB.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Small dots at rung connections
    const dotRadius = 2 * (0.5 + depthFactor * 0.5);
    const dotColor = baseColors[Math.floor((posA.y / VERTICAL_SPACING) % baseColors.length)];
    
    ctx.save();
    ctx.globalAlpha = opacity * 0.8;
    ctx.fillStyle = dotColor;
    ctx.beginPath();
    ctx.arc(posA.x, posA.y, dotRadius, 0, Math.PI * 2);
    ctx.arc(posB.x, posB.y, dotRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawCentralAxis() {
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#6666aa';
    ctx.lineWidth = 1;
    ctx.setLineDash([8, 12]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, W, H);
    
    drawBackground();
    drawCentralAxis();

    rotation += ROTATION_SPEED;

    // Calculate all positions first
    const positions = [];
    for (let i = 0; i < NUM_NODES; i++) {
        positions.push({
            A: getNodePosition(i, rotation, 'A'),
            B: getNodePosition(i, rotation, 'B')
        });
    }

    // Draw rungs first (behind the strands)
    for (let i = 0; i < NUM_NODES; i++) {
        drawRung(positions[i].A, positions[i].B);
    }

    // Sort nodes by depth for proper 3D rendering
    const strandANodes = positions.map((p, i) => ({ ...p.A, index: i }));
    const strandBNodes = positions.map((p, i) => ({ ...p.B, index: i }));

    // Draw back nodes first, then front nodes
    const allNodes = [
        ...strandANodes.map(n => ({ ...n, strand: 'A' })),
        ...strandBNodes.map(n => ({ ...n, strand: 'B' }))
    ];
    allNodes.sort((a, b) => a.z - b.z);

    // Draw connecting strands as lines
    const strandALinePoints = positions.map(p => p.A);
    const strandBLinePoints = positions.map(p => p.B);

    drawConnectingLine(strandALinePoints, strandA.core, 0.2);
    drawConnectingLine(strandBLinePoints, strandB.core, 0.2);

    // Draw nodes sorted by depth
    for (const node of allNodes) {
        drawNode(node.x, node.y, node.z, node.strand);
    }

    // Draw axis label
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#8888cc';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('AXIS', W / 2 + 15, H / 2);
    ctx.restore();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
