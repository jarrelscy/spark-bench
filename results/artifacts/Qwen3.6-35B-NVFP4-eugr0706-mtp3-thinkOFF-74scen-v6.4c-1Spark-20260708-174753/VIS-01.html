<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Resize canvas to fill window
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        window.addEventListener('resize', resize);

        // Starfield
        let stars = [];
        function initStars() {
            stars = [];
            const starCount = 300;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }

        // Planet Data
        // Distances and sizes are scaled for visual appeal, not realistic proportions
        const planets = [
            { name: "Mercury", distance: 60, radius: 4, speed: 0.04, color: "#A5A5A5", angle: Math.random() * Math.PI * 2 },
            { name: "Venus", distance: 90, radius: 7, speed: 0.015, color: "#E3BB76", angle: Math.random() * Math.PI * 2 },
            { name: "Earth", distance: 130, radius: 7.5, speed: 0.01, color: "#22A6B3", angle: Math.random() * Math.PI * 2 },
            { name: "Mars", distance: 170, radius: 5, speed: 0.008, color: "#EB4D4B", angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", distance: 240, radius: 18, speed: 0.004, color: "#F0932B", angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", distance: 320, radius: 15, speed: 0.003, color: "#F6E58D", angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus", distance: 390, radius: 10, speed: 0.002, color: "#7ED6DF", angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", distance: 450, radius: 9, speed: 0.001, color: "#4834D4", angle: Math.random() * Math.PI * 2 }
        ];

        // Draw the Sun
        function drawSun() {
            // Sun Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
            gradient.addColorStop(0, "rgba(255, 255, 200, 1)");
            gradient.addColorStop(0.2, "rgba(255, 200, 50, 1)");
            gradient.addColorStop(0.5, "rgba(255, 150, 0, 0.5)");
            gradient.addColorStop(1, "rgba(255, 100, 0, 0)");

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core
            ctx.fillStyle = "#FFF200";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Stars
        function drawStars(time) {
            ctx.fillStyle = "#FFFFFF";
            stars.forEach(star => {
                // Twinkle effect
                const opacity = (Math.sin(time * star.twinkleSpeed) + 1) / 2 * 0.8 + 0.2;
                ctx.globalAlpha = opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        // Draw Planets
        function drawPlanets(time) {
            planets.forEach(planet => {
                // Update angle
                planet.angle += planet.speed;

                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit Path
                ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet Shadow (3D effect)
                const shadowOffset = planet.radius * 0.3;
                const planetGradient = ctx.createRadialGradient(
                    x - shadowOffset, y - shadowOffset, planet.radius * 0.2,
                    x, y, planet.radius
                );
                planetGradient.addColorStop(0, planet.color);
                planetGradient.addColorStop(1, "rgba(0,0,0,0.8)");

                ctx.fillStyle = planetGradient;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw Saturn's Ring
                if (planet.hasRing) {
                    ctx.strokeStyle = "rgba(210, 180, 140, 0.6)";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        // Animation Loop
        let lastTime = 0;
        function animate(time) {
            // Clear canvas
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, width, height);

            // Draw background
            drawStars(time);

            // Draw Sun
            drawSun();

            // Draw Planets
            drawPlanets(time);

            requestAnimationFrame(animate);
        }

        // Initialize
        resize();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
