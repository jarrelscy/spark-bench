<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Deep space black */
            overflow: hidden; /* Prevent scrollbars */
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];

    // Configuration for the planets
    // Distances and sizes are stylized for visual clarity, not astronomical accuracy
    const planets = [
        { name: "Mercury", color: "#A5A5A5", size: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", size: 7, distance: 90, speed: 0.03, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6F2", size: 7, distance: 130, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#FF5733", size: 5, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D9A066", size: 18, distance: 240, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#E0C896", size: 15, distance: 320, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#82E0E6", size: 10, distance: 390, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4B70DD", size: 10, distance: 450, speed: 0.003, angle: Math.random() * Math.PI * 2 }
    ];

    // Initialization and Resize Handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    // Generate random starfield
    function generateStars() {
        stars = [];
        const starCount = 400;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    // Draw the Starfield background
    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0; // Reset alpha
    }

    // Draw the Sun
    function drawSun() {
        // Outer Glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
        gradient.addColorStop(0, '#FFF7E0'); // Bright center
        gradient.addColorStop(0.2, '#FFD700'); // Gold
        gradient.addColorStop(0.5, 'rgba(255, 140, 0, 0.6)'); // Orange fade
        gradient.addColorStop(1, 'rgba(255, 100, 0, 0)'); // Transparent edge

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Solid Core
        ctx.fillStyle = '#FFFACD';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw Orbit Paths
    function drawOrbits() {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = 1;
        planets.forEach(planet => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    // Update and Draw Planets
    function drawPlanets() {
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Planet Shadow/Glow
            ctx.shadowBlur = 10;
            ctx.shadowColor = planet.color;

            // Draw Planet Body
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fill();

            // Reset Shadow for performance
            ctx.shadowBlur = 0;

            // Draw Saturn's Ring (Special Case)
            if (planet.hasRing) {
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Draw an ellipse around the planet
                ctx.ellipse(x, y, planet.size * 2.2, planet.size * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });
    }

    // Main Animation Loop
    function animate() {
        // Clear canvas with a slight trail effect (optional, using solid clear here for clean look)
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawOrbits();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);

    // Start
    resize();
    animate();

</script>
</body>
</html>
