<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        // Configuration
        const config = {
            numPoints: 60,
            radius: 120,
            verticalSpacing: 12,
            rotationSpeed: 0.03,
            perspective: 800,
            color1: { r: 255, g: 100, b: 100 },    // Red strand
            color2: { r: 100, g: 200, b: 255 },    // Blue strand
            rungColor: { r: 255, g: 255, b: 255 }
        };

        let angleOffset = 0;

        function drawDNA() {
            ctx.clearRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const totalHeight = config.numPoints * config.verticalSpacing;
            const startY = centerY - (totalHeight / 2);

            // Calculate all 3D points first
            const points1 = [];
            const points2 = [];
            const rungs = [];

            for (let i = 0; i < config.numPoints; i++) {
                const y = startY + i * config.verticalSpacing;
                
                // Calculate angles for both strands (180 degrees apart)
                const angle1 = i * 0.3 + angleOffset;
                const angle2 = angle1 + Math.PI;

                // 3D coordinates (x, z, y) where y is vertical on screen
                const x1 = Math.cos(angle1) * config.radius;
                const z1 = Math.sin(angle1) * config.radius;
                
                const x2 = Math.cos(angle2) * config.radius;
                const z2 = Math.sin(angle2) * config.radius;

                // Perspective projection
                const scale1 = config.perspective / (config.perspective + z1);
                const scale2 = config.perspective / (config.perspective + z2);

                const screenX1 = centerX + x1 * scale1;
                const screenY1 = y;
                const screenZ1 = z1;
                const screenScale1 = scale1;

                const screenX2 = centerX + x2 * scale2;
                const screenY2 = y;
                const screenZ2 = z2;
                const screenScale2 = scale2;

                points1.push({ x: screenX1, y: screenY1, z: screenZ1, scale: screenScale1, index: i });
                points2.push({ x: screenX2, y: screenY2, z: screenZ2, scale: screenScale2, index: i });
                
                rungs.push({ 
                    p1: points1[points1.length - 1], 
                    p2: points2[points2.length - 1],
                    z: (screenZ1 + screenZ2) / 2
                });
            }

            // Sort all elements by Z-depth (back to front)
            const allElements = [];
            
            // Add points with their strand info
            points1.forEach(p => allElements.push({ type: 'point', strand: 1, ...p }));
            points2.forEach(p => allElements.push({ type: 'point', strand: 2, ...p }));
            rungs.forEach(r => allElements.push({ type: 'rung', ...r }));

            // Sort by Z (farther first)
            allElements.sort((a, b) => b.z - a.z);

            // Draw in correct order
            allElements.forEach(el => {
                if (el.type === 'point') {
                    const color = el.strand === 1 ? config.color1 : config.color2;
                    const size = 4 * el.scale;
                    
                    // Glow effect
                    const gradient = ctx.createRadialGradient(
                        el.x, el.y, 0,
                        el.x, el.y, size * 3
                    );
                    gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, 0.8)`);
                    gradient.addColorStop(0.5, `rgba(${color.r}, ${color.g}, ${color.b}, 0.3)`);
                    gradient.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(el.x, el.y, size * 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Core
                    ctx.fillStyle = `rgba(${Math.min(255, color.r + 100)}, ${Math.min(255, color.g + 100)}, ${Math.min(255, color.b + 100)}, ${0.5 + el.scale * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(el.x, el.y, size, 0, Math.PI * 2);
                    ctx.fill();
                } 
                else if (el.type === 'rung') {
                    const alpha = 0.3 + (el.z / config.radius) * 0.3;
                    const lineWidth = 1.5 * ((el.p1.scale + el.p2.scale) / 2);
                    
                    ctx.strokeStyle = `rgba(${config.rungColor.r}, ${config.rungColor.g}, ${config.rungColor.b}, ${Math.max(0.1, alpha)})`;
                    ctx.lineWidth = lineWidth;
                    ctx.beginPath();
                    ctx.moveTo(el.p1.x, el.p1.y);
                    ctx.lineTo(el.p2.x, el.p2.y);
                    ctx.stroke();
                }
            });

            // Draw connecting lines for each strand (behind everything)
            ctx.lineWidth = 2;
            
            // Strand 1
            ctx.strokeStyle = `rgba(${config.color1.r}, ${config.color1.g}, ${config.color1.b}, 0.4)`;
            ctx.beginPath();
            points1.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
            
            // Strand 2
            ctx.strokeStyle = `rgba(${config.color2.r}, ${config.color2.g}, ${config.color2.b}, 0.4)`;
            ctx.beginPath();
            points2.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();

            angleOffset += config.rotationSpeed;
            requestAnimationFrame(drawDNA);
        }

        drawDNA();
    </script>
</body>
</html>
