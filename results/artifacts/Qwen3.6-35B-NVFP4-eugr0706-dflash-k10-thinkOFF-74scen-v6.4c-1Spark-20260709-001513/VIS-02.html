<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1200;
        const SPIRAL_ARMS = 3;
        const MAX_RADIUS = 300;
        const ROTATION_SPEED_BASE = 0.002;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle for spiral distribution
                const armIndex = Math.floor(Math.random() * SPIRAL_ARMS);
                const armAngle = (armIndex / SPIRAL_ARMS) * Math.PI * 2;
                
                // Distance from center (more stars near center, fewer at edge)
                const dist = Math.pow(Math.random(), 0.5) * MAX_RADIUS;
                
                // Spiral offset: closer stars have less angular offset
                const spiralAngle = dist * 0.02; 
                
                // Add some randomness to position
                const angleSpread = (Math.random() - 0.5) * 0.8;
                
                this.angle = armAngle + spiralAngle + angleSpread;
                this.distance = dist;
                this.speed = (0.5 / (dist + 1)) * ROTATION_SPEED_BASE * (Math.random() * 0.5 + 0.75);
                this.size = Math.random() * 1.5 + 0.5;
                this.baseAlpha = Math.random() * 0.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color variation: blue-white near center, yellow/red at edges
                const colorChoice = Math.random();
                if (colorChoice < 0.6) {
                    // Blue-white (hotter, younger stars)
                    this.r = 200 + Math.random() * 55;
                    this.g = 220 + Math.random() * 35;
                    this.b = 255;
                } else if (colorChoice < 0.85) {
                    // Yellow (middle-aged)
                    this.r = 255;
                    this.g = 220 + Math.random() * 35;
                    this.b = 150 + Math.random() * 50;
                } else {
                    // Red/Orange (older stars)
                    this.r = 255;
                    this.g = 150 + Math.random() * 50;
                    this.b = 100 + Math.random() * 50;
                }
            }

            update(time) {
                this.angle += this.speed;
                // Twinkle effect
                this.alpha = this.baseAlpha * (0.7 + 0.3 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
            }

            draw(ctx) {
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.round(this.r)}, ${Math.round(this.g)}, ${Math.round(this.b)}, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Draw the bright central core with gradient
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 40);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 255, 240, 0.8)');
            gradient.addColorStop(0.3, 'rgba(255, 220, 180, 0.3)');
            gradient.addColorStop(0.7, 'rgba(200, 150, 100, 0.1)');
            gradient.addColorStop(1, 'rgba(200, 150, 100, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Bright center point
            ctx.beginPath();
            ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
        }

        function drawBackgroundStars() {
            // Draw some static background stars
            if (!drawBackgroundStars.cache) {
                drawBackgroundStars.cache = [];
                for (let i = 0; i < 300; i++) {
                    drawBackgroundStars.cache.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 1.2,
                        alpha: Math.random() * 0.3 + 0.1
                    });
                }
            }
            
            drawBackgroundStars.cache.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });
        }

        function animate(time) {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw background stars
            drawBackgroundStars();
            
            // Draw core
            drawCore();
            
            // Update and draw galaxy stars
            stars.forEach(star => {
                star.update(time);
                star.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        // Initialize
        resize();
        initStars();
        window.addEventListener('resize', () => {
            resize();
            initStars();
        });
        
        requestAnimationFrame(animate);
    </script>
</body>
</html>
