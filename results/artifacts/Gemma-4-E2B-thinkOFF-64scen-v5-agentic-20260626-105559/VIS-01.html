<!DOCTYPE html>
<html>
<head>
    <title>Solar System Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystemCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarSystemCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to fill the window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Simulation Constants ---
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const sunRadius = 20;
        const planets = [
            // { radius, color, speed (radians/frame), size }
            { name: "Mercury", radius: 80, color: "#A9A9A9", speed: 0.05, size: 3 },
            { name: "Venus", radius: 130, color: "#FFD700", speed: 0.03, size: 4 },
            { name: "Earth", radius: 180, color: "#4169E1", speed: 0.02, size: 5 },
            { name: "Mars", radius: 230, color: "#B22222", speed: 0.015, size: 3.5 },
            { name: "Jupiter", radius: 300, color: "#FFA500", speed: 0.008, size: 7 },
            { name: "Saturn", radius: 380, color: "#DAA520", speed: 0.005, size: 6 }
        ];

        let planetsData = planets.map(p => ({
            ...p,
            angle: Math.random() * Math.PI * 2, // Start at a random position
            orbitSpeed: p.speed * (1 / p.radius) // Adjust speed based on radius for more realistic relative movement
        }));

        // --- Drawing Functions ---

        function drawStarfield() {
            // Simple dark background, could be enhanced with twinkling stars if desired
            ctx.fillStyle = 'rgba(0, 0, 15, 1)'; // Very dark blue/black
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Optional: Draw faint stars (simple dots)
            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 1.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
                ctx.fillRect(x, y, size, size);
            }
        }

        function drawSun() {
            const sun = planetsData[0]; // The first planet is the Sun
            
            // Create a glowing effect
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0, 
                centerX, centerY, sunRadius * 2
            );
            gradient.addColorStop(0, 'rgba(255, 255, 150, 1)'); // Bright center
            gradient.addColorStop(0.5, 'rgba(255, 165, 0, 0.8)'); // Orange glow
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)'); // Transparent edge

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();

            // Draw the core
            ctx.fillStyle = '#FFEB3B';
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlanet(data) {
            const { radius, color, size, angle } = data;

            // Calculate position based on angle and radius
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);

            // Draw orbit path (optional, helps visualize the path)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();

            // Draw planet body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- Animation Loop ---

        function animate() {
            // 1. Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Draw background
            drawStarfield();

            // 3. Update positions and draw
            planetsData.forEach(planet => {
                // Update angle based on orbital speed
                planet.angle += planet.orbitSpeed;

                // Draw the planet
                drawPlanet(planet);
            });

            // 4. Draw the Sun last to ensure it's on top
            drawSun();

            // Request the next frame
            requestAnimationFrame(animate);
        }

        // Start the simulation
        animate();
    </script>
</body>
</html>
