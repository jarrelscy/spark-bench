<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating DNA Helix</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111;
            overflow: hidden;
        }
        canvas {
            border: 1px solid #333;
            background-color: #000;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas" width="600" height="600"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('dnaCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const helixRadius = 150;
            const strandCount = 20; // Number of nodes on each strand
            const rungHeight = 30;
            const strandColor1 = 'rgba(0, 150, 255, 0.8)'; // Blueish
            const strandColor2 = 'rgba(255, 50, 150, 0.8)'; // Pinkish
            const backgroundColor = '#0a0a1a';

            let rotationAngle = 0;
            let time = 0;

            // --- Node Structure ---
            class DNAHelixNode {
                constructor(index, strandIndex) {
                    this.index = index; // Position along the helix (0 to strandCount-1)
                    this.strandIndex = strandIndex; // 0 or 1
                    this.angle = (index / strandCount) * Math.PI * 2; // Base angular position
                    this.radius = helixRadius;
                    this.color = strandIndex === 0 ? strandColor1 : strandColor2;
                }

                draw(ctx, rotationOffset) {
                    const x = centerX + this.radius * Math.cos(this.angle + rotationOffset);
                    const y = centerY + this.radius * Math.sin(this.angle + rotationOffset);

                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            const nodes = [];
            for (let i = 0; i < strandCount; i++) {
                nodes.push(new DNAHelixNode(i, 0)); // Strand 1
                nodes.push(new DNAHelixNode(i, 1)); // Strand 2
            }

            // --- Drawing Functions ---

            function drawRungs(ctx, rotationOffset) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;

                for (let i = 0; i < strandCount; i++) {
                    // Calculate positions for the current rotation
                    const node1 = nodes[2 * i];
                    const node2 = nodes[2 * i + 1];

                    // Calculate positions considering the rotation
                    const x1 = centerX + node1.radius * Math.cos(node1.angle + rotationOffset);
                    const y1 = centerY + node1.radius * Math.sin(node1.angle + rotationOffset);

                    const x2 = centerX + node2.radius * Math.cos(node2.angle + rotationOffset);
                    const y2 = centerY + node2.radius * Math.sin(node2.angle + rotationOffset);

                    // Draw the rung connecting the two points
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }

            function draw() {
                // 1. Clear canvas
                ctx.fillStyle = backgroundColor;
                ctx.fillRect(0, 0, width, height);

                // Calculate dynamic rotation based on time
                rotationAngle += 0.005; // Speed of rotation
                const rotationOffset = rotationAngle;

                // 2. Draw Rungs (connecting elements)
                drawRungs(ctx, rotationOffset);

                // 3. Draw Nodes (the strands)
                nodes.forEach(node => {
                    node.draw(ctx, rotationOffset);
                });

                // 4. Request next frame
                requestAnimationFrame(draw);
            }

            // Start the animation loop
            draw();
        });
    </script>
</body>
</html>
