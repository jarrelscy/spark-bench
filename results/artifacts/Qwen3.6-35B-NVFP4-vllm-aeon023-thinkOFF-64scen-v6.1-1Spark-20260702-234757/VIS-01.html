<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Resize canvas to fill window
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Create starfield
        const stars = [];
        const numStars = 500;

        function createStars() {
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    opacity: Math.random(),
                    twinkleSpeed: 0.01 + Math.random() * 0.03
                });
            }
        }

        createStars();

        // Planet definitions
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 60, speed: 0.04, color: '#b5b5b5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 7, orbitRadius: 90, speed: 0.025, color: '#e3bb76', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 8, orbitRadius: 130, speed: 0.02, color: '#4f86f7', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 170, speed: 0.016, color: '#d14a28', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 16, orbitRadius: 230, speed: 0.008, color: '#d4a574', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 13, orbitRadius: 290, speed: 0.006, color: '#e6c994', angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: 'Uranus', radius: 10, orbitRadius: 340, speed: 0.004, color: '#7de8f0', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', radius: 9, orbitRadius: 380, speed: 0.003, color: '#3e54e8', angle: Math.random() * Math.PI * 2 }
        ];

        // Draw stars
        function drawStars(time) {
            for (let star of stars) {
                const twinkle = Math.sin(time * star.twinkleSpeed) * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * twinkle})`;
                ctx.fill();
            }
        }

        // Draw Sun with glow
        function drawSun() {
            // Outer glow
            const gradient3 = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 60);
            gradient3.addColorStop(0, 'rgba(255, 200, 50, 0.3)');
            gradient3.addColorStop(1, 'rgba(255, 200, 50, 0)');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fillStyle = gradient3;
            ctx.fill();

            // Middle glow
            const gradient2 = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 35);
            gradient2.addColorStop(0, 'rgba(255, 220, 100, 0.6)');
            gradient2.addColorStop(1, 'rgba(255, 220, 100, 0)');
            ctx.beginPath();
            ctx.arc(centerX, centerY, 35, 0, Math.PI * 2);
            ctx.fillStyle = gradient2;
            ctx.fill();

            // Sun body
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 22);
            gradient.addColorStop(0, '#fff8e0');
            gradient.addColorStop(0.3, '#ffd700');
            gradient.addColorStop(0.7, '#ff8c00');
            gradient.addColorStop(1, '#ff6600');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 22, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Draw orbit path
        function drawOrbit(radius) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Draw planet
        function drawPlanet(planet, time) {
            // Update angle
            planet.angle += planet.speed;

            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Draw orbit
            drawOrbit(planet.orbitRadius);

            // Draw planet glow
            const glowGradient = ctx.createRadialGradient(x, y, 0, x, y, planet.radius * 3);
            glowGradient.addColorStop(0, planet.color + '40');
            glowGradient.addColorStop(1, planet.color + '00');
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 3, 0, Math.PI * 2);
            ctx.fillStyle = glowGradient;
            ctx.fill();

            // Draw Saturn's ring
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.6, planet.angle, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(210, 180, 140, 0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Draw planet body
            const planetGradient = ctx.createRadialGradient(x - planet.radius * 0.3, y - planet.radius * 0.3, 0, x, y, planet.radius);
            planetGradient.addColorStop(0, lightenColor(planet.color, 40));
            planetGradient.addColorStop(1, planet.color);
            
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planetGradient;
            ctx.fill();
        }

        // Helper function to lighten color
        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        // Animation loop
        let lastTime = 0;
        function animate(time) {
            const deltaTime = time - lastTime;
            lastTime = time;

            // Clear canvas
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw stars
            drawStars(time);

            // Draw Sun
            drawSun();

            // Draw planets
            for (let planet of planets) {
                drawPlanet(planet, time);
            }

            requestAnimationFrame(animate);
        }

        // Handle window resize for stars
        window.addEventListener('resize', () => {
            resize();
            createStars();
        });

        // Start animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
