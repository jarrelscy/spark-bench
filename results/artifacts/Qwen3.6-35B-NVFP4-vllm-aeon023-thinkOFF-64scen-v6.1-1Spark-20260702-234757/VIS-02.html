<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 800;
        const ARM_COUNT = 3;
        const ARM_SPREAD = 0.8;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle for the arm
                const armIndex = Math.floor(Math.random() * ARM_COUNT);
                const armAngle = (armIndex / ARM_COUNT) * Math.PI * 2;
                
                // Distance from center (more stars near center)
                this.distance = Math.random() * Math.random() * Math.min(width, height) * 0.4;
                
                // Spiral angle based on distance
                const spiralAngle = this.distance * 0.02;
                
                // Random offset for spread
                const spread = (Math.random() - 0.5) * ARM_SPREAD;
                
                // Base angle
                this.angle = armAngle + spiralAngle + spread;
                
                // Orbital speed (faster closer to center)
                this.speed = (0.002 + Math.random() * 0.003) / (this.distance * 0.01 + 0.1);
                
                // Size
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color variation
                const colorChoice = Math.random();
                if (colorChoice < 0.3) {
                    // Blue-ish
                    this.r = 150 + Math.random() * 105;
                    this.g = 180 + Math.random() * 75;
                    this.b = 255;
                } else if (colorChoice < 0.6) {
                    // Yellow/white
                    this.r = 255;
                    this.g = 255;
                    this.b = 200 + Math.random() * 55;
                } else if (colorChoice < 0.8) {
                    // Red/orange (older stars)
                    this.r = 255;
                    this.g = 100 + Math.random() * 100;
                    this.b = 50 + Math.random() * 50;
                } else {
                    // White
                    this.r = 255;
                    this.g = 255;
                    this.b = 255;
                }
                
                // Twinkle
                this.twinkleSpeed = 0.02 + Math.random() * 0.05;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = 0.3 + Math.random() * 0.7;
                
                this.x = 0;
                this.y = 0;
            }

            update(time) {
                this.angle += this.speed;
                
                // Calculate position
                this.x = centerX + Math.cos(this.angle) * this.distance;
                this.y = centerY + Math.sin(this.angle) * this.distance;
                
                // Twinkle effect
                this.alpha = this.baseAlpha * (0.5 + 0.5 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.floor(this.r)}, ${Math.floor(this.g)}, ${Math.floor(this.b)}, ${this.alpha})`;
                ctx.fill();
            }
        }

        function init() {
            resize();
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Create a radial gradient for the core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 60);
            gradient.addColorStop(0, 'rgba(255, 255, 240, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 240, 200, 0.4)');
            gradient.addColorStop(0.5, 'rgba(200, 180, 150, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate(time) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Clear completely every few frames to prevent buildup
            if (Math.floor(time / 100) % 3 === 0) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, width, height);
            }
            
            drawCore();
            
            // Update and draw stars
            for (const star of stars) {
                star.update(time);
                star.draw();
            }
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
        });

        init();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
