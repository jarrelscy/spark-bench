<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const starCount = 1500;

        // Galaxy Configuration
        const galaxyParams = {
            armCount: 4,
            armSpread: 0.5, // How wide the arms are
            coreSize: 0.15, // Percentage of width
            rotationSpeed: 0.0005,
            maxRadius: 0, // Calculated on resize
        };

        class Star {
            constructor(isCore = false) {
                this.isCore = isCore;
                this.reset();
            }

            reset() {
                // Distance from center (Gaussian distribution for core density)
                if (this.isCore) {
                    this.distance = Math.random() * (galaxyParams.maxRadius * 0.3);
                    this.angle = Math.random() * Math.PI * 2;
                    this.size = Math.random() * 2 + 1;
                    this.color = { r: 255, g: 200, b: 200 }; // Warm white/yellow
                } else {
                    // Logarithmic distribution for spiral arms
                    const r = Math.random();
                    this.distance = r * r * galaxyParams.maxRadius; 
                    
                    // Calculate base angle based on distance (logarithmic spiral)
                    // The further out, the more it rotates
                    const spiralAngle = (this.distance / galaxyParams.maxRadius) * 10; 
                    
                    // Pick a random arm
                    const armIndex = Math.floor(Math.random() * galaxyParams.armCount);
                    const armOffset = (armIndex * Math.PI * 2) / galaxyParams.armCount;
                    
                    // Add randomness to spread the arm
                    const spread = (Math.random() - 0.5) * galaxyParams.armSpread;
                    
                    this.angle = spiralAngle + armOffset + spread;
                    
                    // Size based on distance (larger near core)
                    this.size = Math.random() * (1.5 - (this.distance / galaxyParams.maxRadius)) + 0.5;
                    
                    // Color variation: Blue/White outer, Yellow/Red inner
                    const distRatio = this.distance / galaxyParams.maxRadius;
                    const r = 255;
                    const g = 150 + (1 - distRatio) * 50;
                    const b = 100 + (1 - distRatio) * 100;
                    this.color = { r, g, b };
                }

                this.baseAlpha = Math.random() * 0.5 + 0.5;
                this.alpha = this.baseAlpha;
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Rotation speed (Keplerian-ish: closer moves faster)
                this.rotationSpeed = galaxyParams.rotationSpeed * (1 + (10000 / (this.distance + 50)));
            }

            update(time) {
                // Rotate
                this.angle += this.rotationSpeed;

                // Twinkle
                this.alpha = this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.3;
                if (this.alpha < 0) this.alpha = 0;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw(ctx) {
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
                ctx.fill();

                // Add a glow for brighter/larger stars
                if (this.size > 1.2 && this.alpha > 0.8) {
                    ctx.beginPath();
                    ctx.arc(x, y, this.size * 3, 0, Math.PI * 2);
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, this.size * 3);
                    gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha * 0.3})`);
                    gradient.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            galaxyParams.maxRadius = Math.min(width, height) * 0.45;
            
            // Re-initialize stars to fit new dimensions
            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                // 30% core stars, 70% arm stars
                stars.push(new Star(i < starCount * 0.3));
            }
        }

        function animate(time) {
            // Clear with fade effect for subtle trails (optional, but looks nice)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            // Draw Core Glow
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, galaxyParams.maxRadius * 0.4);
            coreGradient.addColorStop(0, 'rgba(255, 230, 230, 0.15)');
            coreGradient.addColorStop(0.5, 'rgba(200, 150, 255, 0.05)');
            coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = coreGradient;
            ctx.fillRect(0, 0, width, height);

            // Update and draw stars
            for (let i = 0; i < stars.length; i++) {
                stars[i].update(time);
                stars[i].draw(ctx);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
