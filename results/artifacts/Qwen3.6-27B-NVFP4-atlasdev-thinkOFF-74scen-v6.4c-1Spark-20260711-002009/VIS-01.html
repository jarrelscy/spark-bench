<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration
        const stars = [];
        const starCount = 200;
        
        // Planet Data
        // distance: relative scale factor
        // size: radius in pixels
        // speed: angular velocity per frame
        // color: hex string
        const planets = [
            { name: "Mercury", distance: 60,  size: 4,  speed: 0.02, color: "#A5A5A5" },
            { name: "Venus",   distance: 90,  size: 7,  speed: 0.015, color: "#E3BB76" },
            { name: "Earth",   distance: 130, size: 7.5,speed: 0.01,  color: "#22A6B3" },
            { name: "Mars",    distance: 170, size: 5,  speed: 0.008, color: "#EB4D4B" },
            { name: "Jupiter", distance: 240, size: 18, speed: 0.004, color: "#F0932B" },
            { name: "Saturn",  distance: 320, size: 15, speed: 0.003, color: "#F6E58D", hasRing: true },
            { name: "Uranus",  distance: 390, size: 10, speed: 0.002, color: "#7ED6DF" },
            { name: "Neptune", distance: 450, size: 10, speed: 0.0015,color: "#4834D4" }
        ];

        // Initialize angles
        planets.forEach(p => {
            p.angle = Math.random() * Math.PI * 2;
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Outer Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = "#F9CA24";
            
            // Sun Body
            ctx.fillStyle = "#F9CA24";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow for other elements
            ctx.shadowBlur = 0;
        }

        function drawOrbits() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function drawPlanets() {
            planets.forEach(planet => {
                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Update angle
                planet.angle += planet.speed;

                // Draw Planet
                ctx.fillStyle = planet.color;
                ctx.beginPath(.arc(x, y, planet.size, 0, Math.PI * 2);
                ctx.fill();

                // Special case for Saturn's ring
                if (planet.hasRing) {
                    ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    // Draw an ellipse to simulate the ring
                    ctx.ellipse(x, y, planet.size * 2, planet.size * 0.5, planet.angle, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Optional: Draw Name
                ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                ctx.font = "10px Arial";
                ctx.textAlign = "center";
                ctx.fillText(planet.name, x, y + planet.size + 12);
            });
        }

        function animate() {
            // Clear screen
            ctx.clearRect(0, 0, width, height);

            // Draw background
            drawStars();

            // Draw system
            drawOrbits();
            drawSun();
            drawPlanets();

            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', resize);

        // Start
        resize();
        animate();

    </script>
</body>
</html>
