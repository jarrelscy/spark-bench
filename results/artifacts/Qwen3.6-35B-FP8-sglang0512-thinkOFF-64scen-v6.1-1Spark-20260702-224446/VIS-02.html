<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const STAR_COUNT = 1500;
        const ARM_COUNT = 3;
        const GALAXY_RADIUS = 400;
        
        // Configuration for the spiral arms
        const ARM_SPREAD = 15; // How much stars scatter from the arm center
        const CORE_SIZE = 60;  // Radius of the bright core

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random distance from center (weighted towards center)
                // Using Math.random() * Math.random() clusters them more naturally
                const r = Math.random() * GALAXY_RADIUS;
                const r2 = r * r / GALAXY_RADIUS; // Bias towards center

                // Random angle
                let theta = Math.random() * Math.PI * 2;

                // Assign to an arm
                const armIndex = Math.floor(Math.random() * ARM_COUNT);
                const armAngle = (armIndex / ARM_COUNT) * Math.PI * 2;
                
                // Add spiral twist: angle increases with distance
                const spiralFactor = r * 0.005; 
                
                // Add randomness to scatter stars away from the arm
                const noise = (Math.random() - 0.5) * ARM_SPREAD * (1 + r/GALAXY_RADIUS);

                theta = armAngle + spiralFactor + noise;

                // Convert polar to cartesian
                this.x = Math.cos(theta) * r;
                this.y = Math.sin(theta) * r;
                
                // Store original polar coordinates for rotation logic
                this.radius = r;
                this.angle = theta;

                // Orbital speed: inner stars move faster (Keplerian-ish)
                // v = k / r. We add a small constant to prevent infinite speed at center
                this.speed = (0.5 / (r + 20)) * 100; 
                
                // Star properties
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color variation based on distance
                // Core: Yellow/White, Arms: Blue/White/Pink
                this.color = this.generateColor(r);
            }

            generateColor(r) {
                const normalizedR = r / GALAXY_RADIUS;
                const rand = Math.random();
                
                if (normalizedR < 0.3) {
                    // Core colors: Warm yellow, white
                    if (rand < 0.7) return { r: 255, g: 240, b: 200 }; // Warm white
                    if (rand < 0.9) return { r: 255, g: 200, b: 100 }; // Yellow
                    return { r: 255, g: 255, b: 255 }; // Bright white
                } else {
                    // Arm colors: Blue, White, faint Pink
                    if (rand < 0.6) return { r: 150, g: 200, b: 255 }; // Blue
                    if (rand < 0.8) return { r: 200, g: 220, b: 255 }; // Light blue
                    if (rand < 0.9) return { r: 255, g: 200, b: 220 }; // Pinkish
                    return { r: 255, g: 255, b: 255 }; // White
                }
            }

            update(time) {
                // Rotate the star
                this.angle += this.speed * 0.001;
                
                // Calculate current position
                this.currentX = Math.cos(this.angle) * this.radius;
                this.currentY = Math.sin(this.angle) * this.radius;

                // Twinkle effect
                this.alpha = 0.5 + 0.5 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
            }

            draw(ctx, cx, cy) {
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(cx + this.currentX, cy + this.currentY, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let stars = [];

        function init() {
            resize();
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        function drawCore() {
            // Create a radial gradient for the bright core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_SIZE * 2);
            gradient.addColorStop(0, 'rgba(255, 250, 240, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 220, 180, 0.8)');
            gradient.addColorStop(0.5, 'rgba(200, 180, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_SIZE * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate(time) {
            // Clear canvas with a very slight fade for trails? 
            // No, let's do clean clear for crisp stars.
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            drawCore();

            // Sort stars by Y position for simple depth sorting (optional, but looks nice)
            // Actually, for performance with 1500 stars, we might skip sorting every frame.
            // Let's just draw them. The alpha handles blending.

            for (let star of stars) {
                star.update(time);
                star.draw(ctx, centerX, centerY);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
