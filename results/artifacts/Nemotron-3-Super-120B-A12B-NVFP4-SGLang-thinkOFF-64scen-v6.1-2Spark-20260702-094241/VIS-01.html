<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to window size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Starfield background
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2,
                alpha: Math.random() * 0.8 + 0.2
            });
        }

        // Celestial bodies
        const sun = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 40,
            color: 'rgba(255, 165, 0, 0.9)' // Glowing orange
        };

        const planets = [
            { name: 'Mercury', radius: 8, orbitRadius: 80, speed: 0.04, color: '#888888' },
            { name: 'Venus',   radius: 12, orbitRadius: 120, speed: 0.03, color: '#e6b0aa' },
            { name: 'Earth',   radius: 14, orbitRadius: 160, speed: 0.02, color: '#4a90e2' },
            { name: 'Mars',    radius: 10, orbitRadius: 200, speed: 0.016, color: '#e27d60' },
            { name: 'Jupiter', radius: 20, orbitRadius: 260, speed: 0.008, color: '#d4a373' },
            { name: 'Saturn',  radius: 18, orbitRadius: 320, speed: 0.006, color: '#f5deb3' }
        ];

        let time = 0;

        function drawStarfield() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (const star of stars) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            }
        }

        function drawSun() {
            // Glowing effect: radial gradient
            const gradient = ctx.createRadialGradient(
                sun.x, sun.y, 0,
                sun.x, sun.y, sun.radius
            );
            gradient.addColorStop(0, 'rgba(255, 255, 100, 0.9)');
            gradient.addColorStop(0.7, 'rgba(255, 165, 0, 0.7)');
            gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');

            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Optional: outer glow
            ctx.shadowColor = 'rgba(255, 165, 0, 0.5)';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius + 10, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 165, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.shadowBlur = 0; // Reset
        }

        function drawPlanet(planet) {
            const angle = time * planet.speed;
            const x = sun.x + Math.cos(angle) * planet.orbitRadius;
            const y = sun.y + Math.sin(angle) * planet.orbitRadius;

            // Orbit path (optional, subtle)
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, planet.orbitRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            // Planet
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.fill();

            // Optional: subtle glow
            ctx.shadowColor = planet.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius + 2, 0, Math.PI * 2);
            ctx.strokeStyle = planet.color;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function animate() {
            time += 0.01; // Control overall speed
            drawStarfield();
            drawSun();
            for (const planet of planets) {
                drawPlanet(planet);
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
