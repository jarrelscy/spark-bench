<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const TOTAL_STARS = 1500;
        const CORE_STARS = 300;
        const ARM_COUNT = 3;
        const ARM_SPREAD = 0.8; // How wide the arms are
        const GALAXY_RADIUS = 400;
        
        let stars = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor(isCore) {
                this.isCore = isCore;
                this.reset();
            }

            reset() {
                if (this.isCore) {
                    // Core stars are close to center
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 60; // Small radius for core
                    this.x = Math.cos(angle) * distance;
                    this.y = Math.sin(angle) * distance;
                    this.baseSize = Math.random() * 1.5 + 0.5;
                    this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                    this.twinkleOffset = Math.random() * Math.PI * 2;
                    this.color = `rgba(255, ${150 + Math.random() * 105}, ${100 + Math.random() * 155}, ${0.8 + Math.random() * 0.2})`;
                    this.rotationSpeed = 0.002 + Math.random() * 0.002; // Slow rotation
                } else {
                    // Spiral arm stars
                    // Determine which arm
                    this.armIndex = Math.floor(Math.random() * ARM_COUNT);
                    const armAngle = (this.armIndex / ARM_COUNT) * Math.PI * 2;
                    
                    // Distance from center (more stars further out for spiral look)
                    const t = Math.pow(Math.random(), 1.5); // Bias towards outer edges
                    const distance = 40 + t * (GALAXY_RADIUS - 40);
                    
                    // Add some randomness to arm width
                    const spiralAngle = armAngle + (distance * 0.005) + (Math.random() - 0.5) * ARM_SPREAD;
                    
                    this.x = Math.cos(spiralAngle) * distance;
                    this.y = Math.sin(spiralAngle) * distance;
                    
                    // Color variation: Blue/Purple at edges, Yellow/White in middle
                    const innerFactor = 1 - (distance / GALAXY_RADIUS);
                    const r = 150 + Math.random() * 105 * innerFactor;
                    const g = 100 + Math.random() * 100 * innerFactor;
                    const b = 200 + Math.random() * 55;
                    this.color = `rgba(${r}, ${g}, ${b}, ${0.5 + Math.random() * 0.5})`;
                    
                    this.baseSize = Math.random() * 1.2 + 0.3;
                    this.twinkleSpeed = Math.random() * 0.03 + 0.005;
                    this.twinkleOffset = Math.random() * Math.PI * 2;
                    
                    // Rotation speed decreases with distance (Kepler-like)
                    this.rotationSpeed = 0.0005 / (distance / 100);
                }
                
                this.currentSize = this.baseSize;
            }

            update(time) {
                // Rotate around center
                const cos = Math.cos(this.rotationSpeed);
                const sin = Math.sin(this.rotationSpeed);
                const newX = this.x * cos - this.y * sin;
                const newY = this.x * sin + this.y * cos;
                this.x = newX;
                this.y = newY;

                // Twinkle
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                this.currentSize = this.baseSize * (0.8 + 0.2 * twinkle);
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(centerX + this.x, centerY + this.y, this.currentSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            stars = [];
            
            // Create core stars
            for (let i = 0; i < CORE_STARS; i++) {
                stars.push(new Star(true));
            }
            
            // Create spiral arm stars
            for (let i = 0; i < TOTAL_STARS - CORE_STARS; i++) {
                stars.push(new Star(false));
            }
        }

        function animate(time) {
            // Clear canvas with black
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Draw core glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
            gradient.addColorStop(0, 'rgba(255, 240, 200, 0.4)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 150, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 100, 0, Math.PI * 2);
            ctx.fill();

            // Update and draw stars
            for (let star of stars) {
                star.update(time);
                star.draw();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            // Reinitialize stars to adjust positions relative to new center if needed
            // For simplicity, we just update coordinates, but star positions are relative to center
        });

        init();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
