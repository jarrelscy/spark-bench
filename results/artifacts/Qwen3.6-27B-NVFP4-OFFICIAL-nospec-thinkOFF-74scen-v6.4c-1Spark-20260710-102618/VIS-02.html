<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Canvas Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>

    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        
        // Configuration
        const STAR_COUNT = 1200;
        const ARM_COUNT = 3;
        const ARM_SPREAD = 0.8; // How wide the arms are
        const GROWTH_FACTOR = 0.15; // How fast the spiral expands
        const ROTATION_SPEED = 0.0005; // Base rotation speed
        
        // Colors for the galaxy (Core, Arms, Dust)
        const colors = [
            { r: 255, g: 255, b: 255 }, // White core
            { r: 200, g: 220, b: 255 }, // Blue-ish stars
            { r: 255, g: 240, b: 200 }, // Yellow-ish stars
            { r: 180, g: 180, b: 220 }  // Purple-ish dust
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        class Star {
            constructor() {
                this.reset();
                // Randomize initial angle so they don't all start at 0
                this.angle = Math.random() * Math.PI * 2;
            }

            reset() {
                // Random radius from center (0 to max radius)
                // We use a power distribution to cluster stars near the center
                const maxRadius = Math.min(width, height) * 0.45;
                const randomPower = Math.pow(Math.random(), 1.5); 
                this.radius = randomPower * maxRadius;
                
                // Determine if this star belongs to a spiral arm or is background noise
                this.isArmStar = Math.random() > 0.15;
                
                // Pick a random arm
                this.armIndex = Math.floor(Math.random() * ARM_COUNT);
                
                // Calculate the base angle for this arm based on radius
                // This creates the spiral shape: angle increases as radius increases
                const armAngle = (this.armIndex / ARM_COUNT) * Math.PI * 2;
                
                // Add some randomness (spread) to the position
                const spread = (Math.random() - 0.5) * ARM_SPREAD;
                
                // The final angle calculation combines the spiral logic with the spread
                // We store the offset so we can rotate the whole system later
                this.angleOffset = armAngle + spread + (this.radius * GROWTH_FACTOR);
                
                // Visual properties
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color selection based on radius (core is white, edges are colored)
                const colorIndex = this.radius < 50 ? 0 : Math.floor(Math.random() * 3) + 1;
                const color = colors[colorIndex];
                this.color = `rgb(${color.r}, ${color.g}, ${color.b})`;
                
                // Twinkle properties
                this.alpha = Math.random();
                this.alphaSpeed = Math.random() * 0.02 + 0.005;
                this.alphaDir = 1;
            }

            update(globalRotation) {
                // Twinkle effect
                this.alpha += this.alphaSpeed * this.alphaDir;
                if (this.alpha >= 1 || this.alpha <= 0.2) {
                    this.alphaDir *= -1;
                }

                // Calculate position
                // The angle changes over time based on distance (differential rotation)
                // Closer stars move faster
                const rotationSpeed = (1000 / (this.radius + 50)) * ROTATION_SPEED;
                const currentAngle = this.angleOffset + globalRotation + (Date.now() * rotationSpeed * 0.01);

                this.x = centerX + Math.cos(currentAngle) * this.radius;
                this.y = centerY + Math.sin(currentAngle) * this.radius;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        let globalRotation = 0;

        function animate() {
            // Clear screen with a slight fade for a subtle trail effect (optional, currently set to full clear)
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw the bright core
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 60);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            coreGradient.addColorStop(0.2, 'rgba(255, 240, 200, 0.8)');
            coreGradient.addColorStop(0.5, 'rgba(100, 100, 255, 0.2)');
            coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = coreGradient;
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Update global rotation for the spiral structure
            globalRotation += 0.001;

            // Update and draw stars
            // Use 'lighter' composite operation to make overlapping stars glow
            ctx.globalCompositeOperation = 'lighter';
            
            for (let star of stars) {
                star.update(globalRotation);
                star.draw();
            }
            
            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', resize);
        
        // Start
        resize();
        animate();

    </script>
</body>
</html>
