<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration
        const starCount = 400;
        let stars = [];

        // Planet Definitions
        // Distances are scaled relative to each other, not to real astronomical units
        const planets = [
            { name: 'Mercury', color: '#A5A5A5', radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: 'Venus',   color: '#E3BB76', radius: 7, distance: 90, speed: 0.03, angle: Math.random() * Math.PI * 2 },
            { name: 'Earth',   color: '#22A6F2', radius: 7, distance: 130, speed: 0.02, angle: Math.random() * Math.PI * 2 },
            { name: 'Mars',    color: '#FF5733', radius: 5, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', color: '#D9A066', radius: 18, distance: 230, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn',  color: '#E0C896', radius: 15, distance: 300, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: 'Uranus',  color: '#88D8D8', radius: 10, distance: 360, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', color: '#4B70DD', radius: 10, distance: 410, speed: 0.003, angle: Math.random() * Math.PI * 2 }
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        function generateStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Sun Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
            gradient.addColorStop(0, 'rgba(255, 255, 0, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 0, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.2)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core
            ctx.fillStyle = '#FFD700';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#FF8C00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow
        }

        function drawOrbitPath(distance) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path (faint line)
            drawOrbitPath(planet.distance);

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Special rendering for Saturn's ring
            if (planet.hasRing) {
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Draw an ellipse to simulate the ring
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI/2, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Update Angle
            planet.angle += planet.speed;
        }

        function animate() {
            // Clear canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();

            planets.forEach(planet => drawPlanet(planet));

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        animate();

    </script>
</body>
</html>
