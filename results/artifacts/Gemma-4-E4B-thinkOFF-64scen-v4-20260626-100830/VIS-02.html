<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const numStars = 500;
        const coreRadius = 50;
        const galaxyArmFactor = 2.5; // Controls how tightly the spiral wraps
        const rotationSpeed = 0.005; // Speed of rotation in radians per frame

        let stars = [];
        let time = 0;

        // --- Star Class ---
        class Star {
            constructor(index) {
                this.index = index;
                this.initialRadius = Math.random() * 150 + 50; // Base distance from core
                this.angle = Math.random() * Math.PI * 2; // Initial angle
                this.brightness = Math.random() * 0.5 + 0.5; // Base brightness (0.5 to 1.0)
                this.twinkleFactor = Math.random() * 0.3 + 0.7; // Controls twinkling amplitude
            }

            update(time) {
                // Spiral structure calculation: Radius increases with angle (logarithmic spiral approximation)
                // r = a * exp(b * theta)
                // Here, we use a simpler, more visible spiral based on the initial angle and rotation
                
                // Calculate the current angle, incorporating rotation
                const currentAngle = this.angle + time * rotationSpeed;
                
                // Calculate the radius based on the angle (simulating the spiral shape)
                // We modify the radius based on the angle to create the spiral arms
                const spiralEffect = Math.pow(Math.cos(this.angle * galaxyArmFactor) + 1, 2) * 0.5 + 0.5;
                
                // The final radius is modulated by the spiral effect and the base radius
                this.r = this.initialRadius * (1 + (spiralEffect - 0.5) * 0.5);
                this.theta = currentAngle;

                // Twinkle effect: Modulate brightness based on a sine wave tied to time
                const twinkle = (Math.sin((time * 5 + this.index) / 10) * 0.5 + 0.5);
                this.currentBrightness = this.brightness * this.twinkleFactor * twinkle;
            }

            draw(ctx) {
                const x = coreRadius + this.r * Math.cos(this.theta);
                const y = coreRadius + this.r * Math.sin(this.theta);

                // Color variation: Subtle blue/white hue shift
                const hue = 200 + (this.index % 5) * 5; // Slight variation in blue tones
                const saturation = 80;
                const lightness = 70;

                ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                ctx.globalAlpha = this.currentBrightness;
                
                // Draw a small point for the star
                ctx.beginPath();
                ctx.arc(x, y, 1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Initialization ---
        function initializeGalaxy() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star(i));
            }
        }

        // --- Animation Loop ---
        function animate(timestamp) {
            time = timestamp / 1000; // Convert ms to seconds

            // Clear canvas with black background
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slight trail effect for motion blur
            ctx.fillRect(0, 0, width, height);
            // Resetting to pure black for a cleaner look:
            // ctx.clearRect(0, 0, width, height);
            // ctx.fillStyle = '#000';
            // ctx.fillRect(0, 0, width, height);


            // Draw the bright core (optional, but adds definition)
            ctx.globalAlpha = 0.8;
            ctx.fillStyle = 'rgba(255, 255, 200, 0.9)'; // Pale yellow/white core
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, coreRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;


            // Update and draw stars
            stars.forEach(star => {
                star.update(time);
                star.draw(ctx);
            });

            requestAnimationFrame(animate);
        }

        // --- Event Listeners and Start ---
        window.addEventListener('resize', initializeGalaxy);
        
        initializeGalaxy();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
