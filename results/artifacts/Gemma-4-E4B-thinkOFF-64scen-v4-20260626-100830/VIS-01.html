<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000005;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            border: 1px solid #111;
        }
    </style>
</head>
<body>
    <canvas id="solarSystemCanvas"></canvas>

    <script>
        // --- Setup ---
        const canvas = document.getElementById('solarSystemCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to fill the window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Constants and Objects ---

        // Center of the solar system
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Starfield properties
        const numStars = 100;
        const stars = [];

        // Planet configuration: { radius, color, orbitalRadius, orbitalSpeed (degrees/frame), name }
        const planetsData = [
            // Mercury (Small, Fast)
            { radius: 3, color: '#b0a080', orbitalRadius: 60, orbitalSpeed: 0.04, name: 'Mercury' },
            // Venus (Slightly larger, Slower)
            { radius: 5, color: '#e09040', orbitalRadius: 90, orbitalSpeed: 0.025, name: 'Venus' },
            // Earth (Medium, Standard speed)
            { radius: 6, color: '#4090ff', orbitalRadius: 130, orbitalSpeed: 0.018, name: 'Earth' },
            // Mars (Smaller, Slower)
            { radius: 4, color: '#c04030', orbitalRadius: 170, orbitalSpeed: 0.015, name: 'Mars' },
            // Jupiter (Large, Slow)
            { radius: 12, color: '#e0c090', orbitalRadius: 230, orbitalSpeed: 0.008, name: 'Jupiter' },
            // Saturn (Large, Slower, with a ring visual)
            { radius: 10, color: '#c0b080', orbitalRadius: 290, orbitalSpeed: 0.006, name: 'Saturn' }
        ];

        // Sun properties
        const sun = {
            radius: 20,
            color: '#ffcc00',
            glow: 40
        };

        // Planet objects (to hold dynamic state)
        const planets = planetsData.map(data => ({
            ...data,
            angle: Math.random() * Math.PI * 2, // Initial random angle
            x: centerX + data.orbitalRadius,
            y: centerY
        }));

        // --- Initialization Functions ---

        function createStars() {
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    brightness: Math.random() * 0.8 + 0.2
                });
            }
        }

        // --- Drawing Functions ---

        function drawStarfield() {
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer glow effect
            ctx.shadowBlur = sun.glow;
            ctx.shadowColor = sun.color;
            
            // Draw the main body
            ctx.beginPath();
            ctx.arc(centerX, centerY, sun.radius, 0, Math.PI * 2);
            ctx.fillStyle = sun.color;
            ctx.fill();
            
            // Reset shadow for other drawings
            ctx.shadowBlur = 0;
        }

        function drawPlanet(planet) {
            // Draw the planet body
            ctx.beginPath();
            ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.fill();
            
            // Optional: Draw a subtle highlight
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Saturn Ring (Special case)
            if (planet.name === 'Saturn') {
                const ringWidth = 15;
                ctx.beginPath();
                ctx.ellipse(planet.x, planet.y, planet.radius + ringWidth, ringWidth, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(180, 170, 110, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // --- Update Logic ---

        function updatePlanets() {
            planets.forEach(planet => {
                // 1. Update angle based on speed
                planet.angle += planet.orbitalSpeed;

                // 2. Calculate new position using trigonometry (Polar to Cartesian conversion)
                planet.x = centerX + planet.orbitalRadius * Math.cos(planet.angle);
                planet.y = centerY + planet.orbitalRadius * Math.sin(planet.angle);
            });
        }

        // --- Main Animation Loop ---

        function animate() {
            // 1. Clear the canvas (creates the "starfield" effect by redrawing stars over the old frame)
            ctx.fillStyle = 'rgba(0, 0, 5, 0.1)'; // Slight trail effect, or use 'rgba(0, 0, 0, 0.1)' for a cleaner fade
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // For a perfect black background, use:
            // ctx.clearRect(0, 0, canvas.width, canvas.height); 

            // 2. Update positions
            updatePlanets();

            // 3. Draw elements
            drawStarfield();
            drawSun();
            planets.forEach(drawPlanet);

            // 4. Request next frame
            requestAnimationFrame(animate);
        }

        // --- Event Listeners and Initialization ---

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Re-center the sun if the window size changes dramatically
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
        });

        // Start the simulation
        createStars();
        animate();

    </script>
</body>
</html>
