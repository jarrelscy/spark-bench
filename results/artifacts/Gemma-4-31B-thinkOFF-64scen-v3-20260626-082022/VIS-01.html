<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050508;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        const planets = [];

        const planetData = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, orbit: 60, speed: 0.047 },
            { name: "Venus", color: "#E3BB76", radius: 7, orbit: 90, speed: 0.035 },
            { name: "Earth", color: "#2271B3", radius: 7.5, orbit: 130, speed: 0.029 },
            { name: "Mars", color: "#E27B58", radius: 5, orbit: 170, speed: 0.024 },
            { name: "Jupiter", color: "#D39C7E", radius: 18, orbit: 240, speed: 0.013 },
            { name: "Saturn", color: "#C5AB6E", radius: 15, orbit: 310, speed: 0.009 }
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function initPlanets() {
            planets.length = 0;
            planetData.forEach(data => {
                planets.push({
                    ...data,
                    angle: Math.random() * Math.PI * 2
                });
            });
        }

        function draw() {
            // Clear background
            ctx.fillStyle = "#050508";
            ctx.fillRect(0, 0, width, height);

            // Draw Starfield
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Sun (Glowing)
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 30);
            sunGradient.addColorStop(0, "#FFF5F2");
            sunGradient.addColorStop(0.2, "#FFD200");
            sunGradient.addColorStop(0.5, "#F7941E");
            sunGradient.addColorStop(1, "transparent");

            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fill();

            // Draw Planets
            planets.forEach(planet => {
                // Draw Orbit Path
                ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbit, 0, Math.PI * 2);
                ctx.stroke();

                // Calculate Position
                const x = centerX + Math.cos(planet.angle) * planet.orbit;
                const y = centerY + Math.sin(planet.angle) * planet.orbit;

                // Draw Planet
                ctx.fillStyle = planet.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Update angle for next frame
                planet.angle += planet.speed * 0.5;
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        initPlanets();
        draw();
    </script>
</body>
</html>
