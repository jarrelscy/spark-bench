<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, stars = [];
        const STAR_COUNT = 800;
        const ARMS = 3;
        const ARM_TIGHTNESS = 0.15;
        const ROTATION_SPEED = 0.002;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            stars = [];

            for (let i = 0; i < STAR_COUNT; i++) {
                // Random distance from center
                const distance = Math.random() * (Math.min(width, height) * 0.4);
                
                // Assign to one of the spiral arms
                const armIndex = Math.floor(Math.random() * ARMS);
                const armOffset = (armIndex / ARMS) * Math.PI * 2;
                
                // The "spiral" math: angle increases as distance increases
                const angle = distance * ARM_TIGHTNESS + armOffset;
                
                // Add some randomness/spread to the arm
                const spread = (Math.random() - 0.5) * (distance * 0.2);
                
                // Color variation: blueish to whiteish
                const hue = 200 + Math.random() * 40; 
                const brightness = 70 + Math.random() * 30;
                
                stars.push({
                    distance: distance,
                    angle: angle + spread,
                    size: Math.random() * 1.5 + 0.5,
                    color: `hsl(${hue}, 80%, ${brightness}%)`,
                    twinkle: Math.random() * Math.PI,
                    twinkleSpeed: 0.02 + Math.random() * 0.05
                });
            }
        }

        function draw() {
            // Create a slight trail effect by not fully clearing the screen
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fill();

            stars.forEach(star => {
                // Update rotation
                star.angle += ROTATION_SPEED * (1 - star.distance / (Math.min(width, height) * 0.4));
                
                // Update twinkle
                star.twinkle += star.twinkleSpeed;
                const opacity = 0.5 + Math.sin(star.twinkle) * 0.5;

                // Convert polar coordinates to Cartesian
                const x = centerX + Math.cos(star.angle) * star.distance;
                const y = centerY + Math.sin(star.angle) * star.distance;

                ctx.globalAlpha = opacity;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(x, y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1.0;
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);

        init();
        draw();
    </script>
</body>
</html>
