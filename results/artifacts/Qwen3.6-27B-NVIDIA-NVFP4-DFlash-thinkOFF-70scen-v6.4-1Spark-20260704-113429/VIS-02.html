<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const stars = [];
        // Configuration
        const STAR_COUNT = 1500;
        const ARM_COUNT = 3;
        const ARM_SPREAD = 0.8; // How wide the arms are
        const GALAXY_SIZE = 300; // Base radius factor
        const CORE_SIZE = 30;

        // Resize handling
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            // Adjust galaxy size based on screen
            // Keep it responsive but not too huge on mobile
            const minDim = Math.min(width, height);
            // Reset stars if needed or just let them flow (flow looks cooler)
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Determine if this star is part of the core or the arms
                // 15% of stars are core stars
                this.isCore = Math.random() < 0.15;

                if (this.isCore) {
                    // Core stars: clustered near center, random angle
                    const angle = Math.random() * Math.PI * 2;
                    // Gaussian-ish distribution for core density
                    const r = Math.random() * Math.random() * CORE_SIZE; 
                    this.radius = r;
                    this.angle = angle;
                    this.speed = 0.02 + Math.random() * 0.02; // Fast rotation near center
                    this.size = Math.random() * 1.5 + 0.5;
                    this.color = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.5})`;
                } else {
                    // Arm stars: spiral distribution
                    // Determine which arm this star belongs to
                    const armIndex = Math.floor(Math.random() * ARM_COUNT);
                    const armOffset = (Math.PI * 2 / ARM_COUNT) * armIndex;
                    
                    // Distance from center (0 to 1)
                    this.radius = Math.random() * (Math.min(width, height) / 2.5) + 20;
                    
                    // Spiral logic: angle depends on radius
                    // The further out, the more the angle shifts
                    const spiralFactor = 1.5; 
                    const baseAngle = (this.radius / 100) * spiralFactor;
                    
                    // Add spread to make the arm thick
                    const spread = (Math.random() - 0.5) * ARM_SPREAD;
                    
                    this.angle = baseAngle + armOffset + spread;
                    
                    // Orbital speed: slower further out (Kepler-ish)
                    // Add some randomness to prevent rigid rotation
                    this.speed = (10 / (this.radius + 50)) * 0.05;
                    
                    this.size = Math.random() * 1.5 + 0.2;
                    
                    // Color variation based on distance (Blue/White young stars outside, Redder inside)
                    const hue = 200 + (Math.random() * 60); // Blue to Purple range
                    const sat = 50 + Math.random() * 50;
                    const light = 80 + Math.random() * 20;
                    this.color = `hsla(${hue}, ${sat}%, ${light}%, 0.8)`;
                }

                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
            }

            update() {
                // Rotate
                this.angle += this.speed;
                
                // Slight radial drift for organic feel
                if (!this.isCore) {
                    this.radius += (Math.random() - 0.5) * 0.2;
                    // Keep within bounds
                    const limit = Math.min(width, height) / 2.5;
                    if (this.radius > limit) this.radius = limit;
                    if (this.radius < 20) this.radius = 20;
                }
            }

            draw(ctx) {
                // Calculate twinkle alpha
                const twinkle = Math.sin(Date.now() * 0.005 * this.twinkleSpeed + this.twinkleOffset);
                const alpha = 0.5 + (twinkle * 0.5); // 0 to 1

                const x = centerX + Math.cos(this.angle) * this.radius;
                const y = centerY + Math.sin(this.angle) * this.radius;

                ctx.globalAlpha = this.isCore ? 1 : alpha;
                
                if (this.isCore) {
                    ctx.fillStyle = '#fff';
                } else {
                    ctx.fillStyle = this.color;
                }
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize stars
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        function animate() {
            // Clear canvas with a slight fade for trails (optional, but clean clear is better for sharp stars)
            ctx.clearRect(0, 0, width, height);
            
            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_SIZE * 2);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(200, 220, 255, 0.4)');
            gradient.addColorStop(0.5, 'rgba(100, 150, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_SIZE * 2, 0, Math.PI * 2);
            ctx.fill();

            // Draw Stars
            // Use 'lighter' composite operation for glowing effect when stars overlap
            ctx.globalCompositeOperation = 'lighter';
            
            stars.forEach(star => {
                star.update();
                star.draw(ctx);
            });

            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>
