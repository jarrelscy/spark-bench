<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Starfield data
        const stars = [];
        const numStars = 400;

        // Planet definitions
        // Distances and speeds are relative for visual effect, not scientifically accurate
        const planets = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
            { name: "Venus", color: "#E3BB76", radius: 6, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
            { name: "Earth", color: "#22A6B3", radius: 6.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
            { name: "Mars", color: "#EB4D4B", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D09E5F", radius: 12, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", color: "#F0C27B", radius: 10, distance: 310, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRings: true },
            { name: "Uranus", color: "#7ED6DF", radius: 8, distance: 380, speed: 0.002, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#30336B", radius: 8, distance: 440, speed: 0.0015, angle: Math.random() * Math.PI * 2 }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.5 + 0.3
                });
            }
        }

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 0, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 140, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');
            
            ctx.beginPath();
            ctx.fillStyle = gradient;
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fill();

            // Core
            ctx.beginPath();
            ctx.fillStyle = '#FFD700';
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOrbit(distance) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path
            drawOrbit(planet.distance);

            // Draw Planet
            ctx.beginPath();
            ctx.fillStyle = planet.color;
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Shadow (simple shading effect)
            // Calculate angle to sun to determine shadow direction
            const angleToSun = Math.atan2(centerY - y, centerX - x);
            
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.clip(); // Clip to planet shape
            
            // Draw a shadow gradient
            const shadowGrad = ctx.createRadialGradient(
                x - Math.cos(angleToSun) * planet.radius, 
                y - Math.sin(angleToSun) * planet.radius, 
                0,
                x, y, planet.radius
            );
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
            
            ctx.fillStyle = shadowGrad;
            ctx.fillRect(x - planet.radius, y - planet.radius, planet.radius * 2, planet.radius * 2);
            ctx.restore();

            // Draw Saturn's Rings
            if (planet.hasRings) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(planet.angle + Math.PI / 4); // Rotate rings slightly
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.7)';
                ctx.lineWidth = 2;
                // Draw rings as an ellipse
                ctx.ellipse(0, 0, planet.radius * 2.2, planet.radius * 0.6, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Draw Planet Name
            ctx.font = '10px Arial';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 12);
        }

        function animate() {
            // Clear canvas
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw static elements
            drawStars();
            drawSun();

            // Update and draw planets
            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        resize();
        initStars();
        animate();
    </script>
</body>
</html>
