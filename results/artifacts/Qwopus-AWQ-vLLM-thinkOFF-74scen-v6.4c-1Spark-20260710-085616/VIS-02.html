<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const starCount = 1500;
        const arms = 3;
        const stars = [];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Star Class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center
                this.distance = Math.random() * (Math.min(width, height) * 0.45);
                
                // Base angle offset for spiral arms
                this.angleOffset = Math.random() * (Math.PI * 2);
                
                // Assign to a specific arm
                this.armIndex = Math.floor(Math.random() * arms);
                
                // Size (closer stars are larger)
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color variation
                const r = 100 + Math.random() * 155; // 100-255
                const g = 100 + Math.random() * 155; // 100-255
                const b = 150 + Math.random() * 105; // 150-255
                this.color = `rgb(${r},${g},${b})`;
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = Math.random() * 0.5 + 0.5;
            }

            update(time) {
                // Orbital speed decreases with distance (Keplerian-ish)
                const speed = 0.0005 / (this.distance * 0.01 + 1);
                
                // Calculate current angle based on spiral shape
                // The spiral shape is defined by angle = distance * spiralTightness + baseAngle
                const spiralTightness = 0.02;
                const spiralAngle = this.distance * spiralTightness;
                
                // Current angle includes rotation over time
                const currentAngle = this.angleOffset + spiralAngle + time * speed;

                // Calculate X and Y coordinates
                this.x = centerX + Math.cos(currentAngle) * this.distance;
                this.y = centerY + Math.sin(currentAngle) * this.distance;

                // Calculate twinkle
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                this.alpha = this.baseAlpha + (twinkle * 0.3);
                if (this.alpha < 0.1) this.alpha = 0.1;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize stars
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        // Draw the glowing core
        function drawCore() {
            const radius = Math.min(width, height) * 0.05;
            
            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius * 4);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.1, 'rgba(200, 220, 255, 0.8)');
            gradient.addColorStop(0.3, 'rgba(150, 180, 255, 0.3)');
            gradient.addColorStop(0.6, 'rgba(100, 120, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Animation loop
        let time = 0;
        function animate() {
            // Clear canvas with black background
            ctx.fillStyle = '#000000';
            ctx.globalAlpha = 1;
            ctx.fillRect(0, 0, width, height);

            // Draw core
            drawCore();

            // Update and draw stars
            for (let i = 0; i < stars.length; i++) {
                stars[i].update(time);
                stars[i].draw(ctx);
            }

            time++;
            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
