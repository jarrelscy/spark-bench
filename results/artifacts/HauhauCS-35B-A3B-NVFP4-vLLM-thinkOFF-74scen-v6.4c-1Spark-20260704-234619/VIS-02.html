<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiral Galaxy</title>
<style>
* { margin: 0; padding: 0; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
const canvas = document.getElementById('galaxy');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NUM_STARS = 800;
const NUM_ARMS = 4;
const ARM_SPREAD = 0.6;
const CORE_BRIGHTNESS = 1.0;

// Precompute star data
const stars = [];

function createStars() {
    for (let i = 0; i < NUM_STARS; i++) {
        const armIndex = Math.floor(Math.random() * NUM_ARMS);
        const armAngle = (armIndex / NUM_ARMS) * Math.PI * 2;

        // Distance from center (0 to 1, with more stars near center)
        const dist = Math.pow(Math.random(), 0.6) * 0.95;

        // Spiral angle increases with distance
        const spiralFactor = 3.5;
        const spiralAngle = armAngle + dist * spiralFactor;

        // Add spread to arms
        const spread = (Math.random() - 0.5) * ARM_SPREAD * (1 - dist * 0.5);

        const angle = spiralAngle + spread;
        const radius = dist * Math.min(W, H) * 0.42;

        // Star brightness: brighter near center, dimmer at edges
        const baseBrightness = Math.pow(1 - dist * 0.7, 1.5) * (0.3 + Math.random() * 0.7);

        // Color: warm tones near center, cooler at edges
        const hueShift = dist * 40;
        const r = Math.min(255, 255 * baseBrightness * (0.8 + Math.random() * 0.2));
        const g = Math.min(255, 200 * baseBrightness * (0.7 + Math.random() * 0.3));
        const b = Math.min(255, 150 * baseBrightness * (0.5 + Math.random() * 0.5));

        // Twinkle properties
        const twinkleSpeed = 0.5 + Math.random() * 3;
        const twinklePhase = Math.random() * Math.PI * 2;
        const twinkleAmp = 0.1 + Math.random() * 0.3;

        // Star size
        const size = 0.5 + Math.random() * 1.5;

        stars.push({
            baseX: Math.cos(angle) * radius,
            baseY: Math.sin(angle) * radius,
            radius: radius,
            angle: angle,
            baseBrightness: baseBrightness,
            r: r,
            g: g,
            b: b,
            twinkleSpeed: twinkleSpeed,
            twinklePhase: twinklePhase,
            twinkleAmp: twinkleAmp,
            size: size,
            rotationSpeed: 0.0002 + (1 - dist) * 0.0008
        });
    }
}

createStars();

// Core star glow particles
const CORE_STARS = 120;
const coreStars = [];
for (let i = 0; i < CORE_STARS; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.pow(Math.random(), 2) * 0.15;
    coreStars.push({
        x: Math.cos(angle) * dist * Math.min(W, H) * 0.42,
        y: Math.sin(angle) * dist * Math.min(W, H) * 0.42,
        size: 0.5 + Math.random() * 2,
        brightness: 0.5 + Math.random() * 0.5,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 2
    });
}

let time = 0;

function draw() {
    // Fade effect for trails
    ctx.fillStyle = 'rgba(0, 0, 0, 1)';
    ctx.fillRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    time += 0.016;

    // Draw core glow
    const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) * 0.08);
    coreGrad.addColorStop(0, 'rgba(255, 240, 220, 0.6)');
    coreGrad.addColorStop(0.1, 'rgba(255, 220, 180, 0.3)');
    coreGrad.addColorStop(0.4, 'rgba(200, 160, 120, 0.08)');
    coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, Math.min(W, H) * 0.08, 0, Math.PI * 2);
    ctx.fill();

    // Draw core stars
    for (const s of coreStars) {
        const twinkle = 0.5 + 0.5 * Math.sin(time * s.speed + s.phase);
        const alpha = s.brightness * twinkle * 0.7;
        const sz = s.size * twinkle;

        const grad = ctx.createRadialGradient(
            cx + s.x, cy + s.y, 0,
            cx + s.x, cy + s.y, sz * 3
        );
        grad.addColorStop(0, `rgba(255, 240, 220, ${alpha})`);
        grad.addColorStop(0.3, `rgba(255, 200, 150, ${alpha * 0.4})`);
        grad.addColorStop(1, 'rgba(255, 180, 120, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx + s.x, cy + s.y, sz * 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw spiral stars
    for (const star of stars) {
        // Update rotation
        star.angle += star.rotationSpeed * 0.016;

        const x = cx + Math.cos(star.angle) * star.radius;
        const y = cy + Math.sin(star.angle) * star.radius;

        // Twinkle
        const twinkle = 1.0 - star.twinkleAmp + star.twinkleAmp * (0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.twinklePhase));
        const alpha = star.baseBrightness * twinkle;

        if (alpha < 0.01) continue;

        const sz = star.size * (0.7 + twinkle * 0.3);

        // Star glow
        if (sz > 0.8) {
            const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, sz * 4);
            glowGrad.addColorStop(0, `rgba(${Math.round(star.r)}, ${Math.round(star.g)}, ${Math.round(star.b)}, ${alpha * 0.3})`);
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(x, y, sz * 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Star point
        const starGrad = ctx.createRadialGradient(x, y, 0, x, y, sz);
        starGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        starGrad.addColorStop(0.4, `rgba(${Math.round(star.r)}, ${Math.round(star.g)}, ${Math.round(star.b)}, ${alpha * 0.6})`);
        starGrad.addColorStop(1, `rgba(${Math.round(star.r)}, ${Math.round(star.g)}, ${Math.round(star.b)}, 0)`);
        ctx.fillStyle = starGrad;
        ctx.beginPath();
        ctx.arc(x, y, sz, 0, Math.PI * 2);
        ctx.fill();
    }

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
