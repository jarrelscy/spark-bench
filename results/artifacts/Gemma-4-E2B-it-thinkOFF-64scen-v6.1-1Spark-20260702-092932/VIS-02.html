<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Configuration for the galaxy
        const numStars = 500;
        const coreRadius = Math.min(width, height) * 0.1;
        const coreX = width / 2;
        const coreY = height / 2;
        const coreSize = 10;
        const starCount = numStars;

        let stars = [];
        let animationFrameId;

        // Star object structure
        class Star {
            constructor(x, y, distance, speed, colorHue) {
                this.x = x;
                this.y = y;
                this.distance = distance; // Distance from the core
                this.speed = speed;       // Orbital speed
                this.angle = Math.random() * Math.PI * 2; // Initial angle
                this.radius = Math.random() * 100 + 10; // Size variation
                this.colorHue = colorHue; // Base hue for color variation
                this.twinkle = Math.random() * 0.5 + 0.5; // Twinkle intensity
                this.size = Math.random() * 1.5 + 0.5;
            }

            update() {
                // Calculate orbital position based on distance and speed
                this.angle += this.speed * 0.005; // Orbital rotation speed
                this.x = coreX + Math.cos(this.angle) * this.distance;
                this.y = coreY + Math.sin(this.angle) * this.distance;

                // Subtle twinkling effect (small random jitter)
                this.x += Math.sin(Date.now() * 0.005 + this.distance) * 0.1;
                this.y += Math.cos(Date.now() * 0.005 + this.distance) * 0.1;
            }

            draw() {
                // Color variation based on hue and twinkle
                const r = Math.floor(100 + Math.sin(Date.now() * 0.005 + this.colorHue) * 50);
                const g = Math.floor(100 + Math.cos(Date.now() * 0.005 + this.colorHue + Math.PI / 2) * 50);
                const b = Math.floor(100 + Math.sin(Date.now() * 0.005 + this.colorHue + 1) * 50);

                const alpha = 0.5 + this.twinkle * 0.5;

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize stars
        function initializeStars() {
            for (let i = 0; i < starCount; i++) {
                // Distribute stars in a somewhat spiral pattern
                const distance = Math.random() * (Math.min(width, height) - coreRadius) + coreRadius;
                const speed = Math.random() * 0.5 + 0.5; // Orbital speed
                const colorHue = Math.random() * 360; // Full spectrum of colors
                stars.push(new Star(0, 0, distance, speed, colorHue));
            }
        }

        // Draw the central core
        function drawCore() {
            const gradient = ctx.createRadialGradient(coreX, coreY, 0, coreX, coreY, coreSize * 2);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)'); // Bright center
            gradient.addColorStop(0.5, 'rgba(255, 150, 50, 0.8)'); // Orange/Yellow glow
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Fades to black

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(coreX, coreY, coreSize * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Main animation loop
        function animate() {
            // 1. Clear the canvas (with a very slight fade for a trail effect)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Subtle persistence
            ctx.fillRect(0, 0, width, height);

            // 2. Draw the core
            drawCore();

            // 3. Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Request the next frame
            animationFrameId = requestAnimationFrame(animate);
        }

        // Handle resizing
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Re-center core if necessary, though the core is centered by default
        });

        // Start the application
        initializeStars();
        animate();

    </script>
</body>
</html>
