<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystemCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarSystemCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas dimensions to fill the window
        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        // --- Constants ---
        const CENTER_X = W / 2;
        const CENTER_Y = H / 2;
        const G = 0.0005; // Gravitational constant (scaled for visual effect)
        const SUN_RADIUS = 20;
        const PLANET_CONFIG = [
            { name: "Mercury", radius: 50, color: "#a9a9a9", speed: 0.015, mass: 1 },
            { name: "Venus", radius: 70, color: "#e6b800", speed: 0.010, mass: 2 },
            { name: "Earth", radius: 100, color: "#4169E1", speed: 0.007, mass: 4 },
            { name: "Mars", radius: 130, color: "#B22222", speed: 0.005, mass: 3 },
            { name: "Jupiter", radius: 170, color: "#FFD700", speed: 0.003, mass: 8 },
            { name: "Saturn", radius: 210, color: "#DAA520", speed: 0.002, mass: 6 }
        ];

        let planets = [];
        let sun;

        // --- Initialization ---

        function initializeSolarSystem() {
            // Create the Sun
            sun = {
                x: CENTER_X,
                y: CENTER_Y,
                radius: SUN_RADIUS,
                color: "#FFFF00",
                mass: 100, // High mass for gravitational pull
                glowRadius: 50 // For the glow effect
            };

            // Create planets
            PLANET_CONFIG.forEach(config => {
                planets.push({
                    name: config.name,
                    radius: config.radius,
                    color: config.color,
                    speed: config.speed,
                    mass: config.mass,
                    distance: Math.random() * (W / 2 - 100) + 100, // Initial random distance from center
                    angle: Math.random() * Math.PI * 2, // Initial angle
                    vx: 0, // Velocity x
                    vy: 0, // Velocity y
                    isOrbiting: true
                });
            });
        }

        // --- Drawing Functions ---

        function drawStarfield() {
            // Draw a dark background (simulating space)
            ctx.fillStyle = 'rgba(0, 0, 10, 1)'; // Very dark blue/black
            ctx.fillRect(0, 0, W, H);

            // Simple starfield effect (optional: can be enhanced with many small dots)
            ctx.fillStyle = 'white';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * W;
                const y = Math.random() * H;
                const size = Math.random() * 1;
                ctx.fillRect(x, y, size, size);
            }
        }

        function drawSun() {
            const { x, y, radius, color, glowRadius } = sun;

            // 1. Draw the glow (simulating light)
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, glowRadius);
            gradient.addColorStop(0, `rgba(255, 255, 150, 1)`);
            gradient.addColorStop(0.5, `rgba(255, 165, 0, 0.8)`);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
            ctx.fill();

            // 2. Draw the Sun body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlanet(planet) {
            // Draw orbit path (optional: for visualization)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(CENTER_X, CENTER_Y, planet.distance, 0, Math.PI * 2);
            ctx.stroke();

            // Draw the planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(planet.x, planet.y, 5, 0, Math.PI * 2);
            ctx.fill();

            // Optional: Draw a highlight
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(planet.x, planet.y, 2, 0, Math.PI * 2);
            ctx.stroke();
        }

        // --- Physics & Update ---

        function updatePositions() {
            // 1. Update planet positions based on their orbital mechanics (simplified circular motion)
            planets.forEach(planet => {
                if (planet.isOrbiting) {
                    // Update angle based on speed
                    planet.angle += planet.speed;

                    // Calculate new position
                    planet.x = CENTER_X + planet.distance * Math.cos(planet.angle);
                    planet.y = CENTER_Y + planet.distance * Math.sin(planet.angle);
                }
            });
        }

        function calculateGravity() {
            // Calculate gravitational forces between all bodies (Sun and planets)
            const sunPos = { x: CENTER_X, y: CENTER_Y };

            planets.forEach(p1 => {
                // Calculate force exerted by the Sun on p1
                const dx = sunPos.x - p1.x;
                const dy = sunPos.y - p1.y;
                const distanceSq = dx * dx + dy * dy;
                const distance = Math.sqrt(distanceSq);

                if (distance > 1) {
                    // F = G * M1 * M2 / r^2
                    const force = (G * sun.mass * p1.mass) / distanceSq;

                    // Acceleration (a = F/m)
                    const ax = (force * dx) / p1.mass;
                    const ay = (force * dy) / p1.mass;

                    // Update velocity (v = v + a*dt). Since dt is implicitly handled by speed/angle update,
                    // we'll apply a damping/correction factor to the velocity based on the force.
                    p1.vx = ax;
                    p1.vy = ay;
                }
            });
        }

        function update() {
            calculateGravity();
            updatePositions();
        }

        // --- Main Loop ---

        function animate() {
            // Clear canvas
            drawStarfield();

            // Update physics
            update();

            // Draw elements
            drawSun();

            planets.forEach(drawPlanet);

            requestAnimationFrame(animate);
        }

        // --- Event Listeners ---

        window.addEventListener('resize', () => {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            CENTER_X = W / 2;
            CENTER_Y = H / 2;
        });

        // Start the simulation
        initializeSolarSystem();
        animate();

    </script>
</body>
</html>
