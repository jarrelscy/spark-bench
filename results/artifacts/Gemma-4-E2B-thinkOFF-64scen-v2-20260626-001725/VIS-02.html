<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- Galaxy Parameters ---
        const numStars = 500;
        const coreRadius = Math.min(width, height) * 0.1;
        const coreColor = 'yellow';
        const starColorVariation = 255; // Max variation for star color
        const twinkleFactor = 0.8; // How much the brightness fluctuates

        let stars = [];
        let animationFrameId;

        // --- Star Class ---
        class Star {
            constructor(x, y, distance, speed, colorHue) {
                this.x = x;
                this.y = y;
                this.distance = distance; // Distance from the center
                this.speed = speed;       // Orbital speed
                this.angle = Math.random() * Math.PI * 2; // Initial angle
                this.radius = Math.random() * 10 + 1; // Size of the star
                this.colorHue = colorHue + (Math.random() * starColorVariation);
                this.twinkle = Math.random() * 0.5 + 0.5; // Base twinkle intensity
            }

            update() {
                // Orbital movement (spiral effect)
                this.angle += this.speed * 0.001; // Slow rotation speed
                this.x = this.distance * Math.cos(this.angle);
                this.y = this.distance * Math.sin(this.angle);

                // Subtle movement/twinkle effect
                this.twinkle = Math.max(0.1, this.twinkle + (Math.random() - 0.5) * 0.01);

                // Boundary wrapping (to keep stars on screen or cycling)
                if (this.x < -this.distance) this.x = width + this.distance;
                if (this.x > width + this.distance) this.x = -this.distance;
                if (this.y < -this.distance) this.y = height + this.distance;
                if (this.y > height + this.distance) this.y = -this.distance;
            }

            draw() {
                // Calculate brightness based on twinkle
                const brightness = 1 - (this.twinkle * 0.5); // Base brightness

                // Color interpolation (using HSL for easier variation)
                const color = `hsl(${this.colorHue}, 100%, ${brightness * 50}%)`;

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * (0.5 + Math.random() * 0.5), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Initialization ---
        function initializeStars() {
            stars = [];
            const centerX = width / 2;
            const centerY = height / 2;

            for (let i = 0; i < numStars; i++) {
                // Distribute stars radially, favoring the outer spiral
                const distance = coreRadius + Math.random() * (Math.min(width, height) - coreRadius) * 0.8;
                const speed = 0.5 + Math.random() * 1.5; // Varying orbital speeds
                const colorHue = Math.random() * 360;

                stars.push(new Star(centerX, centerY, distance, speed, colorHue));
            }
        }

        // --- Animation Loop ---
        function animate() {
            // 1. Fade the background slightly to create a trailing/star-field effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Low alpha for subtle trail
            ctx.fillRect(0, 0, width, height);

            // 2. Draw the core (Bright center)
            const coreRadiusPx = coreRadius * (canvas.width / width);
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, coreRadiusPx
            );
            gradient.addColorStop(0, 'rgba(255, 255, 150, 1)');
            gradient.addColorStop(0.5, 'rgba(255, 165, 0, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, coreRadiusPx, 0, Math.PI * 2);
            ctx.fill();


            // 3. Update and Draw Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        // Start the simulation
        initializeStars();
        animate();

    </script>
</body>
</html>
