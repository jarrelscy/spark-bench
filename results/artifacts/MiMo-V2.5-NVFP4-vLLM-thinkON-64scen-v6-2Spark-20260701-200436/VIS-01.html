<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #000;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
}
canvas {
display: block;
}
</style>
</head>
<body>
<canvas id="solarSystem"></canvas>
<script>
const canvas = document.getElementById('solarSystem');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
W = canvas.width = window.innerWidth;
H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Stars ---
const stars = [];
for (let i = 0; i < 500; i++) {
stars.push({
x: Math.random(),
y: Math.random(),
r: Math.random() * 1.5 + 0.3,
brightness: Math.random() * 0.7 + 0.3,
twinkleSpeed: Math.random() * 0.02 + 0.005,
twinkleOffset: Math.random() * Math.PI * 2
});
}

function drawStars(time) {
for (const s of stars) {
const alpha = s.brightness * (0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset));
ctx.beginPath();
ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
ctx.fill();
}
}

// --- Sun ---
function drawSun(cx, cy, time) {
const pulse = 1 + 0.03 * Math.sin(time * 0.002);

// Outer corona
for (let i = 5; i >= 0; i--) {
const radius = (28 + i * 18) * pulse;
const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
grad.addColorStop(0, `rgba(255, 200, 50, ${0.08 - i * 0.012})`);
grad.addColorStop(1, 'rgba(255, 200, 50, 0)');
ctx.beginPath();
ctx.arc(cx, cy, radius, 0, Math.PI * 2);
ctx.fillStyle = grad;
ctx.fill();
}

// Inner glow
const innerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22 * pulse);
innerGrad.addColorStop(0, '#fffbe6');
innerGrad.addColorStop(0.3, '#ffdd44');
innerGrad.addColorStop(0.7, '#ffaa00');
innerGrad.addColorStop(1, 'rgba(255, 120, 0, 0)');
ctx.beginPath();
ctx.arc(cx, cy, 22 * pulse, 0, Math.PI * 2);
ctx.fillStyle = innerGrad;
ctx.fill();

// Core
const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 12);
coreGrad.addColorStop(0, '#ffffff');
coreGrad.addColorStop(0.5, '#ffee88');
coreGrad.addColorStop(1, '#ffcc00');
ctx.beginPath();
ctx.arc(cx, cy, 12, 0, Math.PI * 2);
ctx.fillStyle = coreGrad;
ctx.fill();
}

// --- Planets ---
const planets = [
{
name: 'Mercury',
color: '#b5a7a0',
glow: 'rgba(181, 167, 160, 0.3)',
radius: 3,
orbitRadius: 60,
speed: 0.042,
angle: Math.random() * Math.PI * 2,
ring: false
},
{
name: 'Venus',
color: '#e8cda0',
glow: 'rgba(232, 205, 160, 0.3)',
radius: 5,
orbitRadius: 90,
speed: 0.032,
angle: Math.random() * Math.PI * 2,
ring: false
},
{
name: 'Earth',
color: '#4fa4e8',
glow: 'rgba(79, 164, 232, 0.3)',
radius: 5.5,
orbitRadius: 125,
speed: 0.025,
angle: Math.random() * Math.PI * 2,
ring: false
},
{
name: 'Mars',
color: '#d4654a',
glow: 'rgba(212, 101, 74, 0.3)',
radius: 4.5,
orbitRadius: 165,
speed: 0.019,
angle: Math.random() * Math.PI * 2,
ring: false
},
{
name: 'Jupiter',
color: '#c8a56e',
glow: 'rgba(200, 165, 110, 0.3)',
radius: 12,
orbitRadius: 225,
speed: 0.012,
angle: Math.random() * Math.PI * 2,
ring: false
},
{
name: 'Saturn',
color: '#e0c88a',
glow: 'rgba(224, 200, 138, 0.3)',
radius: 10,
orbitRadius: 290,
speed: 0.009,
angle: Math.random() * Math.PI * 2,
ring: true
},
{
name: 'Uranus',
color: '#7ecfcf',
glow: 'rgba(126, 207, 207, 0.3)',
radius: 7,
orbitRadius: 350,
speed: 0.006,
angle: Math.random() * Math.PI * 2,
ring: false
},
{
name: 'Neptune',
color: '#4a6ee0',
glow: 'rgba(74, 110, 224, 0.3)',
radius: 6.5,
orbitRadius: 400,
speed: 0.004,
angle: Math.random() * Math.PI * 2,
ring: false
}
];

function getScale() {
return Math.min(W, H) / 900;
}

function drawOrbitPath(cx, cy, orbitR, scale) {
ctx.beginPath();
ctx.arc(cx, cy, orbitR * scale, 0, Math.PI * 2);
ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
ctx.lineWidth = 1;
ctx.stroke();
}

function drawPlanet(p, cx, cy, scale, time) {
p.angle += p.speed * 0.016;
const x = cx + Math.cos(p.angle) * p.orbitRadius * scale;
const y = cy + Math.sin(p.angle) * p.orbitRadius * scale;
const r = p.radius * scale;

// Planet glow
const glowGrad = ctx.createRadialGradient(x, y, 0, x, y, r * 2.5);
glowGrad.addColorStop(0, p.glow);
glowGrad.addColorStop(1, 'transparent');
ctx.beginPath();
ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
ctx.fillStyle = glowGrad;
ctx.fill();

// Ring for Saturn
if (p.ring) {
ctx.save();
ctx.translate(x, y);
ctx.scale(1, 0.35);
ctx.beginPath();
ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
ctx.strokeStyle = 'rgba(224, 200, 138, 0.5)';
ctx.lineWidth = 2 * scale;
ctx.stroke();
ctx.beginPath();
ctx.arc(0, 0, r * 1.8, 0, Math.PI * 2);
ctx.strokeStyle = 'rgba(224, 200, 138, 0.3)';
ctx.lineWidth = 1.5 * scale;
ctx.stroke();
ctx.restore();
}

// Planet body
const planetGrad = ctx.createRadialGradient(
x - r * 0.3, y - r * 0.3, r * 0.1,
x, y, r
);
planetGrad.addColorStop(0, lightenColor(p.color, 40));
planetGrad.addColorStop(0.7, p.color);
planetGrad.addColorStop(1, darkenColor(p.color, 50));
ctx.beginPath();
ctx.arc(x, y, r, 0, Math.PI * 2);
ctx.fillStyle = planetGrad;
ctx.fill();

// Name label
ctx.font = `${Math.max(10, 10 * scale)}px Arial, sans-serif`;
ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
ctx.textAlign = 'center';
ctx.fillText(p.name, x, y + r + 12 * scale);
}

function lightenColor(hex, amount) {
const num = parseInt(hex.slice(1), 16);
let r = Math.min(255, ((num >> 16) & 0xFF) + amount);
let g = Math.min(255, ((num >> 8) & 0xFF) + amount);
let b = Math.min(255, (num & 0xFF) + amount);
return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, amount) {
const num = parseInt(hex.slice(1), 16);
let r = Math.max(0, ((num >> 16) & 0xFF) - amount);
let g = Math.max(0, ((num >> 8) & 0xFF) - amount);
let b = Math.max(0, (num & 0xFF) - amount);
return `rgb(${r},${g},${b})`;
}

// --- Asteroid Belt (between Mars and Jupiter) ---
const asteroids = [];
for (let i = 0; i < 120; i++) {
asteroids.push({
angle: Math.random() * Math.PI * 2,
dist: 185 + Math.random() * 25,
size: Math.random() * 1.2 + 0.3,
speed: 0.007 + Math.random() * 0.003,
brightness: Math.random() * 0.3 + 0.1
});
}

function drawAsteroids(cx, cy, scale, time) {
for (const a of asteroids) {
a.angle += a.speed * 0.016;
const x = cx + Math.cos(a.angle) * a.dist * scale;
const y = cy + Math.sin(a.angle) * a.dist * scale;
ctx.beginPath();
ctx.arc(x, y, a.size * scale, 0, Math.PI * 2);
ctx.fillStyle = `rgba(160, 150, 140, ${a.brightness})`;
ctx.fill();
}
}

// --- Main Loop ---
let lastTime = 0;

function animate(timestamp) {
requestAnimationFrame(animate);

const dt = timestamp - lastTime;
lastTime = timestamp;

ctx.clearRect(0, 0, W, H);

// Dark background gradient
const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
bgGrad.addColorStop(0, '#0a0a1a');
bgGrad.addColorStop(1, '#000005');
ctx.fillStyle = bgGrad;
ctx.fillRect(0, 0, W, H);

drawStars(timestamp);

const cx = W / 2;
const cy = H / 2;
const scale = getScale();

// Draw orbits
for (const p of planets) {
drawOrbitPath(cx, cy, p.orbitRadius, scale);
}

// Asteroid belt
drawAsteroids(cx, cy, scale, timestamp);

// Sun
drawSun(cx, cy, timestamp);

// Planets
for (const p of planets) {
drawPlanet(p, cx, cy, scale, timestamp);
}

// Title
ctx.font = '14px Arial, sans-serif';
ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
ctx.textAlign = 'left';
ctx.fillText('Solar System Simulation', 20, 30);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
