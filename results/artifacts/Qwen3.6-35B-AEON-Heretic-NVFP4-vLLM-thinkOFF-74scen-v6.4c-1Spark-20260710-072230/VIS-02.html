<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const starCount = 800;
        const arms = 3;
        const coreSize = 150;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle for spiral arm placement
                this.angle = Math.random() * Math.PI * 2;
                
                // Distance from center (inverse power for density)
                this.distance = Math.pow(Math.random(), 1.5) * Math.max(width, height) * 0.45;
                
                // Orbital speed (slower further out)
                this.speed = 0.0005 + (Math.random() * 0.0005) / (this.distance * 0.01 + 1);
                
                // Size
                this.size = Math.random() * 2 + 0.5;
                
                // Twinkle properties
                this.twinkleSpeed = 0.02 + Math.random() * 0.05;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color variation
                const colorChoice = Math.random();
                if (colorChoice < 0.6) {
                    // White-ish
                    this.color = `rgba(255, 255, 255, `;
                    this.alphaBase = 0.8;
                } else if (colorChoice < 0.8) {
                    // Blue-ish
                    this.color = `rgba(150, 200, 255, `;
                    this.alphaBase = 0.7;
                } else {
                    // Yellow-ish
                    this.color = `rgba(255, 230, 150, `;
                    this.alphaBase = 0.6;
                }
            }

            update() {
                this.angle += this.speed;
            }

            draw() {
                const x = width / 2 + Math.cos(this.angle) * this.distance;
                const y = height / 2 + Math.sin(this.angle) * this.distance;
                
                // Twinkle effect
                const twinkle = Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset);
                const alpha = this.alphaBase + (twinkle * 0.2);
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + alpha + ')';
                ctx.fill();
            }
        }

        // Initialize stars
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }

        function drawCore() {
            const centerX = width / 2;
            const centerY = height / 2;
            
            // Core glow layers
            const layers = 3;
            for (let i = layers; i > 0; i--) {
                const radius = coreSize * (i / layers) * 1.5;
                const gradient = ctx.createRadialGradient(
                    centerX, centerY, 0,
                    centerX, centerY, radius
                );
                
                const alpha = 0.15 / i;
                gradient.addColorStop(0, `rgba(255, 250, 220, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(255, 220, 150, ${alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(255, 200, 100, 0)`);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        function animate() {
            // Clear canvas with slight fade for motion blur effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw core
            drawCore();
            
            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
