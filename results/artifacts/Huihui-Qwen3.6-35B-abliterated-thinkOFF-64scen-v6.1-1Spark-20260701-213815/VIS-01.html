<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Starfield
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.5,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        // Sun
        const sun = {
            x: width / 2,
            y: height / 2,
            radius: 30,
            color: '#FFD700'
        };

        // Planets
        const planets = [
            { name: 'Mercury', radius: 4, orbit: 60, speed: 0.04, color: '#A9A9A9', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 6, orbit: 90, speed: 0.025, color: '#E6E6FA', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 7, orbit: 130, speed: 0.02, color: '#4B0082', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 5, orbit: 170, speed: 0.015, color: '#8B0000', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 14, orbit: 220, speed: 0.008, color: '#DAA520', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 12, orbit: 280, speed: 0.006, color: '#F4A460', angle: Math.random() * Math.PI * 2, ring: true },
            { name: 'Uranus', radius: 9, orbit: 340, speed: 0.004, color: '#87CEEB', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', radius: 8, orbit: 400, speed: 0.003, color: '#4169E1', angle: Math.random() * Math.PI * 2 }
        ];

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Glow effect
            const gradient = ctx.createRadialGradient(sun.x, sun.y, sun.radius * 0.5, sun.x, sun.y, sun.radius * 3);
            gradient.addColorStop(0, 'rgba(255, 200, 0, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 140, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');

            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius * 3, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Sun body
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius, 0, Math.PI * 2);
            ctx.fillStyle = sun.color;
            ctx.fill();
        }

        function drawPlanet(planet) {
            const x = sun.x + Math.cos(planet.angle) * planet.orbit;
            const y = sun.y + Math.sin(planet.angle) * planet.orbit;

            // Orbit path
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, planet.orbit, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Planet glow
            const glow = ctx.createRadialGradient(x, y, planet.radius * 0.5, x, y, planet.radius * 2);
            glow.addColorStop(0, `${planet.color}80`);
            glow.addColorStop(1, `${planet.color}00`);
            
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 2, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            // Planet body
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.fill();

            // Saturn's ring
            if (planet.ring) {
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.6, planet.angle, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(210, 180, 140, 0.7)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function updatePlanets() {
            planets.forEach(planet => {
                planet.angle += planet.speed;
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawStars();
            drawSun();
            
            planets.forEach(planet => {
                drawPlanet(planet);
            });
            
            updatePlanets();
            
            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            sun.x = width / 2;
            sun.y = height / 2;
            
            // Regenerate stars for new canvas size
            stars.length = 0;
            for (let i = 0; i < 400; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.8 + 0.2
                });
            }
        });

        animate();
    </script>
</body>
</html>
