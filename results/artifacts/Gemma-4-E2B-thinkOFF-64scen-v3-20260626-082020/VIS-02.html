<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- Galaxy Parameters ---
        const numStars = 500;
        const coreRadius = Math.min(width, height) * 0.1;
        const coreX = width / 2;
        const coreY = height / 2;
        const coreSize = 3;

        let stars = [];

        // Star class definition
        class Star {
            constructor(x, y, distance, colorHue, size) {
                this.x = x;
                this.y = y;
                this.distance = distance; // Distance from the core
                this.angle = Math.random() * Math.PI * 2; // Initial angle for spiral placement
                this.colorHue = colorHue + (Math.random() - 0.5) * 50; // Slight color variation
                this.size = Math.random() * 1.5 + 0.5;
                this.twinkle = Math.random() * 0.5 + 0.5; // Twinkle intensity
                this.speed = Math.random() * 0.01 + 0.005; // Rotation speed
            }

            update() {
                // Calculate spiral movement
                this.angle += this.speed;
                // Determine radius based on angle to create the spiral effect
                const radius = this.distance + Math.cos(this.angle * 3) * 10; // More complex spiral
                this.x = coreX + radius * Math.cos(this.angle);
                this.y = coreY + radius * Math.sin(this.angle);

                // Twinkle effect: slight random size fluctuation
                this.size = this.size * (1 + Math.sin(Date.now() * 0.005 + this.distance) * 0.1);
            }

            draw() {
                // Calculate brightness/alpha based on twinkle
                const alpha = 0.5 + this.twinkle * 0.5;

                // Color calculation (using HSL for vibrant colors)
                const hue = this.colorHue % 360;
                const saturation = 80;
                const lightness = 50 + Math.sin(Date.now() * 0.001 + this.distance) * 10;

                ctx.fillStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Initialization ---
        function initializeStars() {
            for (let i = 0; i < numStars; i++) {
                // Distribute stars in a somewhat dense spiral pattern
                const distance = Math.random() * (Math.min(width, height) * 0.8);
                const angle = Math.random() * Math.PI * 2;

                // Bias stars towards the spiral path
                let r = distance * (0.5 + Math.random() * 0.5); // Vary distance slightly
                let theta = angle + (i / numStars) * Math.PI * 4; // Add angular separation

                const x = coreX + r * Math.cos(theta);
                const y = coreY + r * Math.sin(theta);

                const colorHue = Math.random() * 360;
                
                stars.push(new Star(x, y, r, colorHue, Math.random() * 1.5 + 0.5));
            }
        }

        // --- Animation Loop ---
        function animate() {
            // 1. Fade the canvas slightly to create a trailing effect (subtle)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slow fade
            ctx.fillRect(0, 0, width, height);

            // 2. Draw the core (Bright center)
            const gradient = ctx.createRadialGradient(coreX, coreY, coreSize * 2, coreX, coreY, coreSize * 50);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)'); // Bright center
            gradient.addColorStop(0.3, 'rgba(255, 150, 0, 0.8)'); // Orange glow
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Transparent edge
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(coreX, coreY, coreSize * 50, 0, Math.PI * 2);
            ctx.fill();


            // 3. Update and Draw Stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            // Re-initialize or adjust parameters if necessary on resize
        });


        // Start the process
        initializeStars();
        animate();

    </script>
</body>
</html>
