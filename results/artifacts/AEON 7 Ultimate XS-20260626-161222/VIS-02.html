<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="galaxyCanvas"></canvas>

<script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let stars = [];
    const STAR_COUNT = 600;
    
    // Configuration
    const SPIRAL_ARMS = 4;
    const ARM_SPREAD = 0.8; // How spread out the stars are within an arm
    const CORE_RADIUS = 40;
    const OUTER_RADIUS_MULTIPLIER = 0.8; // Relative to half the screen width/height

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStars();
    }

    class Star {
        constructor() {
            this.reset();
        }

        reset() {
            // Random angle for the arm
            const armIndex = Math.floor(Math.random() * SPIRAL_ARMS);
            const armAngle = (armIndex * 360) / SPIRAL_ARMS;
            
            // Distance from center (0 to 1)
            this.radiusRatio = Math.random();
            
            // Random offset from the perfect spiral line
            const angleOffset = (Math.random() - 0.5) * ARM_SPREAD * 100;
            
            // Calculate position based on spiral math
            // Spiral angle increases as distance increases
            const spiralAngle = this.radiusRatio * 150; // Total spiral rotation in degrees
            
            this.angle = (armAngle + spiralAngle + angleOffset) * (Math.PI / 180);
            
            // Size variation
            this.size = Math.random() * 1.5 + 0.5;
            
            // Color variation (Hue, Saturation, Lightness)
            // Core is warmer (yellow/orange), outer is cooler (blue/purple)
            const hueBase = 200 + (Math.random() * 60); // Blue/Purple base
            const hueMix = Math.random();
            const hue = hueBase + (1 - this.radiusRatio) * 60; // Shift to orange near core
            const sat = 50 + Math.random() * 50;
            const light = 60 + Math.random() * 40;
            
            this.color = `hsl(${hue}, ${sat}%, ${light}%)`;
            
            // Twinkle properties
            this.twinkleSpeed = Math.random() * 0.05 + 0.01;
            this.twinkleOffset = Math.random() * Math.PI * 2;
            this.baseAlpha = 0.5 + Math.random() * 0.5;
            
            // Rotation speed (closer to center = faster)
            this.orbitSpeed = (0.2 + Math.random() * 0.5) * (1 / (this.radiusRatio + 0.2));
        }

        draw(time) {
            // Calculate current angle (rotation)
            const currentAngle = this.angle + (time * this.orbitSpeed * 0.0005);
            
            // Calculate max radius based on screen size
            const maxRadius = Math.min(width, height) * OUTER_RADIUS_MULTIPLIER;
            const currentRadius = this.radiusRatio * maxRadius;
            
            // Polar to Cartesian
            const x = width / 2 + Math.cos(currentAngle) * currentRadius;
            const y = height / 2 + Math.sin(currentAngle) * currentRadius;
            
            // Twinkle effect
            const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.3 + 0.7;
            const alpha = this.baseAlpha * twinkle;
            
            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = alpha;
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }
    }

    function drawCore() {
        const cx = width / 2;
        const cy = height / 2;
        
        // Core Glow
        const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, CORE_RADIUS * 3);
        gradient.addColorStop(0, 'rgba(255, 240, 200, 0.8)');
        gradient.addColorStop(0.2, 'rgba(200, 150, 100, 0.4)');
        gradient.addColorStop(0.5, 'rgba(100, 150, 200, 0.1)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(cx, cy, CORE_RADIUS * 3, 0, Math.PI * 2);
        ctx.fill();
        
        // Bright center
        ctx.fillStyle = '#FFF8E7';
        ctx.beginPath();
        ctx.arc(cx, cy, CORE_RADIUS * 0.5, 0, Math.PI * 2);
        ctx.fill();
    }

    function animate(time) {
        // Clear canvas with slight transparency for trail effect (optional, currently solid black)
        ctx.fillStyle = 'rgba(0, 0, 0, 1)';
        ctx.fillRect(0, 0, width, height);
        
        // Draw stars
        for (let i = 0; i < stars.length; i++) {
            stars[i].draw(time);
        }
        
        // Draw core on top
        drawCore();
        
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    
    // Initialize
    resize();
    requestAnimationFrame(animate);

</script>
</body>
</html>
