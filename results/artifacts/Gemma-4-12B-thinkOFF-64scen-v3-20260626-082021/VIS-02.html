<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const STAR_COUNT = 1200;
        const CORE_COLOR = 'rgba(255, 255, 200, 0.8)';

        function init() {
            resize();
            createGalaxy();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createGalaxy() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                // Spiral math: radius and angle
                // We use a logarithmic-style spiral: r = a * e^(b * theta)
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.pow(Math.random(), 0.7) * (Math.min(width, height) * 0.45);
                
                // Spiral offset: shift angle based on distance
                const spiralAngle = distance * 0.005;
                const finalAngle = angle + spiralAngle;

                // Add some "scatter" to make it look organic
                const scatter = (Math.random() - 0.5) * (distance * 0.2);
                
                stars.push({
                    x: Math.cos(finalAngle) * distance + scatter,
                    y: Math.sin(finalAngle) * distance + scatter,
                    baseX: Math.cos(finalAngle) * distance + scatter,
                    baseY: Math.sin(finalAngle) * distance + scatter,
                    size: Math.random() * 1.5 + 0.5,
                    speed: (1 / (distance + 50)) * 2, // Closer stars move faster
                    color: `hsl(${Math.random() * 60 + 200}, ${Math.random() * 100}%, ${Math.random() * 100}%)`,
                    twinkleSpeed: Math.random() * 0.05 + 0.02,
                    twinkleOffset: Math.random() * Math.PI * 2,
                    opacity: Math.random()
                });
            }
        }

        function animate() {
            // Slight trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fill();

            stars.forEach(s => {
                // Update position (rotation)
                const currentAngle = Math.atan2(s.y, s.x) + s.speed;
                const currentDist = Math.sqrt(s.x * s.x + s.y * s.y);
                
                s.x = Math.cos(currentAngle) * currentDist;
                s.y = Math.sin(currentAngle) * currentDist;

                // Twinkle effect
                const twinkle = (Math.sin(Date.now() * s.twinkleSpeed + s.twinkleOffset) + 1) / 2;
                
                ctx.fillStyle = s.color;
                ctx.globalAlpha = twinkle * 0.8 + 0.2;
                ctx.beginPath();
                ctx.arc(centerX + s.x, centerY + s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.globalAlpha = 1.0;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            createGalaxy(); // Re-center and re-scale stars
        });

        init();
    </script>
</body>
</html>
