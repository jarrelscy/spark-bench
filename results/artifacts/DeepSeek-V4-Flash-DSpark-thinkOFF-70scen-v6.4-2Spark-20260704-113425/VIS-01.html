<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('solarCanvas');
            const ctx = canvas.getContext('2d');

            let W, H, cx, cy, scale;

            // ─── Responsive sizing ───
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
                scale = Math.min(W, H) * 0.42;
            }
            window.addEventListener('resize', resize);
            resize();

            // ─── Starfield ───
            let stars = [];

            function generateStars() {
                stars = [];
                const count = Math.floor((W * H) / 2200);
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.8 + 0.3,
                        baseBright: Math.random() * 0.6 + 0.4,
                        phase: Math.random() * Math.PI * 2,
                        speed: 0.2 + Math.random() * 0.8
                    });
                }
            }
            generateStars();
            window.addEventListener('resize', generateStars);

            // ─── Planet data ───
            // orbitRadius is a fraction of 'scale', speed in rad/frame
            const planets = [{
                name: 'Mercury',
                orbitFrac: 0.16,
                radius: 3.5,
                color: '#b5b5b5',
                speed: 0.022,
                angle: 0
            }, {
                name: 'Venus',
                orbitFrac: 0.24,
                radius: 5.5,
                color: '#e8cda0',
                speed: 0.016,
                angle: Math.PI * 0.3
            }, {
                name: 'Earth',
                orbitFrac: 0.33,
                radius: 6.0,
                color: '#4b8bbe',
                speed: 0.012,
                angle: Math.PI * 0.7
            }, {
                name: 'Mars',
                orbitFrac: 0.42,
                radius: 4.5,
                color: '#c1440e',
                speed: 0.0095,
                angle: Math.PI * 1.1
            }, {
                name: 'Jupiter',
                orbitFrac: 0.55,
                radius: 10.5,
                color: '#d4a574',
                speed: 0.0055,
                angle: Math.PI * 1.6
            }, {
                name: 'Saturn',
                orbitFrac: 0.68,
                radius: 9.0,
                color: '#ead6b8',
                speed: 0.0038,
                angle: Math.PI * 2.2,
                hasRings: true
            }, {
                name: 'Uranus',
                orbitFrac: 0.80,
                radius: 7.0,
                color: '#7ec8e3',
                speed: 0.0025,
                angle: Math.PI * 2.8
            }, {
                name: 'Neptune',
                orbitFrac: 0.92,
                radius: 6.5,
                color: '#3b5dab',
                speed: 0.0016,
                angle: Math.PI * 3.5
            }];

            // ─── Drawing helpers ───

            function drawStars(time) {
                for (const s of stars) {
                    const twinkle = 0.6 + 0.4 * Math.sin(time * s.speed + s.phase);
                    const alpha = s.baseBright * twinkle;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }
            }

            function drawOrbits() {
                ctx.strokeStyle = 'rgba(255,255,255,0.07)';
                ctx.lineWidth = 0.8;
                for (const p of planets) {
                    const r = p.orbitFrac * scale;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            function drawSun(time) {
                const pulse = 1 + 0.025 * Math.sin(time * 0.6);
                const glowRadius = 70 * pulse * (scale / 450);

                // ── Outer glow (very faint, large) ──
                const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius * 2.2);
                g1.addColorStop(0, 'rgba(255,200,80,0.25)');
                g1.addColorStop(0.3, 'rgba(255,160,40,0.12)');
                g1.addColorStop(0.7, 'rgba(255,100,20,0.04)');
                g1.addColorStop(1, 'rgba(255,50,0,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, glowRadius * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = g1;
                ctx.fill();

                // ── Mid glow ──
                const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius * 1.3);
                g2.addColorStop(0, 'rgba(255,220,100,0.50)');
                g2.addColorStop(0.4, 'rgba(255,180,60,0.30)');
                g2.addColorStop(0.8, 'rgba(255,120,30,0.08)');
                g2.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, glowRadius * 1.3, 0, Math.PI * 2);
                ctx.fillStyle = g2;
                ctx.fill();

                // ── Inner glow ──
                const g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius * 0.7);
                g3.addColorStop(0, 'rgba(255,255,230,0.95)');
                g3.addColorStop(0.3, 'rgba(255,240,180,0.85)');
                g3.addColorStop(0.6, 'rgba(255,200,80,0.50)');
                g3.addColorStop(1, 'rgba(255,150,30,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, glowRadius * 0.7, 0, Math.PI * 2);
                ctx.fillStyle = g3;
                ctx.fill();

                // ── Core (bright white-yellow) ──
                const coreR = 18 * (scale / 450);
                const g4 = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
                g4.addColorStop(0, 'rgba(255,255,255,1)');
                g4.addColorStop(0.25, 'rgba(255,255,220,1)');
                g4.addColorStop(0.6, 'rgba(255,220,120,1)');
                g4.addColorStop(1, 'rgba(255,180,50,1)');
                ctx.beginPath();
                ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
                ctx.fillStyle = g4;
                ctx.fill();

                // ── Highlight glint ──
                const glintR = coreR * 0.35;
                const g5 = ctx.createRadialGradient(
                    cx - coreR * 0.3, cy - coreR * 0.3, 0,
                    cx - coreR * 0.3, cy - coreR * 0.3, glintR
                );
                g5.addColorStop(0, 'rgba(255,255,255,0.9)');
                g5.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(cx - coreR * 0.3, cy - coreR * 0.3, glintR, 0, Math.PI * 2);
                ctx.fillStyle = g5;
                ctx.fill();
            }

            function drawPlanet(p, time) {
                const r = p.orbitFrac * scale;
                const x = cx + Math.cos(p.angle) * r;
                const y = cy + Math.sin(p.angle) * r;
                const pr = p.radius * (scale / 450);

                // ── Planet glow ──
                const glowR = pr * 3.5;
                const pg = ctx.createRadialGradient(x, y, 0, x, y, glowR);
                pg.addColorStop(0, p.color + '55');
                pg.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(x, y, glowR, 0, Math.PI * 2);
                ctx.fillStyle = pg;
                ctx.fill();

                // ── Planet body ──
                const bodyGrad = ctx.createRadialGradient(
                    x - pr * 0.3, y - pr * 0.3, pr * 0.1,
                    x, y, pr
                );
                // Lighter highlight on top-left, darker on bottom-right
                const lighter = ctx.createRadialGradient(
                    x - pr * 0.3, y - pr * 0.3, 0,
                    x, y, pr
                );
                lighter.addColorStop(0, lightenColor(p.color, 40));
                lighter.addColorStop(0.5, p.color);
                lighter.addColorStop(1, darkenColor(p.color, 30));
                ctx.beginPath();
                ctx.arc(x, y, pr, 0, Math.PI * 2);
                ctx.fillStyle = lighter;
                ctx.fill();

                // ── Saturn rings ──
                if (p.hasRings) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(p.angle + 0.4);
                    const ringOuter = pr * 2.4;
                    const ringInner = pr * 1.2;
                    // Draw ring as a thick elliptical arc
                    ctx.strokeStyle = 'rgba(210,185,150,0.55)';
                    ctx.lineWidth = pr * 0.7;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringOuter, ringOuter * 0.35, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    // Inner ring line
                    ctx.strokeStyle = 'rgba(200,175,140,0.30)';
                    ctx.lineWidth = pr * 0.3;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, ringInner, ringInner * 0.35, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // ── Small specular highlight ──
                const hlR = pr * 0.3;
                const hl = ctx.createRadialGradient(
                    x - pr * 0.25, y - pr * 0.25, 0,
                    x - pr * 0.25, y - pr * 0.25, hlR
                );
                hl.addColorStop(0, 'rgba(255,255,255,0.5)');
                hl.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(x - pr * 0.25, y - pr * 0.25, hlR, 0, Math.PI * 2);
                ctx.fillStyle = hl;
                ctx.fill();

                // ── Advance angle ──
                p.angle += p.speed;
            }

            // ─── Color helpers ───
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 200, g: 200, b: 200 };
            }

            function rgbToHex(r, g, b) {
                return '#' + [r, g, b].map(c => {
                    const clamped = Math.max(0, Math.min(255, Math.round(c)));
                    return clamped.toString(16).padStart(2, '0');
                }).join('');
            }

            function lightenColor(hex, amount) {
                const c = hexToRgb(hex);
                return rgbToHex(
                    Math.min(255, c.r + amount),
                    Math.min(255, c.g + amount),
                    Math.min(255, c.b + amount)
                );
            }

            function darkenColor(hex, amount) {
                const c = hexToRgb(hex);
                return rgbToHex(
                    Math.max(0, c.r - amount),
                    Math.max(0, c.g - amount),
                    Math.max(0, c.b - amount)
                );
            }

            // ─── Main animation loop ───
            let startTime = performance.now();

            function animate(timestamp) {
                const elapsed = (timestamp - startTime) / 1000;

                // ── Clear ──
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                // ── Draw layers ──
                drawStars(elapsed);
                drawOrbits();
                drawSun(elapsed);

                for (const p of planets) {
                    drawPlanet(p, elapsed);
                }

                requestAnimationFrame(animate);
            }

            // ─── Handle resize for planet angles? No, keep them continuous ───
            // Just restart animation smoothly
            requestAnimationFrame(animate);

            // ─── Handle window resize ───
            // (already handled via event listener, but we need to regenerate stars
            //  and update scale — already done in resize/generateStars)

            // ─── Small tweak: regenerate stars on resize ───
            // Already wired above.

            console.log('🌌 Solar System animation running!');
        })();
    </script>
</body>
</html>
