<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('galaxyCanvas');
            const ctx = canvas.getContext('2d');

            let W, H, cx, cy, maxRadius;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
                maxRadius = Math.min(W, H) * 0.44;
            }
            resize();
            window.addEventListener('resize', resize);

            // ─── Parameters ───────────────────────────────────────────────
            const NUM_ARMS = 3;
            const STARS_PER_ARM = 220;
            const BG_STARS = 180;
            const TWIST = 0.022;
            const ROTATION_SPEED = 0.00018;
            const CORE_MAX_RADIUS = Math.min(W, H) * 0.08;

            // ─── Utility ───────────────────────────────────────────────────
            function gaussianRandom(scale) {
                // Box-Muller transform, returns roughly normal distribution
                let u = 0,
                    v = 0;
                while (u === 0) u = Math.random();
                while (v === 0) v = Math.random();
                return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * scale;
            }

            function lerp(a, b, t) { return a + (b - a) * t; }

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

            // ─── Star Colors ───────────────────────────────────────────────
            function starColor(radius, t) {
                // t: 0 = inner, 1 = outer
                // Inner: warm gold (255, 210, 120)
                // Mid: white (255, 250, 240)
                // Outer: cool blue (160, 195, 255)
                const r1 = 255,
                    g1 = 210,
                    b1 = 120;
                const r2 = 255,
                    g2 = 250,
                    b2 = 240;
                const r3 = 160,
                    g3 = 195,
                    b3 = 255;

                let r, g, b;
                if (t < 0.5) {
                    const u = t / 0.5;
                    r = lerp(r1, r2, u);
                    g = lerp(g1, g2, u);
                    b = lerp(b1, b2, u);
                } else {
                    const u = (t - 0.5) / 0.5;
                    r = lerp(r2, r3, u);
                    g = lerp(g2, g3, u);
                    b = lerp(b2, b3, u);
                }

                // Add subtle random variation
                const vary = 20;
                r = clamp(r + (Math.random() - 0.5) * vary, 0, 255);
                g = clamp(g + (Math.random() - 0.5) * vary, 0, 255);
                b = clamp(b + (Math.random() - 0.5) * vary, 0, 255);

                return { r: Math.floor(r), g: Math.floor(g), b: Math.floor(b) };
            }

            // ─── Galaxy Stars ──────────────────────────────────────────────
            const stars = [];

            function generateStars() {
                stars.length = 0;
                for (let arm = 0; arm < NUM_ARMS; arm++) {
                    const armAngle = (arm / NUM_ARMS) * Math.PI * 2;
                    for (let i = 0; i < STARS_PER_ARM; i++) {
                        // Radius: more density near center
                        const r = 6 + Math.pow(Math.random(), 0.55) * (maxRadius - 6);

                        // Spiral angle with Gaussian scatter
                        const scatter = gaussianRandom(0.32);
                        const angleOffset = armAngle + (r - 6) * TWIST + scatter;

                        // Size: mostly small, some larger
                        const size = 0.3 + Math.pow(Math.random(), 1.6) * 3.2;

                        // Color
                        const t = (r - 6) / (maxRadius - 6);
                        const col = starColor(r, t);

                        // Twinkle parameters
                        const twinkleSpeed = 0.4 + Math.random() * 1.8;
                        const twinklePhase = Math.random() * Math.PI * 2;
                        const twinkleAmp = 0.3 + Math.random() * 0.5;

                        stars.push({
                            radius: r,
                            angleBase: angleOffset,
                            size: size,
                            color: col,
                            twinkleSpeed: twinkleSpeed,
                            twinklePhase: twinklePhase,
                            twinkleAmp: twinkleAmp
                        });
                    }
                }
            }
            generateStars();

            // ─── Background Stars ──────────────────────────────────────────
            const bgStars = [];

            function generateBgStars() {
                bgStars.length = 0;
                for (let i = 0; i < BG_STARS; i++) {
                    const x = Math.random() * W;
                    const y = Math.random() * H;
                    const size = 0.2 + Math.random() * 0.7;
                    const brightness = 0.3 + Math.random() * 0.5;
                    bgStars.push({
                        x: x,
                        y: y,
                        size: size,
                        brightness: brightness,
                        twinkleSpeed: 0.2 + Math.random() * 0.6,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            generateBgStars();

            // ─── Handle resize ─────────────────────────────────────────────
            window.addEventListener('resize', function() {
                resize();
                // Regenerate with new dimensions
                generateStars();
                generateBgStars();
                // Update core max radius
                CORE_MAX_RADIUS = Math.min(W, H) * 0.08;
            });

            // ─── Draw Core ─────────────────────────────────────────────────
            function drawCore(time) {
                const pulse = 0.92 + 0.08 * Math.sin(time * 0.0006);
                const baseR = CORE_MAX_RADIUS * pulse;

                // Outer glow
                const grad1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 4.5);
                grad1.addColorStop(0, 'rgba(255, 220, 150, 0.12)');
                grad1.addColorStop(0.3, 'rgba(255, 200, 120, 0.06)');
                grad1.addColorStop(0.7, 'rgba(200, 180, 255, 0.02)');
                grad1.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad1;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 4.5, 0, Math.PI * 2);
                ctx.fill();

                // Mid glow
                const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 2.2);
                grad2.addColorStop(0, 'rgba(255, 230, 180, 0.25)');
                grad2.addColorStop(0.4, 'rgba(255, 210, 150, 0.12)');
                grad2.addColorStop(0.8, 'rgba(200, 180, 255, 0.04)');
                grad2.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad2;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // Inner glow
                const grad3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.2);
                grad3.addColorStop(0, 'rgba(255, 250, 240, 0.6)');
                grad3.addColorStop(0.3, 'rgba(255, 235, 200, 0.4)');
                grad3.addColorStop(0.7, 'rgba(255, 210, 160, 0.15)');
                grad3.addColorStop(1, 'rgba(255, 200, 150, 0)');
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 1.2, 0, Math.PI * 2);
                ctx.fill();

                // Bright core
                const grad4 = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 0.5);
                grad4.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad4.addColorStop(0.2, 'rgba(255, 255, 240, 0.9)');
                grad4.addColorStop(0.5, 'rgba(255, 240, 210, 0.5)');
                grad4.addColorStop(1, 'rgba(255, 220, 180, 0)');
                ctx.fillStyle = grad4;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 0.5, 0, Math.PI * 2);
                ctx.fill();

                // Central hot spot
                const grad5 = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 0.15);
                grad5.addColorStop(0, 'rgba(255, 255, 255, 1)');
                grad5.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
                grad5.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad5;
                ctx.beginPath();
                ctx.arc(cx, cy, baseR * 0.15, 0, Math.PI * 2);
                ctx.fill();

                // Lens flare / diffraction spikes (subtle)
                ctx.save();
                ctx.globalAlpha = 0.08 + 0.04 * Math.sin(time * 0.0004 + 1.2);
                const spikeLen = baseR * 3.0;
                for (let i = 0; i < 4; i++) {
                    const angle = i * Math.PI / 2 + time * 0.00005;
                    ctx.beginPath();
                    ctx.moveTo(cx - Math.cos(angle) * baseR * 0.2, cy - Math.sin(angle) * baseR * 0.2);
                    ctx.lineTo(cx + Math.cos(angle) * spikeLen, cy + Math.sin(angle) * spikeLen);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ─── Animation Loop ────────────────────────────────────────────
            function animate(time) {
                // Clear
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                // ── Draw background stars ──
                for (const bg of bgStars) {
                    const twinkle = 0.5 + 0.5 * Math.sin(time * 0.0008 * bg.twinkleSpeed + bg.twinklePhase);
                    const alpha = bg.brightness * (0.4 + 0.6 * twinkle);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(bg.x, bg.y, bg.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // ── Draw galaxy stars ──
                const rotationAngle = time * ROTATION_SPEED;

                // Sort stars by size (larger drawn on top) for depth
                // But for performance, we'll just draw in order and use a slight size-based alpha
                for (const star of stars) {
                    const angle = star.angleBase + rotationAngle;
                    const x = cx + star.radius * Math.cos(angle);
                    const y = cy + star.radius * Math.sin(angle);

                    // Skip if off screen (with margin)
                    if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;

                    // Twinkle
                    const tw = 0.5 + 0.5 * Math.sin(time * 0.001 * star.twinkleSpeed + star.twinklePhase);
                    const alpha = 0.35 + 0.65 * Math.pow(tw, 0.8);

                    // Size twinkle (subtle)
                    const sizeMod = 0.85 + 0.15 * (0.5 + 0.5 * Math.sin(time * 0.001 * star.twinkleSpeed * 0.7 + star
                        .twinklePhase + 1.0));
                    const drawSize = star.size * sizeMod;

                    const { r, g, b } = star.color;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;

                    // Draw star as a circle with slight glow for larger stars
                    if (drawSize > 1.8) {
                        // Add a soft glow for brighter stars
                        const glow = ctx.createRadialGradient(x, y, 0, x, y, drawSize * 2.5);
                        glow.addColorStop(0, `rgba(${r},${g},${b},0.3)`);
                        glow.addColorStop(0.4, `rgba(${r},${g},${b},0.1)`);
                        glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = glow;
                        ctx.beginPath();
                        ctx.arc(x, y, drawSize * 2.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = `rgb(${r},${g},${b})`;
                    }

                    ctx.beginPath();
                    ctx.arc(x, y, drawSize, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // ── Draw core (on top) ──
                drawCore(time);

                // ── Subtle vignette ──
                const vignette = ctx.createRadialGradient(cx, cy, maxRadius * 0.3, cx, cy, maxRadius * 1.1);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(0.6, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, 'rgba(0,0,0,0.55)');
                ctx.fillStyle = vignette;
                ctx.fillRect(0, 0, W, H);

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
