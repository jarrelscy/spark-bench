<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const STAR_COUNT = 800;
        const CORE_COLOR = 'rgba(255, 255, 255, 0.8)';

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Spiral parameters
                // r = distance from center, theta = angle
                // Spiral formula: r = a * e^(b * theta)
                this.baseRadius = Math.random() * (Math.min(width, height) * 0.45);
                this.angle = Math.random() * Math.PI * 2;
                
                // Determine orbital properties
                // Closer stars move faster
                this.speed = (1 / (this.baseRadius + 50)) * 0.5 + (Math.random() * 0.2);
                
                // Randomize color (blues, whites, yellows)
                const colors = ['#fff', '#eef', '#ff0', '#ddd', '#aab'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkle = Math.random() * Math.PI;
                
                // Offset for "thickness" of the spiral arms
                this.offset = (Math.random() - 0.5) * (this.baseRadius * 0.2);
                
                // Size of the star
                this.size = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.angle += this.speed;
                this.twinkle += this.twinkleSpeed;

                // Spiral calculation: r = a * theta
                // We use a logarithmic-style spiral approximation
                const spiralFactor = 0.5 + (this.baseRadius / (Math.min(width, height) * 0.4));
                const currentRadius = this.baseRadius + (Math.sin(this.angle * 0.5) * 10);
                
                // Project to screen coordinates
                const x = width / 2 + Math.cos(this.angle) * (currentRadius + this.offset);
                const y = height / 2 + Math.sin(this.angle) * (currentRadius + this.offset);

                // Draw the star
                const opacity = 0.4 + Math.abs(Math.sin(this.twinkle)) * 0.6;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = opacity;
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize stars
        function initGalaxy() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function draw() {
            // Slight trail effect by using a semi-transparent clear
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Draw glowing core
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, 50
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 50, 0, Math.PI * 2);
            ctx.fill();

            // Update and draw stars
            stars.forEach(star => star.update());

            requestAnimationFrame(draw);
        }

        initGalaxy();
        draw();
    </script>
</body>
</html>
