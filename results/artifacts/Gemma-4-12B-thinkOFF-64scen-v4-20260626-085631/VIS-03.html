<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let animationFrame;

        // Configuration
        const numNodes = 40;
        const helixRadius = 100;
        const helixPitch = 0.5; // Controls how "stretched" the helix is
        const rotationSpeed = 0.02;
        let rotationAngle = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            // Clear canvas with a slight trail effect
            ctx.fillStyle = 'rgba(10, 10, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            ctx.save();
            ctx.translate(centerX, centerY);

            // Draw the DNA Strands
            for (let i = 0; i < numNodes; i++) {
                // Calculate vertical position
                const y = (i * 15) - (numNodes * 7.5);
                
                // Calculate angle for the two strands (offset by PI for opposite sides)
                // The sine wave creates the spiral
                const angle1 = i * helixPitch - rotationAngle;
                const angle2 = i * helixPitch - rotationAngle + Math.PI;

                const x1 = Math.cos(angle1) * helixRadius;
                const y1 = y;
                
                const x2 = Math.cos(angle2) * helixRadius;
                const y2 = y;

                // Draw the "Rungs" (connecting lines)
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                // Draw the Nodes
                // Strand 1 (Cyan-ish)
                ctx.beginPath();
                ctx.fillStyle = `hsla(${180 + (i * 2) % 60}, 80%, 60%, 0.8)`;
                ctx.arc(x1, y1, 3, 0, Math.PI * 2);
                ctx.fill();

                // Strand 2 (Magenta-ish)
                ctx.beginPath();
                ctx.fillStyle = `hsla(${300 + (i * 2) % 60}, 80%, 60%, 0.8)`;
                ctx.arc(x2, y2, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();

            rotationAngle += rotationSpeed;
            animationFrame = requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
