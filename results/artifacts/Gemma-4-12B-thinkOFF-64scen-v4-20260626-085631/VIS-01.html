<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Starfield generation
        const stars = [];
        for (let i = 0; i < 400; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }

        // Planet Data
        // radius: distance from sun, speed: angular velocity, color, size
        const planets = [
            { name: "Mercury", dist: 60, speed: 0.04, color: "#A5A5A5", size: 3 },
            { name: "Venus", dist: 90, speed: 0.015, color: "#E3BB76", size: 5 },
            { name: "Earth", dist: 130, speed: 0.01, color: "#2271B3", size: 6 },
            { name: "Mars", dist: 170, speed: 0.008, color: "#E27B58", size: 4 },
            { name: "Jupiter", dist: 230, speed: 0.004, color: "#D39C7E", size: 12 },
            { name: "Saturn", dist: 290, speed: 0.002, color: "#C5AB6E", size: 10 }
        ];

        // Initialize planet positions
        planets.forEach(p => {
            p.angle = Math.random() * Math.PI * 2;
        });

        function draw() {
            // Clear canvas with slight trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw Stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Sun
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 30);
            gradient.addColorStop(0, '#FFF5F2');
            gradient.addColorStop(0.2, '#FFD200');
            gradient.addColorStop(0.5, '#F7941D');
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fill();

            // Draw Planets
            planets.forEach(p => {
                // Calculate position
                p.angle += p.speed;
                const x = centerX + Math.cos(p.angle) * p.dist;
                const y = centerY + Math.sin(p.angle) * p.dist;

                // Draw Orbit Path
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.arc(centerX, centerY, p.dist, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet
                ctx.beginPath();
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Reset shadow for next draw
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
