<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- Galaxy Parameters ---
        const numStars = 500;
        const coreRadius = 50;
        const galaxyScale = 150; // How tightly the spiral is wound
        const rotationSpeed = 0.005; // Speed of rotation in radians per frame

        let stars = [];

        // --- Star Class ---
        class Star {
            constructor(index) {
                this.index = index;
                
                // Randomize position slightly around the disk structure
                const angle = Math.random() * Math.PI * 2;
                const radiusFactor = Math.pow(Math.random(), 1.5); // Bias towards the inner disk
                
                // Calculate initial position based on a spiral formula (Archimedean-like)
                const radius = coreRadius + (galaxyScale * radiusFactor * Math.random());
                const theta = angle + (radius / galaxyScale) * 2; // Spiral winding factor
                
                this.x = radius * Math.cos(theta);
                this.y = radius * Math.sin(theta);
                
                this.baseRadius = Math.random() * 1.5 + 0.5; // Size
                this.baseBrightness = Math.random() * 0.5 + 0.5; // Base intensity
                
                // Twinkle factor
                this.twinkleOffset = Math.random() * 100;
            }

            update(time) {
                // Rotate the system around the center (0, 0)
                const rotationAngle = rotationSpeed * time * 0.01; 
                
                // Calculate new positions based on rotation
                const currentX = this.x;
                const currentY = this.y;

                // Rotation matrix application (simplified for rotation around origin)
                this.x = currentX * Math.cos(rotationAngle) - currentY * Math.sin(rotationAngle);
                this.y = currentX * Math.sin(rotationAngle) + currentY * Math.cos(rotationAngle);
            }

            draw(ctx, time) {
                // Twinkle effect: modulate brightness based on sine wave over time
                const twinkleFactor = 1 + 0.1 * Math.sin((time + this.twinkleOffset) * 0.05);
                
                // Color variation: slight shift based on radius/position
                const colorHue = 200 + (this.y / (height / 2) * 50); // Blueish hue shift
                
                // Calculate current brightness
                const brightness = this.baseBrightness * twinkleFactor;
                
                // Set color (using HSL for easy color variation)
                ctx.fillStyle = `hsl(${colorHue}, 100%, ${50 + brightness * 20}%)`;
                
                // Draw the star
                ctx.beginPath();
                ctx.arc(this.x + width / 2, this.y + height / 2, this.baseRadius * brightness * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- Initialization ---
        function initializeGalaxy() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star(i));
            }
        }

        // --- Animation Loop ---
        let startTime = Date.now();

        function animate(timestamp) {
            const elapsed = timestamp - startTime;

            // Clear canvas (Black background)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slight trail effect for motion blur
            ctx.fillRect(0, 0, width, height);
            
            // Fade the background completely every 100 frames to prevent trails from stacking up too much
            if (elapsed % 100 < 16) { 
                 ctx.clearRect(0, 0, width, height);
            }
            
            // Draw Core (Bright center)
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, coreRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 200, 0.8)'; // Yellowish core glow
            ctx.shadowBlur = 30;
            ctx.shadowColor = 'rgba(255, 255, 150, 1)';
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow for stars

            // Update and Draw Stars
            stars.forEach(star => {
                star.update(elapsed);
                star.draw(ctx, elapsed);
            });

            requestAnimationFrame(animate);
        }

        // --- Event Listeners & Start ---
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        initializeGalaxy();
        requestAnimationFrame(animate);

    </script>
</body>
</html>
