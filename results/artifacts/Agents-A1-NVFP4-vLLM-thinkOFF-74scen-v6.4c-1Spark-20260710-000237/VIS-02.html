<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Spiral Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const starCount = 800;
        const stars = [];
        
        // Galaxy Configuration
        const armCount = 4;
        const coreSize = 15;
        const spiralFactor = 0.02; // Tightness of spiral
        
        // Color Palettes (Core to Outer)
        const coreColors = [
            {r: 255, g: 255, b: 200}, // Bright White/Yellow
            {r: 255, g: 200, b: 100}, // Orange
            {r: 200, g: 100, b: 50}   // Reddish
        ];

        const armColors = [
            {r: 100, g: 150, b: 255}, // Blue
            {r: 150, g: 200, b: 255}, // Light Blue
            {r: 200, g: 220, b: 255}  // Pale Blue
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle for the arm
                this.angle = Math.random() * Math.PI * 2;
                
                // Distance from center (logarithmic spiral distribution)
                // We want more stars near the center, fewer at the edges
                const maxRadius = Math.min(width, height) * 0.45;
                this.radius = Math.random() * maxRadius;
                
                // Determine arm index (0 to armCount-1)
                this.armIndex = Math.floor(Math.random() * armCount);
                
                // Offset angle based on arm to create spiral arms
                // Each arm is separated by 2*PI / armCount
                const armAngle = (this.armIndex * 2 * Math.PI) / armCount;
                
                // Add some randomness to position within the arm
                this.angle = armAngle + (Math.random() - 0.5) * 0.5; // Slight spread
                
                // Spiral growth: as radius increases, angle increases
                // This creates the spiral effect
                this.angle += this.radius * spiralFactor;
                
                // Size varies
                this.size = Math.random() * 1.5 + 0.5;
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                
                // Color selection based on distance from center
                // Closer to center = warmer colors, farther = cooler colors
                const colorRatio = this.radius / maxRadius;
                
                if (colorRatio < 0.3) {
                    // Core colors
                    const color = coreColors[Math.floor(Math.random() * coreColors.length)];
                    this.color = `rgb(${color.r}, ${color.g}, ${color.b})`;
                    this.brightness = 1.0;
                } else {
                    // Arm colors
                    const color = armColors[Math.floor(Math.random() * armColors.length)];
                    this.color = `rgb(${color.r}, ${color.g}, ${color.b})`;
                    this.brightness = 0.8;
                }
                
                // Fade out stars at the very edge
                if (colorRatio > 0.8) {
                    this.brightness *= (1 - colorRatio) * 2;
                }
            }

            draw(time) {
                // Calculate position
                const x = centerX + Math.cos(this.angle + time * 0.2) * this.radius;
                const y = centerY + Math.sin(this.angle + time * 0.2) * this.radius;
                
                // Twinkle effect
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                const alpha = 0.3 + 0.7 * (twinkle + 1) / 2;
                
                // Draw star
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = alpha * this.brightness;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function init() {
            resize();
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function drawCore(time) {
            // Draw the bright core
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, coreSize * 2
            );
            
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 255, 200, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreSize * 2, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Add a bright center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreSize * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
        }

        function animate(time) {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw the core
            drawCore(time);
            
            // Draw stars
            stars.forEach(star => star.draw(time));
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
