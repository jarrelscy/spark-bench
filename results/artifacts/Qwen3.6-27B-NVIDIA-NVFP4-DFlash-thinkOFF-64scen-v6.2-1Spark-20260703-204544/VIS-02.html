<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden; /* Prevent scrollbars */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="galaxyCanvas"></canvas>

<script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    
    // Galaxy Configuration
    const STAR_COUNT = 1500;
    const ARM_COUNT = 3;
    const ARM_SPREAD = 0.5; // How "fuzzy" the arms are
    const BASE_SPEED = 0.0005;
    
    // Store star data
    const stars = [];

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }

    // Star Class
    class Star {
        constructor() {
            this.reset();
        }

        reset() {
            // Distance from center (radius)
            // Using random distribution to make it denser in the center
            const rRandom = Math.random();
            this.radius = rRandom * Math.min(width, height) * 0.45;

            // Determine which arm this star belongs to
            const armIndex = Math.floor(Math.random() * ARM_COUNT);
            
            // Calculate angle based on spiral logic
            // The further out, the more the angle twists
            const armAngle = (armIndex / ARM_COUNT) * Math.PI * 2;
            const spiralTwist = this.radius * 0.004; 
            
            // Add randomness to spread stars out of the perfect line (create disk thickness)
            // Gaussian-like distribution for spread
            const randomSpread = (Math.random() - 0.5) * ARM_SPREAD + (Math.random() - 0.5) * 0.5;
            
            this.angle = armAngle + spiralTwist + randomSpread;
            
            // Size
            this.size = Math.random() * 1.5 + 0.5;
            
            // Color
            // Core stars are warmer (yellow/orange), outer stars are cooler (blue/white)
            const hueBase = this.radius > (Math.min(width,height)*0.2) ? 200 : 40; 
            const hueVar = Math.random() * 60;
            this.hue = hueBase + hueVar;
            this.saturation = Math.random() * 50 + 50; // 50-100%
            this.lightness = Math.random() * 40 + 60; // 60-100%
            
            // Twinkle properties
            this.twinkleSpeed = Math.random() * 0.05 + 0.01;
            this.twinkleOffset = Math.random() * Math.PI * 2;
            
            // Rotation speed (closer to center = faster)
            // Using inverse square root for somewhat realistic orbital velocity feel
            this.speed = BASE_SPEED * (1 + (100 / (this.radius + 50)));
        }

        update() {
            // Rotate the star
            this.angle += this.speed;
        }

        draw(ctx, time) {
            // Calculate position
            const x = centerX + Math.cos(this.angle) * this.radius;
            const y = centerY + Math.sin(this.angle) * this.radius;

            // Calculate Twinkle (Alpha)
            // Sine wave oscillation
            const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
            // Map -1..1 to 0.2..1.0
            const alpha = 0.2 + (twinkle + 1) * 0.4;

            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, ${this.lightness}%, ${alpha})`;
            ctx.fill();
        }
    }

    // Initialize
    function init() {
        resize();
        stars.length = 0;
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }
    }

    // Animation Loop
    let time = 0;
    function animate() {
        // Clear canvas with a slight fade effect for trails (optional, but looks nice)
        // Using solid clear for crisp movement
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, width, height);

        // Draw the bright core
        const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 60);
        coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
        coreGradient.addColorStop(0.2, 'rgba(255, 240, 200, 0.8)');
        coreGradient.addColorStop(0.5, 'rgba(100, 149, 237, 0.2)'); // Faint blue halo
        coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Update and draw stars
        // We use additive blending to make overlapping stars brighter
        ctx.globalCompositeOperation = 'lighter';
        
        for (let star of stars) {
            star.update();
            star.draw(ctx, time);
        }
        
        // Reset blending for the next frame background clear
        ctx.globalCompositeOperation = 'source-over';

        time++;
        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', () => {
        resize();
        // Re-calculate star positions relative to new center if desired, 
        // or just let them flow. Here we just reset to avoid clipping issues.
        init(); 
    });

    // Start
    init();
    animate();

</script>
</body>
</html>
