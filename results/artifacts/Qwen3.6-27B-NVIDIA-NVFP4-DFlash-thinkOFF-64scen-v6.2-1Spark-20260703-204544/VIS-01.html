<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration for the solar system
        // Distances and speeds are scaled for visual aesthetics, not scientific accuracy
        const planets = [
            { name: "Mercury", color: "#A5A5A5", size: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus",   color: "#E3BB76", size: 7, distance: 90, speed: 0.03, angle: Math.random() * Math.PI * 2 },
            { name: "Earth",   color: "#22A6F2", size: 7.5, distance: 130, speed: 0.02, angle: Math.random() * Math.PI * 2 },
            { name: "Mars",    color: "#D14A28", size: 5, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D9A066", size: 18, distance: 240, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn",  color: "#EAD6B8", size: 15, distance: 320, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus",  color: "#D1F4F9", size: 10, distance: 390, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#4B70DD", size: 10, distance: 450, speed: 0.003, angle: Math.random() * Math.PI * 2 }
        ];

        // Starfield data
        let stars = [];
        const numStars = 400;

        function init() {
            resize();
            generateStars();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            // Regenerate stars on resize to fill screen
            generateStars();
        }

        function generateStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = "#FFD700";
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            
            // Gradient for Sun body
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 25);
            sunGradient.addColorStop(0, "#FFF");
            sunGradient.addColorStop(0.2, "#FFD700");
            sunGradient.addColorStop(1, "#FF8C00");
            
            ctx.fillStyle = sunGradient;
            ctx.fill();
            
            // Reset shadow for other elements
            ctx.shadowBlur = 0;
        }

        function drawOrbit(distance) {
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path
            drawOrbit(planet.distance);

            // Draw Planet
            ctx.beginPath();
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            
            // Simple lighting effect (shadow)
            // We create a gradient offset towards the center (sun)
            const angleToSun = Math.atan2(centerY - y, centerX - x);
            const gradientOffset = planet.size * 0.5;
            
            ctx.shadowBlur = 5;
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Saturn's Ring
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                // Ellipse logic
                ctx.ellipse(x, y, planet.size * 2.2, planet.size * 0.8, planet.angle + Math.PI/2, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function animate() {
            // Clear canvas
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, width, height);

            // Draw Background
            drawStars();

            // Draw Sun
            drawSun();

            // Update and Draw Planets
            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', resize);

        // Start
        init();

    </script>
</body>
</html>
