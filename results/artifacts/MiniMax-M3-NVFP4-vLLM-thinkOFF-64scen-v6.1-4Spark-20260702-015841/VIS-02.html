<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spiral Galaxy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
(function() {
  const canvas = document.getElementById('galaxy');
  const ctx = canvas.getContext('2d');

  let width, height, cx, cy;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = width / 2;
    cy = height / 2;
  }
  resize();
  window.addEventListener('resize', resize);

  // Galaxy parameters
  const NUM_STARS = 800;
  const NUM_ARMS = 4;
  const ARM_SPREAD = 0.55;
  const GALAXY_RADIUS = Math.min(width, height) * 0.45;
  const CORE_RADIUS = GALAXY_RADIUS * 0.12;
  const ROTATION_SPEED = 0.00015; // radians per ms base

  // Color palette: bluish-white, white, yellowish, reddish
  function starColor(t, brightness) {
    // t in [0,1]; 0=blue, 0.5=white, 1=red
    let r, g, b;
    if (t < 0.5) {
      const k = t / 0.5;
      r = Math.round(180 + (255 - 180) * k);
      g = Math.round(210 + (255 - 210) * k);
      b = Math.round(255);
    } else {
      const k = (t - 0.5) / 0.5;
      r = 255;
      g = Math.round(255 - (255 - 200) * k);
      b = Math.round(255 - (255 - 180) * k);
    }
    r = Math.round(r * brightness);
    g = Math.round(g * brightness);
    b = Math.round(b * brightness);
    return `rgb(${r},${g},${b})`;
  }

  const stars = [];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function createStars() {
    stars.length = 0;
    for (let i = 0; i < NUM_STARS; i++) {
      // Decide if this star is in core, in disk, or bulge
      const r = Math.pow(Math.random(), 0.6) * GALAXY_RADIUS;
      let angle, armOffset;

      if (r < CORE_RADIUS) {
        // Core: roughly spherical cluster
        angle = Math.random() * Math.PI * 2;
        armOffset = 0;
      } else {
        // Choose an arm
        const armIndex = Math.floor(Math.random() * NUM_ARMS);
        const armAngle = (armIndex / NUM_ARMS) * Math.PI * 2;
        // Spiral angle increases with radius
        const spiral = (r / GALAXY_RADIUS) * 2.2;
        // Random scatter around arm
        armOffset = (Math.random() - 0.5) * ARM_SPREAD * (1 - r / GALAXY_RADIUS * 0.5);
        angle = armAngle + spiral + armOffset;
      }

      // Slight vertical thickness (disk)
      const thickness = r < CORE_RADIUS
        ? CORE_RADIUS * 0.6
        : GALAXY_RADIUS * 0.04 * (1 - r / GALAXY_RADIUS * 0.7);
      const y3d = (Math.random() - 0.5) * thickness;

      // Color: core stars yellower/redder, outer bluer
      let colorT;
      if (r < CORE_RADIUS) {
        colorT = rand(0.45, 0.95);
      } else {
        // Outer stars more blue, some variation
        colorT = Math.random() < 0.15 ? rand(0.55, 0.95) : rand(0.0, 0.45);
      }

      // Size: core stars brighter and slightly larger
      const sizeBase = r < CORE_RADIUS ? rand(1.2, 2.4) : rand(0.4, 1.6);
      // Brighter near core
      const brightness = Math.max(0.25, 1 - (r / GALAXY_RADIUS) * 0.85);

      stars.push({
        radius: r,
        angle: angle,
        y3d: y3d,
        size: sizeBase,
        colorT: colorT,
        brightness: brightness,
        // Twinkle parameters
        twinkleSpeed: rand(0.0008, 0.003),
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleAmp: rand(0.15, 0.45),
        // Orbital speed: inner stars rotate faster (Keplerian-ish)
        orbitSpeed: ROTATION_SPEED * (1 / Math.sqrt(Math.max(0.15, r / GALAXY_RADIUS + 0.15)))
      });
    }
  }
  createStars();
  window.addEventListener('resize', createStars);

  // Background nebula gradient (subtle)
  function drawBackground() {
    // Deep space with very subtle radial glow at center
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, GALAXY_RADIUS * 1.6);
    grad.addColorStop(0, 'rgba(40, 30, 60, 0.35)');
    grad.addColorStop(0.3, 'rgba(20, 15, 35, 0.15)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);
  }

  // Distant background stars (non-rotating)
  const bgStars = [];
  for (let i = 0; i < 200; i++) {
    bgStars.push({
      x: Math.random(),
      y: Math.random(),
      size: rand(0.2, 0.9),
      brightness: rand(0.3, 0.8),
      twinkleSpeed: rand(0.0005, 0.002),
      twinklePhase: Math.random() * Math.PI * 2
    });
  }

  function drawBgStars(time) {
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      const tw = 0.6 + 0.4 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
      const b = s.brightness * tw;
      const px = s.x * width;
      const py = s.y * height;
      ctx.fillStyle = `rgba(${Math.round(200*b)},${Math.round(210*b)},${Math.round(230*b)},${b})`;
      ctx.beginPath();
      ctx.arc(px, py, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Core glow
  function drawCore(time) {
    const pulse = 0.85 + 0.15 * Math.sin(time * 0.0008);
    const r = CORE_RADIUS * 1.8 * pulse;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(255, 240, 220, 0.9)');
    grad.addColorStop(0.2, 'rgba(255, 200, 160, 0.5)');
    grad.addColorStop(0.5, 'rgba(180, 140, 200, 0.2)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Bright core point
    ctx.fillStyle = 'rgba(255, 250, 240, 1)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  let lastTime = performance.now();

  function animate(time) {
    const dt = time - lastTime;
    lastTime = time;

    drawBackground();
    drawBgStars(time);

    // Update and draw galaxy stars
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.angle += s.orbitSpeed * dt;

      // Slight 3D perspective tilt (galaxy disk tilted)
      const cosA = Math.cos(s.angle);
      const sinA = Math.sin(s.angle);
      const tiltY = s.y3d * 0.6; // squish vertical

      const x = cx + cosA * s.radius;
      const y = cy + sinA * s.radius * 0.55 + tiltY;

      // Skip if off screen roughly
      if (x < -10 || x > width + 10 || y < -10 || y > height + 10) continue;

      // Twinkle
      const tw = 1 - s.twinkleAmp + s.twinkleAmp * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinklePhase));
      const b = Math.max(0.05, s.brightness * tw);

      // Color
      ctx.fillStyle = starColor(s.colorT, b);

      // Size with twinkle
      const size = s.size * (0.7 + 0.3 * tw);

      // Draw star with soft glow for brighter ones
      if (size > 1.2) {
        ctx.beginPath();
        ctx.arc(x, y, size * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = starColor(s.colorT, b * 0.25);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';

    drawCore(time);

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
