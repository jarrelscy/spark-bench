<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Solar System</title> <style> body { margin: 0; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; } canvas { background: #000; } </style> </head> <body> <canvas id="solar"></canvas> <script> const canvas = document.getElementById('solar'); const ctx = canvas.getContext('2d'); const stars = []; function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize(); // Create stars for (let i = 0; i < 300; i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.5, tw: Math.random() * Math.PI * 2 }); } const sun = { x: 0, y: 0, r: 40 }; const planets = [ { name: 'Mercury', orbit: 70, size: 4, speed: 0.008, color: '#a9a9a9' }, { name: 'Venus', orbit: 105, size: 7, speed: 0.006, color: '#e8c468' }, { name: 'Earth', orbit: 145, size: 8, speed: 0.005, color: '#4a90d9' }, { name: 'Mars', orbit: 185, size: 6, speed: 0.004, color: '#d1603d' }, { name: 'Jupiter', orbit: 245, size: 18, speed: 0.002, color: '#d8a56b' }, { name: 'Saturn', orbit: 310, size: 15, speed: 0.0015, color: '#e3c075' } ]; let angle = 0; function draw() { const cx = canvas.width / 2; const cy = canvas.height / 2; ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Stars stars.forEach(s => { s.tw += 0.02; const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.tw)); ctx.globalAlpha = alpha; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1; // Sun glow const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120); glow.addColorStop(0, 'rgba(255,220,100,0.9)'); glow.addColorStop(0.3, 'rgba(255,160,40,0.5)'); glow.addColorStop(1, 'rgba(255,100,0,0)'); ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI * 2); ctx.fill(); // Sun body const sunGrad = ctx.createRadialGradient(cx - 10, cy - 10, 5, cx, cy, sun.r); sunGrad.addColorStop(0, '#fff7d6'); sunGrad.addColorStop(0.5, '#ffd24a'); sunGrad.addColorStop(1, '#ff8c00'); ctx.fillStyle = sunGrad; ctx.beginPath(); ctx.arc(cx, cy, sun.r, 0, Math.PI * 2); ctx.fill(); // Orbit paths (faint) planets.forEach(p => { ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, p.orbit, 0, Math.PI * 2); ctx.stroke(); }); // Planets planets.forEach(p => { const x = cx + Math.cos(p.angle) * p.orbit; const y = cy + Math.sin(p.angle) * p.orbit; // Planet with slight shading const g = ctx.createRadialGradient(x - p.size * 0.3, y - p.size * 0.3, p.size * 0.1, x, y, p.size); g.addColorStop(0, p.color); g.addColorStop(1, '#111'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, p.size, 0, Math.PI * 2); ctx.fill(); p.angle += p.speed; }); requestAnimationFrame(draw); } planets.forEach(p => p.angle = Math.random() * Math.PI * 2); draw(); </script> </body> </html>
